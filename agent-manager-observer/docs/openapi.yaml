openapi: 3.0.3
info:
  title: Agent Manager Observer API
  description: |
    Observer Service-backed API for listing, exporting, and fetching distributed traces,
    component/build logs, and resource metrics.

    Endpoints use human-readable `organization`, `project`, `agent`, and `environment` identifiers.
    Lazy loading is supported: the span list endpoint returns summaries only; individual span
    attributes are fetched on demand via the span detail endpoint.

    All endpoints require the same Bearer JWT as the Agent Manager Service console
    (validated via JWKS / local-dev mode).
  version: 1.0.0
  contact:
    name: WSO2 LLC
    url: https://www.wso2.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:9098
    description: Local development
  - url: https://observer.example.com
    description: Production (replace with your deployment URL)

tags:
  - name: health
    description: Liveness / readiness (unauthenticated)
  - name: traces
    description: Observer Service-backed trace data with lazy loading (requires JWT)
  - name: logs
    description: Observer Service-backed component and build logs (requires JWT)
  - name: metrics
    description: Observer Service-backed resource metrics (requires JWT)

paths:
  /health:
    get:
      tags:
        - health
      summary: Health check
      description: Verifies service liveness and readiness. Does not require authentication.
      operationId: health
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOkResponse"
        "503":
          description: Service unhealthy (e.g. dependency unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthErrorResponse"

  /api/v1/traces:
    get:
      tags:
        - traces
      summary: List traces
      description: |
        Returns paginated trace overviews for a component. Each trace includes input, output, token usage,
        and status extracted from the root span — the same richness as the v1 list endpoint.
        Uses the Observer Service instead of OpenSearch. No offset; use `limit` for page size.

        The filter parameters (`status`, `minDurationMs`, `minTokens`, `minSpanCount`, `model`,
        `conversationId`, `tool`, `toolError`, `mcpServer`, `missing`) are optional and combine with AND. With any filter set, the server walks
        the window in sort order until it has `limit` matches, the window runs out, it has examined
        500 traces, it has fetched 100 MCP handshakes (only with `mcpServer` or `include=mcpServers`),
        or it has searched for 20 seconds (`truncated` is then true, and `nextCursor` continues the
        search).
        With no filter and no `cursor` set the request makes one upstream trace query, unless
        traces share a start time at the end of the page.

        To page, send the previous response's `nextCursor` as `cursor`, with the same `startTime`,
        `endTime`, `sortOrder` and filters. Do not page by narrowing `endTime` or `startTime`: the
        window bounds each span, so a narrowed window leaves out traces still running at its edge.
        Traces are ordered by start time in `sortOrder`, then by `traceId`. Each page starts just
        after the previous page's last trace, so pages don't overlap.

        A trace that can't be read is left out of the page; with a filter set it is retried once
        first. The request fails only when it could read none of the traces it examined.
      operationId: listTraces
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/organization"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/agent"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/startTimeRequired"
        - $ref: "#/components/parameters/endTimeRequired"
        - name: limit
          in: query
          required: false
          description: Page size (default 10, max 1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - $ref: "#/components/parameters/sortOrder"
        - name: include
          in: query
          required: false
          style: form
          explode: false
          description: |
            Opt-in span-derived fields to fill on every trace, as a comma-separated
            list. The parameter may be repeated. Unknown values return 400.

            - `models`: read model names from the trace's span list, requested with
              inline attributes. It adds one span-list call for traces that otherwise
              need none, and makes the span-list call heavier for the rest. Traces
              above the span-count threshold return no `models` either way.
            - `tools`: read tool names and failures from the trace's span list,
              without attributes. Most traces list their spans anyway, so it adds a
              call only for traces whose root fills input, output and token usage by
              itself. Traces above 200 spans return no `tools`, at no extra cost.
            - `mcpServers`: read MCP server names from the trace's `initialize.mcp`
              spans, found in the span list without attributes. One span fetch per
              tool that opened a session, for its first handshake in start order, and
              at most 5 per trace. With a filter set, the search stops once it has
              fetched 100 handshakes, after the batch of up to 50 traces it is reading
              (`truncated` is then true, and `nextCursor` continues the search).
              Without a filter only the per-trace limit applies. Traces above 200
              spans return no `mcpServers`, at no extra cost.
          schema:
            type: array
            maxItems: 3
            items:
              type: string
              enum: [models, tools, mcpServers]
        - $ref: "#/components/parameters/traceStatusFilter"
        - $ref: "#/components/parameters/minDurationMsFilter"
        - $ref: "#/components/parameters/minTokensFilter"
        - $ref: "#/components/parameters/minSpanCountFilter"
        - $ref: "#/components/parameters/modelFilter"
        - $ref: "#/components/parameters/conversationIdFilter"
        - $ref: "#/components/parameters/toolFilter"
        - $ref: "#/components/parameters/toolErrorFilter"
        - $ref: "#/components/parameters/mcpServerFilter"
        - $ref: "#/components/parameters/missingFilter"
        - name: cursor
          in: query
          required: false
          description: |
            The `nextCursor` of the previous page. It is opaque and only valid with the same
            `startTime`, `endTime`, `sortOrder` and filters as that page. A malformed cursor
            returns 400.
          schema:
            type: string
      responses:
        "200":
          description: Trace overview list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceOverviewListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ObserverUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/traces/export:
    get:
      tags:
        - traces
      summary: Export traces with full span details
      description: |
        Returns complete trace objects for a component including ALL spans, each fully enriched with
        AmpAttributes (LLM data, tool calls, token usage, etc.). Response includes Content-Disposition
        for download. Export limit is capped at 1000 traces.

        `organization`, `project`, `agent`, and `environment` are all required to scope the export
        to a specific agent.

        The filter parameters are the list endpoint's and select the same traces: they combine with
        AND, and with any filter set the server walks the window in sort order until it has `limit`
        matches, the window runs out, it has examined 500 traces, it has fetched 100 MCP handshakes
        (only with `mcpServer`), or it has searched for 10 seconds (`truncated` is then true, and
        `lookedBackTo` says how far it got). Spans are fetched only
        for the matches, so a filtered export returns at most 500 traces. There is no cursor: to
        export further back, narrow the window. With no filter set the export makes one upstream
        trace query, as before.

        A trace that can't be read, while selecting with a filter or while fetching its spans, is
        retried once, then left out and listed in `failedTraceIds`. The export fails only when it
        could read none of the traces it selected.
      operationId: exportTraces
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/organization"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/agent"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/startTimeRequired"
        - $ref: "#/components/parameters/endTimeRequired"
        - name: limit
          in: query
          required: false
          description: Max traces to export (default 100, max 1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - $ref: "#/components/parameters/sortOrder"
        - $ref: "#/components/parameters/traceStatusFilter"
        - $ref: "#/components/parameters/minDurationMsFilter"
        - $ref: "#/components/parameters/minTokensFilter"
        - $ref: "#/components/parameters/minSpanCountFilter"
        - $ref: "#/components/parameters/modelFilter"
        - $ref: "#/components/parameters/conversationIdFilter"
        - $ref: "#/components/parameters/toolFilter"
        - $ref: "#/components/parameters/toolErrorFilter"
        - $ref: "#/components/parameters/mcpServerFilter"
        - $ref: "#/components/parameters/missingFilter"
      responses:
        "200":
          description: Export payload
          headers:
            Content-Disposition:
              description: Suggested download filename
              schema:
                type: string
                example: 'attachment; filename="traces-export-20260406-120000.json"'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceExportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ObserverUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/traces/{traceId}/spans:
    get:
      tags:
        - traces
      summary: List spans for a trace
      description: |
        Returns lightweight span summaries (name, parentSpanId, timing) for a trace.
        No attributes are included — fetch individual span details via the span detail endpoint.
      operationId: listTraceSpans
      security:
        - bearerAuth: []
      parameters:
        - name: traceId
          in: path
          required: true
          description: Trace identifier
          schema:
            type: string
            example: "3cae024cf613a5f37843e9c6eefa3020"
        - $ref: "#/components/parameters/organization"
        - $ref: "#/components/parameters/projectOptional"
        - $ref: "#/components/parameters/agentOptional"
        - $ref: "#/components/parameters/environmentOptional"
        - $ref: "#/components/parameters/startTimeRequired"
        - $ref: "#/components/parameters/endTimeRequired"
        - name: limit
          in: query
          required: false
          description: Max spans to return (default 10, max 1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - $ref: "#/components/parameters/sortOrder"
      responses:
        "200":
          description: Span summary list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpanSummaryListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ObserverUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/traces/{traceId}/spans/{spanId}:
    get:
      tags:
        - traces
      summary: Get full span detail
      description: |
        Returns the full span including all OTEL attributes and enriched AmpAttributes
        (semantic kind, input/output, token usage, LLM data, tool calls, etc.).
      operationId: getSpanDetail
      security:
        - bearerAuth: []
      parameters:
        - name: traceId
          in: path
          required: true
          description: Trace identifier
          schema:
            type: string
            example: "3cae024cf613a5f37843e9c6eefa3020"
        - name: spanId
          in: path
          required: true
          description: Span identifier
          schema:
            type: string
            example: "a1b2c3d4e5f60001"
      responses:
        "200":
          description: Full enriched span
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichedSpan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ObserverUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/logs:
    get:
      tags:
        - logs
      summary: Query component logs
      description: |
        Returns log entries for an agent's runtime component, scoped by organization,
        project, agent, and environment. `startTime`/`endTime` are required and the
        range is capped at 14 days. Not available to `amp-publisher-*` tokens.
      operationId: queryLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/organization"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/agent"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/startTimeRequired"
        - $ref: "#/components/parameters/endTimeRequired"
        - name: searchPhrase
          in: query
          required: false
          description: Free-text phrase to filter log lines by
          schema:
            type: string
        - $ref: "#/components/parameters/logLevels"
        - name: limit
          in: query
          required: false
          description: Max log lines to return (optional; upstream default applies when omitted, max 10000)
          schema:
            type: integer
            minimum: 1
            maximum: 10000
        - $ref: "#/components/parameters/sortOrder"
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/UpstreamObserverError"

  /api/v1/build-logs:
    get:
      tags:
        - logs
      summary: Query build (workflow) logs
      description: |
        Returns log entries for an Argo build workflow run, over a fixed 30-day lookback
        window, oldest first, capped at 1000 lines. Not available to `amp-publisher-*` tokens.
      operationId: queryBuildLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/organization"
        - $ref: "#/components/parameters/buildName"
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/UpstreamObserverError"

  /api/v1/metrics:
    get:
      tags:
        - metrics
      summary: Query agent resource metrics
      description: |
        Returns CPU and memory usage/requests/limits time series for an agent's runtime
        component, scoped by organization, project, agent, and environment.
        `startTime`/`endTime` are required (no range cap). Not available to
        `amp-publisher-*` tokens.
      operationId: queryMetrics
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/organization"
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/agent"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/startTimeRequired"
        - $ref: "#/components/parameters/endTimeRequired"
      responses:
        "200":
          description: Resource metrics time series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/UpstreamObserverError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Same access token as used for Agent Manager Service API calls.

  parameters:
    organization:
      name: organization
      in: query
      required: true
      description: Organization name
      schema:
        type: string
        example: "default"
    project:
      name: project
      in: query
      required: true
      description: Project name
      schema:
        type: string
    agent:
      name: agent
      in: query
      required: true
      description: Agent name
      schema:
        type: string
    environment:
      name: environment
      in: query
      required: true
      description: Environment name
      schema:
        type: string
    projectOptional:
      name: project
      in: query
      required: false
      description: Project name filter
      schema:
        type: string
    agentOptional:
      name: agent
      in: query
      required: false
      description: Agent name filter
      schema:
        type: string
    environmentOptional:
      name: environment
      in: query
      required: false
      description: Environment name filter
      schema:
        type: string
    buildName:
      name: buildName
      in: query
      required: true
      description: Argo workflow run name for the build
      schema:
        type: string
    logLevels:
      name: logLevels
      in: query
      required: false
      description: Comma-separated log levels to filter by
      schema:
        type: string
        example: "INFO,WARN,ERROR"
    startTimeRequired:
      name: startTime
      in: query
      required: true
      schema:
        type: string
        format: date-time
        example: "2026-04-01T00:00:00Z"
    endTimeRequired:
      name: endTime
      in: query
      required: true
      schema:
        type: string
        format: date-time
        example: "2026-04-06T23:59:59Z"
    sortOrder:
      name: sortOrder
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    traceStatusFilter:
      name: status
      in: query
      required: false
      description: |
        `error` keeps traces whose status reports at least one error; `ok` keeps the rest,
        including traces with no status.
      schema:
        type: string
        enum: [error, ok]
    minDurationMsFilter:
      name: minDurationMs
      in: query
      required: false
      description: Keep traces whose duration is at least this many milliseconds.
      schema:
        type: integer
        format: int64
        minimum: 0
    minTokensFilter:
      name: minTokens
      in: query
      required: false
      description: |
        Keep traces whose `tokenUsage.totalTokens` is at least this value. Traces without
        `tokenUsage` never match, even with `minTokens=0`.
      schema:
        type: integer
        format: int64
        minimum: 0
    minSpanCountFilter:
      name: minSpanCount
      in: query
      required: false
      description: Keep traces with at least this many spans.
      schema:
        type: integer
        format: int64
        minimum: 0
    modelFilter:
      name: model
      in: query
      required: false
      description: |
        Keep traces where any entry of `models` contains this value, ignoring case,
        so `gpt-4o-mini` matches `gpt-4o-mini-2024-07-18`. Implies
        `include=models`, so the server fills `models` on every trace and the request
        carries that cost. Traces above the span-count threshold have no `models` and
        never match.
      schema:
        type: string
        maxLength: 256
        example: gpt-4o
    conversationIdFilter:
      name: conversationId
      in: query
      required: false
      description: Keep traces whose `conversationId` equals this value exactly.
      schema:
        type: string
        maxLength: 256
        example: conv-42
    toolFilter:
      name: tool
      in: query
      required: false
      description: |
        Keep traces where any entry of `tools` contains this value, ignoring case. With
        `toolError=true`, a failed tool (an entry of `failedTools`) must contain it, so
        `tool=search_web&toolError=true` means "search_web failed". Implies `include=tools`,
        so the server fills `tools` and `failedTools` on every trace and the request carries
        that cost: a trace is judged on its span list, fetched without attributes before its
        root, so a rejected trace costs one list call. Tools are read from span names only
        (`execute_tool {name}`, `{name}.tool`). Traces above 200 spans have no `tools` and
        never match.
      schema:
        type: string
        maxLength: 256
        example: search_web
    toolErrorFilter:
      name: toolError
      in: query
      required: false
      description: |
        `true` keeps traces with at least one failed tool, that is, `failedTools` is not
        empty; empty or `false` sets no filter, and any other value returns 400. A tool
        fails when a span with its name has OTel status error. When an MCP call fails, the
        outer `execute_tool` span stays unset and the inner `.tool` span carries the error,
        so the tool is reported as failed. With `tool` also set, the failed tool must match
        it. Implies `include=tools`, with the cost and the 200-span cap described for `tool`.
      schema:
        type: string
        enum: ["true", "false"]
    mcpServerFilter:
      name: mcpServer
      in: query
      required: false
      description: |
        Keep traces where any entry of `mcpServers` contains this value, ignoring case.
        Implies `include=mcpServers`, with its cost and limits. The span list comes before
        the root, as for `tool`, and the handshake fetches come after every other check,
        so a trace without a handshake span costs one list call. Traces above 200 spans
        never match. The search stops once it has fetched 100 handshakes, after the batch
        of up to 50 traces it is reading, with `truncated` true; the list's `nextCursor`
        continues it.
      schema:
        type: string
        maxLength: 256
        example: github-mcp-server
    missingFilter:
      name: missing
      in: query
      required: false
      style: form
      explode: false
      description: |
        Keep traces without the named fields, as a comma-separated list. The parameter
        may be repeated. Unknown values return 400.

        - `conversationId`: keep traces with no conversation ID on the root, its first
          child or its LLM spans. A trace with an ID on its root is ruled out at the root;
          one without reads every span that may carry an ID, even when the root fills
          `input`, `output` and `tokenUsage`. A trace whose ID may sit on a span that
          wasn't read is left out as unreadable: one above 100 spans, one with more than
          50 LLM spans, or one with a failed fetch. Can't be combined with `conversationId`
          (400).
      schema:
        type: array
        maxItems: 1
        items:
          type: string
          enum: [conversationId]

  responses:
    BadRequest:
      description: Bad request — missing or invalid query parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ObserverUnavailable:
      description: Observer Service not configured (OPENCHOREO_OBSERVER_URL unset)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Publisher-audience (`amp-publisher-*`) tokens are not permitted on this endpoint
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamObserverError:
      description: The Observer Service query failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthOkResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          example: healthy
        timestamp:
          type: string
          format: date-time

    HealthErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: unhealthy
        error:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Short error code or literal (e.g. error, Unauthorized)
        message:
          type: string
          description: Human-readable detail

    Span:
      type: object
      required:
        - traceId
        - spanId
        - name
        - service
        - startTime
        - endTime
        - durationInNanos
      properties:
        traceId:
          type: string
        spanId:
          type: string
        parentSpanId:
          type: string
          nullable: true
        name:
          type: string
        service:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        durationInNanos:
          type: integer
          format: int64
        kind:
          type: string
        status:
          type: string
          description: OTel status code of the span ("ok", "error", or "unset")
        statusMessage:
          type: string
          description: >
            Developer-facing status message from the span's OTel status
            (OpenChoreo 1.2.0+). Typically set only when the span errored.
          nullable: true
        attributes:
          type: object
          additionalProperties: true

    FullTrace:
      type: object
      required:
        - traceId
        - rootSpanId
        - rootSpanName
        - startTime
        - endTime
        - spans
      properties:
        traceId:
          type: string
        rootSpanId:
          type: string
        rootSpanName:
          type: string
        rootSpanKind:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        durationInNanos:
          type: integer
          format: int64
        spanCount:
          type: integer
        tokenUsage:
          $ref: "#/components/schemas/TokenUsage"
        status:
          $ref: "#/components/schemas/TraceStatus"
        input:
          nullable: true
          oneOf:
            - type: string
            - type: object
            - type: array
              items: {}
        output:
          nullable: true
          oneOf:
            - type: string
            - type: object
            - type: array
              items: {}
        taskId:
          type: string
          nullable: true
          description: Task ID from baggage (evaluation experiments)
        trialId:
          type: string
          nullable: true
          description: Trial ID from baggage (evaluation experiments)
        spans:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/EnrichedSpan"

    TraceExportResponse:
      type: object
      required:
        - traces
        - totalCount
        - truncated
        - spansTruncated
      properties:
        traces:
          type: array
          items:
            $ref: "#/components/schemas/FullTrace"
        totalCount:
          type: integer
          description: |
            Upstream trace count for the window when no filter is set; the number of
            exported traces when any filter is set.
        lookedBackTo:
          type: string
          format: date-time
          description: |
            Set only when a filter is set. How far the server examined traces, in UTC with
            sub-second precision: the start time of the last trace examined in sort order, or the
            window edge (`startTime` for `desc`, `endTime` for `asc`) when the window ran out.
          example: "2026-04-01T00:00:00.5Z"
        truncated:
          type: boolean
          description: |
            True when the export was cut short: a filtered export reached its cap of 500 examined
            traces or 100 MCP handshake fetches, or its 10-second search budget, before the window
            ran out, or `spansTruncated`
            is true. With a filter set and `spansTruncated` true, it doesn't say whether the
            search also stopped early.
        spansTruncated:
          type: boolean
          description: |
            True when an exported trace has more than 10 000 spans; the file holds the first
            10 000 spans of that trace.
        failedTraceIds:
          type: array
          items:
            type: string
          description: |
            Traces left out because they couldn't be read. A trace that failed while a filter was
            selecting traces may or may not have matched. Absent when every trace was read.

    # ── schemas ─────────────────────────────────────────────────────────────

    TraceOverview:
      type: object
      description: |
        Single trace overview as returned by GET /api/v1/traces.
        Includes root-span-derived input, output, and token usage.
      required:
        - traceId
        - rootSpanId
        - rootSpanName
        - rootSpanKind
        - startTime
        - endTime
        - durationInNanos
        - spanCount
      properties:
        traceId:
          type: string
        rootSpanId:
          type: string
        rootSpanName:
          type: string
        rootSpanKind:
          type: string
          description: Semantic span type (llm, tool, agent, chain, etc.)
          example: llm
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        durationInNanos:
          type: integer
          format: int64
        spanCount:
          type: integer
        tokenUsage:
          $ref: "#/components/schemas/TokenUsage"
        status:
          $ref: "#/components/schemas/TraceStatus"
        input:
          nullable: true
          oneOf:
            - type: string
            - type: object
            - type: array
              items: {}
        output:
          nullable: true
          oneOf:
            - type: string
            - type: object
            - type: array
              items: {}
        models:
          type: array
          description: |
            Distinct model names across the trace's LLM spans, first-seen order.
            Only present when `include=models`, or when the LLM spans were
            fetched for other reasons (to fill `input`, `output` or `tokenUsage`).
            Absent otherwise, and absent when no LLM span names a model.
          items:
            type: string
          example: ["gpt-4o", "gpt-4o-mini"]
        conversationId:
          type: string
          description: |
            The trace's conversation, session or thread ID. Read from the root span, then
            from the spans fetched to fill `input`, `output` or `tokenUsage`: the root's
            first child, then the LLM spans in start order. With a `conversationId` filter or
            `missing=conversationId`, a root without one reads those spans even when it has
            all three. The first span with
            one wins.
            On each span the keys are read in this order: `gen_ai.conversation.id`,
            `session.id`, `langfuse.session.id`, the Traceloop association properties
            `session_id`, `conversation_id` and `thread_id` (LangGraph's thread), then
            `langsmith.metadata.session_id` and `langsmith.metadata.thread_id`. A whole
            number is returned as its decimal string. Absent when none of those spans
            carries one.
          example: conv-42
        tools:
          type: array
          description: |
            Distinct tools the trace called, in first-call order. Only present with
            `include=tools`, for traces of at most 200 spans, and when a tool span
            names a tool.
            Read from span names only: `execute_tool {name}` (OTel GenAI, Traceloop
            LangGraph, Strands, Google ADK) and `{name}.tool` (Traceloop, its MCP
            instrumentation and the OpenAI Agents SDK); also `.tools`, `.function` and
            `.functions`. A span named only after the tool, as OpenInference and
            Logfire name them, isn't recognised, and a bare `execute_tool` names no tool.
          items:
            type: string
          example: ["search_issues", "check_system_status"]
        failedTools:
          type: array
          description: |
            The entries of `tools` with at least one span whose OTel status is error.
            Failure attributes such as `error.type` aren't read, so a tool error that
            leaves the status unset doesn't count. Present under the same conditions
            as `tools`, and absent when no tool failed.
          items:
            type: string
          example: ["search_issues"]
        mcpServers:
          type: array
          description: |
            Distinct MCP servers the trace connected to, in handshake order. Only present
            with `include=mcpServers`, for traces of at most 200 spans, and when an
            `initialize.mcp` span names a server.
            Read from the MCP initialize result in that span's `traceloop.entity.output`:
            `serverInfo.name`, else `serverInfo.title`. Limits:
            - Only Traceloop's MCP instrumentation emits this span, and only when the agent
              opens an MCP session inside the trace. A client that opens a session per tool
              call (the default for langchain-mcp-adapters' `MultiServerMCPClient`) has one
              per call; an agent that holds one session for its lifetime has none in later
              traces, so they report no servers.
            - One handshake is read per tool, the first in start order, keyed by the tool
              span it sits under; a handshake under no tool span counts on its own. At most
              5 are read per trace, so servers reached only through later tools are left out.
          items:
            type: string
          example: ["github-mcp-server"]

    TraceOverviewListResponse:
      type: object
      required:
        - traces
        - totalCount
        - lookedBackTo
        - truncated
      properties:
        traces:
          type: array
          items:
            $ref: "#/components/schemas/TraceOverview"
        totalCount:
          type: integer
          description: |
            Upstream trace count for the window when no filter is set; the number of
            matching traces in `traces` when any filter is set.
        lookedBackTo:
          type: string
          format: date-time
          description: |
            How far the server examined traces, for display only, in UTC with sub-second
            precision. It is the start time of the last trace examined in sort order (the oldest
            for `desc`, the newest for `asc`), or the window edge (`startTime` for `desc`,
            `endTime` for `asc`) when the window ran out. Page with `nextCursor`, not by passing
            this value as a time bound.
          example: "2026-04-01T00:00:00.5Z"
        truncated:
          type: boolean
          description: |
            True when the server stopped before filling the page and before the window ran out:
            a filtered request reached its cap of 500 examined traces or 100 MCP handshake
            fetches, or its 20-second search budget (`nextCursor` continues from where it
            stopped), or the page went deeper than
            the server fetches (1000 traces into the window, reached by a deep `cursor` or by more
            traces at one start time than that; there is no `nextCursor`, so narrow the window to
            see more).
        nextCursor:
          type: string
          description: |
            Opaque cursor for the next page; send it back as `cursor`. Present when the window
            holds traces past this page, including when `truncated` is true after the examine
            cap, the handshake cap or the search budget. Absent when the window ran out or the cursor depth was
            reached.

    SpanSummary:
      type: object
      description: Lightweight span summary returned by GET /api/v1/traces/{traceId}/spans. No attributes included.
      required:
        - spanId
        - spanName
        - startTime
        - endTime
        - durationNs
      properties:
        spanId:
          type: string
        spanName:
          type: string
        parentSpanId:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        durationNs:
          type: integer
          format: int64
        error:
          type: boolean
          description: >
            True when the span's OTel status code is "error". Sourced from the
            span-list response (no per-span detail fetch), so the trace tree can
            flag failed spans up front.
        statusMessage:
          type: string
          description: Developer-facing status message from the span's OTel status (typically set on error).
          nullable: true

    SpanSummaryListResponse:
      type: object
      required:
        - spans
        - totalCount
      properties:
        spans:
          type: array
          items:
            $ref: "#/components/schemas/SpanSummary"
        totalCount:
          type: integer

    SpanStatus:
      type: object
      properties:
        error:
          type: boolean
          description: Whether the span has an error
        errorType:
          type: string
          description: Error type from error.type attribute (only present when error is true)
          nullable: true
        message:
          type: string
          description: >
            Developer-facing status message from the span's OTel status
            (OpenChoreo 1.2.0+). Typically set only when the span errored.
          nullable: true

    AmpAttributes:
      type: object
      description: Semantically enriched attributes added by the AMP platform.
      required:
        - kind
      properties:
        kind:
          type: string
          description: Semantic span type
          enum: [llm, tool, embedding, retriever, agent, crewaitask, chain, unknown]
        input:
          description: Input data (type varies by kind)
          nullable: true
          oneOf:
            - type: string
            - type: object
            - type: array
              items: {}
        output:
          description: Output data (type varies by kind)
          nullable: true
          oneOf:
            - type: string
            - type: object
            - type: array
              items: {}
        status:
          $ref: "#/components/schemas/SpanStatus"
        data:
          description: Kind-specific data (LLMData, ToolData, EmbeddingData, etc.)
          nullable: true
          type: object
          additionalProperties: true

    EnrichedSpan:
      description: |
        Full span as returned by GET /api/v1/traces/{traceId}/spans/{spanId}.
        Includes raw OTEL attributes and enriched AmpAttributes.
      allOf:
        - $ref: "#/components/schemas/Span"
        - type: object
          properties:
            ampAttributes:
              $ref: "#/components/schemas/AmpAttributes"

    TokenUsage:
      type: object
      properties:
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        totalTokens:
          type: integer

    TraceStatus:
      type: object
      properties:
        errorCount:
          type: integer

    LogEntry:
      type: object
      description: Single log line as returned by GET /api/v1/logs and GET /api/v1/build-logs.
      required:
        - timestamp
        - log
        - logLevel
      properties:
        timestamp:
          type: string
          format: date-time
        log:
          type: string
        logLevel:
          type: string
          example: "INFO"

    LogsResponse:
      type: object
      required:
        - logs
        - totalCount
        - tookMs
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        totalCount:
          type: integer
        tookMs:
          type: number
          format: float

    MetricDataPoint:
      type: object
      description: Single timestamped value in a metrics time series.
      required:
        - time
        - value
      properties:
        time:
          type: string
          format: date-time
        value:
          type: number
          format: double

    MetricsResponse:
      type: object
      description: Resource metrics time series as returned by GET /api/v1/metrics.
      required:
        - cpuUsage
        - cpuRequests
        - cpuLimits
        - memory
        - memoryRequests
        - memoryLimits
      properties:
        cpuUsage:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataPoint"
        cpuRequests:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataPoint"
        cpuLimits:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataPoint"
        memory:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataPoint"
        memoryRequests:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataPoint"
        memoryLimits:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataPoint"

security:
  - bearerAuth: []
