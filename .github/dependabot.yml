version: 2

# Security-update PRs require dependency graph, Dependabot alerts, and
# Dependabot security updates to be enabled in repository settings.
# Keep target-branch unset so these rules also apply to security updates.
# Group all version levels within each sample and ecosystem so related libraries
# can update together. Grouping does not replace compatibility checks in CI.
updates:
  - package-ecosystem: "pip"
    directory: "/samples/a2a-agent"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "Asia/Colombo"
    groups:
      a2a-python-updates:
        applies-to: "version-updates"
        patterns: ["*"]
      a2a-python-security:
        applies-to: "security-updates"
        patterns: ["*"]

