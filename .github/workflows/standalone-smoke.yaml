# Brings up the Compose stack once per distribution and runs
# deployments/standalone/scripts/smoke.sh against it: sign-in, the core API,
# which routes each binary serves and the UI manifest.
# amp-core is the only cover the core binary gets as a running stack.
name: Standalone smoke

on:
  pull_request:
    branches:
      - amp-2.x
    paths:
      - 'agent-manager-service/**'
      - 'deployments/standalone/**'
      - '.github/workflows/standalone-smoke.yaml'
      - '.github/actions/amp-dev-stack/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.smoke }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: amp
            smoke: amp
          - distribution: amp-core
            smoke: amp-core
          # The full stack with the gateway module switched off at runtime.
          - distribution: amp
            smoke: amp-off
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # File mode, so the script signs in as admin. The console build is left
      # out; file-auth-smoke covers the console the API serves.
      - uses: ./.github/actions/amp-dev-stack
        with:
          auth_mode: file
          distribution: ${{ matrix.distribution }}

      - name: Disable the AI Gateway
        if: matrix.smoke == 'amp-off'
        working-directory: deployments/standalone
        run: |
          docker compose exec -T amp-api /go/bin/amp module disable ai-gateway
          sleep 5 # every replica reloads within 2 seconds

      - name: Smoke checks
        run: deployments/standalone/scripts/smoke.sh ${{ matrix.smoke }} --no-console

      - name: Capture stack logs on failure
        if: failure()
        working-directory: deployments/standalone
        run: |
          mkdir -p "$RUNNER_TEMP/standalone-smoke"
          docker compose ps -a > "$RUNNER_TEMP/standalone-smoke/services.txt" 2>&1 || true
          for s in amp-init amp-api gateway-controller gateway-runtime; do
            docker compose logs --no-color --tail 300 "$s" \
              > "$RUNNER_TEMP/standalone-smoke/$s.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: standalone-smoke-${{ matrix.distribution }}
          path: ${{ runner.temp }}/standalone-smoke/
