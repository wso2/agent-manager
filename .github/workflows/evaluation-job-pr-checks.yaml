name: Evaluation Job

on:
  pull_request:
    branches: ["main"]
    paths:
      - "evaluation-job/**"
      - ".github/workflows/evaluation-job-pr-checks.yaml"

# Default token scope is read-only; jobs that publish, push or deploy
# request the extra scopes they need at job level.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: evaluation-job
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned: ruff 0.16 widened its default rule set, so an unpinned
          # install changes what CI enforces without any code change.
          pip install ruff==0.15.22

      - name: Run ruff linter
        run: ruff check .

      - name: Run ruff formatter check
        run: ruff format --check .

  test:
    name: Test
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: evaluation-job
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ../libs/amp-evaluation
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest test_main.py -v

  type-check:
    name: Type Check
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: evaluation-job
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ../libs/amp-evaluation
          pip install -r requirements.txt
          pip install mypy

      - name: Run mypy
        run: mypy main.py --install-types --non-interactive
