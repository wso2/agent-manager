name: Deployable Sample Python Compatibility
on:
  pull_request:
    paths:
      - 'test/instrumentation-matrix/harness/deployable_samples.py'
      - 'test/instrumentation-matrix/matrix.yaml'
      - 'test/instrumentation-matrix/scripts/check_sample_python_compat.py'
      - '.github/workflows/deployable-sample-python-compat.yaml'
  # The samples live in wso2/agent-manager-samples, so path filters here cannot
  # see their changes. A daily run catches drift on the samples main branch,
  # and a dispatch can test a specific samples commit before it merges.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      samples_ref:
        description: Branch, tag or commit of wso2/agent-manager-samples to test
        required: false
        default: main
permissions:
  contents: read
concurrency:
  group: deployable-sample-python-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resolve:
    name: Resolve deployable samples on matrix Pythons
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: wso2/agent-manager-samples
          ref: ${{ inputs.samples_ref || 'main' }}
          path: .agent-manager-samples
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install uv pyyaml
      - run: python test/instrumentation-matrix/scripts/check_sample_python_compat.py
