name: Agent Manager CLI

on:
  pull_request:
    branches: ["main", "amp-2.x"]
    paths:
      - "cli/**"
      - "scripts/build-amctl.sh"
      - ".github/workflows/amctl-pr-checks.yaml"

permissions:
  contents: read

jobs:
  checks:
    name: PR Checks
    timeout-minutes: 30
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6.1.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Check formatting
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "Code is not formatted. Run 'gofmt -w .' from cli/."
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Check module metadata
        if: ${{ !cancelled() }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify modules
        if: ${{ !cancelled() }}
        run: go mod verify

      - name: Install pinned lint tools (tools.mk)
        if: ${{ !cancelled() }}
        working-directory: .
        run: make tools-lint

      - name: Run staticcheck
        if: ${{ !cancelled() }}
        run: staticcheck ./...

      - name: Run go vet
        if: ${{ !cancelled() }}
        run: go vet -mod=readonly ./...

      - name: Run tests
        if: ${{ !cancelled() }}
        run: go test -mod=readonly -race -coverprofile=coverage.out ./...

      - name: Check coverage
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          python3 scripts/coverage/go_summary.py cli/coverage.out \
            --module github.com/wso2/agent-manager/cli \
            --exclude-file cli/coverage-excludes.txt \
            --out cli/coverage-summary.json
          python3 scripts/coverage/ratchet.py cli/coverage-summary.json \
            cli/coverage-baseline.json --title "amctl coverage"

      - name: Build CLI
        if: ${{ !cancelled() }}
        run: go build -mod=readonly ./...

      - name: Validate build script syntax
        if: ${{ !cancelled() }}
        working-directory: .
        run: sh -n scripts/build-amctl.sh
