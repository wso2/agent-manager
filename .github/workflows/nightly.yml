name: Nightly Dev Build

run-name: Nightly Dev Build #${{ github.run_number }}

on:
  # schedule:
  #   - cron: '0 0 * * *' # midnight UTC
  workflow_dispatch: {}

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.AMP_REGISTRY || 'ghcr.io' }}
  REGISTRY_ORG: ${{ vars.AMP_REGISTRY_ORG || 'wso2' }}
  HELM_REGISTRY: ${{ vars.AMP_HELM_REGISTRY || 'oci://ghcr.io/wso2' }}

jobs:
  # Compute the dated version string once; all jobs consume it via needs.
  compute-version:
    name: Compute Version
    runs-on: ubuntu-latest
    outputs:
      dev-version: ${{ steps.version.outputs.dev-version }}
    steps:
      - name: Compute dev version
        id: version
        run: |
          DEV_VERSION="0.0.0-dev-$(date -u +%Y%m%d)"
          echo "dev-version=$DEV_VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Dev version: $DEV_VERSION"

  # Delete previous nightly Docker/OCI image tags (0.0.0-dev-*) from all packages
  # before building new ones so stale dated tags don't accumulate.
  cleanup-images:
    name: Cleanup Previous Nightly Images
    # Talks to the GHCR packages API directly, so it only applies when the
    # registry is GHCR. A build publishing elsewhere has nothing to clean here.
    if: ${{ vars.AMP_REGISTRY == '' || vars.AMP_REGISTRY == 'ghcr.io' }}
    needs: compute-version
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - amp-api
          - amp-console
          - amp-observer
          - amp-quick-start
          - amp-evaluation-monitor
          - wso2-agent-manager
          - wso2-amp-observability-extension
          - wso2-amp-platform-resources-extension
          - wso2-amp-thunder-extension
          - wso2-amp-evaluation-extension
          - wso2-amp-api-platform-gateway-extension
    steps:
      # The package may not exist yet (e.g. right after an image is renamed,
      # before its first build/push creates the GHCR package), in which case
      # ghcr-cleanup-action 404s and fails the job. Probe existence first so
      # we can skip cleanup in that specific case without masking real
      # failures (auth errors, GHCR outages) from the cleanup step itself.
      - name: Check if package ${{ matrix.package }} exists
        id: check-package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
        run: |
          err=$(mktemp)
          if gh api "orgs/${REGISTRY_ORG}/packages/container/${PACKAGE}" >/dev/null 2>"$err"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" "$err"; then
            echo "::warning::Package ${PACKAGE} not found yet — skipping cleanup."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Failed to check package ${PACKAGE}:"
            cat "$err" >&2
            exit 1
          fi

      # GHCR refuses to delete a package's last remaining tagged version
      # ("You must delete the package instead"). A package that has only
      # ever had nightly dev builds (e.g. right after a rename, before its
      # first real release) has no other tag to fall back on, so deleting
      # its sole 0.0.0-dev-* tag would hit that error. Detect this case and
      # skip cleanup for it instead of failing the job.
      - name: Check tagged versions for ${{ matrix.package }}
        id: check-tags
        if: steps.check-package.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
        run: |
          tags=$(gh api "orgs/${REGISTRY_ORG}/packages/container/${PACKAGE}/versions" \
            --paginate --jq '.[].metadata.container.tags[]?')
          total=$(printf '%s\n' "$tags" | grep -c . || true)
          dev_only=$(printf '%s\n' "$tags" | grep -c '^0\.0\.0-dev-' || true)
          if [ "$total" -gt 0 ] && [ "$total" -eq "$dev_only" ]; then
            echo "::warning::${PACKAGE} has no tagged version besides its nightly dev tag(s) yet; GHCR won't allow deleting the last tagged version, so skipping cleanup until a real release tag exists."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete previous 0.0.0-dev-* tags for ${{ matrix.package }}
        if: steps.check-package.outputs.exists == 'true' && steps.check-tags.outputs.skip != 'true'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ env.REGISTRY_ORG }}
          package: ${{ matrix.package }}
          delete-tags: '0.0.0-dev-*'
          delete-untagged: false

  # Delete the previous nightly git tag before creating the new dated one.
  cleanup-git-tag:
    name: Cleanup Previous Nightly Git Tag
    needs: compute-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete previous nightly git tags
        env:
          TODAY_TAG: amp/v${{ needs.compute-version.outputs.dev-version }}
        run: |
          # Delete all remote amp/v0.0.0-dev-* tags except today's (which doesn't exist yet)
          git ls-remote --tags origin 'refs/tags/amp/v0.0.0-dev-*' \
            | awk '{print $2}' \
            | sed 's|refs/tags/||' \
            | grep -v "^${TODAY_TAG}$" \
            | while read -r tag; do
                echo "Deleting tag: $tag"
                git push origin --delete "refs/tags/$tag" || echo "⚠️ Could not delete $tag (may not exist)"
              done
          echo "✅ Previous nightly git tags cleaned"

  # Load release-config.json and emit job matrices (mirrors release.yml pattern).
  load-config:
    name: Load Config
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-matrix.outputs.images }}
      charts: ${{ steps.set-matrix.outputs.charts }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load configuration and set matrix
        id: set-matrix
        run: |
          CONFIG_FILE=".github/release-config.json"
          CHARTS_BASE_PATH=$(jq -r '.config["charts-base-path"]' "$CONFIG_FILE")

          IMAGES=$(jq -c --arg base "$CHARTS_BASE_PATH" '[.images[] | {
            name: .name,
            "service-dir": .dir,
            dockerfile: (.dir + "/Dockerfile"),
            context: (.context // "")
          }]' "$CONFIG_FILE")

          CHARTS=$(jq -c --arg base "$CHARTS_BASE_PATH" '[.charts[] | {
            name: .,
            path: ($base + "/" + .),
            "chart-file": ($base + "/" + . + "/Chart.yaml")
          }]' "$CONFIG_FILE")

          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "charts=$CHARTS" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build ${{ matrix.image.name }}
    needs: [compute-version, cleanup-images, load-config]
    # cleanup-images is skipped when publishing somewhere other than GHCR, and a
    # skipped dependency would otherwise skip this job and everything after it,
    # turning the whole nightly into a silent no-op.
    if: >-
      always() &&
      needs.compute-version.result == 'success' &&
      needs.load-config.result == 'success' &&
      (needs.cleanup-images.result == 'success' || needs.cleanup-images.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.load-config.outputs.images) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }}
        if: hashFiles(matrix.image.dockerfile) != ''
        uses: ./.github/actions/build-docker-image
        with:
          service-dir: ${{ matrix.image.service-dir }}
          image-name: ${{ matrix.image.name }}
          registry: ${{ env.REGISTRY }}
          registry-org: ${{ env.REGISTRY_ORG }}
          tag: ${{ needs.compute-version.outputs.dev-version }}
          context: ${{ matrix.image.context }}

  package-charts:
    name: Package ${{ matrix.chart.name }}
    needs: [compute-version, build-images, load-config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.load-config.outputs.charts) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Helm (deployments/setup/cluster-tools.env)
        uses: ./.github/actions/setup-cluster-clis
        with:
          k3d: "false"
          kubectl: "false"

      - name: Cache Helm chart dependencies
        if: hashFiles(format('{0}/Chart.lock', matrix.chart.path)) != ''
        uses: actions/cache@v5
        with:
          path: ${{ matrix.chart.path }}/charts
          key: helm-charts-${{ hashFiles(format('{0}/Chart.lock', matrix.chart.path)) }}

      - name: Patch chart image tags
        env:
          DEV_VERSION: ${{ needs.compute-version.outputs.dev-version }}
        run: |
          # Substitute 0.0.0-dev image tags with the dated nightly tag.
          # Unlike release.yml (which prepends v), nightly images have no v prefix.
          find ./deployments/helm-charts -name "values.yaml" -type f | while read -r f; do
            sed -i.bak "s|tag: \"0\.0\.0-dev\"|tag: \"${DEV_VERSION}\"|g" "$f"
            rm -f "${f}.bak"
          done
          echo "✅ Patched image tags to ${DEV_VERSION}"

      - name: Package and push ${{ matrix.chart.name }}
        if: hashFiles(matrix.chart.chart-file) != ''
        run: |
          bash .github/scripts/package-helm-chart.sh \
            "$CHART_PATH" \
            "$DEV_VERSION" \
            "$HELM_REGISTRY" \
            "$HELM_TOKEN"
        env:
          CHART_PATH: ${{ matrix.chart.path }}
          DEV_VERSION: ${{ needs.compute-version.outputs.dev-version }}
          HELM_REGISTRY: ${{ env.HELM_REGISTRY }}
          HELM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # package-helm-chart.sh prefers these over the positional token, so a
          # custom HELM_REGISTRY authenticates with its own credentials instead of
          # a GITHUB_TOKEN that means nothing to it.
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  update-dev-tag:
    name: Update Nightly Git Tag
    needs: [compute-version, cleanup-git-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Create nightly git tag
        env:
          DEV_VERSION: ${{ needs.compute-version.outputs.dev-version }}
        run: |
          TAG="amp/v${DEV_VERSION}"
          COMMIT_SHA=$(git rev-parse HEAD)
          # Delete existing tag if present locally or remotely (idempotent — safe to re-run same day)
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -d "$TAG"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin --delete "refs/tags/$TAG"
          fi
          git tag -a "$TAG" -m "Nightly dev build ${DEV_VERSION} from main at ${COMMIT_SHA:0:7}"
          git push origin "$TAG"
          echo "✅ Created tag $TAG at ${COMMIT_SHA:0:7}"

  e2e:
    name: E2E
    needs: [compute-version, package-charts, update-dev-tag]
    runs-on: ubuntu-24.04
    # Bumped from 60 to accommodate the reduced test parallelism below: with
    # --procs=1 (was -p, i.e. one proc per vCPU) suites run serially, so
    # wall-clock grows even though no suite thrashes on CPU any more.
    timeout-minutes: 150
    permissions:
      contents: read
      checks: write
    outputs:
      summary: ${{ steps.test-summary.outputs.summary }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install cluster CLIs (deployments/setup/cluster-tools.env)
        uses: ./.github/actions/setup-cluster-clis

      - name: Install yq
        env:
          YQ_VERSION: v4.45.4
          YQ_SHA256: b96de04645707e14a12f52c37e6266832e03c29e95b9b139cddcae7314466e69
        run: |
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install /tmp/yq /usr/local/bin/yq

      - name: Install platform
        id: install-platform
        env:
          VERSION: ${{ needs.compute-version.outputs.dev-version }}
        run: |
          cd deployments/quick-start && bash install.sh

      - name: Run e2e tests
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.INSTRUMENTATION_TEST_OPENAI_API_KEY }}
          # add-environment.sh requires CHART_VERSION; pin it to the same chart
          # version the platform was installed with above.
          CHART_VERSION: ${{ needs.compute-version.outputs.dev-version }}
        run: |
          set -o pipefail
          # --procs=1 (was -p, which auto-picks one proc per vCPU = 4 on the
          # ubuntu-24.04 runner). The single-node k3d cluster cannot fit
          # multiple concurrent per-environment stacks (each env = its own
          # Thunder + isolated API Platform Gateway controller/runtime + agent
          # runtime pods); the node ran out of CPU, leaving pods Pending
          # ("Insufficient cpu") and gateway bootstrap Jobs timing out. Running
          # suites serially keeps the footprint to one environment at a time.
          # --timeout raised to 90m to match the longer serial wall-clock.
          cd test/e2e && go run github.com/onsi/ginkgo/v2/ginkgo -v --procs=1 --timeout 90m \
            --poll-progress-after=600s --keep-going --junit-report=report.xml \
            ./tests/... 2>&1 | tee e2e-output.log

      - name: Run security conformance tests
        if: ${{ !cancelled() && steps.install-platform.outcome == 'success' }}
        env:
          SECURITY_PROBE_REPOSITORY_URL: ${{ format('{0}/{1}', github.server_url, github.repository) }}
          SECURITY_PROBE_REPOSITORY_BRANCH: ${{ github.ref_name }}
        run: |
          set -o pipefail
          make security-test-live 2>&1 | tee test/e2e/security-output.log

      - name: Dump pod logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/pod-logs
          kubectl logs deployment/amp-api -n wso2-amp --tail=500 --all-containers=true > /tmp/pod-logs/amp-api.txt 2>&1 || true
          kubectl logs deployment/openchoreo-api -n openchoreo-control-plane --tail=500 --all-containers=true > /tmp/pod-logs/openchoreo-api.txt 2>&1 || true
          kubectl logs deployment/amp-observer -n openchoreo-observability-plane --tail=500 --all-containers=true > /tmp/pod-logs/amp-observer.txt 2>&1 || true
          kubectl logs deployment/observer -n openchoreo-observability-plane --tail=500 --all-containers=true > /tmp/pod-logs/observer.txt 2>&1 || true
          # openchoreo reconciler (drives data-plane Release/ReleaseBinding rollout)
          kubectl logs deployment/controller-manager -n openchoreo-control-plane --tail=500 --all-containers=true > /tmp/pod-logs/openchoreo-controller-manager.txt 2>&1 || true
          # OpenBao + external-secrets: the secret-sync path. When an ExternalSecret
          # never materializes (install times out "Waiting for secret ..."), the
          # actual cause — e.g. a ClusterSecretStore not ready, or an OpenBao
          # Kubernetes-auth failure — appears only in these logs.
          kubectl logs -n openbao openbao-0 --tail=500 > /tmp/pod-logs/openbao.txt 2>&1 || true
          kubectl logs -n external-secrets -l app.kubernetes.io/name=external-secrets --tail=500 --all-containers=true > /tmp/pod-logs/external-secrets.txt 2>&1 || true
          kubectl get clustersecretstores,externalsecrets -A -o wide > /tmp/pod-logs/secret-stores.txt 2>&1 || true
          kubectl describe clustersecretstore default > /tmp/pod-logs/clustersecretstore-default.txt 2>&1 || true
          # Cluster-wide pod state, plus Warning events only (surfaces stuck data-plane agent rollouts)
          kubectl get pods -A -o wide > /tmp/pod-logs/all-pods.txt 2>&1 || true
          kubectl get events -A --field-selector type=Warning --sort-by=.lastTimestamp > /tmp/pod-logs/warning-events.txt 2>&1 || true
          # Node allocatable vs. requested — the "Allocated resources" table here is
          # what makes an "Insufficient cpu" scheduling failure diagnosable (shows
          # how close total pod CPU requests are to the node's allocatable).
          kubectl describe nodes > /tmp/pod-logs/nodes-describe.txt 2>&1 || true
          kubectl top nodes > /tmp/pod-logs/nodes-top.txt 2>&1 || true
          kubectl top pods -A --sort-by=cpu > /tmp/pod-logs/pods-top-cpu.txt 2>&1 || true
          for pod in $(kubectl get pods -n workflows-default --no-headers -o custom-columns=":metadata.name" 2>/dev/null); do
            kubectl logs "$pod" -n workflows-default --all-containers=true --tail=200 > "/tmp/pod-logs/wf-pod-${pod}.txt" 2>&1 || true
          done
          # User workload (agent runtime) pods live in per-env data-plane namespaces
          # (dp-<org>-<project>-<env>-<hash>). These carry the actual agent invocation
          # errors (e.g. "500 Connection error"), so capture logs for every pod in them.
          for ns in $(kubectl get ns --no-headers -o custom-columns=":metadata.name" 2>/dev/null | grep '^dp-'); do
            for pod in $(kubectl get pods -n "$ns" --no-headers -o custom-columns=":metadata.name" 2>/dev/null); do
              kubectl logs "$pod" -n "$ns" --all-containers=true --tail=500 > "/tmp/pod-logs/dp-${ns}-${pod}.txt" 2>&1 || true
            done
          done
          # Per-env API Platform Gateway + Thunder pods. Each environment's gateway
          # stack lives in its own "<org>-<env>" namespace and its Thunder in
          # "amp-thunder-<org>-<env>"; the gateway's Helm pre-install bootstrap Job
          # runs there. Capturing these makes "failed pre-install: timed out
          # waiting for the condition" debuggable (the bootstrap Job pod log is the
          # only place the actual healthz/IDP/registration error appears). Also
          # describe non-Running pods to surface exit reasons and scheduling events.
          for ns in $(kubectl get ns --no-headers -o custom-columns=":metadata.name" 2>/dev/null \
              | grep -E '^(default-|amp-thunder-)' || true); do
            for pod in $(kubectl get pods -n "$ns" --no-headers -o custom-columns=":metadata.name" 2>/dev/null); do
              kubectl logs "$pod" -n "$ns" --all-containers=true --tail=200 > "/tmp/pod-logs/ns-${ns}--${pod}.txt" 2>&1 || true
            done
            kubectl get pods -n "$ns" --no-headers 2>/dev/null \
              | awk '$3 != "Running" && $3 != "Completed" { print $1 }' \
              | while read -r p; do
                  kubectl describe pod "$p" -n "$ns" > "/tmp/pod-logs/describe-${ns}--${p}.txt" 2>&1 || true
                done
          done

      - name: Upload pod logs
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pod-logs
          path: /tmp/pod-logs/
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@6e6a65b7a0bd2c9197df7d0ae36ac5cee784230c # v2.0.0
        with:
          name: Nightly E2E Test Results
          path: test/e2e/report.xml
          reporter: java-junit

      - name: Publish security test results
        if: ${{ always() && hashFiles('test/e2e/security-report.xml') != '' }}
        uses: dorny/test-reporter@6e6a65b7a0bd2c9197df7d0ae36ac5cee784230c # v2.0.0
        with:
          name: Nightly Security Conformance Results
          path: test/e2e/security-report.xml
          reporter: java-junit

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: e2e-test-logs
          path: |
            test/e2e/e2e-output.log
            test/e2e/security-output.log
          retention-days: 7

      # Parse the ginkgo JUnit report into a one-line summary for the Chat alert.
      # Sums the attributes across all <testsuite> elements so the counts hold
      # even if ginkgo emits more than one suite.
      - name: Build test summary
        id: test-summary
        if: always()
        run: |
          REPORT="test/e2e/report.xml"
          if [ ! -f "$REPORT" ]; then
            echo "summary=test report not found (suite likely failed before producing report.xml)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sum_attr() {
            grep -o "<testsuite [^>]*" "$REPORT" \
              | grep -o "$1=\"[0-9]*\"" \
              | grep -o '[0-9]*' \
              | awk '{s+=$1} END {print s+0}'
          }
          TESTS=$(sum_attr tests)
          FAILURES=$(sum_attr failures)
          ERRORS=$(sum_attr errors)
          SKIPPED=$(sum_attr skipped)
          PASSED=$(( TESTS - FAILURES - ERRORS - SKIPPED ))
          SUMMARY="${PASSED} passed, ${FAILURES} failed, ${ERRORS} errored, ${SKIPPED} skipped (of ${TESTS})"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "Test summary: $SUMMARY"

  notify-google-chat:
    name: Notify Google Chat
    needs: [compute-version, e2e]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    steps:
      - name: Post failure alert
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          DEV_VERSION: ${{ needs.compute-version.outputs.dev-version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_SUMMARY: ${{ needs.e2e.outputs.summary }}
        run: |
          if [ -z "${GCHAT_WEBHOOK_URL}" ]; then
            echo "::warning::GCHAT_WEBHOOK_URL secret is not set; skipping Chat notification."
            exit 0
          fi
          SUMMARY_LINE="${TEST_SUMMARY:-no test summary available}"
          # Build the JSON with jq so the summary text is safely escaped.
          PAYLOAD=$(jq -n \
            --arg version "${DEV_VERSION}" \
            --arg summary "${SUMMARY_LINE}" \
            --arg url "${RUN_URL}" \
            '{text: ("*🔴 Nightly E2E failed* — `\($version)`\n" + $summary + "\n<\($url)|View run>")}')
          curl -s -X POST "${GCHAT_WEBHOOK_URL}" \
            -H 'Content-Type: application/json' \
            -d "${PAYLOAD}"
