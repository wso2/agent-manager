name: Nightly Dev Build

run-name: Nightly Dev Build #${{ github.run_number }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Builds the images, runs the e2e tests on the Docker Compose stack, and
# publishes the nightly tag only when they pass. Manual runs are dry runs by default.

on:
  schedule:
    - cron: '30 21 * * *' # 21:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Test only: uses a temporary version that is deleted at the end.
        required: false
        default: true
        type: boolean
      ginkgo_procs:
        description: >-
          How many test suites run at the same time.
        required: false
        default: '1'
        type: string

concurrency:
  group: nightly
  cancel-in-progress: false

# Read-only by default; jobs that need more declare their own permissions.
permissions:
  contents: read

env:
  REGISTRY: ${{ vars.AMP_REGISTRY || 'ghcr.io' }}
  REGISTRY_ORG: ${{ vars.AMP_REGISTRY_ORG || 'wso2' }}

jobs:
  # Dated version used by all jobs. A dry run gets its own version.
  compute-version:
    name: Compute Version
    runs-on: [self-hosted, amp-nightly-e2e]
    timeout-minutes: 10
    outputs:
      dev-version: ${{ steps.version.outputs.dev-version }}
      dry-run: ${{ steps.version.outputs.dry-run }}
    steps:
      - name: Compute dev version
        id: version
        env:
          # Inputs are empty on a schedule, so scheduled runs are never dry runs.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            DEV_VERSION="0.0.0-dryrun-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          else
            DRY_RUN=false
            DEV_VERSION="0.0.0-dev-$(date -u +%Y%m%d)"
          fi
          echo "dev-version=$DEV_VERSION" >> "$GITHUB_OUTPUT"
          echo "dry-run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "✅ Dev version: $DEV_VERSION (dry run: $DRY_RUN)"

  # Build matrices from release-config.json.
  load-config:
    name: Load Config
    runs-on: [self-hosted, amp-nightly-e2e]
    timeout-minutes: 10
    outputs:
      images: ${{ steps.set-matrix.outputs.images }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load configuration and set matrix
        id: set-matrix
        run: |
          CONFIG_FILE=".github/release-config.json"
          IMAGES=$(jq -c '[.images[] | {
            name: .name,
            "service-dir": .dir,
            dockerfile: (.dir + "/Dockerfile"),
            context: (.context // "")
          }]' "$CONFIG_FILE")

          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build ${{ matrix.image.name }}
    needs: [compute-version, load-config]
    runs-on: [self-hosted, amp-nightly-e2e]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.load-config.outputs.images) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Fail early if the Dockerfile is missing.
      - name: Check Dockerfile exists
        env:
          DOCKERFILE: ${{ matrix.image.dockerfile }}
        run: |
          if [ ! -f "$DOCKERFILE" ]; then
            echo "::error::Dockerfile not found at ${DOCKERFILE} (from .github/release-config.json). Fix the config or restore the file."
            exit 1
          fi

      # Needed to build the arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
          # Log out at the end of the job.
          logout: true

      - name: Build and push ${{ matrix.image.name }}
        uses: ./.github/actions/build-docker-image
        with:
          service-dir: ${{ matrix.image.service-dir }}
          image-name: ${{ matrix.image.name }}
          registry: ${{ env.REGISTRY }}
          registry-org: ${{ env.REGISTRY_ORG }}
          tag: ${{ needs.compute-version.outputs.dev-version }}
          context: ${{ matrix.image.context }}

  e2e:
    name: E2E
    needs: [compute-version, build-images]
    runs-on: [self-hosted, amp-nightly-e2e]
    timeout-minutes: 200
    permissions:
      contents: read
      checks: write
    outputs:
      summary: ${{ steps.test-summary.outputs.summary }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Start from a clean state.
      - name: Clean leftover state from a previous run
        uses: ./.github/actions/teardown-self-hosted
        with:
          registry: ${{ env.REGISTRY }}

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      # Run the images this nightly just pushed on the Docker Compose stack.
      - name: Install platform
        id: install-platform
        timeout-minutes: 20
        env:
          VERSION: ${{ needs.compute-version.outputs.dev-version }}
        run: |
          bash .github/scripts/pin-standalone-images.sh "${VERSION}" "${REGISTRY}/${REGISTRY_ORG}"
          cd deployments/standalone
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 600 --scale amp-console=0

      - name: Run e2e tests
        id: e2e-tests
        timeout-minutes: 120
        env:
          OPENAI_API_KEY: ${{ secrets.INSTRUMENTATION_TEST_OPENAI_API_KEY }}
          GINKGO_PROCS: ${{ inputs.ginkgo_procs || '1' }}
        run: |
          set -o pipefail
          # Suites run one at a time by default. --timeout is the total budget.
          cd test/e2e && go run github.com/onsi/ginkgo/v2/ginkgo -v --procs="${GINKGO_PROCS}" --timeout 90m \
            --poll-progress-after=600s --keep-going --junit-report=report.xml \
            ./tests/... 2>&1 | tee e2e-output.log

      # Runs even if the e2e tests failed.
      - name: Run security conformance tests
        id: security-tests
        if: ${{ !cancelled() && steps.install-platform.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          set -o pipefail
          make security-test-live 2>&1 | tee test/e2e/security-output.log

      - name: Dump service logs
        if: ${{ always() && steps.install-platform.outcome != 'skipped' }}
        working-directory: deployments/standalone
        run: |
          mkdir -p /tmp/service-logs
          docker compose ps -a > /tmp/service-logs/services.txt 2>&1 || true
          docker stats --no-stream > /tmp/service-logs/stats.txt 2>&1 || true
          for service in $(docker compose config --services); do
            docker compose logs --no-color --tail 500 "$service" > "/tmp/service-logs/${service}.txt" 2>&1 || true
          done

      - name: Upload service logs
        if: ${{ always() && steps.install-platform.outcome != 'skipped' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: service-logs
          path: /tmp/service-logs/
          retention-days: 7

      # Only publishes; the test step decides pass or fail.
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@6e6a65b7a0bd2c9197df7d0ae36ac5cee784230c # v2.0.0
        with:
          name: Nightly E2E Test Results
          path: test/e2e/report.xml
          reporter: java-junit
          fail-on-error: 'false'
          fail-on-empty: 'false'

      - name: Publish security test results
        if: ${{ always() && hashFiles('test/e2e/security-report.xml') != '' }}
        uses: dorny/test-reporter@6e6a65b7a0bd2c9197df7d0ae36ac5cee784230c # v2.0.0
        with:
          name: Nightly Security Conformance Results
          path: test/e2e/security-report.xml
          reporter: java-junit
          fail-on-error: 'false'
          fail-on-empty: 'false'

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: e2e-test-logs
          path: |
            test/e2e/e2e-output.log
            test/e2e/security-output.log
          retention-days: 7

      # One-line test summary for the notification.
      - name: Build test summary
        id: test-summary
        if: always()
        run: |
          summarise() {
            local report="$1"
            if [ ! -f "$report" ]; then
              echo "no report (suite did not run or failed before producing it)"
              return
            fi
            sum_attr() {
              grep -o "<testsuite [^>]*" "$report" \
                | grep -o "$1=\"[0-9]*\"" \
                | grep -o '[0-9]*' \
                | awk '{s+=$1} END {print s+0}'
            }
            local tests failures errors skipped passed
            tests=$(sum_attr tests); failures=$(sum_attr failures)
            errors=$(sum_attr errors); skipped=$(sum_attr skipped)
            passed=$(( tests - failures - errors - skipped ))
            echo "${passed} passed, ${failures} failed, ${errors} errored, ${skipped} skipped (of ${tests})"
          }
          E2E_SUMMARY=$(summarise test/e2e/report.xml)
          SEC_SUMMARY=$(summarise test/e2e/security-report.xml)
          SUMMARY="e2e: ${E2E_SUMMARY} | security: ${SEC_SUMMARY}"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "Test summary: $SUMMARY"

      # Last step, as the steps above still use the stack.
      - name: Teardown
        if: ${{ always() }}
        uses: ./.github/actions/teardown-self-hosted

  # After e2e passes, move the nightly git tag to this commit. Not on a dry run.
  publish-dev-tag:
    name: Publish Nightly Git Tag
    needs: [compute-version, e2e]
    if: ${{ needs.e2e.result == 'success' && needs.compute-version.outputs.dry-run != 'true' }}
    runs-on: [self-hosted, amp-nightly-e2e]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Delete previous nightly git tags
        env:
          TODAY_TAG: amp/v${{ needs.compute-version.outputs.dev-version }}
        run: |
          git ls-remote --tags origin 'refs/tags/amp/v0.0.0-dev-*' \
            | awk '{print $2}' \
            | sed 's|refs/tags/||' \
            | grep -v "^${TODAY_TAG}$" \
            | while read -r tag; do
                echo "Deleting tag: $tag"
                git push origin --delete "refs/tags/$tag" || echo "⚠️ Could not delete $tag (may not exist)"
              done
          echo "✅ Previous nightly git tags cleaned"

      - name: Create nightly git tag
        env:
          DEV_VERSION: ${{ needs.compute-version.outputs.dev-version }}
        run: |
          TAG="amp/v${DEV_VERSION}"
          COMMIT_SHA=$(git rev-parse HEAD)
          # Replace the tag if it already exists.
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -d "$TAG"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin --delete "refs/tags/$TAG"
          fi
          git tag -a "$TAG" -m "Nightly dev build ${DEV_VERSION} from main at ${COMMIT_SHA:0:7}"
          git push origin "$TAG"
          echo "✅ Created tag $TAG at ${COMMIT_SHA:0:7}"

  # Real run: after e2e passes, delete older nightly images.
  # Dry run: always delete this run's images.
  cleanup-images:
    name: Cleanup Nightly Images
    needs: [compute-version, e2e]
    # GHCR only.
    if: >-
      ${{ (vars.AMP_REGISTRY == '' || vars.AMP_REGISTRY == 'ghcr.io') && (
        (always() && needs.compute-version.outputs.dry-run == 'true') ||
        (needs.e2e.result == 'success' && needs.compute-version.outputs.dry-run != 'true')
      ) }}
    runs-on: [self-hosted, amp-nightly-e2e]
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - amp-api
          - amp-console
          - amp-observer
    steps:
      # Skip packages that do not exist yet.
      - name: Check if package ${{ matrix.package }} exists
        id: check-package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
        run: |
          err=$(mktemp)
          if gh api "orgs/${REGISTRY_ORG}/packages/container/${PACKAGE}" >/dev/null 2>"$err"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" "$err"; then
            echo "::warning::Package ${PACKAGE} not found yet — skipping cleanup."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Failed to check package ${PACKAGE}:"
            cat "$err" >&2
            exit 1
          fi

      # Today's tag is always kept.
      - name: Delete nightly tags for ${{ matrix.package }}
        if: steps.check-package.outputs.exists == 'true'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ env.REGISTRY_ORG }}
          package: ${{ matrix.package }}
          delete-tags: ${{ needs.compute-version.outputs.dry-run == 'true' && needs.compute-version.outputs.dev-version || '0.0.0-dev-*' }}
          exclude-tags: ${{ needs.compute-version.outputs.dry-run != 'true' && needs.compute-version.outputs.dev-version || '' }}
          delete-untagged: false

  # Posts the result of every run, except cancelled runs and dry runs.
  notify-google-chat:
    name: Notify Google Chat
    needs: [compute-version, load-config, build-images, e2e, publish-dev-tag]
    if: ${{ !cancelled() && needs.compute-version.outputs.dry-run != 'true' }}
    runs-on: [self-hosted, amp-nightly-e2e]
    timeout-minutes: 10
    steps:
      - name: Post run status
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          DEV_VERSION: ${{ needs.compute-version.outputs.dev-version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_SUMMARY: ${{ needs.e2e.outputs.summary }}
          VERSION_RESULT: ${{ needs.compute-version.result }}
          CONFIG_RESULT: ${{ needs.load-config.result }}
          BUILD_RESULT: ${{ needs.build-images.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          TAG_RESULT: ${{ needs.publish-dev-tag.result }}
        run: |
          STAGES="version=${VERSION_RESULT} config=${CONFIG_RESULT} build=${BUILD_RESULT} e2e=${E2E_RESULT} tag=${TAG_RESULT}"
          echo "Stages: ${STAGES}"
          if [ -z "${GCHAT_WEBHOOK_URL}" ]; then
            echo "::warning::GCHAT_WEBHOOK_URL secret is not set; skipping Chat notification."
            exit 0
          fi
          if [ "${BUILD_RESULT}" = "success" ] && [ "${E2E_RESULT}" = "success" ] && [ "${TAG_RESULT}" = "success" ]; then
            HEADLINE="*🟢 Nightly passed* — \`${DEV_VERSION}\`"
          else
            # Report the earliest stage that failed.
            FAILED_STAGE="tag"
            [ "${E2E_RESULT}" != "success" ] && FAILED_STAGE="e2e"
            [ "${BUILD_RESULT}" != "success" ] && FAILED_STAGE="build"
            SETUP_FAILED=""
            case "${VERSION_RESULT}" in failure|cancelled) SETUP_FAILED="compute-version" ;; esac
            case "${CONFIG_RESULT}" in failure|cancelled) SETUP_FAILED="${SETUP_FAILED:+${SETUP_FAILED} and }load-config" ;; esac
            [ -n "${SETUP_FAILED}" ] && FAILED_STAGE="${SETUP_FAILED}"
            HEADLINE="*🔴 Nightly failed at ${FAILED_STAGE}* — \`${DEV_VERSION:-unknown version}\`"
          fi
          SUMMARY_LINE="${TEST_SUMMARY:-no test summary available}"
          # Build the JSON with jq so the summary text is safely escaped.
          PAYLOAD=$(jq -n \
            --arg headline "${HEADLINE}" \
            --arg stages "${STAGES}" \
            --arg summary "${SUMMARY_LINE}" \
            --arg url "${RUN_URL}" \
            '{text: ($headline + "\n" + $stages + "\n" + $summary + "\n<\($url)|View run>")}')
          curl -s -X POST "${GCHAT_WEBHOOK_URL}" \
            -H 'Content-Type: application/json' \
            -d "${PAYLOAD}"
