name: Dev Build

run-name: Dev Build from ${{ inputs.source-ref }}

# Builds and publishes every image from a ref, without E2E, so a build can be
# run (deployments/standalone) and tested by hand. Earlier builds are kept.
on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: "Branch, tag or commit SHA to build"
        required: false
        default: "main"
        type: string

concurrency:
  group: dev-build
  cancel-in-progress: false

# Fixed to the public registry the standalone bundle pins.
env:
  REGISTRY: ghcr.io
  REGISTRY_ORG: wso2

permissions:
  contents: read

jobs:
  # Pin the source commit once; every job builds that exact commit.
  prepare:
    name: Prepare
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source-ref }}

      # A prefix other than 0.0.0-dev keeps the nightly cleanup off these builds.
      - name: Compute version
        id: version
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION="0.0.0-snapshot-$(date -u +%Y%m%d)-${SHA:0:7}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION from $SHA"

  load-config:
    name: Load Config
    needs: prepare
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      images: ${{ steps.set-matrix.outputs.images }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Load configuration and set matrix
        id: set-matrix
        run: |
          CONFIG_FILE=".github/release-config.json"

          IMAGES=$(jq -c '[.images[] | {
            name: .name,
            "service-dir": .dir,
            context: (.context // "")
          }]' "$CONFIG_FILE")

          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build ${{ matrix.image.name }}
    needs: [prepare, load-config]
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.load-config.outputs.images) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }}
        uses: ./.github/actions/build-docker-image
        with:
          service-dir: ${{ matrix.image.service-dir }}
          image-name: ${{ matrix.image.name }}
          registry: ${{ env.REGISTRY }}
          registry-org: ${{ env.REGISTRY_ORG }}
          tag: ${{ needs.prepare.outputs.version }}
          context: ${{ matrix.image.context }}

  # Only a complete build gets a tag.
  tag:
    name: Create Git Tag
    needs: [prepare, build-images]
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Create and push tag
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        # The version embeds the commit, so an existing tag is a same-day rerun of this commit.
        run: |
          TAG="amp/v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; keeping it."
          else
            git tag -a "$TAG" -m "Dev build ${VERSION} from ${SHA:0:7}" "$SHA"
            git push origin "$TAG"
          fi

      - name: Write run instructions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "## Dev build \`${VERSION}\`"
            echo
            echo 'From the root of a checkout of this tag:'
            echo '```'
            echo "bash .github/scripts/pin-standalone-images.sh ${VERSION} ${REGISTRY}/${REGISTRY_ORG}"
            echo "cd deployments/standalone && cp .env.example .env && docker compose up -d --wait"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
