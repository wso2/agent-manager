name: Analect — Build amp-api image

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: "Branch, tag or commit SHA to build"
        required: false
        default: "feature/apikey-rotation-fix"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/analect-io/amp-service

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push amp-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}

      - name: Get short SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: agent-manager-service
          file: agent-manager-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest-dev
          build-args: |
            VERSION=${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image ref
        run: echo "Image pushed — ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.sha }}"
