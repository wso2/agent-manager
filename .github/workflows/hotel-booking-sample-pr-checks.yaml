name: Hotel Booking Sample PR Checks

on:
  pull_request:
    branches: ["main", "amp-2.x"]
    paths:
      - "samples/hotel-booking-agent/**"
      - ".github/workflows/hotel-booking-sample-pr-checks.yaml"
      - "test/sample-smoke/hotel_booking/**"
      - "test/sample-smoke/external_agent.py"
      - "test/instrumentation-matrix/heavy/amp_client.py"
      - "test/instrumentation-matrix/harness/classify.py"
      - ".github/actions/amp-dev-stack/**"

  workflow_dispatch:

permissions:
  contents: read

env:
  SAMPLE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: hotel-booking-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate platform failure guards
        run: |
          python -m pip install requests
          python -m unittest discover -s test/sample-smoke/hotel_booking -p 'test_*.py' -v
      - name: Run smoke test
        env:
          PYTHON: python
          REPORTS: ${{ runner.temp }}/hotel-booking-smoke
        run: bash samples/hotel-booking-agent/scripts/smoke_test.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hotel-booking-smoke
          path: ${{ runner.temp }}/hotel-booking-smoke/

  platform-smoke:
    name: Hotel Booking external agent and trace smoke
    needs: smoke-test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.SAMPLE_SHA }}
          persist-credentials: false
      # Agent Manager on Docker Compose, built from this checkout.
      - uses: ./.github/actions/amp-dev-stack
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Run the sample as an external agent and find its trace
        env:
          # Bootstrap fixture credential for this job's ephemeral stack, not a repository secret.
          IDP_CLIENT_SECRET: amp-api-client-secret
        run: |
          python test/sample-smoke/hotel_booking/platform_smoke.py \
            --python python --reports "$RUNNER_TEMP/hotel-booking-platform"
      - name: Capture stack logs on failure
        if: failure()
        working-directory: deployments/standalone
        run: |
          reports="$RUNNER_TEMP/hotel-booking-platform"
          mkdir -p "$reports"
          docker compose ps -a > "$reports/services.txt" 2>&1 || true
          for service in amp-api amp-observer gateway-controller gateway-runtime otel-collector; do
            docker compose logs --no-color --tail 300 "$service" > "$reports/$service.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hotel-booking-platform-smoke
          path: ${{ runner.temp }}/hotel-booking-platform/
