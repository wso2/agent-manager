name: Dependabot PR Summary

on:
  schedule:
    # Monday 09:00 Asia/Colombo (UTC+05:30).
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: dependabot-pr-summary
  cancel-in-progress: false

jobs:
  summarize:
    if: github.repository == 'wso2/agent-manager' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test summary logic
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_dependabot_pr_summary.py'
      - name: Collect results and notify Google Chat
        env:
          GH_TOKEN: ${{ github.token }}
          GCHAT_PR_WEBHOOK_URL: ${{ secrets.GCHAT_PR_WEBHOOK_URL }}
        run: python3 .github/scripts/dependabot_pr_summary.py
