# Runs the e2e and live security suites against the Docker Compose stack built
# from the pull request. Pull requests from forks get no secrets, so the specs
# that call a real model skip themselves there.
name: E2E Tests

on:
  pull_request:
    branches:
      - amp-2.x
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-go

      # Docker Compose stack (deployments/standalone), built from this checkout.
      - name: Install platform
        id: install-platform
        uses: ./.github/actions/amp-dev-stack
        with:
          log_route_hits: "true"
          private_events: "true"

      - name: Run e2e tests
        env:
          OPENAI_API_KEY: ${{ secrets.INSTRUMENTATION_TEST_OPENAI_API_KEY }}
        run: |
          set -o pipefail
          cd test/e2e && go run github.com/onsi/ginkgo/v2/ginkgo -v --procs=2 --timeout 60m \
            --poll-progress-after=600s --keep-going --junit-report=report.xml \
            ./tests/... 2>&1 | tee e2e-output.log

      - name: Run security conformance tests
        if: ${{ !cancelled() && steps.install-platform.outcome == 'success' }}
        run: |
          set -o pipefail
          make security-test-live 2>&1 | tee test/e2e/security-output.log

      # Which API routes the two suites called, from amp-api's route-hit log.
      # A report only; it fails nothing.
      - name: Report route coverage
        if: ${{ !cancelled() && steps.install-platform.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p /tmp/route-coverage
          (cd deployments/standalone && docker compose logs --no-color --no-log-prefix amp-api) \
            > /tmp/route-coverage/amp-api.log
          python3 scripts/coverage/route_coverage.py /tmp/route-coverage/amp-api.log \
            --exemptions test/e2e/route-exemptions.yaml \
            --out /tmp/route-coverage/route-coverage.json \
            --hits /tmp/route-coverage/route-hits.tsv

      - name: Upload route hits
        if: ${{ !cancelled() && steps.install-platform.outcome == 'success' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: route-coverage
          path: |
            /tmp/route-coverage/route-hits.tsv
            /tmp/route-coverage/route-coverage.json
          retention-days: 7

      - name: Dump service logs on failure
        if: failure()
        working-directory: deployments/standalone
        run: |
          mkdir -p /tmp/service-logs
          docker compose ps -a > /tmp/service-logs/services.txt 2>&1 || true
          for service in $(docker compose config --services); do
            docker compose logs --no-color "$service" > "/tmp/service-logs/${service}.txt" 2>&1 || true
          done

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: service-logs
          path: /tmp/service-logs/
          retention-days: 7

      # The checks API needs a token that can write, which a fork's pull
      # request does not get; the reports are in the uploaded logs instead.
      - name: Publish test results
        if: ${{ always() && !github.event.pull_request.head.repo.fork }}
        uses: dorny/test-reporter@6e6a65b7a0bd2c9197df7d0ae36ac5cee784230c # v2.0.0
        with:
          name: E2E Test Results
          path: test/e2e/report.xml
          reporter: java-junit

      - name: Publish security test results
        if: ${{ always() && !github.event.pull_request.head.repo.fork && hashFiles('test/e2e/security-report.xml') != '' }}
        uses: dorny/test-reporter@6e6a65b7a0bd2c9197df7d0ae36ac5cee784230c # v2.0.0
        with:
          name: Security Conformance Results
          path: test/e2e/security-report.xml
          reporter: java-junit

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: e2e-test-logs
          path: |
            test/e2e/e2e-output.log
            test/e2e/security-output.log
            test/e2e/report.xml
            test/e2e/security-report.xml
          retention-days: 7
