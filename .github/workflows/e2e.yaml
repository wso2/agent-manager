name: E2E Tests

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-go

      # Docker Compose stack (deployments/standalone), built from this checkout.
      - name: Install platform
        id: install-platform
        uses: ./.github/actions/amp-dev-stack

      - name: Run e2e tests
        env:
          OPENAI_API_KEY: ${{ secrets.INSTRUMENTATION_TEST_OPENAI_API_KEY }}
        run: |
          set -o pipefail
          cd test/e2e && go run github.com/onsi/ginkgo/v2/ginkgo -v --procs=2 --timeout 60m \
            --poll-progress-after=600s --keep-going --junit-report=report.xml \
            ./tests/... 2>&1 | tee e2e-output.log

      - name: Run security conformance tests
        if: ${{ !cancelled() && steps.install-platform.outcome == 'success' }}
        run: |
          set -o pipefail
          make security-test-live 2>&1 | tee test/e2e/security-output.log

      - name: Dump service logs on failure
        if: failure()
        working-directory: deployments/standalone
        run: |
          mkdir -p /tmp/service-logs
          docker compose ps -a > /tmp/service-logs/services.txt 2>&1 || true
          for service in $(docker compose config --services); do
            docker compose logs --no-color --tail 500 "$service" > "/tmp/service-logs/${service}.txt" 2>&1 || true
          done

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: service-logs
          path: /tmp/service-logs/
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@6e6a65b7a0bd2c9197df7d0ae36ac5cee784230c # v2.0.0
        with:
          name: E2E Test Results
          path: test/e2e/report.xml
          reporter: java-junit

      - name: Publish security test results
        if: ${{ always() && hashFiles('test/e2e/security-report.xml') != '' }}
        uses: dorny/test-reporter@6e6a65b7a0bd2c9197df7d0ae36ac5cee784230c # v2.0.0
        with:
          name: Security Conformance Results
          path: test/e2e/security-report.xml
          reporter: java-junit

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: e2e-test-logs
          path: |
            test/e2e/e2e-output.log
            test/e2e/security-output.log
          retention-days: 7
