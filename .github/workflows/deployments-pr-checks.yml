name: Deployments PR Checks

on:
  pull_request:
    branches:
      - main
      - amp-2.x
    paths:
      - 'deployments/**'
      - 'agent-manager-service/modules/observability/store/clickhouse/users.xml'
      - '.github/scripts/**'
      - '.github/workflows/deployments-pr-checks.yml'

permissions:
  contents: read

jobs:
  standalone-checks:
    name: Standalone Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert no raw-GitHub fetches of this repository
        run: bash .github/scripts/check-no-raw-github-fetches.sh
        shell: bash

      - name: Shellcheck the deployment scripts
        run: |
          shellcheck -S error \
            deployments/setup/*.sh \
            deployments/standalone/thunder/entrypoint.sh \
            deployments/standalone/scripts/*.sh \
            .github/scripts/*.sh
        shell: bash

      - name: Validate the compose files
        working-directory: deployments/standalone
        run: |
          # .env is optional: every variable has a default.
          test -z "$(docker compose config -q 2>&1)"
          test -z "$(COMPOSE_PROFILES=observability-external docker compose config -q 2>&1)"
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.core.yml config -q
          COMPOSE_PROFILES=postgres docker compose -f docker-compose.yml -f docker-compose.postgres.yml config -q
          COMPOSE_PROFILES=observability docker compose config -q
          COMPOSE_PROFILES=postgres,observability docker compose -f docker-compose.yml -f docker-compose.postgres.yml config -q
          COMPOSE_PROFILES=observability docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.dev.yml config -q
          COMPOSE_PROFILES=observability-external docker compose config -q
          COMPOSE_PROFILES=postgres,observability-external docker compose -f docker-compose.yml -f docker-compose.postgres.yml config -q
          COMPOSE_PROFILES=observability-external docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.dev.yml config -q
        shell: bash

      - name: Check the bundled ClickHouse users match the observability module's
        run: cmp deployments/standalone/observability/clickhouse-users.xml agent-manager-service/modules/observability/store/clickhouse/users.xml
        shell: bash

      - name: Check the SQL for your own ClickHouse gives each login the bundled users' hosts and grants
        run: bash .github/scripts/check-clickhouse-users-sql.sh
        shell: bash

      # A release bundle must run from its own files, pinned to published images.
      - name: Build and validate a release bundle
        run: |
          work="$(mktemp -d)"
          git archive HEAD | tar -x -C "$work"
          cd "$work"
          bash .github/scripts/pin-standalone-images.sh v0.0.0-check ghcr.io/wso2
          bash .github/scripts/build-standalone-bundle.sh 0.0.0-check dist
          mkdir unpacked && tar xzf dist/wso2-agent-manager-standalone-0.0.0-check.tar.gz -C unpacked
          cd unpacked/standalone
          test ! -e docker-compose.build.yml && test ! -e docker-compose.dev.yml && test ! -e docker-compose.core.yml
          cp .env.example .env
          docker compose config -q
          grep -q '^AMP_API_IMAGE=ghcr.io/wso2/amp-api:v0.0.0-check$' .env
        shell: bash
