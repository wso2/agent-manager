name: AMP Instrumentation Release

on:
  workflow_dispatch:
run-name: AMP Instrumentation Release (${{ github.ref_name }})

# Default token scope is read-only; jobs that publish, push or deploy
# request the extra scopes they need at job level.
permissions:
  contents: read

jobs:
  settings:
    uses: ./.github/workflows/read-workflow-settings.yml
    with:
      section: amp_instrumentation_release
      defaults: >-
        {"branch": "main", "target_version": null}

  test:
    needs: settings
    name: Test
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: libs/amp-instrumentation
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ fromJSON(needs.settings.outputs.values).branch }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest --cov=src --cov-report=html --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: amp-instrumentation-coverage
          path: htmlcov

  release:
    name: Release
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    needs: [settings, test]
    permissions:
      contents: write
    defaults:
      run:
        working-directory: libs/amp-instrumentation
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ fromJSON(needs.settings.outputs.values).branch }}

      - name: Set release tag and version
        env:
          VERSION: ${{ fromJSON(needs.settings.outputs.values).target_version }}
        run: |
          echo "RELEASE_TAG=amp-instrumentation/v$VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Commit package version update
        run: |
          # Update version in pyproject.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          echo "Updated version to $VERSION in pyproject.toml"

          # Verify the update was successful
          grep -Fx "version = \"$VERSION\"" pyproject.toml || (echo "Failed to update version in pyproject.toml" && exit 1)
          echo "Version $VERSION successfully set in pyproject.toml"

          # Commit the version update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Bump version to $VERSION"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Error: Tag $RELEASE_TAG already exists. Please use a different version."
            exit 1
          fi
          git tag -a "$RELEASE_TAG" -m "Release $VERSION"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          tag_name: ${{ env.RELEASE_TAG }}
