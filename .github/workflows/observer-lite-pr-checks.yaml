name: Observer Lite

on:
  pull_request:
    branches: ["main"]
    paths:
      - "deployments/dev/observer-lite/**"
      - "agent-manager-observer/**"
      - ".github/workflows/observer-lite-pr-checks.yaml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Install pinned lint tools (tools.mk)
        run: make tools-lint

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none
          working-directory: deployments/dev/observer-lite

  test:
    name: Test
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Run tests
        working-directory: deployments/dev/observer-lite
        run: make test

  build:
    name: Build
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: deployments/dev/observer-lite
        run: >
          docker buildx build
          --build-context amp-observer=../../../agent-manager-observer
          -t amp-observer-lite:pr-check
          .
