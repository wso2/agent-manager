# Named to match the internal mirror's "PR Build & Security Scan / secret-scan" check.
name: PR Build & Security Scan

# Scans new commits for leaked credentials with gitleaks. Known false positives
# are suppressed by fingerprint in .gitleaksignore.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer PR push supersedes the last scan, but each push to main scans its own
# commits, so each push run gets its own group and is never cancelled or replaced.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || format('push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the release checksums.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C /usr/local/bin gitleaks
          rm "$archive"
          gitleaks version

      - name: Scan commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # Scan only the commits this event introduces. Older history holds
          # test fixtures and placeholders that predate this check.
          # gitleaks reports "no leaks" when git rejects the range, so check
          # that the commits exist before scanning.
          has_commit() { git cat-file -e "$1^{commit}" 2>/dev/null; }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! has_commit "$PR_BASE_SHA" || ! has_commit "$PR_HEAD_SHA"; then
              echo "::error::Commit range ${PR_BASE_SHA}..${PR_HEAD_SHA} is not in the checkout."
              exit 1
            fi
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0*$ ]]; then
            echo "::warning::No previous commit for this push; scanning only ${PUSH_SHA}."
            range="-1 ${PUSH_SHA}"
          else
            # After a force-push the previous commit is no longer on a branch,
            # but GitHub still serves it by SHA until it is garbage collected.
            if ! has_commit "$PUSH_BEFORE_SHA"; then
              git fetch --no-tags --quiet origin "$PUSH_BEFORE_SHA" || true
            fi
            if has_commit "$PUSH_BEFORE_SHA"; then
              range="${PUSH_BEFORE_SHA}..${PUSH_SHA}"
            else
              # Without it the pushed range is unknown, so only the tip is scanned
              # and earlier commits of a multi-commit force-push are not.
              echo "::warning::Previous commit ${PUSH_BEFORE_SHA} is not available; scanning only ${PUSH_SHA}."
              range="-1 ${PUSH_SHA}"
            fi
          fi
          echo "Scanning ${range}"

          # git log -p shows no diff for merge commits; --remerge-diff adds what a
          # conflict resolution changed, so secrets added there are scanned too.
          if ! gitleaks git --redact --verbose --exit-code 1 --log-opts="--remerge-diff ${range}"; then
            echo "::error::gitleaks found potential secrets. Remove them and rotate any real credential; for a verified false positive, add its fingerprint to .gitleaksignore with a comment explaining why."
            exit 1
          fi
