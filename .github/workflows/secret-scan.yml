name: Secret Scan

# Scans new commits for leaked credentials with gitleaks. Known false positives
# are suppressed by fingerprint in .gitleaksignore.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the release checksums.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C /usr/local/bin gitleaks
          rm "$archive"
          gitleaks version

      - name: Scan commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # Scan only the commits this event introduces. Older history holds
          # test fixtures and placeholders that predate this check.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0*$ ]]; then
            log_opts="-1 ${PUSH_SHA}"
          else
            log_opts="${PUSH_BEFORE_SHA}..${PUSH_SHA}"
          fi
          echo "Scanning ${log_opts}"

          if ! gitleaks git --redact --verbose --exit-code 1 --log-opts="$log_opts"; then
            echo "::error::gitleaks found potential secrets. Remove them and rotate any real credential; for a verified false positive, add its fingerprint to .gitleaksignore with a comment explaining why."
            exit 1
          fi
