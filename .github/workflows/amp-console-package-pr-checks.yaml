name: AMP Console Package

on:
  pull_request:
    branches: ["main", "amp-2.x"]
    paths:
      - "console/**"
      - ".github/workflows/amp-console-package-pr-checks.yaml"
      - "scripts/coverage/**"
      - ".github/actions/coverage-exception-label/**"

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.task }}
    permissions:
      contents: read
      pull-requests: read # the coverage-exception label
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        task: [lint, build, test]
    defaults:
      run:
        working-directory: console
    steps:
      # The test leg takes the full history, so the coverage gate can diff
      # against the base branch.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ matrix.task == 'test' && 0 || 1 }}

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-console-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tests import the other workspace packages from their built output.
      - name: Build the workspace packages
        if: matrix.task == 'test'
        run: pnpm build

      - name: Run ${{ matrix.task }}
        run: pnpm ${{ matrix.task == 'test' && 'test:coverage' || matrix.task }}

      - name: Read the coverage-exception label
        id: label
        if: matrix.task == 'test'
        uses: ./.github/actions/coverage-exception-label

      # Minimums and changed-line coverage from console/coverage-gate.json.
      - name: Check coverage
        if: matrix.task == 'test'
        run: |
          python3 ../scripts/coverage/console_summary.py "$RUNNER_TEMP/console-coverage.json"
          python3 ../scripts/coverage/gate.py "$RUNNER_TEMP/console-coverage.json" \
            coverage-gate.json --title "Console coverage" \
            --console-root . --repo-root .. \
            --base "origin/${{ github.base_ref }}" \
            ${{ steps.label.outputs.exempt == 'true' && '--exempt' || '' }}

      - name: Upload coverage reports
        if: ${{ !cancelled() && matrix.task == 'test' }}
        uses: actions/upload-artifact@v7
        with:
          name: console-coverage
          # Only the per-package summary: globbing the packages' coverage/
          # directories walks pnpm's symlinked node_modules and stalls.
          path: ${{ runner.temp }}/console-coverage.json
          if-no-files-found: ignore
