name: AMP Console Package

on:
  pull_request:
    branches: ["main"]
    paths:
      - "console/**"
      - ".github/workflows/amp-console-package-pr-checks.yaml"

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        task: [lint, build]
    defaults:
      run:
        working-directory: console
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-console-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: pnpm ${{ matrix.task }}

  # Build the console image (amd64, no push) so a broken Dockerfile is
  # caught on the PR.
  docker-image:
    name: docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build console image
        run: |
          docker build \
            --platform linux/amd64 \
            --file console/Dockerfile \
            --build-arg VERSION=pr-${{ github.event.pull_request.number }} \
            --tag amp-console:pr-check \
            console
