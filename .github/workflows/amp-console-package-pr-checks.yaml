name: AMP Console Package

on:
  pull_request:
    branches: ["main"]
    paths:
      - "console/**"
      - ".github/workflows/amp-console-package-pr-checks.yaml"

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        task: [lint, build]
    defaults:
      run:
        working-directory: console
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-console-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: pnpm ${{ matrix.task }}
