name: Instrumentation matrix test - manual

on:
  workflow_dispatch:
    inputs:
      traceloop_versions:
        description: 'Comma-separated traceloop versions; "all" = every entry in matrix.yaml'
        required: false
        default: 'all'
      frameworks:
        description: 'Comma-separated framework names; "all" = every entry'
        required: false
        default: 'all'
      framework_versions:
        description: 'Comma-separated framework versions; "all" = every entry'
        required: false
        default: 'all'
      python_versions:
        description: 'Comma-separated python versions; "all" = every entry'
        required: false
        default: 'all'
      include_heavy_tier:
        description: 'Also run the heavy-tier subset against a built-from-source AMP stack'
        type: boolean
        default: false
      include_record_mode:
        description: 'Re-record cassettes (requires OPENAI/ANTHROPIC keys) and open a refresh PR'
        type: boolean
        default: false
      heavy_only:
        description: 'Skip the emission matrix and run only the heavy tier (implies heavy)'
        type: boolean
        default: false
      heavy_cell_id:
        description: 'Run only this one heavy-subset cell id (cheap iteration; ignores the filters above); empty = the filtered subset'
        required: false
        default: ''

permissions:
  contents: read   # open-record-pr escalates to write at the job level

concurrency:
  group: instrumentation-matrix-manual-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  resolve-cells:
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    # Skipped for heavy-only iteration — no emission matrix to expand.
    if: ${{ !inputs.heavy_only }}
    outputs:
      cell_ids: ${{ steps.expand.outputs.cell_ids }}
      count: ${{ steps.expand.outputs.count }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Expand to cell ids
        id: expand
        working-directory: test/instrumentation-matrix
        env:
          FILTER_TRACELOOP_VERSIONS: ${{ inputs.traceloop_versions }}
          FILTER_FRAMEWORKS: ${{ inputs.frameworks }}
          FILTER_FRAMEWORK_VERSIONS: ${{ inputs.framework_versions }}
          FILTER_PYTHON_VERSIONS: ${{ inputs.python_versions }}
        run: python scripts/expand_filter.py
      - name: Guard against empty filter
        if: steps.expand.outputs.count == '0'
        run: |
          echo "::error::filter resolved zero cells; check the input values."
          exit 1

  run-cells:
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    needs: resolve-cells
    strategy:
      fail-fast: false
      # GitHub caps matrix size at 256; budget below caps the parallelism so
      # 200+ filtered cells don't queue runners for everyone else.
      max-parallel: 8
      matrix:
        cell: ${{ fromJSON(needs.resolve-cells.outputs.cell_ids) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
      - run: pip install nox pyyaml
      - name: Run cell
        working-directory: test/instrumentation-matrix
        env:
          # `once` records missing interactions; `none` is replay-only.
          VCR_RECORD_MODE: ${{ inputs.include_record_mode && 'once' || 'none' }}
          OPENAI_API_KEY: ${{ secrets.INSTRUMENTATION_TEST_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.INSTRUMENTATION_TEST_ANTHROPIC_API_KEY }}
        run: nox -s emission -- --cell-id=${{ matrix.cell }}
      # Artifact name is keyed by run-id + cell id so multiple manual runs
      # don't collide. The trailing slashes pull cells/ and cassettes/ both.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manual-cell-${{ matrix.cell }}
          path: |
            test/instrumentation-matrix/reports/
            test/instrumentation-matrix/cassettes/

  open-record-pr:
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    needs: run-cells
    if: ${{ inputs.include_record_mode }}
    permissions:
      contents: write        # push the refresh branch
      pull-requests: write   # open the cassette-refresh PR
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          # Download every manual-cell-* artifact into a single staging dir.
          # Each unpacks into manual-cell-<id>/cassettes/<framework>/...
          path: /tmp/artifacts
      - name: Merge re-recorded cassettes into the working tree
        run: |
          set -euo pipefail
          shopt -s nullglob
          target="test/instrumentation-matrix/cassettes"
          mkdir -p "$target"
          for d in /tmp/artifacts/manual-cell-*/cassettes; do
            echo "merging from $d"
            rsync -a --include='*/' --include='*.yaml' --exclude='*' "$d"/ "$target"/
          done
          git status -- "$target"
      - name: Open refresh PR
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          branch: chore/refresh-cassettes-${{ github.run_id }}
          title: Refresh instrumentation-matrix cassettes
          commit-message: Refresh cassettes from manual matrix run ${{ github.run_id }}
          add-paths: test/instrumentation-matrix/cassettes/**
          body: |
            Auto-generated by `instrumentation-matrix-manual` run
            [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Filter inputs:
            - traceloop_versions: `${{ inputs.traceloop_versions }}`
            - frameworks: `${{ inputs.frameworks }}`
            - framework_versions: `${{ inputs.framework_versions }}`
            - python_versions: `${{ inputs.python_versions }}`

            Review the cassette diffs before merging — a meaningful change
            (new attributes, different prompt response) is a signal worth
            investigating, not a rubber-stamp refresh.

  resolve-heavy-shards:
    runs-on:
      - codebuild-wso2_agent-manager-${{ github.run_id }}-${{ github.run_attempt }}
    if: ${{ inputs.heavy_only || inputs.include_heavy_tier }}
    outputs:
      versions: ${{ steps.shards.outputs.versions }}
      count: ${{ steps.shards.outputs.count }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      # The filter inputs narrow the heavy subset the same way they narrow the
      # emission matrix; each Traceloop version left becomes one heavy job.
      - name: List heavy-tier shards
        id: shards
        working-directory: test/instrumentation-matrix
        env:
          FILTER_TRACELOOP_VERSIONS: ${{ inputs.traceloop_versions }}
          FILTER_FRAMEWORKS: ${{ inputs.frameworks }}
          FILTER_FRAMEWORK_VERSIONS: ${{ inputs.framework_versions }}
          FILTER_PYTHON_VERSIONS: ${{ inputs.python_versions }}
          HEAVY_CELL_ID: ${{ inputs.heavy_cell_id }}
        run: python scripts/resolve_heavy_shards.py
      - name: Guard against an empty heavy run
        if: steps.shards.outputs.count == '0'
        env:
          HEAVY_CELL_ID: ${{ inputs.heavy_cell_id }}
        run: |
          if [ -n "$HEAVY_CELL_ID" ]; then
            echo "::error::heavy_cell_id '$HEAVY_CELL_ID' is not in the heavy subset."
            exit 1
          fi
          # Not an error: the filters may name only emission-only frameworks.
          echo "::warning::the filters match no heavy-subset cell; skipping the heavy tier."

  heavy:
    # GitHub-hosted: the job runs the Docker Compose stack and the cell agents.
    runs-on: ubuntu-latest
    needs: [run-cells, resolve-heavy-shards]
    # Normal run: gate behind a green emission matrix. heavy_only: run
    # regardless (run-cells is skipped), so always() is needed to evaluate at all.
    if: >-
      ${{ always() && needs.resolve-heavy-shards.result == 'success' &&
      needs.resolve-heavy-shards.outputs.count != '0' &&
      (inputs.heavy_only || (inputs.include_heavy_tier && needs.run-cells.result == 'success')) }}
    # One shard per Traceloop version, each on its own stack, as in the
    # nightly.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        traceloop: ${{ fromJSON(needs.resolve-heavy-shards.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6
      # Agent Manager on Docker Compose, built from this branch (NOT released
      # images — the matrix must exercise the PR's gateway, collector and
      # observer changes). Each cell's agent then runs on this runner.
      - uses: ./.github/actions/amp-dev-stack
      # Each cell runs on its own Python; heavy/local_agent.py looks up
      # python<X.Y> on PATH and skips cells whose interpreter is missing.
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.12
            3.13
            3.11
      # requests: heavy/driver.py + amp_client/observer use it for the
      # AMP REST + observer calls (the emission tier never makes live calls).
      # jsonschema: harness.validator validates spans against the contract.
      - run: pip install nox pyyaml requests jsonschema
      - name: Run heavy tier
        working-directory: test/instrumentation-matrix
        # URLs + IDP creds default to the compose stack's values; only the LLM
        # keys are secrets, passed to each local agent.
        env:
          OPENAI_API_KEY: ${{ secrets.INSTRUMENTATION_TEST_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.INSTRUMENTATION_TEST_ANTHROPIC_API_KEY }}
          # The customer-support-agent's web-search tool needs this.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Narrow the shard exactly as resolve-heavy-shards did; empty = all.
          FILTER_TRACELOOP_VERSIONS: ${{ inputs.traceloop_versions }}
          FILTER_FRAMEWORKS: ${{ inputs.frameworks }}
          FILTER_FRAMEWORK_VERSIONS: ${{ inputs.framework_versions }}
          FILTER_PYTHON_VERSIONS: ${{ inputs.python_versions }}
          # Optional single-cell run for cheap iteration; empty = full subset.
          HEAVY_CELL_ID: ${{ inputs.heavy_cell_id }}
          HEAVY_PROVIDER_VERSION: ${{ matrix.traceloop }}
        run: nox -s heavy
      - name: Heavy summary
        if: always()
        working-directory: test/instrumentation-matrix
        shell: bash
        run: |
          [ -d reports/heavy ] || exit 0
          {
            echo "### Heavy-tier results"
            echo "| cell | result | category | evidence |"
            echo "| --- | --- | --- | --- |"
            for f in reports/heavy/*.json; do
              [ -e "$f" ] || continue
              python - "$f" <<'PY'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
              ev = d.get("evidence") or {}
              summ = ev.get("summary") or (("agent: " + ev["agent"][:80]) if ev.get("agent") else "")
              print(f"| {d['cellId']} | {d['result']} | {d.get('category') or ''} | {summ.replace('|', '/')} |")
          except Exception as e:  # a malformed report must not blank the whole table
              print(f"| {sys.argv[1]} | ERROR | | {str(e)[:80].replace('|', '/')} |")
          PY
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Dump stack diagnostics on failure
        if: failure()
        working-directory: deployments/standalone
        run: |
          set +e
          docker compose ps -a
          for service in amp-api amp-observer gateway-controller gateway-runtime otel-collector opensearch; do
            echo "=== $service ==="
            docker compose logs --no-color --tail 150 "$service"
          done
          docker stats --no-stream
          df -h
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manual-heavy-${{ matrix.traceloop }}
          path: test/instrumentation-matrix/reports/heavy/
