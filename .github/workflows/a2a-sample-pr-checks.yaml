name: A2A Sample PR Checks

on:
  pull_request:
    paths:
      - 'samples/a2a-agent/**'
      - 'test/sample-smoke/a2a/**'
      - 'test/sample-smoke/external_agent.py'
      - 'test/instrumentation-matrix/heavy/amp_client.py'
      - 'test/instrumentation-matrix/harness/classify.py'
      - '.github/workflows/a2a-sample-pr-checks.yaml'
      - '.github/actions/amp-dev-stack/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a2a-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  SAMPLE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  local-smoke:
    name: A2A local smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.SAMPLE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate smoke-test failure guards
        run: |
          python -m pip install requests
          python -m unittest discover -s test/sample-smoke/a2a -p 'test_*.py' -v
      - name: Install dependencies and run HTTP smoke
        env:
          PYTHON: python
        run: bash samples/a2a-agent/scripts/smoke_test.sh --reports "$RUNNER_TEMP/a2a-local"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a2a-local-smoke
          path: ${{ runner.temp }}/a2a-local/

  platform-smoke:
    name: A2A external agent and trace smoke
    needs: local-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.SAMPLE_SHA }}
          persist-credentials: false
      # Agent Manager on Docker Compose, built from this checkout.
      - uses: ./.github/actions/amp-dev-stack
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Run the sample as an external agent and find its trace
        env:
          # Bootstrap fixture credential for this job's ephemeral stack, not a repository secret.
          IDP_CLIENT_SECRET: amp-api-client-secret
        run: |
          python test/sample-smoke/a2a/a2a_platform_smoke.py \
            --python python --reports "$RUNNER_TEMP/a2a-platform"
      - name: Capture stack logs on failure
        if: failure()
        working-directory: deployments/standalone
        run: |
          reports="$RUNNER_TEMP/a2a-platform"
          mkdir -p "$reports"
          docker compose ps -a > "$reports/services.txt" 2>&1 || true
          for service in amp-api amp-observer gateway-controller gateway-runtime otel-collector; do
            docker compose logs --no-color --tail 300 "$service" > "$reports/$service.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a2a-platform-smoke
          path: ${{ runner.temp }}/a2a-platform/
