name: Bring up AMP dev stack (build-from-source)
description: >
  Stands up AMP Lite with Docker Compose (deployments/standalone) from the
  working tree — building the agent-manager-service image from source (NOT
  a released image), so jobs validate the current PR's API changes end to
  end. No Kubernetes, Helm or port-forwards: the API is on :9000, ThunderID
  on thunder.amp.localhost:8080 and the AI Gateway on :19080
  (default-default.gateway.localhost). The stack runs no trace store.

  amp-api is built without the embedded console unless `console` is true.
  With `distribution: amp-core` it is the core binary instead, with no AI
  Gateway (docker-compose.core.yml).
inputs:
  distribution:
    description: Which binary amp-api runs, "amp" (everything) or "amp-core" (no modules).
    required: false
    default: "amp"
  console:
    description: Build the console into amp-api (served on :9000).
    required: false
    default: "false"
  auth_mode:
    description: >
      Sign-in mode for the stack: "idp" (ThunderID) or "file". Defaults to idp
      because the jobs that use this action authenticate as machine clients,
      with client_credentials against ThunderID. The stack's own default is
      file; a job that wants to exercise that passes it here.
    required: false
    default: "idp"
  log_route_hits:
    description: >
      Log the route pattern and status of every amp-api request
      (LOG_ROUTE_HITS), for scripts/coverage/route_coverage.py.
    required: false
    default: "false"
  private_events:
    description: >
      Let amp-api deliver events to private addresses and reach the host as
      host.docker.internal (EVENTS_ALLOW_PRIVATE_DESTINATIONS), for the e2e
      webhook journey.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # The Dockerfiles the stack builds.
    - name: Cache base images
      uses: ./.github/actions/cache-base-images
      with:
        dockerfiles: |
          agent-manager-service/Dockerfile
    - name: Bring up AMP (build-from-source)
      shell: bash
      env:
        WITH_CONSOLE: ${{ inputs.console }}
        DISTRIBUTION: ${{ inputs.distribution }}
        AUTH_MODE: ${{ inputs.auth_mode }}
        LOG_ROUTE_HITS: ${{ inputs.log_route_hits }}
        PRIVATE_EVENTS: ${{ inputs.private_events }}
      run: |
        set -euo pipefail
        cd deployments/standalone
        # Most jobs authenticate as a machine client, with client_credentials
        # against ThunderID (test/instrumentation-matrix/heavy/amp_client.py),
        # so they run in identity-provider mode: file mode mints and validates
        # its own tokens and would refuse ThunderID's. The jobs and the e2e
        # suite also know the test stack's client secrets and admin password,
        # so they are fixed here instead of generated. The environment wins
        # over amp.yaml.
        bash ../../.github/scripts/standalone-ci-settings.sh "$AUTH_MODE" > ci-settings.yml
        export COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml:ci-settings.yml
        case "$DISTRIBUTION" in
          amp) ;;
          amp-core) COMPOSE_FILE="$COMPOSE_FILE:docker-compose.core.yml" ;;
          *) echo "::error::unknown distribution: $DISTRIBUTION"; exit 1 ;;
        esac
        if [ "$WITH_CONSOLE" != "true" ]; then
          # Skip the console build: amp-api then serves a placeholder page.
          printf 'services:\n  amp-api:\n    build:\n      args: { CONSOLE: none }\n' > ci-no-console.yml
          COMPOSE_FILE="$COMPOSE_FILE:ci-no-console.yml"
        fi
        docker compose build amp-api
        if ! docker compose up -d --wait --wait-timeout 600; then
          docker compose ps -a
          docker compose logs --tail 200
          exit 1
        fi
        docker compose ps -a
