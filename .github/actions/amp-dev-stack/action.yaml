name: Bring up AMP dev stack (build-from-source)
description: >
  Stands up AMP Lite with Docker Compose (deployments/standalone) from the
  working tree — building the agent-manager-service and agent-manager-observer
  images from source (NOT released images), so jobs validate the current PR's
  API and observer changes end to end. No Kubernetes, Helm or port-forwards:
  the API is on :9000, the observer on :9098, ThunderID on
  thunder.amp.localhost:8080 and the AI Gateway on :19080
  (default-default.gateway.localhost).

  The console image is skipped unless `console` is true.
inputs:
  console:
    description: Also build and start the console (nginx image on :3000).
    required: false
    default: "false"
  auth_mode:
    description: >
      Sign-in mode for the stack: "idp" (ThunderID) or "file". Defaults to idp
      because the jobs that use this action authenticate as machine clients,
      with client_credentials against ThunderID. The stack's own default is
      file; a job that wants to exercise that passes it here.
    required: false
    default: "idp"
runs:
  using: composite
  steps:
    # The Dockerfiles the stack builds.
    - name: Cache base images
      uses: ./.github/actions/cache-base-images
      with:
        dockerfiles: |
          agent-manager-service/Dockerfile
          agent-manager-observer/Dockerfile
    - name: Bring up AMP (build-from-source)
      shell: bash
      env:
        WITH_CONSOLE: ${{ inputs.console }}
        AUTH_MODE: ${{ inputs.auth_mode }}
      run: |
        set -euo pipefail
        cd deployments/standalone
        cp .env.example .env
        # Most jobs authenticate as a machine client, with client_credentials
        # against ThunderID (test/instrumentation-matrix/heavy/amp_client.py),
        # so they run in identity-provider mode: file mode mints and validates
        # its own tokens and would refuse ThunderID's.
        #
        # Switching the mode takes all three values, because the two JWKS
        # defaults follow AUTH_MODE's default rather than AUTH_MODE itself.
        echo "AUTH_MODE=${AUTH_MODE}" >> .env
        if [ "$AUTH_MODE" = "idp" ]; then
          {
            echo "KEY_MANAGER_JWKS_URL=http://thunder:\${THUNDER_PORT}/oauth2/jwks"
            echo "OBSERVER_JWKS_URL=http://thunder:\${THUNDER_PORT}/oauth2/jwks"
          } >> .env
        fi
        export COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml
        # OpenSearch refuses to start below this on Linux hosts.
        sudo sysctl -w vm.max_map_count=262144
        services=(amp-api amp-observer)
        scale=(--scale amp-console=0)
        if [ "$WITH_CONSOLE" = "true" ]; then
          services+=(amp-console)
          scale=()
        fi
        docker compose build "${services[@]}"
        if ! docker compose up -d --wait --wait-timeout 600 "${scale[@]}"; then
          docker compose ps -a
          docker compose logs --tail 200
          exit 1
        fi
        docker compose ps -a
