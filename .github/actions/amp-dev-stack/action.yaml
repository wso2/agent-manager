name: Bring up AMP dev stack (build-from-source)
description: >
  Stands up the full AMP platform on k3d from the working tree — building the
  agent-manager-service, agent-manager-observer, and
  python-instrumentation-provider images from source and loading them into
  k3d (NOT the released images quick-start/install.sh uses). This is what
  lets the instrumentation matrix's heavy tier validate the *current* PR's
  observer + instrumentation changes end to end.

  Mirrors the local `make setup` chain, minus Colima (macOS-only) and the
  console (UI, not needed by the heavy tier).
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-go
    # setup-platform.sh gates on a minimum Node patch release, which the
    # runner image's preinstalled Node doesn't always meet.
    - uses: actions/setup-node@v6
      with:
        node-version: "26.12.1"
    - name: Install cluster CLIs (deployments/setup/cluster-tools.env)
      uses: ./.github/actions/setup-cluster-clis
    - name: Install yq
      shell: bash
      run: |
        curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64
        echo "b96de04645707e14a12f52c37e6266832e03c29e95b9b139cddcae7314466e69  /tmp/yq" | sha256sum -c -
        sudo install /tmp/yq /usr/local/bin/yq
    # The Dockerfiles the setup chain below builds.
    - name: Cache base images
      uses: ./.github/actions/cache-base-images
      with:
        dockerfiles: |
          agent-manager-observer/Dockerfile
          agent-manager-service/Dockerfile.dev
          evaluation-job/Dockerfile.dev
    - name: Bring up AMP (build-from-source)
      shell: bash
      run: |
        set -euo pipefail
        # k3d cluster + prerequisites (Gateway API, cert-manager, kgateway,
        # the AMP Gateway, OpenBao)
        make setup-k3d
        # Thunder + the API Platform Gateway operator.
        (cd deployments/setup && ./setup-amp-extensions.sh)
        # Build and load amp-observer from source, then install trace storage
        # (OpenSearch + OpenTelemetry Collector) and the observer.
        make -C agent-manager-observer docker-load-k3d K3D_CLUSTER_NAME=amp-dev
        (cd deployments/setup && ./setup-amp-observability-extension.sh "$PWD/../..")
        # Build + start the core platform (agent-manager-service via compose).
        # setup-platform seeds agent-manager-service/.env from the tracked
        # example, runs DB migrations against the compose-exposed Postgres, and
        # only then starts the service — so it boots cleanly against a migrated
        # schema with no extra host-side migrate/restart needed here.
        make setup-platform
        # Expose AMP API (9000) + amp-observer (9098). Bind 0.0.0.0 so the
        # agent-manager container can reach the forwards via the bridge gateway
        # (a 127.0.0.1-only forward is unreachable from inside the container).
        (cd deployments/setup && PORT_FORWARD_ADDRESS=0.0.0.0 ./port-forward.sh --platform --background)
        make setup-gateway
        (cd deployments/setup && PORT_FORWARD_ADDRESS=0.0.0.0 ./port-forward.sh --background)
