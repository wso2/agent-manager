openapi: 3.0.1
info:
  title: Leave Assistant API
  description: >-
    Chat endpoint for the AI leave-request assistant, served by a ballerina/ai
    ai:Listener. Send a natural-language message and the agent manages employee
    leave balances and requests (check a balance, file a request, list
    requests, cancel, approve, reject) using its tools.
  version: 0.2.0
servers:
  - url: http://localhost:9090/leave-assistant
paths:
  /chat:
    post:
      summary: Send a chat message to the leave assistant
      operationId: postChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatReqMessage'
            examples:
              checkBalance:
                summary: Check a leave balance
                value:
                  sessionId: s1
                  message: What is my leave balance? My employee id is E-3001
              requestLeave:
                summary: Request annual leave
                value:
                  sessionId: s1
                  message: I am E-3001, request 2 days annual leave starting tomorrow, family event
              listRequests:
                summary: List leave requests
                value:
                  sessionId: s1
                  message: List my leave requests, employee id E-3001
              cancelRequest:
                summary: Cancel a leave request
                value:
                  sessionId: s1
                  message: Cancel the family event leave request for E-3001
              approveRequest:
                summary: Approve a pending leave request
                value:
                  sessionId: s1
                  message: Approve the pending 5-day leave request for E-3001
      responses:
        '200':
          description: The agent's reply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRespMessage'
              example:
                message: Priya Fernando has 14 days of annual leave and 7 days of sick leave remaining.
        default:
          description: Error occurred while attempting to process the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ChatReqMessage:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: The user's natural-language message to the agent.
        sessionId:
          type: string
          description: Conversation/session identifier used for memory continuity; defaults to a common session id if not provided.
          default: default
    ChatRespMessage:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: The agent's natural-language reply.
    Error:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        reason:
          type: string
        message:
          type: string
        path:
          type: string
        method:
          type: string
