services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: agent-manager-db
    environment:
      POSTGRES_DB: agentmanager
      POSTGRES_USER: agentmanager
      POSTGRES_PASSWORD: agentmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U agentmanager" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-manager

  # Agent Manager Service (Go Backend)
  agent-manager-service:
    build:
      context: ../agent-manager-service
      dockerfile: Dockerfile.dev
    container_name: agent-manager-service
    ports:
      - "9000:8080"
      - "9243:9243"
    environment:
      # Database Configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=agentmanager
      - DB_PASSWORD=agentmanager
      - DB_NAME=agentmanager
      # Server Configuration
      - SERVER_PORT=8080
      - SERVER_PUBLIC_URL=http://localhost:9000
      - OAUTH_AUTHORIZATION_SERVERS=http://thunder.amp.localhost:8080
      - OAUTH_SCOPES_SUPPORTED=amp:llm-proxy:deploy,amp:mcp-server:create,amp:org:invite-member,amp:role:delete,amp:monitor:read,amp:agent:env-production,amp:git-secret:delete,amp:llm-provider:delete,amp:mcp-server:configure-guardrail,amp:deployment-pipeline:create,amp:deployment-pipeline:read,amp:deployment-pipeline:update,amp:deployment-pipeline:delete,amp:gateway:delete,amp:group:delete,amp:llm-proxy:update,amp:monitor:score-read,amp:llm-provider-template:update,amp:agent:build,amp:agent:rollback,amp:agent:token-manage,amp:evaluator:read,amp:llm-provider-template:read,amp:monitor:create,amp:agent:suspend,amp:gateway:token-manage,amp:git-secret:read,amp:mcp-server:connect,amp:mcp-server:api-key-manage,amp:mcp-server:read,amp:observability:log-read,amp:group:create,amp:observability:trace-read,amp:org:remove-member,amp:agent:env-non-production,amp:group:read,amp:llm-provider-template:create,amp:project:delete,amp:agent:create,amp:evaluator:create,amp:llm-provider:read,amp:org:modify-settings,amp:catalog:read,amp:environment:update,amp:group:update,amp:llm-proxy:delete,amp:project:read,amp:data-plane:read,amp:agent:read,amp:environment:read,amp:llm-provider:configure-guardrail,amp:observability:build-log-read,amp:org:assign-role,amp:project:update,amp:mcp-server:delete,amp:environment:delete,amp:evaluator:update,amp:git-secret:create,amp:monitor:execute,amp:llm-provider:api-key-manage,amp:gateway:read,amp:agent:update,amp:llm-provider-template:delete,amp:monitor:delete,amp:org:view,amp:llm-provider:create,amp:mcp-server:update,amp:org:manage-idp,amp:role:read,amp:role:update,amp:agent:delete,amp:gateway:create,amp:llm-provider:deploy,amp:llm-proxy:api-key-manage,amp:monitor:update,amp:org:manage-service-account,amp:role:create,amp:evaluator:delete,amp:llm-provider:connect,amp:llm-provider:update,amp:llm-proxy:read,amp:monitor:score-publish,amp:observability:metric-read,amp:project:create,amp:repository:read,amp:gateway:update,amp:environment:create,amp:llm-proxy:create,amp:agent:api-key-manage,amp:agent-kind:read,amp:agent-kind:create,amp:agent-kind:update,amp:agent-kind:delete,amp:profile:read,amp:profile:update-attributes,amp:scope:create,amp:scope:read,amp:scope:update,amp:scope:delete,amp:agent-identity:read,amp:agent-identity:create,amp:agent-identity:update,amp:agent-identity:delete
      # Growth analytics (Moesif, directly or via a collector proxy) — off by
      # default. Needs MOESIF_ENABLED=true and MOESIF_APPLICATION_ID or
      # MOESIF_COLLECTOR_BASE_URL set;
      # see agent-manager-service/.env.example for all the variables.
      - IS_ON_PREM_DEPLOYMENT=${IS_ON_PREM_DEPLOYMENT:-true}
      - MOESIF_ENABLED=${MOESIF_ENABLED:-false}
      # Console UI actions only; also requires MOESIF_ENABLED=true.
      - CONSOLE_ANALYTICS_ENABLED=${CONSOLE_ANALYTICS_ENABLED:-false}
      - MOESIF_COLLECTOR_BASE_URL=${MOESIF_COLLECTOR_BASE_URL:-}
      - MOESIF_COLLECTOR_HOST_HEADER=${MOESIF_COLLECTOR_HOST_HEADER:-}
      # Your Moesif Application ID; with no collector URL, sends to api.moesif.net.
      - MOESIF_APPLICATION_ID=${MOESIF_APPLICATION_ID:-}
      - AMP_DEPLOYMENT_MODEL=${AMP_DEPLOYMENT_MODEL:-on-prem}
      - AMP_ENVIRONMENT=${AMP_ENVIRONMENT:-}
      # Kubernetes Configuration
      - KUBECONFIG=/app/.kube/config
      - IS_LOCAL_DEV_ENV=true
      # JWT Configuration
      - JWT_SIGNING_PRIVATE_KEY_PATH=/app/keys/private.pem
      - JWT_SIGNING_PUBLIC_KEYS_CONFIG=/app/keys/public-keys-config.json
      - JWT_SIGNING_ACTIVE_KEY_ID=key-1
      - JWT_SIGNING_DEFAULT_EXPIRY=2160h
      - JWT_SIGNING_ISSUER=agent-manager-service
      - JWT_SIGNING_DEFAULT_ENVIRONMENT=default
      # Byte caps on inline file-mount content. Keep FILE_MOUNT_MAX_FILE_BYTES
      # in sync with the console's value in console/apps/web-ui/.env.development.
      - FILE_MOUNT_MAX_FILE_BYTES=1000000
      - FILE_MOUNT_MAX_TOTAL_BYTES=1000000
      # Optional: External Service URLs (add when needed)
      # - OPENCHOREO_API_URL=http://host.docker.internal:8000
      # - OPENSEARCH_URL=http://host.docker.internal:9200
      - AM_OBSERVER_URL=http://host.docker.internal:9098
      # Externally reachable observer URL returned to the CLI via /api/v1/config.
      # No internal fallback: unset means clients surface "observer not configured".
      - AM_OBSERVER_PUBLIC_URL=http://localhost:9098
      - IDP_TOKEN_URL=http://thunder.amp.localhost:8080/oauth2/token
      - IDP_CLIENT_ID=amp-api-client
      - IDP_CLIENT_SECRET=amp-api-client-secret
      # Key Manager / JWT validation configuration
      # Accepts Thunder-issued tokens (client_credentials for publisher)
      - KEY_MANAGER_JWKS_URL=http://thunder.amp.localhost:8080/oauth2/jwks
      - KEY_MANAGER_ISSUER=Agent Management Platform Local,http://thunder.amp.localhost:8080
      # Last entry is SERVER_PUBLIC_URL above plus "/mcp" (no trailing slash,
      # per the MCP spec's canonical-URI guidance) — an MCP token's `aud`.
      # The Helm charts derive this; here it moves by hand.
      - KEY_MANAGER_AUDIENCE=urn:wso2:amp,localhost,amp-publisher-*,amp-api-client,amp-console-client,amctl,am-mcp,http://localhost:9000/mcp
      - AMP_VERSION=v0.8.0
      - OPEN_CHOREO_BASE_URL=http://api.openchoreo.localhost:8195
      # OpenBao/Vault Secret Management Configuration
      # NOTE: Run ./deployments/setup/port-forward.sh to forward OpenBao from k3d cluster
      # Uses the default OpenBao that comes with OpenChoreo for both user and system secrets
      - SECRET_MANAGER_PROVIDER=openbao
      - OPENBAO_URL=http://host.docker.internal:8200
      # Platform A2A card fetches dial the host gateway; *.localhost resolves to the container itself.
      - A2A_CARD_FETCH_DIAL_ADDR=host.docker.internal:19080
      - OPENBAO_TOKEN=root
      - OPENBAO_PATH=secret
      - OPENBAO_VERSION=v2
      # Workflow Plane OpenBao (for git secrets and publisher credentials)
      - WORKFLOW_PLANE_OPENBAO_URL=http://host.docker.internal:8200
      - WORKFLOW_PLANE_OPENBAO_TOKEN=root
      # Thunder API (for per-org publisher credential provisioning)
      # Uses the system app's client_credentials with scope=system to get admin tokens.
      # Leave THUNDER_BASE_URL empty to fall back to static amp-publisher-client credentials.
      - THUNDER_BASE_URL=http://thunder.amp.localhost:8080
      - THUNDER_CLIENT_ID=amp-system-client
      - THUNDER_CLIENT_SECRET=amp-system-client-secret
      # Encryption Configuration (AES-256-GCM, hex-encoded 32-byte key)
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # Platform-admin cross-organization routes (GET /api/v1/platform/...).
      # PLATFORM_ADMIN_OU_ID is the only org allowed to call them; empty denies
      # every request. The default below is ThunderID's built-in "default" OU,
      # fixed on every install and carried by every local token, so the routes
      # work out of the box in local dev. Override in your shell to test a
      # refusal. The two thresholds decide when one gateway counts as failed and
      # when the fleet as a whole is reported unhealthy (503 instead of 200).
      - PLATFORM_ADMIN_OU_ID=${PLATFORM_ADMIN_OU_ID:-01900000-0000-7000-8000-000000000001}
      - GATEWAY_FAILURE_THRESHOLD_SECONDS=${GATEWAY_FAILURE_THRESHOLD_SECONDS:-300}
      # 604800 = 7 days. Disconnected gateways older than this are reported
      # as abandoned and excluded from the failure-percentage denominator.
      - GATEWAY_FAILURE_MAX_AGE_SECONDS=${GATEWAY_FAILURE_MAX_AGE_SECONDS:-604800}
      - GATEWAY_FAILURE_PERCENTAGE_THRESHOLD=${GATEWAY_FAILURE_PERCENTAGE_THRESHOLD:-10}
    volumes:
      # Mount source code for hot-reloading
      - ../agent-manager-service:/app
      # Use container-specific keys (not host) so paths are correct
      - agent_manager_keys:/app/keys
      # Keep container build output off the host mount
      - /app/tmp
      - /app/.bin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      agent-manager:
      k3d-openchoreo-local-setup: # Connect to k3d cluster network for hostname resolution
        ipv4_address: 172.29.0.10
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # OpenChoreo API uses Host-based routing via Kgateway on port 8080.
      # The gateway routes requests based on the Host header, so we need the
      # hostname to resolve to the host machine for proper routing.
      - "api.openchoreo.localhost:host-gateway"
      # Thunder IDP for OAuth2 token exchange (must match OpenChoreo's security.oidc config)
      - "thunder.amp.localhost:host-gateway"
      # API Platform Gateway runtime for agent endpoint access
      - "api-platform-gateway.amp.localhost:host-gateway"

volumes:
  postgres_data:
  agent_manager_keys:

networks:
  agent-manager:
    driver: bridge
  k3d-openchoreo-local-setup:
    external: true
