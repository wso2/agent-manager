# Values for the upstream OpenTelemetry Collector chart
# (open-telemetry/opentelemetry-helm-charts), installed by
# deployments/scripts/lib-observability.sh into the amp-observability namespace.
#
# Receives OTLP/HTTP traces (forwarded by the API Platform Gateway's /otel
# route), writes them to OpenSearch, and counts ingested spans per tenant for
# metering.
mode: deployment
fullnameOverride: opentelemetry-collector

image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib

resources:
  limits:
    memory: 512Mi

ports:
  otlp:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

extraEnvs:
  - name: OPENSEARCH_USERNAME
    valueFrom:
      secretKeyRef:
        name: opensearch-admin-credentials
        key: username
  - name: OPENSEARCH_PASSWORD
    valueFrom:
      secretKeyRef:
        name: opensearch-admin-credentials
        key: password

# Replaces the chart's default pipeline entirely.
alternateConfig:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
          include_metadata: true
  exporters:
    # resource_to_telemetry turns the tenant resource attributes below into
    # metric labels, which is what makes the span count attributable; without
    # it every tenant collapses into one series.
    prometheus:
      endpoint: 0.0.0.0:8889
      resource_to_telemetry_conversion:
        enabled: true
      # Longer than the hour the meter reads: the exporter forgets a series it
      # has not seen for metric_expiration, so an idle tenant's counter would
      # otherwise restart from zero mid-window.
      metric_expiration: 90m
    opensearch:
      http:
        auth:
          authenticator: basicauth/opensearch
        endpoint: https://opensearch.amp-observability.svc.cluster.local:9200
        tls:
          insecure_skip_verify: true
      sending_queue:
        num_consumers: 5
        queue_size: 1000
        sizer: items
      traces_index: "otel-traces"
      traces_index_time_format: "yyyy-MM-dd"
  extensions:
    basicauth/opensearch:
      client_auth:
        # From the opensearch-admin-credentials Secret (extraEnvs above). Never
        # inline the credentials here: a literal silently breaks wherever the
        # password was changed.
        username: ${env:OPENSEARCH_USERNAME}
        password: ${env:OPENSEARCH_PASSWORD}
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  connectors:
    # Counts spans at ingest, the only place the number is exact.
    count:
      spans:
        amp_agent_trace_spans:
          description: Spans ingested, counted per tenant at the point of ingest.
  processors:
    # The count connector emits DELTA sums; Prometheus counters are cumulative.
    deltatocumulative: {}
    # Tenant attributes forwarded by the gateway as request headers. The
    # observer scopes trace queries by the agent-manager/organization,
    # agent-manager/project and agent-manager/agent names.
    resource:
      attributes:
        - key: agent-manager/organization
          from_context: metadata.x-user-organization-name
          action: upsert
        - key: agent-manager/project
          from_context: metadata.x-user-project-name
          action: upsert
        - key: agent-manager/agent
          from_context: metadata.x-user-agent-name
          action: upsert
        - key: agent-manager/agent-uid
          from_context: metadata.x-user-component
          action: upsert
        - key: agent-manager/environment-uid
          from_context: metadata.x-user-environment
          action: upsert
        - key: agent-manager/project-uid
          from_context: metadata.x-user-project
          action: upsert
        - key: agent-manager/namespace
          from_context: metadata.x-user-namespace
          action: upsert
        - key: agent-manager/org-id
          from_context: metadata.x-org-id
          action: upsert
  service:
    extensions: [basicauth/opensearch, health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [resource]
        # count is a tee: traces still reach OpenSearch unchanged.
        exporters: [opensearch, count]
      metrics/spans:
        receivers: [count]
        processors: [deltatocumulative]
        exporters: [prometheus]
