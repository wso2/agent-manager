# Values for the upstream OpenSearch chart (opensearch-project/helm-charts),
# installed by deployments/scripts/lib-observability.sh into the
# amp-observability namespace. OpenSearch stores agent traces written by the
# OpenTelemetry collector (values/otel-collector.yaml) and read by the
# Agent Manager Observer.
#
# Single node, sized for a local/dev or small single-cluster install. The admin
# credentials come from the opensearch-admin-credentials Secret, which the
# install script creates before this chart runs.
clusterName: opensearch
nodeGroup: master
# Service name the collector and the observer dial:
# https://opensearch.amp-observability.svc.cluster.local:9200
masterService: opensearch
singleNode: true
replicas: 1

opensearchJavaOpts: "-Xms512m -Xmx512m"
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 1536Mi

persistence:
  enabled: true
  size: 8Gi

# OpenSearch needs vm.max_map_count >= 262144 on the node; the init container
# raises it (privileged). Disable when the node is already configured.
sysctlInit:
  enabled: true

extraEnvs:
  # Seeds the demo security config's admin user on first start. The demo TLS
  # certificates are self-signed, so clients skip verification in-cluster.
  - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: opensearch-admin-credentials
        key: password
