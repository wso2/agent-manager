# Dev-only cluster resources for `make setup-lite`; apply with kubectl.
# The observability extension chart installs amp-observer into this namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: openchoreo-observability-plane
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-default
  namespace: openchoreo-observability-plane
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 11080
      allowedRoutes:
        namespaces:
          from: All
---
# Stands in for the OpenChoreo collector Service so the gateway's upstream URL
# (opentelemetry-collector:4318) reaches amp-observer. The container does not
# declare 4318; a Service routes to it by number regardless.
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-collector
  namespace: openchoreo-observability-plane
spec:
  selector:
    app: amp-observer
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amp-observer-lite
  namespace: openchoreo-observability-plane
spec:
  podSelector:
    matchLabels:
      app: amp-observer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              openchoreo.dev/system-component: gateway-runtime
      ports:
        - port: 4318
          protocol: TCP
    - ports:
        - port: 9098
          protocol: TCP
---
# The name must match serviceAccountName in the chart's templates/deployment.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amp-observer-lite
  namespace: openchoreo-observability-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amp-observer-lite
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["openchoreo.dev"]
    resources: ["components", "projects", "environments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amp-observer-lite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: amp-observer-lite
subjects:
  - kind: ServiceAccount
    name: amp-observer-lite
    namespace: openchoreo-observability-plane
