# Values for the upstream OpenBao chart (dev mode, root token "root"):
# agent-manager-service's KV store for secrets it manages (OPENBAO_URL /
# OPENBAO_TOKEN). Local development only.
injector:
  enabled: false

server:
  dev:
    enabled: true
    devRootToken: root

  postStart:
    - /bin/sh
    - -c
    - |
      sleep 5
      export BAO_ADDR=http://127.0.0.1:8200
      export BAO_TOKEN=root

      # AMP Monitor Evaluation publisher credentials
      bao kv put secret/amp-publisher-client-secret value="amp-publisher-client-secret"

      # AMP System Client credentials (for agent-manager to call Thunder admin API)
      # NOTE: In production, store under a dedicated mount (e.g. agent-manager/amp-system-client-secret)
      # with a policy scoped to the agent-manager service account only.
      # The shared secret/* path is used here for local dev convenience.
      bao kv put secret/amp-system-client-secret value="amp-system-client-secret"
