{{- if and (include "agent-management-platform.bundledNats" .) .Values.nats.networkPolicy.enabled }}
# Only the agent manager service may connect to the bundled NATS. Probes
# reach the monitor port from the node, which network policies leave open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amp-nats
  labels:
    {{- include "agent-management-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  podSelector:
    matchLabels:
      {{- include "agent-management-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nats
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agent-management-platform.agentManagerService.selectorLabels" . | nindent 14 }}
      ports:
        - port: client
          protocol: TCP
{{- end }}
