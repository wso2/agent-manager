{{- if include "agent-management-platform.bundledNats" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "amp-nats-auth") -}}
{{- $token := "" -}}
{{- if and $existing (hasKey $existing.data "token") -}}
{{- $token = (index $existing.data "token" | b64dec) -}}
{{- end }}
# The token clients need to connect to the bundled NATS. The bus carries
# every org's events: without it, any pod that can reach NATS could read
# them, or publish forged events that the dispatcher delivers.
apiVersion: v1
kind: Secret
metadata:
  name: amp-nats-auth
  labels:
    {{- include "agent-management-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
type: Opaque
stringData:
  token: {{ $token | default (randAlphaNum 48) | quote }}
{{- end }}
