{{- if .Values.dbMigration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: amp-db-migration
  labels:
    {{- include "agent-management-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.dbMigration.backoffLimit }}
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      name: amp-db-migration
      labels:
        {{- include "agent-management-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-migration
    spec:
      {{- include "agent-management-platform.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- with .Values.dbMigration.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "agent-management-platform.postgresql.host" . }} -p {{ include "agent-management-platform.postgresql.port" . }} -U {{ include "agent-management-platform.postgresql.username" . }}; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-management-platform.postgresql.secretName" . }}
                  key: {{ include "agent-management-platform.postgresql.secretPasswordKey" . }}
      {{- end }}
      containers:
        - name: db-migration
          {{- with .Values.dbMigration.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.dbMigration.image.repository }}:{{ .Values.dbMigration.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dbMigration.image.pullPolicy }}
          command:
            - /go/bin/agent-manager-service
            - -migrate
            - -server=false
          env:
            - name: DB_HOST
              value: {{ include "agent-management-platform.postgresql.host" . | quote }}
            - name: DB_PORT
              value: {{ include "agent-management-platform.postgresql.port" . | quote }}
            - name: DB_NAME
              value: {{ include "agent-management-platform.postgresql.database" . | quote }}
            - name: DB_USER
              value: {{ include "agent-management-platform.postgresql.username" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-management-platform.postgresql.secretName" . }}
                  key: {{ include "agent-management-platform.postgresql.secretPasswordKey" . }}
            {{- with (include "agent-management-platform.postgresql.tlsEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: API_KEY_VALUE
              valueFrom:
                secretKeyRef:
                  {{- if .Values.agentManagerService.config.apiKey.existingSecret }}
                  name: {{ .Values.agentManagerService.config.apiKey.existingSecret }}
                  key: {{ .Values.agentManagerService.config.apiKey.existingSecretKey | default "api-key" }}
                  {{- else }}
                  name: {{ include "agent-management-platform.agentManagerService.fullname" . }}
                  key: api-key
                  {{- end }}
            - name: IS_LOCAL_DEV_ENV
              value: "true"
            # Migration 043 backfills existing handle-only env-Thunder rows by
            # using the same deployment-specific origin settings as amp-api.
            # Keep these in the migration hook as well as the API ConfigMap or
            # VM/custom-domain upgrades silently persist localhost URLs.
            - name: IDP_HOST_BASE_DOMAIN
              value: {{ .Values.agentManagerService.config.idpHostBaseDomain | default "amp.localhost" | quote }}
            - name: TLS_ENABLED
              value: {{ .Values.agentManagerService.config.tlsEnabled | default false | quote }}
            - name: LOG_LEVEL
              value: "INFO"
            - name: OPEN_CHOREO_BASE_URL
              value: "http://openchoreo-api.openchoreo-control-plane:8080/api/v1"
          {{- with .Values.dbMigration.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
