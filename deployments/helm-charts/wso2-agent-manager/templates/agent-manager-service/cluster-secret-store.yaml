{{- if .Values.agentManagerService.enabled }}
{{- $fullname := include "agent-management-platform.agentManagerService.fullname" . -}}
{{- $tls := .Values.agentManagerService.internalServer.tlsEnabled -}}
{{- $base := printf "%s://%s-gateway-manager.%s.svc.cluster.local:%v" (ternary "https" "http" $tls) $fullname .Release.Namespace .Values.agentManagerService.gatewayMgtService.port -}}
# Serves the secrets agent manager stores in its database to External Secrets
# Operator. Each SecretReference entry agent manager creates has
# remoteRef.key "<ouID>/<secret name>" and remoteRef.property "<key>"; the
# webhook fetches that one value from the internal API.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.agentManagerService.config.secretStore.clusterSecretStoreName }}
  labels:
    {{- include "agent-management-platform.agentManagerService.labels" . | nindent 4 }}
spec:
  provider:
    webhook:
      url: '{{ $base }}/api/internal/v1/secrets/{{ "{{" }} .remoteRef.key {{ "}}" }}/{{ "{{" }} .remoteRef.property {{ "}}" }}'
      method: GET
      headers:
        Authorization: 'Bearer {{ "{{" }} index .auth "{{ include "agent-management-platform.secretStoreTokenSecretKey" . }}" {{ "}}" }}'
      result:
        jsonPath: $.value
      secrets:
        - name: auth
          secretRef:
            name: {{ include "agent-management-platform.secretStoreTokenSecretName" . }}
            namespace: {{ .Release.Namespace }}
      {{- if $tls }}
      caProvider:
        type: Secret
        name: {{ include "agent-management-platform.tlsCertsSecretName" . }}
        key: cert.pem
        namespace: {{ .Release.Namespace }}
      {{- end }}
{{- end }}
