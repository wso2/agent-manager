{{- if and .Values.agentManagerService.enabled (not .Values.agentManagerService.config.secretStore.existingSecret) }}
{{- $secretName := include "agent-management-platform.secretStoreTokenSecretName" . -}}
{{- $existingToken := "" -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- if and $existingSecret (hasKey $existingSecret.data "secret-store-token") -}}
{{- $existingToken = (index $existingSecret.data "secret-store-token" | b64dec) -}}
{{- end }}
# Holds only the bearer token of the in-house ClusterSecretStore. The label lets
# the External Secrets webhook provider read this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "agent-management-platform.agentManagerService.labels" . | nindent 4 }}
    external-secrets.io/type: webhook
type: Opaque
stringData:
  secret-store-token: {{ .Values.agentManagerService.config.secretStore.token | default $existingToken | default (randAlphaNum 48) | quote }}
{{- end }}
