{{- if .Values.agentManagerService.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-management-platform.agentManagerService.fullname" . }}
  labels:
    {{- include "agent-management-platform.agentManagerService.labels" . | nindent 4 }}
data:
  AM_OBSERVER_URL: {{ .Values.agentManagerService.config.amObserverURL | quote }}
  # Externally reachable observer URL handed to out-of-cluster clients
  # (console bootstrap, CLI) via /api/v1/config. No internal fallback:
  # unset means clients surface "observer not configured".
  AM_OBSERVER_PUBLIC_URL: {{ .Values.agentManagerService.config.amObserverPublicURL | default "" | quote }}
  SERVER_HOST: {{ .Values.agentManagerService.config.serverHost | quote }}
  SERVER_PORT: {{ .Values.agentManagerService.service.targetPort | quote }}
  LOG_LEVEL: {{ .Values.agentManagerService.config.logLevel | quote }}
  AUTO_MAX_PROCS_ENABLED: {{ .Values.agentManagerService.config.autoMaxProcsEnabled | quote }}
  AUTH_HEADER: {{ .Values.agentManagerService.config.authHeader | default "Authorization" | quote }}
  DB_OPERATION_TIMEOUT_SECONDS: {{ .Values.agentManagerService.config.dbOperationTimeout | quote }}
  HEALTH_CHECK_TIMEOUT_SECONDS: {{ .Values.agentManagerService.config.healthCheckTimeout | quote }}
  CORS_ALLOWED_ORIGIN: {{ .Values.agentManagerService.config.corsAllowedOrigin | quote }}
  AGENT_WORKLOAD_CORS_ALLOWED_ORIGIN: {{ .Values.agentManagerService.agentWorkload.cors.allowedOrigin | quote }}
  AGENT_WORKLOAD_CORS_ALLOWED_METHODS: {{ .Values.agentManagerService.agentWorkload.cors.allowedMethods | quote }}
  AGENT_WORKLOAD_CORS_ALLOWED_HEADERS: {{ .Values.agentManagerService.agentWorkload.cors.allowedHeaders | quote }}
  AGENT_WORKLOAD_CORS_ALLOW_CREDENTIALS: {{ .Values.agentManagerService.agentWorkload.cors.allowCredentials | quote }}
  API_KEY_HEADER: {{ .Values.agentManagerService.config.apiKey.header | quote }}
  KUBECONFIG: {{ .Values.agentManagerService.config.kubeconfig | quote }}
  OTEL_TRACELOOP_TRACE_CONTENT: {{ .Values.agentManagerService.config.otel.traceContent | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.agentManagerService.config.otel.exporterEndpoint | quote }}
  OTEL_DEFAULT_INSTRUMENTATION_VERSION: {{ .Values.agentManagerService.config.otel.defaultInstrumentationVersion | quote }}
  INSTRUMENTATION_EXTENSION_PATH: "/etc/amp/instrumentation-extension.yaml"
  KEY_MANAGER_ISSUER: {{ .Values.agentManagerService.config.keyManager.issuer | quote }}                                         
  KEY_MANAGER_AUDIENCE: {{ include "agent-management-platform.agentManagerService.audience" . | quote }}
  KEY_MANAGER_JWKS_URL: {{ .Values.agentManagerService.config.keyManager.jwksUrl | quote }}                                         
  SERVER_PUBLIC_URL: {{ .Values.agentManagerService.config.serverPublicURL | default "" | quote }}
  OAUTH_AUTHORIZATION_SERVERS: {{ .Values.agentManagerService.config.oauthAuthorizationServers | default .Values.agentManagerService.config.keyManager.issuer | quote }}
  # Domain suffix env-Thunder's developer-facing hostnames are built from:
  # "<handle>.<IDP_HOST_BASE_DOMAIN>". Must match the value the
  # deployment-wide provisioning uses, or the identity-provider endpoints the API
  # reports diverge from the actual env-Thunder hosts (e.g. amp.localhost vs the
  # public sslip.io/custom domain on a VM install).
  IDP_HOST_BASE_DOMAIN: {{ .Values.agentManagerService.config.idpHostBaseDomain | default "amp.localhost" | quote }}
  # Read back by add-environment.sh so added environments inherit these domains.
  AGENTS_BASE_DOMAIN: {{ .Values.agentManagerService.config.agentsBaseDomain | default "am-gateway.localhost" | quote }}
  # One port per listener variant: they coincide behind a single TLS front door but
  # not on a plane gateway serving http on 80 and https on 443, so neither is inferred.
  AGENTS_HTTP_PORT: {{ .Values.agentManagerService.config.agentsHttpPort | default "19080" | quote }}
  AGENTS_HTTPS_PORT: {{ .Values.agentManagerService.config.agentsHttpsPort | default "443" | quote }}
  GATEWAY_BASE_DOMAIN: {{ .Values.agentManagerService.config.gatewayBaseDomain | default "gateway.localhost" | quote }}
  # ...and the scheme/port that domain is actually served on, so the vhost an added
  # environment publishes is callable and not just correctly named.
  GATEWAY_VHOST_SCHEME: {{ .Values.agentManagerService.config.gatewayVhostScheme | default "http" | quote }}
  GATEWAY_VHOST_PORT: {{ .Values.agentManagerService.config.gatewayVhostPort | default "19080" | quote }}
  OAUTH_SCOPES_SUPPORTED: {{ .Values.agentManagerService.config.oauthScopesSupported | default "" | quote }}
  IS_ON_PREM_DEPLOYMENT: {{ .Values.agentManagerService.config.isOnPremDeployment | quote }}
  IDP_TOKEN_URL: {{ .Values.agentManagerService.config.oidc.tokenUrl | quote }}
  IDP_CLIENT_ID: {{ .Values.agentManagerService.config.oidc.clientId | quote }}
  IDP_CLIENT_SECRET: {{ .Values.agentManagerService.config.oidc.clientSecret | quote }}
  JWT_SIGNING_PRIVATE_KEY_PATH: {{ .Values.agentManagerService.config.jwtSigning.privateKeyPath | default "/app/keys/private.pem" | quote }}
  JWT_SIGNING_PUBLIC_KEYS_CONFIG: {{ .Values.agentManagerService.config.jwtSigning.publicKeysConfig | default "/app/keys/public-keys-config.json" | quote }}
  JWT_SIGNING_ACTIVE_KEY_ID: {{ .Values.agentManagerService.config.jwtSigning.activeKeyId | default "key-1" | quote }}
  JWT_SIGNING_DEFAULT_EXPIRY: {{ .Values.agentManagerService.config.jwtSigning.defaultExpiry | default "2160h" | quote }}
  JWT_SIGNING_ISSUER: {{ .Values.agentManagerService.config.jwtSigning.issuer | default "agent-manager-service" | quote }}
  JWT_SIGNING_DEFAULT_ENVIRONMENT: {{ .Values.agentManagerService.config.jwtSigning.defaultEnvironment | default "default" | quote }}
  INTERNAL_SERVER_TLS_ENABLED: {{ .Values.agentManagerService.internalServer.tlsEnabled | quote }}
  TLS_ENABLED: {{ .Values.agentManagerService.config.tlsEnabled | default false | quote }}
  OPEN_CHOREO_BASE_URL: {{ .Values.agentManagerService.config.openChoreo.baseURL | quote }}
  # Secret Manager configuration
  SECRET_MANAGER_PROVIDER: {{ .Values.agentManagerService.config.secretManager.provider | default "" | quote }}
  SECRET_MANAGER_API_URL: {{ .Values.agentManagerService.config.secretManager.baseURL | default "" | quote }}
  # OpenBao configuration (Data Plane)
  OPENBAO_URL: {{ .Values.agentManagerService.config.openbao.url | default "" | quote }}
  OPENBAO_PATH: {{ .Values.agentManagerService.config.openbao.path | default "secret" | quote }}
  OPENBAO_VERSION: {{ .Values.agentManagerService.config.openbao.version | default "v2" | quote }}
  # Workflow Plane OpenBao configuration (for Git Secrets)
  WORKFLOW_PLANE_OPENBAO_URL: {{ .Values.agentManagerService.config.workflowPlaneOpenbao.url | default "" | quote }}
  WORKFLOW_PLANE_OPENBAO_PATH: {{ .Values.agentManagerService.config.workflowPlaneOpenbao.path | default "secret" | quote }}
  # Thunder admin API configuration (for per-org publisher credentials and the
  # identity APIs). resolveToHost lets baseURL stay Thunder's public URL (required
  # for the System resource server identifier) even when that hostname isn't
  # directly dialable from this pod — see values.yaml's thunder.resolveToHost.
  THUNDER_BASE_URL: {{ .Values.agentManagerService.config.thunder.baseURL | default "" | quote }}
  THUNDER_RESOLVE_TO_HOST: {{ .Values.agentManagerService.config.thunder.resolveToHost | default "" | quote }}
  THUNDER_CLIENT_ID: {{ .Values.agentManagerService.config.thunder.clientId | default "" | quote }}
  # Agent resource limits (per-agent upper bounds)
  RESOURCE_MAX_REPLICAS: {{ .Values.agentManagerService.config.perAgentResourceLimits.maxReplicas | default 10 | quote }}
  RESOURCE_MAX_CPU: {{ .Values.agentManagerService.config.perAgentResourceLimits.maxCPU | default "500m" | quote }}
  RESOURCE_MAX_MEMORY: {{ .Values.agentManagerService.config.perAgentResourceLimits.maxMemory | default "512Mi" | quote }}
  # RBAC Configuration
  RBAC_ENABLED: {{ .Values.agentManagerService.config.rbacEnabled | default "true" | quote }}
  # Audit logging. Records are written to stdout as structured JSON with
  # log_type=audit and collected by the cluster log pipeline. Retention and
  # immutability are properties of that pipeline — see
  # agent-manager-service/docs/audit-logging.md for what the deployment must provide.
  # `dig`, not `default`: Helm's `default` treats boolean false as empty, so
  # `audit.enabled: false` rendered as "true" and the switch did nothing.
  AUDIT_ENABLED: {{ dig "audit" "enabled" true .Values.agentManagerService.config | quote }}
  AUDIT_BUFFER_SIZE: {{ .Values.agentManagerService.config.audit.bufferSize | default 4096 | quote }}
  AUDIT_BATCH_SIZE: {{ .Values.agentManagerService.config.audit.batchSize | default 200 | quote }}
  AUDIT_FLUSH_INTERVAL_MS: {{ .Values.agentManagerService.config.audit.flushIntervalMs | default 1000 | quote }}
  # Gateway manifest cache backend. Must be "redis" whenever replicaCount > 1 — see
  # the gatewayManifestCache note in values.yaml.
  GATEWAY_MANIFEST_CACHE_BACKEND: {{ .Values.agentManagerService.config.gatewayManifestCache.backend | default "memory" | quote }}
  GATEWAY_MANIFEST_CACHE_REDIS_HOST: {{ .Values.agentManagerService.config.gatewayManifestCache.redis.host | default "" | quote }}
  GATEWAY_MANIFEST_CACHE_REDIS_PORT: {{ .Values.agentManagerService.config.gatewayManifestCache.redis.port | default 6379 | quote }}
  GATEWAY_MANIFEST_CACHE_REDIS_DB: {{ .Values.agentManagerService.config.gatewayManifestCache.redis.db | default 0 | quote }}
  GATEWAY_MANIFEST_CACHE_REDIS_TLS_ENABLED: {{ .Values.agentManagerService.config.gatewayManifestCache.redis.tlsEnabled | default false | quote }}
{{- end }}
