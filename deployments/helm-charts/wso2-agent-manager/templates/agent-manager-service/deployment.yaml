{{- if .Values.agentManagerService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-management-platform.agentManagerService.fullname" . }}
  labels:
    {{- include "agent-management-platform.agentManagerService.labels" . | nindent 4 }}
spec:
  {{- if not .Values.agentManagerService.autoscaling.enabled }}
  replicas: {{ .Values.agentManagerService.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agent-management-platform.agentManagerService.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/agent-manager-service/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/agent-manager-service/secret.yaml") . | sha256sum }}
        checksum/instrumentation-extension: {{ include (print $.Template.BasePath "/agent-manager-service/instrumentation-extension-configmap.yaml") . | sha256sum }}
        {{- with .Values.agentManagerService.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agent-management-platform.agentManagerService.selectorLabels" . | nindent 8 }}
        {{- with .Values.agentManagerService.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "agent-management-platform.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "agent-management-platform.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount | default false }}
      {{- if .Values.agentManagerService.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.agentManagerService.podSecurityContext | nindent 8 }}
      {{- else }}
      securityContext:
        fsGroup: 1000
      {{- end }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "agent-management-platform.postgresql.host" . }} -p {{ include "agent-management-platform.postgresql.port" . }} -U {{ include "agent-management-platform.postgresql.username" . }}; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-management-platform.postgresql.secretName" . }}
                  key: {{ include "agent-management-platform.postgresql.secretPasswordKey" . }}
      {{- end }}
      containers:
        - name: agent-manager-service
          {{- if .Values.agentManagerService.securityContext }}
          securityContext:
            {{- toYaml .Values.agentManagerService.securityContext | nindent 12 }}
          {{- else }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- end }}
          image: "{{ include "agent-management-platform.image" (dict "image" .Values.agentManagerService.image "ctx" .) }}"
          imagePullPolicy: {{ .Values.agentManagerService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.agentManagerService.service.targetPort }}
              protocol: TCP
            - name: {{ if .Values.agentManagerService.internalServer.tlsEnabled }}https{{ else }}http-internal{{ end }}
              containerPort: {{ .Values.agentManagerService.gatewayMgtService.targetPort }}
              protocol: TCP
          env:
            - name: DB_HOST
              value: {{ include "agent-management-platform.postgresql.host" . | quote }}
            - name: DB_PORT
              value: {{ include "agent-management-platform.postgresql.port" . | quote }}
            - name: DB_NAME
              value: {{ include "agent-management-platform.postgresql.database" . | quote }}
            - name: DB_USER
              value: {{ include "agent-management-platform.postgresql.username" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-management-platform.postgresql.secretName" . }}
                  key: {{ include "agent-management-platform.postgresql.secretPasswordKey" . }}
            {{- with (include "agent-management-platform.postgresql.tlsEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: API_KEY_VALUE
              valueFrom:
                secretKeyRef:
                  {{- if .Values.agentManagerService.config.apiKey.existingSecret }}
                  name: {{ .Values.agentManagerService.config.apiKey.existingSecret }}
                  key: {{ .Values.agentManagerService.config.apiKey.existingSecretKey | default "api-key" }}
                  {{- else }}
                  name: {{ include "agent-management-platform.agentManagerService.fullname" . }}
                  key: api-key
                  {{- end }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.agentManagerService.config.github.existingSecret }}
                  name: {{ .Values.agentManagerService.config.github.existingSecret }}
                  key: {{ .Values.agentManagerService.config.github.existingSecretKey | default "github-token" }}
                  {{- else }}
                  name: {{ include "agent-management-platform.agentManagerService.fullname" . }}
                  key: github-token
                  {{- end }}
            {{- with .Values.agentManagerService.config.growthAnalytics }}
            {{- if and .enabled (or .applicationId .existingSecret) }}
            - name: MOESIF_APPLICATION_ID
              valueFrom:
                secretKeyRef:
                  # optional: a missing or misnamed analytics Secret must not
                  # stop the API from starting; tracking just stays off.
                  optional: true
                  {{- if .existingSecret }}
                  name: {{ .existingSecret }}
                  key: {{ .existingSecretKey | default "moesif-application-id" }}
                  {{- else }}
                  name: {{ include "agent-management-platform.agentManagerService.fullname" $ }}
                  key: moesif-application-id
                  {{- end }}
            {{- end }}
            {{- end }}
            {{- if or .Values.agentManagerService.config.openbao.token .Values.agentManagerService.config.openbao.existingSecret }}
            - name: OPENBAO_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.agentManagerService.config.openbao.existingSecret }}
                  name: {{ .Values.agentManagerService.config.openbao.existingSecret }}
                  key: {{ .Values.agentManagerService.config.openbao.existingSecretKey | default "openbao-token" }}
                  {{- else }}
                  name: {{ include "agent-management-platform.agentManagerService.fullname" . }}
                  key: openbao-token
                  {{- end }}
            {{- end }}
            {{- if or .Values.agentManagerService.config.workflowPlaneOpenbao.token .Values.agentManagerService.config.workflowPlaneOpenbao.existingSecret }}
            - name: WORKFLOW_PLANE_OPENBAO_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.agentManagerService.config.workflowPlaneOpenbao.existingSecret }}
                  name: {{ .Values.agentManagerService.config.workflowPlaneOpenbao.existingSecret }}
                  key: {{ .Values.agentManagerService.config.workflowPlaneOpenbao.existingSecretKey | default "openbao-token" }}
                  {{- else }}
                  name: {{ include "agent-management-platform.agentManagerService.fullname" . }}
                  key: workflow-plane-openbao-token
                  {{- end }}
            {{- end }}
            {{- if .Values.webhookDispatcher.enabled }}
            - name: WEBHOOKS_DISPATCHER_API_KEY
              valueFrom:
                {{- include "agent-management-platform.webhookDispatcher.apiKeyRef" . | nindent 16 }}
            {{- end }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.agentManagerService.config.encryptionKey.existingSecret }}
                  name: {{ .Values.agentManagerService.config.encryptionKey.existingSecret }}
                  key: {{ .Values.agentManagerService.config.encryptionKey.existingSecretKey | default "encryption-key" }}
                  {{- else }}
                  name: {{ include "agent-management-platform.agentManagerService.fullname" . }}
                  key: encryption-key
                  {{- end }}
            - name: THUNDER_ASK_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.agentManagerService.config.thunderAskSecret.existingSecret }}
                  name: {{ .Values.agentManagerService.config.thunderAskSecret.existingSecret }}
                  key: {{ .Values.agentManagerService.config.thunderAskSecret.existingSecretKey | default "thunder-ask-secret" }}
                  {{- else }}
                  name: {{ include "agent-management-platform.agentManagerService.fullname" . }}
                  key: thunder-ask-secret
                  {{- end }}
            {{- if or .Values.agentManagerService.config.thunder.clientSecret .Values.agentManagerService.config.thunder.existingSecret }}
            - name: THUNDER_CLIENT_SECRET
              {{- if .Values.agentManagerService.config.thunder.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agentManagerService.config.thunder.existingSecret }}
                  key: {{ .Values.agentManagerService.config.thunder.existingSecretKey | default "thunder-client-secret" }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-management-platform.agentManagerService.fullname" . }}
                  key: thunder-client-secret
              {{- end }}
            {{- end }}
            {{- if or .Values.agentManagerService.config.gatewayManifestCache.redis.password .Values.agentManagerService.config.gatewayManifestCache.redis.existingSecret }}
            - name: GATEWAY_MANIFEST_CACHE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.agentManagerService.config.gatewayManifestCache.redis.existingSecret }}
                  name: {{ .Values.agentManagerService.config.gatewayManifestCache.redis.existingSecret }}
                  key: {{ .Values.agentManagerService.config.gatewayManifestCache.redis.existingSecretKey | default "gateway-manifest-cache-redis-password" }}
                  {{- else }}
                  name: {{ include "agent-management-platform.agentManagerService.fullname" . }}
                  key: gateway-manifest-cache-redis-password
                  {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "agent-management-platform.agentManagerService.fullname" . }}
          {{- with .Values.agentManagerService.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.agentManagerService.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.agentManagerService.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/keys
              readOnly: true
            - name: instrumentation-extension
              mountPath: /etc/amp
              readOnly: true
            {{- if .Values.agentManagerService.internalServer.tlsEnabled }}
            - name: certificates
              mountPath: /app/data/certs
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: jwt-keys
          secret:
            secretName: {{ include "agent-management-platform.jwtKeysSecretName" . }}
            defaultMode: 0440
            optional: true
        - name: instrumentation-extension
          configMap:
            name: {{ include "agent-management-platform.agentManagerService.fullname" . }}-instrumentation-extension
        {{- if .Values.agentManagerService.internalServer.tlsEnabled }}
        - name: certificates
          secret:
            secretName: {{ include "agent-management-platform.tlsCertsSecretName" . }}
            defaultMode: 0440
            optional: false
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.agentManagerService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentManagerService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentManagerService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
