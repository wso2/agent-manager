{{- if .Values.agentManagerService.enabled }}
{{- if or (not .Values.agentManagerService.config.apiKey.existingSecret) (not .Values.agentManagerService.config.github.existingSecret) (not .Values.agentManagerService.config.encryptionKey.existingSecret) (not .Values.agentManagerService.config.thunderAskSecret.existingSecret) (and .Values.agentManagerService.config.thunder.clientSecret (not .Values.agentManagerService.config.thunder.existingSecret)) (not .Values.agentManagerService.config.secretStore.existingSecret) (and .Values.agentManagerService.config.gatewayManifestCache.redis.password (not .Values.agentManagerService.config.gatewayManifestCache.redis.existingSecret)) }}
{{- $secretName := include "agent-management-platform.agentManagerService.fullname" . -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "agent-management-platform.agentManagerService.labels" . | nindent 4 }}
    # Lets the in-house ClusterSecretStore (External Secrets webhook provider)
    # read secret-store-token from this Secret.
    external-secrets.io/type: webhook
type: Opaque
stringData:
  {{- if not .Values.agentManagerService.config.apiKey.existingSecret }}
  {{- $existingApiKey := "" -}}
  {{- if and $existingSecret (hasKey $existingSecret.data "api-key") -}}
  {{- $existingApiKey = (index $existingSecret.data "api-key" | b64dec) -}}
  {{- end }}
  api-key: {{ .Values.agentManagerService.config.apiKey.value | default $existingApiKey | default (randAlphaNum 32) | quote }}
  {{- end }}
  {{- if not .Values.agentManagerService.config.github.existingSecret }}
  github-token: {{ .Values.agentManagerService.config.github.token | default "" | quote }}
  {{- end }}
  {{- with .Values.agentManagerService.config.growthAnalytics }}
  {{- if and .applicationId (not .existingSecret) }}
  moesif-application-id: {{ .applicationId | quote }}
  {{- end }}
  {{- end }}
  {{- if not .Values.agentManagerService.config.encryptionKey.existingSecret }}
  {{- $existingEncryptionKey := "" -}}
  {{- if and $existingSecret (hasKey $existingSecret.data "encryption-key") -}}
  {{- $existingEncryptionKey = (index $existingSecret.data "encryption-key" | b64dec) -}}
  {{- end }}
  encryption-key: {{ .Values.agentManagerService.config.encryptionKey.value | default $existingEncryptionKey | default (randAlphaNum 32 | sha256sum) | quote }}
  {{- end }}
  {{- if not .Values.agentManagerService.config.thunderAskSecret.existingSecret }}
  {{- $existingThunderAskSecret := "" -}}
  {{- if and $existingSecret (hasKey $existingSecret.data "thunder-ask-secret") -}}
  {{- $existingThunderAskSecret = (index $existingSecret.data "thunder-ask-secret" | b64dec) -}}
  {{- end }}
  thunder-ask-secret: {{ .Values.agentManagerService.config.thunderAskSecret.value | default $existingThunderAskSecret | default (randAlphaNum 32) | quote }}
  {{- end }}
  {{- if and .Values.agentManagerService.config.thunder.clientSecret (not .Values.agentManagerService.config.thunder.existingSecret) }}
  thunder-client-secret: {{ .Values.agentManagerService.config.thunder.clientSecret | quote }}
  {{- end }}
  {{- if not .Values.agentManagerService.config.secretStore.existingSecret }}
  {{- $existingSecretStoreToken := "" -}}
  {{- if and $existingSecret (hasKey $existingSecret.data "secret-store-token") -}}
  {{- $existingSecretStoreToken = (index $existingSecret.data "secret-store-token" | b64dec) -}}
  {{- end }}
  secret-store-token: {{ .Values.agentManagerService.config.secretStore.token | default $existingSecretStoreToken | default (randAlphaNum 48) | quote }}
  {{- end }}
  {{- if and .Values.agentManagerService.config.gatewayManifestCache.redis.password (not .Values.agentManagerService.config.gatewayManifestCache.redis.existingSecret) }}
  gateway-manifest-cache-redis-password: {{ .Values.agentManagerService.config.gatewayManifestCache.redis.password | quote }}
  {{- end }}
{{- end }}
{{- end }}
