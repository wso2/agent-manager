{{- if .Values.console.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-management-platform.console.fullname" . }}
  labels:
    {{- include "agent-management-platform.console.labels" . | nindent 4 }}
data:
  # Authentication configuration
  AUTH_CLIENT_ID: {{ .Values.console.config.auth.clientId | quote }}
  AUTH_BASE_URL: {{ .Values.console.config.auth.baseUrl | quote }}
  AUTH_SCOPES: {{ .Values.console.config.auth.scopes | default "openid profile email" | quote }}
  SIGN_IN_REDIRECT_URL: {{ .Values.console.config.auth.signInRedirectURL | quote }}
  SIGN_OUT_REDIRECT_URL: {{ .Values.console.config.auth.signOutRedirectURL | quote }}
  VALIDATE_ID_TOKEN: {{ .Values.console.config.auth.validateIDToken | quote }}
  CLOCK_TOLERANCE: {{ .Values.console.config.auth.clockTolerance | quote }}
  # Disable authentication flag
  DISABLE_AUTH: {{ .Values.console.config.disableAuth | quote }}
  # Backend API URL (auto-configure if empty)
  API_BASE_URL: {{ .Values.console.config.apiBaseUrl | quote }}
  # Gateway control plane URL for gateway setup commands
  GATEWAY_CONTROL_PLANE_URL: {{ .Values.console.config.gatewayControlPlaneUrl | default "http://localhost:9243" | quote }}
  # Gateway version for setup commands
  GATEWAY_VERSION: {{ .Values.console.config.gatewayVersion | default "v2026.09.24" | quote }}
  # Agent Manager release version — pins the deployment-script git tag (amp/vX.Y.Z)
  AMP_VERSION: {{ .Values.console.config.ampVersion | default "v1.0.0" | quote }}
  # Base URL the console's generated commands fetch deployment scripts from.
  # Empty derives the public raw.githubusercontent.com URL from AMP_VERSION; set
  # it where that host is unreachable or serves nothing for this build.
  SCRIPT_BASE_URL: {{ .Values.console.config.scriptBaseUrl | default "" | quote }}
  # Base URL the evaluator AI Copilot prompt links the writing guide from.
  # Empty derives the public raw.githubusercontent.com URL from AMP_VERSION.
  PROMPTS_BASE_URL: {{ .Values.console.config.promptsBaseUrl | default "" | quote }}
  # Documentation base URL for the console's in-product doc links. Built from
  # the docs version so only the version segment varies per release.
  DOCS_URL: {{ printf "https://wso2.com/agent-platform/docs/%s/" (.Values.console.config.docsVersion | default "latest") | quote }}
  # Agent Instrumentation URL
  INSTRUMENTATION_URL: {{ .Values.console.config.instrumentationUrl | quote }}
  # Cluster-internal URLs the gateway uses to reach Agent Manager — surfaced to
  # the Create Environment drawer so the rendered add-environment.sh command
  # carries values that match the deployment mode (docker-compose vs in-cluster).
  AGENT_MANAGER_INTERNAL_BASE_URL: {{ .Values.console.config.agentManagerInternalBaseUrl | default "" | quote }}
  AGENT_MANAGER_INTERNAL_CP_HOST: {{ .Values.console.config.agentManagerInternalCpHost | default "" | quote }}
  # Base domain env-Thunder instances are hosted under, and whether this
  # deployment serves them over TLS — piped into the Create Environment
  # drawer's rendered add-environment.sh command so IDP_HOST_BASE_DOMAIN
  # and TLS_ENABLED match this deployment instead of being omitted.
  IDP_HOST_BASE_DOMAIN: {{ .Values.console.config.idpHostBaseDomain | default "amp.localhost" | quote }}
  TLS_ENABLED: {{ .Values.console.config.tlsEnabled | default "false" | quote }}
  # Request and file-mount size limits in bytes. `dig`, not `default`, for the
  # body limit: 0 is a real setting (no limit) and `default` would replace it.
  # `int` because Helm reads YAML numbers as floats and `quote` would render
  # 1000000 as "1e+06".
  MAX_REQUEST_BODY_BYTES: {{ dig "maxRequestBodyBytes" 0 .Values.console.config | int | quote }}
  FILE_MOUNT_MAX_FILE_BYTES: {{ .Values.console.config.fileMountMaxFileBytes | default (dig "fileMountLimits" "maxFileBytes" 1000000 .Values.agentManagerService.config) | int | quote }}
  # Feature flags — all default to false (disabled) unless explicitly enabled.
  FEATURE_FLAG_ENABLE_PRIVATE_REPO_SUPPORT: {{ dig "featureFlags" "enablePrivateRepoSupport" false .Values.console.config | quote }}
  FEATURE_FLAG_ENABLE_IDENTITY_PROVIDER_MANAGED_MODE: {{ dig "featureFlags" "enableIdentityProviderManagedMode" false .Values.console.config | quote }}
  FEATURE_FLAG_ENABLE_PROFILE_MANAGEMENT: {{ dig "featureFlags" "enableProfileManagement" false .Values.console.config | quote }}
  FEATURE_FLAG_ENABLE_USER_MANAGEMENT: {{ dig "featureFlags" "enableUserManagement" false .Values.console.config | quote }}
{{- end }}
