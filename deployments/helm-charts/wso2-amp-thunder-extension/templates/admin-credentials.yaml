# Resolves the AMP console admin password, in this order:
#   1. thunder.setup.admin.password, if set explicitly — this is how the
#      local dev, quick-start, and VM installers all set a fixed, memorable
#      password on purpose, for convenience on a machine only the operator
#      can reach. This is the ONE field in this repo where an explicit value
#      is expected and normal, not a leftover default to clean up.
#   2. otherwise, the value already stored here from a previous install —
#      re-renders (helm upgrade, or a re-run of the pre-install hook) never
#      rotate the password out from under the operator.
#   3. otherwise, a fresh random 10-character value — this is the production
#      path: the on-your-environment guide never sets thunder.setup.admin.password,
#      so a real deployment always gets a generated value, never a guessable one.
#
# thunder.setup.admin.passwordRef below points Thunder's own native admin
# bootstrap at this Secret either way, so the real account (created by
# Thunder's own internal "01-" bootstrap, which the setup job always runs
# first) gets whichever value was resolved here — one source of truth
# regardless of which of the three cases above applied.
#
# Retrieve it any time with:
#   kubectl get secret amp-admin-credentials -n <thunder-namespace> -o jsonpath='{.data.password}' | base64 -d; echo
{{- $secretName := "amp-admin-credentials" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := "" -}}
{{- if .Values.thunder.setup.admin.password -}}
{{- $password = .Values.thunder.setup.admin.password -}}
{{- else if and $existing $existing.data (index $existing.data "password") -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 10 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: wso2-agent-manager
    app.kubernetes.io/component: admin-credentials
  annotations:
    "helm.sh/hook": pre-install
    # More negative than every consumer: Thunder's own admin-secret.yaml
    # (-6) and setup job (-5), and this wrapper's own bootstrap ConfigMap
    # (-10) — this must exist before all of them.
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  username: {{ .Values.thunder.setup.admin.username | default "admin" | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
