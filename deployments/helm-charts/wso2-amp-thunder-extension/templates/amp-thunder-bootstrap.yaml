  67-amp-default-users.yaml: |
    {{- range $i, $u := .Values.thunder.bootstrap.defaultUsers }}
    {{- if $i }}
    ---
    {{- end }}
    resource_type: user
    {{- if eq $u.username "admin" }}
    # Merges into Thunder's own built-in admin account (created by its internal
    # bootstrap, backend/cmd/server/bootstrap/01-default-resources.yaml, at this exact
    # fixed id) instead of creating a second, separate user — matching how the previous
    # bootstrap script looked up and reused this same native account rather than
    # creating its own. One benefit beyond parity: this account is already a member of
    # Thunder's built-in "Administrators" group (system permission), so it works for
    # both the AMP console and ThunderID's own native console without a second AMP-side
    # role granting that permission. type stays "Person" (Thunder's own native schema
    # for this account, not our "engineer" schema) since we're updating that existing
    # entity in place, not creating a new one.
    #
    # No credentials block here, deliberately: Thunder's own "01-" bootstrap document
    # (which runs first in the same import batch, since it sorts before "67-") already
    # creates this exact user and sets its credential from
    # thunder.setup.admin.passwordRef (see values.yaml — generated once by this chart's
    # own admin-credentials.yaml, not an inline value here). Setting credentials again
    # here, on the very same id in the very same batch, fails with USR-1028 "Credential
    # update not allowed" — Thunder refuses a second credential write against a user
    # that already has one, even within a single bootstrap run. defaultUsers[0] has no
    # password field for this reason — it would be silently unused, not a real copy.
    id: "01900000-0000-7000-8000-000000000030"
    type: Person
    ouHandle: default
    # email is required by Thunder's own "Person" user-type schema (the only other
    # required field besides username); this is an update on an existing entity, so
    # omitting a required attribute fails schema validation the same as it would on
    # create. Thunder's own "01-" document sets this to admin@example.com by default,
    # which is kept here since defaultUsers has no configurable email field.
    attributes:
      username: {{ $u.username | quote }}
      email: "admin@example.com"
      given_name: {{ $u.givenName | quote }}
      family_name: {{ $u.familyName | quote }}
    {{- else }}
    id: amp-user-{{ $u.username }}
    type: {{ $.Values.thunder.bootstrap.userSchema.name | quote }}
    ouHandle: default
    # password must be set in BOTH places, for two independent reasons:
    #  - attributes: entity.Attributes is what Schema.Validate checks for required+
    #    credential fields at create time (skipCredentialRequired is false for creates,
    #    per entity/service.go), so omitting it here fails schema validation as "missing
    #    required field".
    #  - credentials: importUser (system/importer/service_adapters.go) only calls
    #    UpdateUserCredentials — the call that actually hashes and stores a usable
    #    password — when the separate `credentials` field is non-empty. Attributes alone
    #    creates the user with NO real credential at all: it looks fine (GetUser/GetUsers
    #    succeed, the field isn't even echoed back), but every login silently fails and
    #    the sign-in flow just restarts at the same node with no visible error.
    attributes:
      username: {{ $u.username | quote }}
      password: {{ $u.password | quote }}
      given_name: {{ $u.givenName | quote }}
      family_name: {{ $u.familyName | quote }}
    credentials:
      password: {{ $u.password | quote }}
    {{- end }}
    {{- end }}

  68-amp-role-system-client-thunder-admin.yaml: |
    # Grants agent-manager's system client access to ThunderID's OWN admin API (org-unit
    # lookups, resource-server provisioning) by assigning it into Thunder's own built-in
    # "Administrator" role (fixed id, created by Thunder's internal bootstrap,
    # backend/cmd/server/bootstrap/01-default-resources.yaml) — the same role the merged
    # admin user (see 67-amp-default-users.yaml) reaches "system" permission through via
    # the Administrators group. This matches how the previous bootstrap script did the
    # exact same thing: look up Thunder's own Administrator role by name and assign the
    # system client into it, rather than creating a separate role of our own.
    #
    # Name/description/permissions are re-declared exactly as Thunder's own document sets
    # them (not our own invented values): the update path here replaces those three fields
    # wholesale, so restating Thunder's own values keeps this a no-op re-assertion rather
    # than an accidental rename. The role's declarative-immutability guard does not apply
    # to this deployment (role store mode is "mutable", the default when
    # declarativeResources.enabled is unset), and assignments are additive
    # (roleAssignmentService.AddAssignments), so this only adds amp-system-client
    # alongside the existing Administrators group assignment — it does not remove it.
    resource_type: role
    id: "01900000-0000-7000-8000-000000000050"
    name: Administrator
    description: System administrator role with full permissions
    ouHandle: default
    permissions:
      - resourceServerId: "01900000-0000-7000-8000-000000000020"
        permissions:
          - system
    assignments:
      - id: amp-system-client
        type: app

  66-amp-user-type-engineer.yaml: |
    resource_type: user_type
    id: engineer
    category: user
    name: {{ .Values.thunder.bootstrap.userSchema.name | quote }}
    ouHandle: default
    allowSelfRegistration: {{ .Values.thunder.bootstrap.userSchema.allowSelfRegistration }}
    systemAttributes:
      display: username
    schema:
      username:
        type: string
        displayName: Username
        required: true
        unique: true
      password:
        type: string
        displayName: Password
        required: true
        credential: true
      given_name:
        type: string
        displayName: First Name
      family_name:
        type: string
        displayName: Last Name
      email:
        type: string
        displayName: Email

  69-amp-default-resource-server-config.yaml: |
    # Any client_credentials request that includes an explicit OAuth scope now requires a
    # resolvable resource indicator (backend/internal/oauth/oauth2/resourceindicators),
    # failing with invalid_target otherwise. Scripts across the platform (e.g.
    # deployments/scripts/ams-auth.sh's get_ams_token) request explicit scopes without a
    # "resource" param, so we set amp-resource-server as the server-wide default instead of
    # patching every caller.
    resource_type: server_config
    name: defaultResourceServer
    value:
      resourceServerId: amp-resource-server

  70-fix-thunder-system-rs-identifier.yaml: |
    # ThunderID's own built-in "System" resource server (created by its OWN default
    # bootstrap, backend/cmd/server/bootstrap/01-default-resources.yaml) hardcodes
    # identifier: https://localhost:8090/mcp — NOT templated to the deployment's actual
    # publicUrl. The native /console app's config.js derives its OWN OAuth
    # resource_identifier from configuration.server.publicUrl (correctly, e.g.
    # "http://thunder.amp.localhost:8080/mcp" for us), so the two never match, and every
    # native-console login redirects back with "invalid_target: The resource parameter
    # does not match any registered resource server" — the console loads but silently
    # renders nothing. This document re-declares the SAME
    # resource server (same id, so it's an update not a duplicate) with the correct
    # identifier, preserving its full resources/actions tree verbatim so nothing Thunder's
    # own native Administrator role depends on gets dropped. Runs after Thunder's own
    # 01-default-resources.yaml (all resource_server docs execute in filename order
    # within their dependency-order group), so this updates rather than fails to find it.
    resource_type: resource_server
    id: "01900000-0000-7000-8000-000000000020"
    name: System
    description: System resource server
    identifier: "{{ .Values.thunder.configuration.server.publicUrl }}/mcp"
    ouHandle: default
    resources:
      - name: System
        handle: system
        description: System resource
      - name: Organization Unit
        handle: ou
        description: Organization unit resource
        parent: system
        actions:
          - name: View
            handle: view
            description: Read-only access to organization units
      - name: User
        handle: user
        description: User resource
        parent: system
        actions:
          - name: View
            handle: view
            description: Read-only access to users
      - name: Group
        handle: group
        description: Group resource
        parent: system
        actions:
          - name: View
            handle: view
            description: Read-only access to groups
      - name: User Type
        handle: usertype
        description: User type resource
        parent: system
        actions:
          - name: View
            handle: view
            description: Read-only access to user types

  71-amp-cors-config.yaml: |
    # CORS is configured via a "cors" server_config resource (same read-only/writable
    # server-config mechanism as defaultResourceServer above); Thunder's static
    # server config has no CORS section anymore, so this document is the only
    # thing that sets configuration.cors.allowedOrigins below. Without this
    # document Thunder returns no Access-Control-Allow-Origin header for any
    # cross-origin request. The browser then
    # silently fails the /oauth2/token exchange right after a successful sign-in (Thunder
    # processes the request fine; the browser just refuses to hand the response to the
    # calling script), which made the AMP console bounce back into a fresh sign-in loop
    # instead of completing login.
    resource_type: server_config
    name: cors
    value:
      allowedOrigins: {{ .Values.thunder.configuration.cors.allowedOrigins | toJson }}

  73-amp-csp-config.yaml: |
    # Content Security Policy (CSP) server_config resource for ThunderID 1.0.0 GA.
    # ThunderID 1.0.0 enforces a deny-first CSP policy with img-src 'self' data: by default.
    # This bootstrap document relaxes img-src and font-src for /gate/ and /console/ paths
    # to allow external branding assets (e.g. wso2.cachefly.net, gstatic, wikimedia).
    resource_type: server_config
    name: csp
    value:
      reportOnly: false
      paths:
        - location: "/gate/"
          directives:
            style-src-elem:
              - "'self'"
              - "'unsafe-inline'"
            style-src-attr:
              - "'self'"
              - "'unsafe-inline'"
            img-src:
              - "'self'"
              - "data:"
              - "https://wso2.cachefly.net"
              - "https://www.gstatic.com"
              - "https://upload.wikimedia.org"
            font-src:
              - "'self'"
              - "data:"
              - "https://fonts.gstatic.com"
        - location: "/console/"
          directives:
            style-src-elem:
              - "'self'"
              - "'unsafe-inline'"
            style-src-attr:
              - "'self'"
              - "'unsafe-inline'"
            img-src:
              - "'self'"
              - "data:"
              - "https://wso2.cachefly.net"
              - "https://www.gstatic.com"
              - "https://upload.wikimedia.org"
            font-src:
              - "'self'"
              - "data:"
              - "https://fonts.gstatic.com"
            connect-src:
              - "'self'"
              - "https://thunderid.dev"
            worker-src:
              - "'self'"
              - "blob:"

  72-am-observer-client.yaml: |
    # No "scopes" key on purpose: this client's authority comes from its OpenChoreo
    # ClusterAuthzRoleBinding (amp-observer-reader-binding), not from AMP scopes.
    # Scope-less client_credentials tokens fall back to the client ID as audience.
    resource_type: application
    id: am-observer-client
    type: m2m # client_credentials only, no interactive login
    name: {{ .Values.thunder.bootstrap.amObserverClient.name | quote }}
    description: {{ .Values.thunder.bootstrap.amObserverClient.description | quote }}
    ouId: "01900000-0000-7000-8000-000000000001"
    inboundAuthConfig:
      - type: oauth2
        config:
          clientId: {{ .Values.thunder.bootstrap.amObserverClient.clientId | quote }}
          clientSecret: {{ .Values.thunder.bootstrap.amObserverClient.clientSecret | quote }}
          grantTypes: {{ .Values.thunder.bootstrap.amObserverClient.grantTypes | toJson }}
          tokenEndpointAuthMethod: {{ .Values.thunder.bootstrap.amObserverClient.tokenEndpointAuthMethod | quote }}
          pkceRequired: {{ .Values.thunder.bootstrap.amObserverClient.pkceRequired }}
          publicClient: {{ .Values.thunder.bootstrap.amObserverClient.publicClient }}
          token:
            accessToken:
              clientConfig:
                validityPeriod: {{ .Values.thunder.bootstrap.amObserverClient.accessTokenValidityPeriod }}
                attributes: ["ouId", "ouHandle"]

  {{- /* am-obs-mcp gets its OIDC scopes (amObsMcpClient.scopes) plus the four
       observability data-read scopes, single-sourced from
       thunder.bootstrap.observabilityScopes. */}}
  73-am-obs-mcp-client.yaml: |
    resource_type: application
    id: am-obs-mcp-client
    type: browser # public redirect client (authorization_code + PKCE, loopback redirect)
    name: {{ .Values.thunder.bootstrap.amObsMcpClient.name | quote }}
    description: {{ .Values.thunder.bootstrap.amObsMcpClient.description | quote }}
    ouId: "01900000-0000-7000-8000-000000000001"
    authFlowHandle: default-flow
    allowedUserTypes: {{ .Values.thunder.bootstrap.amObsMcpClient.allowedUserTypes | toJson }}
    inboundAuthConfig:
      - type: oauth2
        config:
          clientId: {{ .Values.thunder.bootstrap.amObsMcpClient.clientId | quote }}
          redirectUris: {{ .Values.thunder.bootstrap.amObsMcpClient.redirectUris | toJson }}
          grantTypes: {{ .Values.thunder.bootstrap.amObsMcpClient.grantTypes | toJson }}
          responseTypes: {{ .Values.thunder.bootstrap.amObsMcpClient.responseTypes | toJson }}
          tokenEndpointAuthMethod: {{ .Values.thunder.bootstrap.amObsMcpClient.tokenEndpointAuthMethod | quote }}
          pkceRequired: {{ .Values.thunder.bootstrap.amObsMcpClient.pkceRequired }}
          publicClient: {{ .Values.thunder.bootstrap.amObsMcpClient.publicClient }}
          scopes: {{ concat .Values.thunder.bootstrap.amObsMcpClient.scopes .Values.thunder.bootstrap.observabilityScopes | toJson }}
          token:
            accessToken:
              userConfig:
                validityPeriod: {{ .Values.thunder.bootstrap.amObsMcpClient.accessTokenValidityPeriod }}
                attributes: {{ .Values.thunder.bootstrap.amObsMcpClient.userAttributes | toJson }}
            idToken:
              validityPeriod: {{ .Values.thunder.bootstrap.amObsMcpClient.idTokenValidityPeriod }}
              userAttributes: {{ .Values.thunder.bootstrap.amObsMcpClient.userAttributes | toJson }}
