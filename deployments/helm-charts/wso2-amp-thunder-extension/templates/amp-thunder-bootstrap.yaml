apiVersion: v1
kind: ConfigMap
metadata:
  name: amp-thunder-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: thunder-bootstrap
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
data:
  50-amp-api-client.yaml: |
    # ouId (not ouHandle) on every application document in this file: the declarative
    # importer resolves ouHandle correctly for roles/groups/users, but not for
    # applications, so an application bootstrapped with ouHandle: default ends up with
    # no OU at all, and its client_credentials tokens carry no ouId/ouHandle claim —
    # agent-manager-service's RequireOrgMatch then rejects them as "missing ou identity
    # in token". "01900000-0000-7000-8000-000000000001" is ThunderID's own built-in
    # "default" OU, fixed on every install rather than generated per instance, mirroring
    # what the pre-declarative bootstrap scripts did: resolve "default" once and send
    # the real id. This on-prem deployment only ever runs a single org/OU ("default",
    # mapped to OpenChoreo's own default namespace) — multi-org support is a future
    # concern, not something to solve here.
    #
    # ouId alone is NOT enough: Thunder only embeds ouId/ouHandle as token claims when
    # a client's own token.accessToken.clientConfig.attributes opts in. Every
    # client_credentials-only application in this file needs this attributes list, or
    # its tokens keep getting rejected as "missing ou identity in token" even though
    # ouId above is set correctly.
    resource_type: application
    id: amp-api-client
    type: m2m # client_credentials only, no interactive login
    name: {{ .Values.thunder.bootstrap.ampApiClient.name | quote }}
    description: {{ .Values.thunder.bootstrap.ampApiClient.description | quote }}
    ouId: "01900000-0000-7000-8000-000000000001"
    inboundAuthConfig:
      - type: oauth2
        config:
          clientId: {{ .Values.thunder.bootstrap.ampApiClient.clientId | quote }}
          clientSecret: {{ .Values.thunder.bootstrap.ampApiClient.clientSecret | quote }}
          grantTypes: {{ .Values.thunder.bootstrap.ampApiClient.grantTypes | toJson }}
          tokenEndpointAuthMethod: {{ .Values.thunder.bootstrap.ampApiClient.tokenEndpointAuthMethod | quote }}
          pkceRequired: {{ .Values.thunder.bootstrap.ampApiClient.pkceRequired }}
          publicClient: {{ .Values.thunder.bootstrap.ampApiClient.publicClient }}
          scopes: {{ .Values.thunder.bootstrap.ampScopes | toJson }}
          token:
            accessToken:
              clientConfig:
                validityPeriod: {{ .Values.thunder.bootstrap.ampApiClient.accessTokenValidityPeriod }}
                attributes: ["ouId", "ouHandle"]

  51-amp-console-theme.yaml: |
    resource_type: theme
    id: amp-console-theme
    handle: {{ .Values.thunder.bootstrap.ampConsoleTheme.handle | quote }}
    displayName: {{ .Values.thunder.bootstrap.ampConsoleTheme.displayName | quote }}
    theme:
{{ .Values.thunder.bootstrap.ampConsoleTheme.theme | toYaml | indent 6 }}

  52-amp-console-layout.yaml: |
    # CreateLayout enforces handle uniqueness with no "already exists under a
    # different id, reuse it" fallback. Older ThunderID versions silently discarded
    # a caller-specified layout id, so a cluster upgraded from one of those still has
    # this layout row under a different id — wipe Thunder's PVC before reinstalling
    # with this fixed id, or the id mismatch causes a conflict.
    resource_type: layout
    id: {{ .Values.thunder.bootstrap.ampConsoleLayout.id | quote }}
    handle: {{ .Values.thunder.bootstrap.ampConsoleLayout.handle | quote }}
    displayName: {{ .Values.thunder.bootstrap.ampConsoleLayout.displayName | quote }}
    layout:
{{ .Values.thunder.bootstrap.ampConsoleLayout.layout | toYaml | indent 6 }}

  53-amp-console-app.yaml: |
    resource_type: application
    id: amp-console-client
    type: browser # public redirect client (authorization_code + PKCE console login)
    name: {{ .Values.thunder.bootstrap.ampConsoleClient.name | quote }}
    description: {{ .Values.thunder.bootstrap.ampConsoleClient.description | quote }}
    ouId: "01900000-0000-7000-8000-000000000001"
    logoUrl: {{ .Values.thunder.bootstrap.ampConsoleClient.logoUrl | quote }}
    authFlowHandle: default-flow
    themeId: amp-console-theme
    layoutId: {{ .Values.thunder.bootstrap.ampConsoleLayout.id | quote }}
    allowedUserTypes: {{ .Values.thunder.bootstrap.ampConsoleClient.allowedUserTypes | toJson }}
    inboundAuthConfig:
      - type: oauth2
        config:
          clientId: {{ .Values.thunder.bootstrap.ampConsoleClient.clientId | quote }}
          clientSecret: {{ .Values.thunder.bootstrap.ampConsoleClient.clientSecret | quote }}
          redirectUris: {{ .Values.thunder.bootstrap.ampConsoleClient.redirectUris | toJson }}
          grantTypes: {{ .Values.thunder.bootstrap.ampConsoleClient.grantTypes | toJson }}
          responseTypes: {{ .Values.thunder.bootstrap.ampConsoleClient.responseTypes | toJson }}
          tokenEndpointAuthMethod: {{ .Values.thunder.bootstrap.ampConsoleClient.tokenEndpointAuthMethod | quote }}
          pkceRequired: {{ .Values.thunder.bootstrap.ampConsoleClient.pkceRequired }}
          publicClient: {{ .Values.thunder.bootstrap.ampConsoleClient.publicClient }}
          scopes: {{ .Values.thunder.bootstrap.ampScopes | toJson }}
          token:
            accessToken:
              userConfig:
                validityPeriod: {{ .Values.thunder.bootstrap.ampConsoleClient.accessTokenValidityPeriod }}
                attributes: {{ .Values.thunder.bootstrap.ampConsoleClient.userAttributes | toJson }}
            idToken:
              validityPeriod: {{ .Values.thunder.bootstrap.ampConsoleClient.idTokenValidityPeriod }}
              userAttributes: {{ .Values.thunder.bootstrap.ampConsoleClient.userAttributes | toJson }}

  54-workload-publisher-app.yaml: |
    resource_type: application
    id: workload-publisher-client
    type: m2m # client_credentials only, no interactive login
    name: {{ .Values.thunder.bootstrap.workloadPublisherClient.name | quote }}
    description: {{ .Values.thunder.bootstrap.workloadPublisherClient.description | quote }}
    ouId: "01900000-0000-7000-8000-000000000001"
    inboundAuthConfig:
      - type: oauth2
        config:
          clientId: {{ .Values.thunder.bootstrap.workloadPublisherClient.clientId | quote }}
          clientSecret: {{ .Values.thunder.bootstrap.workloadPublisherClient.clientSecret | quote }}
          grantTypes: {{ .Values.thunder.bootstrap.workloadPublisherClient.grantTypes | toJson }}
          tokenEndpointAuthMethod: {{ .Values.thunder.bootstrap.workloadPublisherClient.tokenEndpointAuthMethod | quote }}
          pkceRequired: {{ .Values.thunder.bootstrap.workloadPublisherClient.pkceRequired }}
          publicClient: {{ .Values.thunder.bootstrap.workloadPublisherClient.publicClient }}
          scopes: {{ .Values.thunder.bootstrap.ampScopes | toJson }}
          token:
            accessToken:
              clientConfig:
                validityPeriod: {{ .Values.thunder.bootstrap.workloadPublisherClient.accessTokenValidityPeriod }}
                attributes: ["ouId", "ouHandle"]

  55-observer-resource-reader-app.yaml: |
    resource_type: application
    id: observer-resource-reader-client
    type: m2m # client_credentials only, no interactive login
    name: {{ .Values.thunder.bootstrap.observerResourceReaderClient.name | quote }}
    description: {{ .Values.thunder.bootstrap.observerResourceReaderClient.description | quote }}
    ouId: "01900000-0000-7000-8000-000000000001"
    inboundAuthConfig:
      - type: oauth2
        config:
          clientId: {{ .Values.thunder.bootstrap.observerResourceReaderClient.clientId | quote }}
          clientSecret: {{ .Values.thunder.bootstrap.observerResourceReaderClient.clientSecret | quote }}
          grantTypes: {{ .Values.thunder.bootstrap.observerResourceReaderClient.grantTypes | toJson }}
          tokenEndpointAuthMethod: {{ .Values.thunder.bootstrap.observerResourceReaderClient.tokenEndpointAuthMethod | quote }}
          pkceRequired: {{ .Values.thunder.bootstrap.observerResourceReaderClient.pkceRequired }}
          publicClient: {{ .Values.thunder.bootstrap.observerResourceReaderClient.publicClient }}
          scopes: {{ .Values.thunder.bootstrap.ampScopes | toJson }}
          token:
            accessToken:
              clientConfig:
                validityPeriod: {{ .Values.thunder.bootstrap.observerResourceReaderClient.accessTokenValidityPeriod }}
                attributes: ["ouId", "ouHandle"]

  56-amp-publisher-client.yaml: |
    resource_type: application
    id: amp-publisher-client
    type: m2m # client_credentials only, no interactive login
    name: {{ .Values.thunder.bootstrap.ampPublisherClient.name | quote }}
    description: {{ .Values.thunder.bootstrap.ampPublisherClient.description | quote }}
    ouId: "01900000-0000-7000-8000-000000000001"
    inboundAuthConfig:
      - type: oauth2
        config:
          clientId: {{ .Values.thunder.bootstrap.ampPublisherClient.clientId | quote }}
          clientSecret: {{ .Values.thunder.bootstrap.ampPublisherClient.clientSecret | quote }}
          grantTypes: {{ .Values.thunder.bootstrap.ampPublisherClient.grantTypes | toJson }}
          tokenEndpointAuthMethod: {{ .Values.thunder.bootstrap.ampPublisherClient.tokenEndpointAuthMethod | quote }}
          pkceRequired: {{ .Values.thunder.bootstrap.ampPublisherClient.pkceRequired }}
          publicClient: {{ .Values.thunder.bootstrap.ampPublisherClient.publicClient }}
          scopes: {{ .Values.thunder.bootstrap.ampScopes | toJson }}
          token:
            accessToken:
              clientConfig:
                validityPeriod: {{ .Values.thunder.bootstrap.ampPublisherClient.accessTokenValidityPeriod }}
                attributes: ["ouId", "ouHandle"]

  57-amp-system-client.yaml: |
    resource_type: application
    id: amp-system-client
    type: m2m # client_credentials only, no interactive login
    name: {{ .Values.thunder.bootstrap.ampSystemClient.name | quote }}
    description: {{ .Values.thunder.bootstrap.ampSystemClient.description | quote }}
    ouId: "01900000-0000-7000-8000-000000000001"
    inboundAuthConfig:
      - type: oauth2
        config:
          clientId: {{ .Values.thunder.bootstrap.ampSystemClient.clientId | quote }}
          clientSecret: {{ .Values.thunder.bootstrap.ampSystemClient.clientSecret | quote }}
          grantTypes: {{ .Values.thunder.bootstrap.ampSystemClient.grantTypes | toJson }}
          tokenEndpointAuthMethod: {{ .Values.thunder.bootstrap.ampSystemClient.tokenEndpointAuthMethod | quote }}
          pkceRequired: {{ .Values.thunder.bootstrap.ampSystemClient.pkceRequired }}
          publicClient: {{ .Values.thunder.bootstrap.ampSystemClient.publicClient }}
          # "system" (not an amp: scope) grants ThunderID's own admin-API access, gated by
          # security.HasSystemPermission reading the token's OAuth scope claim directly
          # (backend/internal/system/security/jwt_authenticator.go + permissions.go) — a
          # separate mechanism from the amp-resource-server role/permission model used below.
          scopes: {{ append .Values.thunder.bootstrap.ampScopes "system" | toJson }}
          token:
            accessToken:
              clientConfig:
                validityPeriod: {{ .Values.thunder.bootstrap.ampSystemClient.accessTokenValidityPeriod }}
                attributes: ["ouId", "ouHandle"]

  58-amctl-client.yaml: |
    resource_type: application
    id: amctl-client
    type: browser # public redirect client (authorization_code + PKCE, loopback redirect)
    name: {{ .Values.thunder.bootstrap.amCliClient.name | quote }}
    description: {{ .Values.thunder.bootstrap.amCliClient.description | quote }}
    ouId: "01900000-0000-7000-8000-000000000001"
    authFlowHandle: default-flow
    allowedUserTypes: {{ .Values.thunder.bootstrap.amCliClient.allowedUserTypes | toJson }}
    inboundAuthConfig:
      - type: oauth2
        config:
          clientId: {{ .Values.thunder.bootstrap.amCliClient.clientId | quote }}
          redirectUris: {{ .Values.thunder.bootstrap.amCliClient.redirectUris | toJson }}
          grantTypes: {{ .Values.thunder.bootstrap.amCliClient.grantTypes | toJson }}
          responseTypes: {{ .Values.thunder.bootstrap.amCliClient.responseTypes | toJson }}
          tokenEndpointAuthMethod: {{ .Values.thunder.bootstrap.amCliClient.tokenEndpointAuthMethod | quote }}
          pkceRequired: {{ .Values.thunder.bootstrap.amCliClient.pkceRequired }}
          publicClient: {{ .Values.thunder.bootstrap.amCliClient.publicClient }}
          scopes: {{ .Values.thunder.bootstrap.ampScopes | toJson }}
          token:
            accessToken:
              userConfig:
                validityPeriod: {{ .Values.thunder.bootstrap.amCliClient.accessTokenValidityPeriod }}
                attributes: {{ .Values.thunder.bootstrap.amCliClient.userAttributes | toJson }}
            idToken:
              validityPeriod: {{ .Values.thunder.bootstrap.amCliClient.idTokenValidityPeriod }}
              userAttributes: {{ .Values.thunder.bootstrap.amCliClient.userAttributes | toJson }}

  {{- /* am-mcp may request every amp scope EXCEPT the observability data-read
       scopes (thunder.bootstrap.observabilityScopes) — those belong exclusively
       to the observer MCP client (73-am-obs-mcp-client.yaml below). */}}
  {{- $amMcpScopes := list }}
  {{- range .Values.thunder.bootstrap.ampScopes }}
  {{- if not (has . $.Values.thunder.bootstrap.observabilityScopes) }}
  {{- $amMcpScopes = append $amMcpScopes . }}
  {{- end }}
  {{- end }}
  59-am-mcp-client.yaml: |
    resource_type: application
    id: am-mcp-client
    type: browser # public redirect client (authorization_code + PKCE, loopback redirect)
    name: {{ .Values.thunder.bootstrap.amMcpClient.name | quote }}
    description: {{ .Values.thunder.bootstrap.amMcpClient.description | quote }}
    ouId: "01900000-0000-7000-8000-000000000001"
    authFlowHandle: default-flow
    allowedUserTypes: {{ .Values.thunder.bootstrap.amMcpClient.allowedUserTypes | toJson }}
    inboundAuthConfig:
      - type: oauth2
        config:
          clientId: {{ .Values.thunder.bootstrap.amMcpClient.clientId | quote }}
          redirectUris: {{ .Values.thunder.bootstrap.amMcpClient.redirectUris | toJson }}
          grantTypes: {{ .Values.thunder.bootstrap.amMcpClient.grantTypes | toJson }}
          responseTypes: {{ .Values.thunder.bootstrap.amMcpClient.responseTypes | toJson }}
          tokenEndpointAuthMethod: {{ .Values.thunder.bootstrap.amMcpClient.tokenEndpointAuthMethod | quote }}
          pkceRequired: {{ .Values.thunder.bootstrap.amMcpClient.pkceRequired }}
          publicClient: {{ .Values.thunder.bootstrap.amMcpClient.publicClient }}
          scopes: {{ $amMcpScopes | toJson }}
          token:
            accessToken:
              userConfig:
                validityPeriod: {{ .Values.thunder.bootstrap.amMcpClient.accessTokenValidityPeriod }}
                attributes: {{ .Values.thunder.bootstrap.amMcpClient.userAttributes | toJson }}
            idToken:
              validityPeriod: {{ .Values.thunder.bootstrap.amMcpClient.idTokenValidityPeriod }}
              userAttributes: {{ .Values.thunder.bootstrap.amMcpClient.userAttributes | toJson }}

  60-amp-resource-server.yaml: |
    resource_type: resource_server
    id: amp-resource-server
    name: Agent Manager API
    description: Agent Manager platform permissions
    # MUST be an absolute URI (RFC 8707 §2): Thunder's /oauth2/authorize binds an
    # authorization request to one resource server up front and persists the resolved
    # identifier into the authorization code, and the token endpoint then re-validates
    # that stored value — a bare string like "amp" has no URI scheme to validate, so
    # every authorization_code exchange fails with invalid_target "Invalid resource
    # parameter: must be an absolute URI". client_credentials never hits this (it
    # skips /oauth2/authorize entirely).
    #
    # A urn: (not http:) URI on purpose: resource-server identifiers must be unique,
    # and Thunder's own built-in System resource server already claims this
    # deployment's http origin (70-fix-thunder-system-rs-identifier.yaml below).
    # A urn is also deployment-independent, so it needs no per-environment host
    # templating.
    #
    # This value IS the token's "aud" claim, so it must stay in sync with every
    # audience allow-list that accepts platform-Thunder tokens: agent-manager-service's
    # and agent-manager-observer's KEY_MANAGER_AUDIENCE, and env-Thunder's
    # trustedIssuer.audience (PLATFORM_THUNDER_TOKEN_AUDIENCE in add-environment-thunder.sh).
    # It does NOT affect any amp:* scope string — those come from resource handles plus
    # the delimiter below, never from this identifier.
    identifier: "urn:wso2:amp"
    ouHandle: default
    delimiter: ":"
    resources:
      # Top-level parent for every resource below (see parent: amp on each). Makes
      # ThunderID's computed permission strings "amp:<resource>:<action>" instead of
      # bare "<resource>:<action>", matching our amp: scope-naming convention — see
      # backend/internal/oauth/oauth2/resourceindicators/resourceindicators.go's
      # DownscopeToResourceServer, which filters requested scopes down to only the
      # permission strings actually computed from this resource server's tree.
      # Without this, every "amp:*" scope we request gets silently dropped (empty
      # granted-scope set) once a resource server is resolved for the token.
      - name: Agent Manager
        handle: amp
        description: Top-level namespace for all Agent Manager permissions
      - name: Organization
        handle: org
        parent: amp
        description: Organizational unit management
        actions:
          - { name: View, handle: view, description: "View organizational details" }
          - { name: Modify Settings, handle: modify-settings, description: "Modify organizational settings" }
          - { name: Invite Member, handle: invite-member, description: "Invite members to the organization" }
          - { name: Remove Member, handle: remove-member, description: "Remove members from the organization" }
          - { name: Assign Role, handle: assign-role, description: "Assign or revoke roles" }
          - { name: Manage IDP, handle: manage-idp, description: "Configure Identity Provider" }
          - { name: Manage Service Account, handle: manage-service-account, description: "Manage service accounts" }
      - name: Profile
        handle: profile
        parent: amp
        description: User profile management
        actions:
          - { name: Read, handle: read, description: "View user profile information" }
          - { name: Update Attributes, handle: update-attributes, description: "Update user attributes" }
      - name: Project
        handle: project
        parent: amp
        description: Project management
        actions:
          - { name: Create, handle: create, description: "Create a project" }
          - { name: Read, handle: read, description: "View project details" }
          - { name: Update, handle: update, description: "Update project settings" }
          - { name: Delete, handle: delete, description: "Delete a project" }
      - name: Environment
        handle: environment
        parent: amp
        description: Environment management
        actions:
          - { name: Create, handle: create, description: "Create an environment" }
          - { name: Read, handle: read, description: "View environment details" }
          - { name: Update, handle: update, description: "Update an environment" }
          - { name: Delete, handle: delete, description: "Delete an environment" }
      - name: Gateway
        handle: gateway
        parent: amp
        description: Gateway management
        actions:
          - { name: Create, handle: create, description: "Register a gateway" }
          - { name: Read, handle: read, description: "View gateway details and status" }
          - { name: Update, handle: update, description: "Update gateway configuration" }
          - { name: Delete, handle: delete, description: "Delete a gateway" }
          - { name: Manage Token, handle: token-manage, description: "Create, list, and delete gateway tokens" }
      - name: Data Plane
        handle: data-plane
        parent: amp
        description: Data plane visibility
        actions:
          - { name: Read, handle: read, description: "View data planes" }
      - name: Deployment Pipeline
        handle: deployment-pipeline
        parent: amp
        description: Deployment pipeline visibility
        actions:
          - { name: Create, handle: create, description: "Create a deployment pipeline" }
          - { name: Read, handle: read, description: "View deployment pipelines" }
          - { name: Update, handle: update, description: "Update a deployment pipeline" }
          - { name: Delete, handle: delete, description: "Delete a deployment pipeline" }
      - name: Git Secret
        handle: git-secret
        parent: amp
        description: Git credential management
        actions:
          - { name: Create, handle: create, description: "Create a git secret" }
          - { name: Read, handle: read, description: "List git secrets" }
          - { name: Delete, handle: delete, description: "Delete a git secret" }
      - name: LLM Provider Template
        handle: llm-provider-template
        parent: amp
        description: LLM provider template management
        actions:
          - { name: Create, handle: create, description: "Create a provider template" }
          - { name: Read, handle: read, description: "View provider templates" }
          - { name: Update, handle: update, description: "Update a provider template" }
          - { name: Delete, handle: delete, description: "Delete a provider template" }
      - name: LLM Provider
        handle: llm-provider
        parent: amp
        description: LLM provider management
        actions:
          - { name: Create, handle: create, description: "Create an LLM provider" }
          - { name: Read, handle: read, description: "View LLM providers and deployments" }
          - { name: Update, handle: update, description: "Update an LLM provider" }
          - { name: Delete, handle: delete, description: "Delete an LLM provider" }
          - { name: Configure Guardrail, handle: configure-guardrail, description: "Configure guardrails, rate limits, and budgets" }
          - { name: Connect, handle: connect, description: "Connect an agent to an LLM provider" }
          - { name: Deploy, handle: deploy, description: "Deploy, undeploy, and restore an LLM provider" }
          - { name: Manage API Key, handle: api-key-manage, description: "Create, update, and delete LLM provider API keys" }
      - name: MCP Server
        handle: mcp-server
        parent: amp
        description: MCP server management
        actions:
          - { name: Create, handle: create, description: "Create an MCP server" }
          - { name: Read, handle: read, description: "View MCP servers" }
          - { name: Update, handle: update, description: "Update an MCP server" }
          - { name: Delete, handle: delete, description: "Delete an MCP server" }
          - { name: Configure Guardrail, handle: configure-guardrail, description: "Configure guardrails on an MCP server" }
          - { name: Connect, handle: connect, description: "Connect an agent to an MCP server" }
          - { name: Manage API Key, handle: api-key-manage, description: "Create, update, and delete MCP server API keys" }
      - name: Scope
        handle: scope
        parent: amp
        description: Scope catalog management
        actions:
          - { name: Create, handle: create, description: "Create a scope" }
          - { name: Read, handle: read, description: "View scopes" }
          - { name: Update, handle: update, description: "Update a scope" }
          - { name: Delete, handle: delete, description: "Delete a scope" }
      - name: Agent Identity
        handle: agent-identity
        parent: amp
        description: Agent identity management
        actions:
          - { name: Create, handle: create, description: "Create an agent identity" }
          - { name: Read, handle: read, description: "View agent identities" }
          - { name: Update, handle: update, description: "Update an agent identity" }
          - { name: Delete, handle: delete, description: "Delete an agent identity" }
      - name: LLM Proxy
        handle: llm-proxy
        parent: amp
        description: LLM proxy management
        actions:
          - { name: Create, handle: create, description: "Create an LLM proxy" }
          - { name: Read, handle: read, description: "View LLM proxies and deployments" }
          - { name: Update, handle: update, description: "Update an LLM proxy" }
          - { name: Delete, handle: delete, description: "Delete an LLM proxy" }
          - { name: Deploy, handle: deploy, description: "Deploy, undeploy, and restore an LLM proxy" }
          - { name: Manage API Key, handle: api-key-manage, description: "Create, update, and delete LLM proxy API keys" }
      - name: Evaluator
        handle: evaluator
        parent: amp
        description: Evaluator management
        actions:
          - { name: Create, handle: create, description: "Create a custom evaluator" }
          - { name: Read, handle: read, description: "View evaluators" }
          - { name: Update, handle: update, description: "Update a custom evaluator" }
          - { name: Delete, handle: delete, description: "Delete a custom evaluator" }
      - name: Agent
        handle: agent
        parent: amp
        description: Agent management
        actions:
          - { name: Create, handle: create, description: "Create an agent" }
          - { name: Read, handle: read, description: "View agent details, builds, deployments, and configs" }
          - { name: Update, handle: update, description: "Update agent configuration and resource configs" }
          - { name: Delete, handle: delete, description: "Delete an agent" }
          - { name: Build, handle: build, description: "Trigger an agent build" }
          - { name: Rollback, handle: rollback, description: "Rollback an agent deployment" }
          - { name: Suspend, handle: suspend, description: "Suspend or stop an agent deployment" }
          - { name: Act on Non-Production Environments, handle: env-non-production, description: "Deploy, promote, or suspend an agent in a non-production environment" }
          - { name: Act on Production Environments, handle: env-production, description: "Deploy, promote, or suspend an agent in an environment flagged isProduction" }
          - { name: Manage Token, handle: token-manage, description: "Generate agent tokens" }
          - { name: Manage API Key, handle: api-key-manage, description: "Create, update, and delete agent API keys" }
      - name: Agent Kind
        handle: agent-kind
        parent: amp
        description: Agent kind management
        actions:
          - { name: Create, handle: create, description: "Create an agent kind" }
          - { name: Read, handle: read, description: "View agent kinds and versions" }
          - { name: Update, handle: update, description: "Update an agent kind" }
          - { name: Delete, handle: delete, description: "Delete an agent kind" }
      - name: Monitor
        handle: monitor
        parent: amp
        description: Monitor management
        actions:
          - { name: Create, handle: create, description: "Create a monitor" }
          - { name: Read, handle: read, description: "View monitors, runs, and run logs" }
          - { name: Update, handle: update, description: "Update a monitor" }
          - { name: Delete, handle: delete, description: "Delete a monitor" }
          - { name: Execute, handle: execute, description: "Start, stop, and rerun monitors" }
          - { name: Read Score, handle: score-read, description: "View scores, breakdowns, and timeseries" }
          - { name: Publish Score, handle: score-publish, description: "Publish monitor scores (internal/system use)" }
      - name: Alerting
        handle: alerting
        parent: amp
        description: Organization alert endpoint management
        actions:
          - { name: Read, handle: read, description: "View the alert endpoint and delivery history" }
          - { name: Manage, handle: manage, description: "Configure, test, and delete the alert endpoint" }
      - name: Observability
        handle: observability
        parent: amp
        description: Observability data-read scopes, enforced by agent-manager-observer
        # Renamed from the dashboard/metric-category model (org-dashboard, project-dashboard,
        # guardrail-metric, infra-metric) to match the data-read model every actual consumer
        # already expects — agent-manager-observer/rbac/permissions.go, agent-manager-service/
        # rbac/permissions.go, and values.yaml's ampScopes/observabilityScopes all use these
        # names; only this resource-server document still had the old ones, so Thunder could
        # never grant amp:observability:trace-read etc. to anyone, even to a superadmin token
        # requesting every ampScopes entry.
        actions:
          - { name: Trace Read, handle: trace-read, description: "Read agent execution traces" }
          - { name: Log Read, handle: log-read, description: "Read agent runtime logs" }
          - { name: Build Log Read, handle: build-log-read, description: "Read agent build logs" }
          - { name: Metric Read, handle: metric-read, description: "Read agent and system metrics" }
      - name: Role
        handle: role
        parent: amp
        description: Role management
        actions:
          - { name: Create, handle: create, description: "Create a custom role" }
          - { name: Read, handle: read, description: "View roles and their permissions" }
          - { name: Update, handle: update, description: "Update a custom role" }
          - { name: Delete, handle: delete, description: "Delete a custom role" }
      - name: Group
        handle: group
        parent: amp
        description: Group management
        actions:
          - { name: Create, handle: create, description: "Create a group" }
          - { name: Read, handle: read, description: "View groups and their members" }
          - { name: Update, handle: update, description: "Update a group" }
          - { name: Delete, handle: delete, description: "Delete a group" }
      - name: Catalog
        handle: catalog
        parent: amp
        description: Resource catalog
        actions:
          - { name: Read, handle: read, description: "View the resource catalog" }
      - name: Repository
        handle: repository
        parent: amp
        description: Source repository browsing
        actions:
          - { name: Read, handle: read, description: "Browse repository branches and commits" }

  60-mcp-resource-servers.yaml: |
  {{- $firstMCPResourceServer := true }}
  {{- range $server := .Values.thunder.bootstrap.mcpResourceServers }}
  {{- $baseURL := index $.Values.thunder.bootstrap $server.baseUrlValue }}
  {{- if and (not $baseURL) (not $server.optional) }}
  {{- fail (printf "thunder.bootstrap.%s must be set" $server.baseUrlValue) }}
  {{- end }}
  {{- if $baseURL }}
  {{- if not $firstMCPResourceServer }}
    ---
  {{- end }}
    resource_type: resource_server
    id: {{ $server.id | quote }}
    name: {{ $server.name | quote }}
    description: {{ $server.description | quote }}
    identifier: {{ printf "%s/mcp" ($baseURL | trimSuffix "/") | quote }}
    ouHandle: default
    delimiter: ":"
    resources:
      - name: Agent Manager
        handle: amp
        description: Top-level namespace for Agent Manager MCP permissions
    {{- if eq $server.permissionSet "observability-only" }}
      - name: Observability
        handle: observability
        parent: amp
        description: Observability MCP permissions
        actions:
          - { name: Trace Read, handle: trace-read, description: "Read agent execution traces" }
          - { name: Log Read, handle: log-read, description: "Read agent runtime logs" }
          - { name: Build Log Read, handle: build-log-read, description: "Read agent build logs" }
          - { name: Metric Read, handle: metric-read, description: "Read agent and system metrics" }
    {{- else }}
      - name: Project
        handle: project
        parent: amp
        description: Project operations exposed by Agent Manager MCP
        actions:
          - { name: Create, handle: create, description: "Create a project" }
          - { name: Read, handle: read, description: "View project details" }
      - name: Environment
        handle: environment
        parent: amp
        description: Environment operations exposed by Agent Manager MCP
        actions:
          - { name: Read, handle: read, description: "View environment details" }
      - name: Agent
        handle: agent
        parent: amp
        description: Agent operations exposed by Agent Manager MCP
        actions:
          - { name: Create, handle: create, description: "Create an agent" }
          - { name: Read, handle: read, description: "View agent details" }
          - { name: Build, handle: build, description: "Trigger an agent build" }
          - { name: Act on Non-Production Environments, handle: env-non-production, description: "Deploy or suspend an agent in a non-production environment" }
          - { name: Suspend, handle: suspend, description: "Suspend an agent deployment" }
          - { name: Manage Token, handle: token-manage, description: "Generate agent tokens" }
    {{- end }}
  {{- $firstMCPResourceServer = false }}
  {{- end }}
  {{- end }}

