---
# HTTPRoute exposing Thunder through the shared AMP Gateway. It lives next to
# the Service, so no ReferenceGrant is needed; the Gateway's listeners accept
# routes from all namespaces.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: thunder
spec:
  hostnames:
    - {{ .Values.thunder.ocIngress.hostname }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.thunder.ocIngress.gatewayName | default "amp-gateway" }}
      namespace: {{ .Values.thunder.ocIngress.gatewayNamespace | default "amp-gateway" }}
    {{- if .Values.thunder.ocIngress.https.enabled }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}-https-gateway
      namespace: {{ .Release.Namespace }}
    {{- end }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ .Release.Name }}-service
          port: {{ .Values.thunder.service.port }}
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
