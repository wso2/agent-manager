# Thunder subchart configuration
thunder:
  deployment:
    replicaCount: 1
    strategy:
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    securityContext:
      # Read-only root filesystem. Must be false for SQLite
      readOnlyRootFilesystem: false
      enableRunAsUser: true
      fsGroup: 10001
      runAsUser: 10001
      seccompProfile:
        enabled: true
        type: RuntimeDefault
    terminationGracePeriodSeconds: 10
    image:
      registry: ghcr.io/thunder-id
      repository: thunderid
      tag: "1.0.0"
      pullPolicy: Always
    container:
      port: 8090
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    annotations: {}
  service:
    port: 8090
  serviceAccount:
    name: thunder-service-account
    create: true
  hpa:
    enabled: false
  pdb:
    minAvailable: "50%"
  ingress:
    enabled: false
  ocIngress:
    hostname: "thunder.amp.localhost"
    https:
      # Enable a dedicated HTTPS Gateway (port 8443) and cert-manager TLS certificate
      # for thunder.amp.localhost so env-Thunder instances can wire it as a trusted issuer.
      # Requires cert-manager to be installed in the cluster.
      enabled: true
      port: 8443
      # Set to true to create the local ClusterIssuer and Root CA. Only one instance
      # in the cluster (typically the platform-wide instance) should create these.
      createIssuer: true
  configuration:
    server:
      port: 8090
      httpOnly: true
      publicUrl: "http://thunder.amp.localhost:8080"
    gateClient:
      hostname: "thunder.amp.localhost"
      port: 8080
      scheme: "http"
      path: "/gate"
    crypto:
      encryption:
        key: "file://config/certs/crypto.key"
      passwordHashing:
        algorithm: "PBKDF2"
        argon2id:
          iterations: 2
          memory: 19456
          parallelism: 1
          key_size: 32
          salt_size: 16
        pbkdf2:
          iterations: 600000
          key_size: 32
          salt_size: 16
        sha256:
          salt_size: 16
      keys:
        - id: "default-key"
          certFile: "config/certs/signing.cert"
          keyFile: "config/certs/signing.key"
        # ECDSA signing key used by the OpenID4VP/OpenID4VCI engines (generated by the setup job).
        - id: "ecdsa-key"
          certFile: "config/certs/ecdsa-signing.cert"
          keyFile: "config/certs/ecdsa-signing.key"
    database:
      config:
        type: sqlite
        sqlite:
          path: "database/configdb.db"
          options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
          max_open_conns: 500
          max_idle_conns: 100
          conn_max_lifetime: 3600
      runtime_transient:
        type: sqlite
        sqlite:
          path: "database/runtime_transient.db"
          options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
          max_open_conns: 500
          max_idle_conns: 100
          conn_max_lifetime: 3600
      entity:
        type: sqlite
        sqlite:
          path: "database/entitydb.db"
          options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
          max_open_conns: 500
          max_idle_conns: 100
          conn_max_lifetime: 3600
      runtime_persistent:
        type: sqlite
        sqlite:
          path: "database/runtime_persistent.db"
          options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
          max_open_conns: 500
          max_idle_conns: 100
          conn_max_lifetime: 3600
    cache:
      disabled: false
      type: "inmemory"
      size: 1000
      ttl: 3600
      evictionPolicy: "LRU"
      cleanupInterval: 300
    jwt:
      issuer: "http://thunder.amp.localhost:8080"
      validityPeriod: 3600
      audience: "application"
      preferredKeyId: "default-key"
    oauth:
      refreshToken:
        renewOnGrant: false
        validityPeriod: 86400
      authorizationCode:
        validityPeriod: 600
      dcr:
        insecure: false
    consent:
      enabled: true
      baseUrl: "http://localhost:9090/api/v1"
      timeout: 5
      maxRetries: 3
      server:
        port: 9090
        hostname: "localhost"
      database:
        type: sqlite
        sqlitePath: "repository/database/consentdb.db"
        sqliteOptions: "_pragma=journal_mode(WAL)&_pragma=cache_size(-16000)"
    cors:
      allowedOrigins:
        - "http://localhost:3000"
        - "http://console.amp.localhost:8080"
  setup:
    enabled: true
    backoffLimit: 3
    ttlSecondsAfterFinished: 86400
    preserveJob: true
    debug: false
    # Thunder's own native admin user (created by its built-in bootstrap,
    # backend/cmd/server/bootstrap/01-default-resources.yaml, type "Person", fixed id
    # 01900000-0000-7000-8000-000000000030) is deliberately left at its default username
    # "admin" here — 67-amp-default-users.yaml below re-targets our own admin bootstrap
    # entry at this SAME fixed id instead of creating a separate user, merging the two
    # into a single account. That account already sits in Thunder's built-in
    # "Administrators" group (system permission), so it works for both the AMP console
    # and ThunderID's own native console without needing a second AMP-side role for it.
    #
    # Leave password empty for production: this chart's own admin-credentials.yaml
    # then generates a random 10-character value itself (reused across
    # reinstalls the same way Thunder's own admin-secret.yaml already does),
    # so there is no shipped default for anyone to leave unchanged. Set it
    # explicitly (the local dev, quick-start, and VM installers all set it to
    # a fixed value) only when a memorable password matters more than a
    # generated one — e.g. a machine only the operator can reach. Either way,
    # retrieve the real value in effect any time with:
    #   kubectl get secret amp-admin-credentials -n <thunder-namespace> -o jsonpath='{.data.password}' | base64 -d
    admin:
      username: "admin"
      password: ""
      passwordRef:
        name: "amp-admin-credentials"
        key: "password"
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  bootstrap:
    enabled: true
    # The observability data-read scopes, single-sourced: 59-am-mcp-client.yaml
    # subtracts this list from am-mcp's allowance and 73-am-obs-mcp-client.yaml
    # appends it to am-obs-mcp's OIDC scopes (both at template render time).
    # The same scopes also appear in ampScopes below as part of the full
    # catalog for the other interactive clients.
    observabilityScopes:
      - "amp:observability:trace-read"
      - "amp:observability:log-read"
      - "amp:observability:build-log-read"
      - "amp:observability:metric-read"
    # Full list of AMP OAuth2 scopes that interactive clients are allowed to request.
    # Thunder only grants scopes that appear in an app's registered scope list, so all
    # permission scopes must be declared here for role-based access to work.
    # Exception: am-mcp's allowance is this catalog MINUS observabilityScopes
    # (filtered in 59-am-mcp-client.yaml) — those scopes are owned exclusively
    # by the observer MCP client (amObsMcpClient below).
    ampScopes:
      - "openid"
      - "profile"
      - "email"
      - "amp:org:view"
      - "amp:org:modify-settings"
      - "amp:org:invite-member"
      - "amp:org:remove-member"
      - "amp:org:assign-role"
      - "amp:org:manage-idp"
      - "amp:org:manage-service-account"
      - "amp:project:create"
      - "amp:project:read"
      - "amp:project:update"
      - "amp:project:delete"
      - "amp:environment:create"
      - "amp:environment:read"
      - "amp:environment:update"
      - "amp:environment:delete"
      - "amp:gateway:create"
      - "amp:gateway:read"
      - "amp:gateway:update"
      - "amp:gateway:delete"
      - "amp:gateway:token-manage"
      - "amp:data-plane:read"
      - "amp:deployment-pipeline:create"
      - "amp:deployment-pipeline:read"
      - "amp:deployment-pipeline:update"
      - "amp:deployment-pipeline:delete"
      - "amp:git-secret:create"
      - "amp:git-secret:read"
      - "amp:git-secret:delete"
      - "amp:llm-provider-template:create"
      - "amp:llm-provider-template:read"
      - "amp:llm-provider-template:update"
      - "amp:llm-provider-template:delete"
      - "amp:llm-provider:create"
      - "amp:llm-provider:read"
      - "amp:llm-provider:update"
      - "amp:llm-provider:delete"
      - "amp:llm-provider:configure-guardrail"
      - "amp:llm-provider:connect"
      - "amp:llm-provider:deploy"
      - "amp:llm-provider:api-key-manage"
      - "amp:mcp-server:create"
      - "amp:mcp-server:read"
      - "amp:mcp-server:update"
      - "amp:mcp-server:delete"
      - "amp:mcp-server:configure-guardrail"
      - "amp:mcp-server:connect"
      - "amp:mcp-server:api-key-manage"
      - "amp:llm-proxy:create"
      - "amp:llm-proxy:read"
      - "amp:llm-proxy:update"
      - "amp:llm-proxy:delete"
      - "amp:llm-proxy:deploy"
      - "amp:llm-proxy:api-key-manage"
      - "amp:evaluator:create"
      - "amp:evaluator:read"
      - "amp:evaluator:update"
      - "amp:evaluator:delete"
      - "amp:agent:create"
      - "amp:agent:read"
      - "amp:agent:update"
      - "amp:agent:delete"
      - "amp:agent:build"
      - "amp:agent:env-non-production"
      - "amp:agent:env-production"
      - "amp:agent:rollback"
      - "amp:agent:suspend"
      - "amp:agent:token-manage"
      - "amp:agent:api-key-manage"
      - "amp:agent-kind:read"
      - "amp:agent-kind:create"
      - "amp:agent-kind:update"
      - "amp:agent-kind:delete"
      - "amp:monitor:create"
      - "amp:monitor:read"
      - "amp:monitor:update"
      - "amp:monitor:delete"
      - "amp:monitor:execute"
      - "amp:monitor:score-read"
      - "amp:monitor:score-publish"
      - "amp:observability:trace-read"
      - "amp:observability:log-read"
      - "amp:observability:build-log-read"
      - "amp:observability:metric-read"
      - "amp:role:create"
      - "amp:role:read"
      - "amp:role:update"
      - "amp:role:delete"
      - "amp:group:create"
      - "amp:group:read"
      - "amp:group:update"
      - "amp:group:delete"
      - "amp:catalog:read"
      - "amp:repository:read"
      - "amp:profile:read"
      - "amp:profile:update-attributes"
      - "amp:scope:create"
      - "amp:scope:read"
      - "amp:scope:update"
      - "amp:scope:delete"
      - "amp:agent-identity:read"
      - "amp:agent-identity:create"
      - "amp:agent-identity:update"
      - "amp:agent-identity:delete"
    configMap:
      name: amp-thunder-bootstrap
      files:
        - 50-amp-api-client.yaml
        - 51-amp-console-theme.yaml
        - 52-amp-console-layout.yaml
        - 53-amp-console-app.yaml
        - 54-workload-publisher-app.yaml
        - 55-observer-resource-reader-app.yaml
        - 56-amp-publisher-client.yaml
        - 57-amp-system-client.yaml
        - 58-amctl-client.yaml
        - 59-am-mcp-client.yaml
        - 60-amp-resource-server.yaml
        - 60-mcp-resource-servers.yaml
        - 61-amp-role-admin.yaml
        - 62-amp-role-developer.yaml
        - 63-amp-role-ai-lead.yaml
        - 64-amp-role-platform-engineer.yaml
        - 65-amp-group-admins.yaml
        - 66-amp-user-type-engineer.yaml
        - 67-amp-default-users.yaml
        - 68-amp-role-system-client-thunder-admin.yaml
        - 69-amp-default-resource-server-config.yaml
        - 70-fix-thunder-system-rs-identifier.yaml
        - 71-amp-cors-config.yaml
        - 72-am-observer-client.yaml
        - 73-am-obs-mcp-client.yaml
        - 73-amp-csp-config.yaml
    # Observer Resource Reader Client configuration (for observability plane to read resources)
    observerResourceReaderClient:
      clientId: "openchoreo-observer-resource-reader-client" # clusterauthzrolebinding is already created with this clientId by openchoreo, so it should not be changed unless the corresponding ClusterAuthzRoleBinding is also updated
      clientSecret: "openchoreo-observer-resource-reader-client-secret"
      name: "OpenChoreo Observer Resource Reader"
      description: "OpenChoreo Observer Resource Reader Client for reading resources from control plane"
      grantTypes:
        - "client_credentials"
      tokenEndpointAuthMethod: "client_secret_post"
      pkceRequired: false
      publicClient: false
      accessTokenValidityPeriod: 3600
    # Workload Publisher Client configuration (for CI workflows to create workloads)
    workloadPublisherClient:
      clientId: "openchoreo-workload-publisher-client" # clusterauthzrolebinding is already created with this clientId by openchoreo, so it should not be changed unless the corresponding ClusterAuthzRoleBinding is also updated
      clientSecret: "openchoreo-workload-publisher-secret"
      name: "Workload Publisher"
      description: "OpenChoreo Workload Publisher Client for creating workloads from CI workflows"
      grantTypes:
        - "client_credentials"
      tokenEndpointAuthMethod: "client_secret_post"
      pkceRequired: false
      publicClient: false
      accessTokenValidityPeriod: 3600
    # AMP API Client configuration
    ampApiClient:
      clientId: "amp-api-client"
      clientSecret: "amp-api-client-secret"
      name: "AMP API Client"
      description: "Client application for AMP API access"
      grantTypes:
        - "client_credentials"
      tokenEndpointAuthMethod: "client_secret_basic"
      pkceRequired: false
      publicClient: false
      accessTokenValidityPeriod: 3600
    # AMP System Client configuration (for agent-manager to provision per-org OAuth apps via Thunder admin API)
    # WARNING: clientSecret below is a LOCAL-DEVELOPMENT-ONLY placeholder.
    # In production, override ampSystemClient.clientSecret via a Kubernetes Secret
    # or external secret manager. Deploying with this default value is insecure.
    ampSystemClient:
      clientId: "amp-system-client"
      clientSecret: "amp-system-client-secret"
      name: "AMP System Client"
      description: "System client for agent-manager to provision per-org OAuth apps"
      grantTypes:
        - "client_credentials"
      tokenEndpointAuthMethod: "client_secret_basic"
      pkceRequired: false
      publicClient: false
      accessTokenValidityPeriod: 3600
    # AMP Publisher Client configuration (for evaluation job to publish scores)
    ampPublisherClient:
      clientId: "amp-publisher-client"
      clientSecret: "amp-publisher-client-secret"  # Override in production; must match the value stored in OpenBao at secret/amp-publisher-client-secret (used by ExternalSecret at workflow runtime)
      name: "AMP Publisher Client"
      description: "Client application for evaluation job to publish scores"
      grantTypes:
        - "client_credentials"
      tokenEndpointAuthMethod: "client_secret_basic"
      pkceRequired: false
      publicClient: false
      accessTokenValidityPeriod: 3600
    # AM Observer Client configuration (dedicated outbound identity for
    # agent-manager-observer's calls to the OpenChoreo observer backend).
    # Its authority comes from the OpenChoreo ClusterAuthzRoleBinding
    # (amp-observer-reader-binding in wso2-amp-platform-resources-extension),
    # NOT from AMP scopes — it has no scope allowance at all, so its tokens
    # fail agent-manager-service's scope checks by construction.
    # WARNING: clientSecret below is a LOCAL-DEVELOPMENT-ONLY placeholder.
    # In production, override amObserverClient.clientSecret via a Kubernetes
    # Secret or external secret manager. Deploying with this default value is
    # insecure.
    # NOTE: pre-install bootstrap job only — see the upgrade note on
    # mcpResourceServers below / docs/reference/mcp-server.mdx.
    amObserverClient:
      clientId: "am-observer-client"
      clientSecret: "am-observer-client-secret"
      name: "AM Observer Client"
      description: "Dedicated client for agent-manager-observer to read observability data from the OpenChoreo observer"
      grantTypes:
        - "client_credentials"
      tokenEndpointAuthMethod: "client_secret_basic"
      pkceRequired: false
      publicClient: false
      accessTokenValidityPeriod: 3600
    # AMP CLI Client configuration (public PKCE client for interactive login)
    amCliClient:
      clientId: "amctl"
      name: "AMCTL"
      description: "AMP CLI application for interactive user login"
      redirectUris:
        - "http://127.0.0.1:10325/callback"
      grantTypes:
        - "authorization_code"
        - "refresh_token"
      responseTypes:
        - "code"
      allowedUserTypes:
        - "engineer"
      tokenEndpointAuthMethod: "none"
      pkceRequired: true
      publicClient: true
      accessTokenValidityPeriod: 3600
      idTokenValidityPeriod: 3600
      refreshTokenValidityPeriod: 2592000
      userAttributes:
        - "given_name"
        - "family_name"
        - "email"
        - "username"
        - "groups"
        - "ouId"
        - "ouHandle"
    # AMP MCP Client configuration (public PKCE client for interactive login)
    amMcpClient:
      clientId: "am-mcp"
      name: "AMP MCP"
      description: "AMP MCP application for interactive user login"
      redirectUris:
        - "http://127.0.0.1:33418/callback"
        - "http://localhost:33418/callback"
      grantTypes:
        - "authorization_code"
        - "refresh_token"
      responseTypes:
        - "code"
      allowedUserTypes:
        - "engineer"
      tokenEndpointAuthMethod: "none"
      pkceRequired: true
      publicClient: true
      accessTokenValidityPeriod: 3600
      idTokenValidityPeriod: 3600
      refreshTokenValidityPeriod: 2592000
      userAttributes:
        - "given_name"
        - "family_name"
        - "email"
        - "username"
        - "groups"
        - "ouId"
        - "ouHandle"
    # AMP Observer MCP Client configuration (public PKCE client for the
    # observer MCP server's interactive login). Allowed ONLY the OIDC scopes
    # plus the four observability data-read scopes; the am-service MCP client
    # (amMcpClient above) is allowed the rest of the catalog.
    # NOTE: pre-install bootstrap job only — see the upgrade note on
    # mcpResourceServers below / docs/reference/mcp-server.mdx.
    amObsMcpClient:
      clientId: "am-obs-mcp"
      name: "AMP Observer MCP"
      description: "AMP Observer MCP application for interactive user login"
      redirectUris:
        - "http://127.0.0.1:33419/callback"
        - "http://localhost:33419/callback"
      grantTypes:
        - "authorization_code"
        - "refresh_token"
      responseTypes:
        - "code"
      allowedUserTypes:
        - "engineer"
      tokenEndpointAuthMethod: "none"
      pkceRequired: true
      publicClient: true
      accessTokenValidityPeriod: 3600
      idTokenValidityPeriod: 3600
      refreshTokenValidityPeriod: 2592000
      # OIDC scopes only — the four observability data-read scopes are
      # appended from observabilityScopes at template render time
      # (73-am-obs-mcp-client.yaml).
      scopes:
        - "openid"
        - "profile"
        - "email"
      userAttributes:
        - "given_name"
        - "family_name"
        - "email"
        - "username"
        - "groups"
        - "ouId"
        - "ouHandle"
    # RFC 8707 resource servers for the public MCP origins. The bootstrap
    # renders these as separate resource servers; urn:wso2:amp remains the
    # platform API resource identifier. baseUrlValue selects the deployment-
    # specific origin — one scalar per MCP endpoint, overridden to whatever
    # that install actually serves (docker-compose dev, k3d, a VM, or a real
    # domain); there is no separate "dev" scalar to keep in sync, the same way
    # observerMcpBaseUrl has never needed one.
    agentManagerMcpBaseUrl: "http://api.amp.localhost:8080"
    observerMcpBaseUrl: "http://traces.amp.localhost:11080"
    mcpResourceServers:
      - name: "AMP Agent Manager MCP"
        id: "amp-agent-manager-mcp-resource-server"
        handle: ""
        baseUrlValue: "agentManagerMcpBaseUrl"
        description: "Resource identifier for the agent-manager MCP endpoint"
        permissionSet: "amp-minus-observability"
      - name: "AMP Observer MCP"
        id: "amp-observer-mcp-resource-server"
        handle: ""
        baseUrlValue: "observerMcpBaseUrl"
        description: "Resource identifier for the observer MCP endpoint"
        permissionSet: "observability-only"
    # AMP Console Client configuration
    ampConsoleClient:
      clientId: "amp-console-client"
      clientSecret: "amp-console-client-secret"
      name: "AMP Console"
      description: "AMP Console Application"
      logoUrl: "https://wso2.cachefly.net/wso2/sites/all/image_resources/logos/WSO2-Pulse-Orange.webp"
      redirectUris:
        - "http://localhost:3000/login"
        - "http://console.amp.localhost:8080/login"
      grantTypes:
        - "authorization_code"
        - "refresh_token"
      responseTypes:
        - "code"
      allowedUserTypes:
        - "engineer"
      tokenEndpointAuthMethod: "none"
      pkceRequired: true
      publicClient: true
      accessTokenValidityPeriod: 3600
      idTokenValidityPeriod: 3600
      refreshTokenValidityPeriod: 2592000
      userAttributes:
        - "given_name"
        - "family_name"
        - "email"
        - "username"
        - "groups"
        - "ouId"
        - "ouHandle"

    # Agent Manager Console Theme (applied to amp-console-client sign-in page)
    ampConsoleTheme:
      handle: "wso2-agent-manager-console"
      displayName: "WSO2 Agent Manager Console Theme"
      theme:
        direction: "ltr"
        defaultColorScheme: "light"
        shape:
          borderRadius: 8
        typography:
          fontFamily: "Inter Variable, sans-serif"
          h1:
            fontSize: "1.75rem"
            fontWeight: 600
            lineHeight: 1.3
        colorSchemes:
          light:
            colors:
              primary:
                main: "#fa7b3f"
                dark: "#e74420"
                contrastText: "#ffffff"
              secondary:
                main: "#1a1a2e"
                dark: "#0d0d1a"
                contrastText: "#ffffff"
              background:
                default: "#f7f8fb"
                paper: "#ffffff"
              text:
                primary: "#000000"
                secondary: "#494848"
          dark:
            colors:
              primary:
                main: "#fa7b3f"
                dark: "#e74420"
                contrastText: "#ffffff"
              secondary:
                main: "#ff9966"
                dark: "#fa7b3f"
                contrastText: "#000000"
              background:
                default: "#121212"
                paper: "#1e1e1e"
              text:
                primary: "#ffffff"
                secondary: "#cccccc"
    # Agent Manager Console Layout (split-screen sign-in page for amp-console-client).
    ampConsoleLayout:
      id: "0e0dc039-bae9-4563-82b9-ee4e76f9a58c"
      handle: "wso2-agent-manager-console"
      displayName: "WSO2 Agent Manager Console Layout"
      layout:
        head:
          stylesheets:
            - id: "wso2-agent-manager-console-overrides"
              type: "inline"
              content: |
                body { background: #fafafa !important; min-height: 100vh !important; margin: 0 !important; }
                [data-color-scheme="dark"] body { background: #0b0b0f !important; }
                body { display: grid !important; grid-template-columns: 1fr !important; align-items: stretch !important; }
                body::before { display: none; }
                @media (min-width: 900px) {
                  body { grid-template-columns: minmax(380px, 1fr) minmax(420px, 1fr) !important; }
                  body::before { content: ""; display: block; background-color: #0a0a0e; background-image: radial-gradient(800px 400px at 0% 0%, rgba(250,123,63,0.18), transparent 60%), url("https://wso2.cachefly.net/wso2/sites/all/image_resources/wso2-agent-manager-auth-marketing-dark.svg"); background-position: top left, center center; background-repeat: no-repeat, no-repeat; background-size: auto, min(540px, calc(100% - 96px)) auto; }
                  [data-color-scheme="light"] body::before { background-color: #f3f4f6; background-image: radial-gradient(800px 400px at 0% 0%, rgba(250,123,63,0.10), transparent 60%), url("https://wso2.cachefly.net/wso2/sites/all/image_resources/wso2-agent-manager-auth-marketing-light.svg"); }
                }
                .MuiPaper-root { max-width: 420px !important; width: 100% !important; margin: auto !important; padding: 40px 36px !important; border-radius: 16px !important; background-color: #ffffff !important; box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 12px 40px rgba(15,23,42,0.08) !important; border: 1px solid rgba(15,23,42,0.06) !important; }
