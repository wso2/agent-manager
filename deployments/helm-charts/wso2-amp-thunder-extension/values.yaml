        screens:
          signin:
            title: "Sign In"
            layout: "split"
          signup:
            title: "Create your WSO2 Cloud account"
            layout: "split"
          common:
            layout: "split"
    # Default Organization unit configuration
    organizationUnit:
      name: "Default"
      handle: "default"
      description: "Default organizational unit"
    # User schema configuration
    userSchema:
      name: "engineer"
      allowSelfRegistration: true
    # Default users configuration
    defaultUsers:
      # No password here: for username "admin" specifically, 67-amp-default-users.yaml
      # never renders a credentials block (it merges into Thunder's own native admin
      # account, which already has one from thunder.setup.admin.passwordRef above) — a
      # value here would be silently unused, not a second copy of the real password.
      - username: "admin"
        givenName: "Admin"
        familyName: "User"
        groups: []
