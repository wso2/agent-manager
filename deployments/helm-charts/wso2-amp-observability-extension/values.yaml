global:
  imagePullSecrets: []
  ampImageRegistry: ""

# Agent Manager Observer Service config
amObserver:
  enabled: true
  developmentMode: false
  name: amp-observer
  replicaCount: 1
  image:
    repository: ghcr.io/wso2/amp-observer
    tag: "0.0.0-dev"
    pullPolicy: IfNotPresent
  port: 9098
  resourceLimits:
    memory: 256Mi
    cpu: 500m
  resourceRequests:
    memory: 128Mi
    cpu: 250m
  # Reachable externally via the shared AMP Gateway (see ocIngress);
  # set type to LoadBalancer to restore a dedicated external endpoint.
  service:
    type: ClusterIP
  # Exposes the Agent Manager Observer through the shared AMP Gateway
  # (deployments/k8s/amp-gateway.yaml) so it does not need its own
  # LoadBalancer service. The HTTPRoute lives in this release's namespace.
  ocIngress:
    enabled: true
    gatewayName: amp-gateway
    gatewayNamespace: amp-gateway
    hostname: traces.amp.localhost
    requestTimeout: 60s
  # Trace store the observer queries. The OpenTelemetry collector writes spans
  # to it (deployments/values/otel-collector.yaml).
  opensearch:
    address: "https://opensearch.amp-observability.svc.cluster.local:9200"
    # Index pattern the collector writes spans to.
    traceIndex: "otel-traces-*"
    # The local OpenSearch install serves self-signed demo certificates.
    tlsInsecureSkipVerify: true
    # Secret holding the OpenSearch credentials; created by the install
    # scripts (deployments/scripts/lib-observability.sh).
    existingSecret: "opensearch-admin-credentials"
    existingSecretUsernameKey: "username"
    existingSecretPasswordKey: "password"
  # JWT authentication — must match the agent-manager keyManager config so the
  # same user token issued by Thunder is accepted by both services. Thunder
  # stamps the resource-server identifier as the token audience, so query tokens
  # (console/CLI) carry aud=urn:wso2:amp — the amp resource server's identifier,
  # which must stay in sync with 60-amp-resource-server.yaml in the Thunder
  # extension chart. The agent-manager-service's own
  # amp-api-client client-credentials token (used for the monitor-run-logs
  # server-to-server call) requests the full amp:* scope set and resolves to the
  # same resource-server audience; "amp-api-client" is listed too as a
  # defensive fallback for any client-credentials request that carries no scope
  # (in which case Thunder falls back to the client ID as the audience).
  # Publisher tokens (aud amp-publisher-*) are matched by a separate regex in
  # the observer's auth middleware and do not need to be listed here.
  # MCP tokens minted for the observer MCP client (am-obs-mcp) carry the
  # RFC 8707 resource identifier — this service's publicUrl with "/mcp"
  # appended (no trailing slash, per the MCP spec's canonical-URI guidance) —
  # as their audience. That URL is NOT listed here: the chart appends
  # publicUrl+"/mcp" to this list automatically, so overriding publicUrl
  # alone keeps MCP tokens valid. "am-obs-mcp" is listed
  # defensively; MCP logins normally carry that resource URL as the
  # audience, not the client ID (unlike amp-api-client's client-credentials
  # fallback, this can't occur for am-obs-mcp, a public client restricted to
  # authorization_code).
  auth:
    isLocalDevEnv: false
    jwksUrl: "http://amp-thunder-extension-service.amp-thunder.svc.cluster.local:8090/oauth2/jwks"
    # MUST be the PUBLIC Thunder URL the platform issues tokens from (the `iss`
    # claim), not the in-cluster service URL used for jwksUrl above. The console
    # and amctl send the same user token here that they send to
    # agent-manager-service, so this has to match that chart's
    # agentManagerService.config.keyManager.issuer — otherwise every traces
    # request 401s with "invalid issuer".
    issuer: "http://thunder.amp.localhost:8080"
    audience: "urn:wso2:amp,amp-api-client,am-obs-mcp"
  # Externally reachable base URL of this service.
  # Used as the `resource` identifier in RFC 9728 protected resource metadata
  # and in the WWW-Authenticate resource_metadata parameter on 401 responses.
  # Routed through the AMP Gateway's 11080 listener (see ocIngress above).
  publicUrl: "http://traces.amp.localhost:11080"
  # OAuth 2.0 discovery metadata for MCP clients (RFC 9728). Consumed by the
  # /mcp route's protected-resource well-known endpoint.
  oauth:
    # Comma-separated list of OAuth 2.0 authorization server URLs advertised
    # in RFC 9728 protected resource metadata. Left empty on purpose: it
    # defaults to auth.issuer above, which is the same authorization server.
    # Only set it when the advertised URL must differ from the token issuer.
    # To suppress the metadata endpoint instead, empty publicUrl — the handler
    # checks that first, and an empty auth.issuer fails startup validation.
    authorizationServers: ""
    # Comma-separated list of OAuth 2.0 scopes supported by this resource,
    # advertised in RFC 9728 protected resource metadata.
    scopesSupported: "amp:observability:log-read,amp:observability:trace-read,amp:observability:metric-read,amp:observability:build-log-read"

# OpenTelemetry collector extras
otelCollector:
  # Collector container ports. Must match the receiver/extension endpoints in
  # deployments/values/otel-collector.yaml, which configures the separately
  # installed collector chart — update both if either changes.
  otlpHttpPort: 4318
  # Where the collector's Prometheus exporter serves the span counter.
  metricsPort: 8889
  healthCheckPort: 13133
  # Optional dedicated external Service for direct OTLP/HTTP pushes to the
  # collector. Disabled by default: shipped clients send traces through the
  # API Platform Gateway's /otel route.
  externalService:
    enabled: false
    type: LoadBalancer
    port: 21893
  # ServiceMonitor for the span counter. Needs the Prometheus Operator CRDs,
  # which the AMP install does not ship.
  # TODO(amp-lite): no metrics store is installed; enable once one is.
  serviceMonitor:
    enabled: false

networkPolicy:
  otelCollector:
    # No-op on clusters whose CNI doesn't enforce NetworkPolicy.
    enabled: true
