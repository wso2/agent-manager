{{- if .Values.networkPolicy.otelCollector.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-gateway-only
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              openchoreo.dev/system-component: gateway-runtime
      ports:
        - protocol: TCP
          port: {{ .Values.otelCollector.otlpHttpPort }}
    - ports:
        - protocol: TCP
          port: {{ .Values.otelCollector.healthCheckPort }}
    # Prometheus scrapes the span counter the count connector emits. Without
    # this the scrape is refused and the counter silently never reaches the
    # metrics store — the collector looks healthy, traces keep flowing, and the
    # only symptom is a meter that reads zero forever.
    #
    # Selected on the operator's own label rather than a release name, so it
    # holds whatever the Prometheus instance is called.
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: {{ .Values.otelCollector.metricsPort }}
{{- end }}
