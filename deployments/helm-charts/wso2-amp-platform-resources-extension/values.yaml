# Default values for wso2-amp-platform-resources
# This chart creates default OpenChoreo resources needed for the AI Agent Management Platform
# All those resources are created in default namespace

# Global configuration
global:
  # -- OAuth / IDP configuration for workload publishing
  oauth:
    # -- OAuth token endpoint URL
    tokenUrl: "http://host.k3d.internal:8080/oauth2/token"
    # -- Host header for OAuth requests
    hostHeader: "thunder.amp.localhost"
    # -- OAuth client ID for workload publisher
    clientId: "openchoreo-workload-publisher-client"

  # -- OpenChoreo API server configuration
  apiServer:
    # -- API server URL
    url: "http://host.k3d.internal:8080"
    # -- Host header for API server requests
    hostHeader: "api.openchoreo.localhost"

  # -- Common labels to add to every resource.
  commonLabels: {}
  # -- Base domain for external access (e.g., "openchoreo.example.com")
  # When set, registry will be accessible at registry.<baseDomain>
  baseDomain: ""
  # -- Container registry configuration
  registry:
    # -- Registry endpoint for pushing and pulling images
    # For local registry: "host.k3d.internal:10082"
    # For external registry with baseDomain: automatically uses "registry.<baseDomain>"
    endpoint: "host.k3d.internal:10082"

  # -- Default resources configuration
  defaultResources:
    # -- Namespace where default resources will be created
    namespace: default
    # -- Registry configuration for default resources
    registry:
      # -- Enable TLS verification for registry connections
      tlsVerify: false

    # -- Buildpack cache configuration
    buildpackCache:
      # @schema
      # type: boolean
      # description: Enable buildpack image caching. When enabled, images are pulled from cache registry instead of remote.
      # default: false
      # @schema
      enabled: false

      # @schema
      # type: array
      # description: List of buildpack images to cache. Each entry has an id for lookup, remoteImage for external registry, and cachedImage for local cache.
      # items:
      #   type: object
      #   additionalProperties: false
      #   required:
      #     - id
      #     - remoteImage
      #     - cachedImage
      #   properties:
      #     id:
      #       type: string
      #       description: Unique identifier for lookup in workflow templates
      #     remoteImage:
      #       type: string
      #       description: Image reference from remote registry (used when caching is disabled)
      #     cachedImage:
      #       type: string
      #       description: Image path in the local build plane registry (used when caching is enabled)
      # @schema
      images:
        - id: "lifecycle"
          remoteImage: "docker.io/buildpacksio/lifecycle:0.20.5"
          cachedImage: "buildpacks-cache/lifecycle:0.20.5"
        - id: "google-builder"
          remoteImage: "gcr.io/buildpacks/builder@sha256:5977b4bd47d3e9ff729eefe9eb99d321d4bba7aa3b14986323133f40b622aef1"
          cachedImage: "buildpacks-cache/google-builder:latest"
        - id: "google-run"
          remoteImage: "gcr.io/buildpacks/google-22/run:latest"
          cachedImage: "buildpacks-cache/google-run:latest"
        - id: "ballerina-builder"
          remoteImage: "ghcr.io/openchoreo/buildpack/ballerina:18"
          cachedImage: "buildpacks-cache/ballerina-builder:18"
        - id: "ballerina-run"
          remoteImage: "ghcr.io/openchoreo/buildpack/ballerina:18-run"
          cachedImage: "buildpacks-cache/ballerina-run:18"

# Kubectl image configuration for jobs
kubectl:
  image: bitnamilegacy/kubectl:1.32.4

# Build workflow pod hardening
buildWorkflows:
  # Run build pods inside a Linux user namespace (hostUsers: false) so the
  # build's root user is unprivileged on the node. This requires idmapped-mount
  # support for every filesystem the pod mounts (overlayfs AND tmpfs/projected
  # volumes) — in practice Linux kernel >= 6.3 (e.g. Ubuntu 24.04, Amazon Linux
  # 2023, recent COS). On older kernels (e.g. Ubuntu 22.04's 5.15, Amazon Linux
  # 2's 5.10) every build pod fails at sandbox creation with
  # "failed to set MOUNT_ATTR_IDMAP ... invalid argument" — set this to false
  # on such nodes to run builds without user namespaces.
  userNamespaces: true

# Environment configuration
environment:
  # Name of the default environment
  name: default
  # Display name for the environment
  displayName: "Default"
  # Description for the environment
  description: "Default environment for WSO2 AI Agent Management Platform"
  # Is this environment critical/production?
  isCritical: false
  # DNS Prefix for the gateway
  dnsPrefix: "default"
  # Gateway ingress details persisted on the default Environment CR. This mirrors
  # what add-environment.sh writes for other envs so every env CR carries its
  # gateway info explicitly. name/namespace MUST reference the real data-plane
  # Gateway so agent HTTPRoutes attach to it; OC builds agent route hostnames as
  # "<env>-<org>.<listener.host>".
  gateway:
    # Real data-plane Gateway the agent routes attach to (parentRef).
    name: gateway-default
    namespace: openchoreo-data-plane
    # http: agent-facing host (distinct from the gateway-runtime host gateway.localhost).
    http:
      host: am-gateway.localhost
      port: 19080
    # https: optional TLS-fronted variant. Unset by default (local/compose serves
    # agents over plain http, tlsEnabled=false). Set host/port on TLS deployments
    # (e.g. the VM installer) so the binding carries an https externalURL; otherwise
    # the tlsEnabled console reads a missing variant and the invoke URL is empty.
    https: {}
    #   host: am-gateway.localhost
    #   port: 443

# API Platform Gateway vhost used for externally reachable gateway URLs.
# Sandboxed platform agents use the per-environment gateway runtime's in-cluster
# Service for OTEL and managed LLM/MCP proxy traffic instead.
apiPlatformGatewayVhost:
  host: gateway.localhost
  port: 19080
  # Full override for the agent OTEL endpoint. When set, it replaces the
  # in-cluster runtime URL entirely — used on installs that front a single
  # public gateway host on :443 (e.g. a VM install), where the per-environment
  # Kubernetes Service does not apply. Empty = derive the in-cluster Service.
  otelEndpointOverride: ""

# Where the per-environment API Platform Gateway is installed. This must agree
# with apiGateway.namespace in wso2-amp-api-platform-gateway-extension, because
# the traits below address that release's gateway-runtime Service by DNS name.
apiPlatformGateway:
  # Empty = derive the per-org-env convention "<org>-<env>", which
  # setup-gateway.sh and add-environment.sh create by passing
  # --set apiGateway.namespace=<org>-<env>.
  #
  # Set this to a fixed namespace when the gateway extension is installed
  # somewhere else — notably openchoreo-data-plane, which is the gateway
  # chart's own default for apiGateway.namespace. Leaving it empty there
  # makes the traits build a name that does not resolve, and the failure is
  # silent: agents keep serving traffic while every span batch fails, and
  # agent invocation has no route to the gateway runtime.
  namespace: ""

# Deployment Pipeline configuration
deploymentPipeline:
  # Name of the default deployment pipeline
  name: default
  # Display name for the deployment pipeline
  displayName: "Default Deployment Pipeline"
  # Description for the deployment pipeline
  description: "Default deployment pipeline for WSO2 Agent Manager"
  # Promotion order for the deployment pipeline
  promotionOrder:
    - sourceEnvironmentRef:
        name: default
      targetEnvironmentRefs: []

# Project configuration
project:
  # Name of the default project
  name: default
  # Display name for the project
  displayName: "Default Project"
  # Description for the project
  description: "Default project for WSO2 Agent Manager"

# Namespace the platform resources below are created in. It must match the
# service's OPEN_CHOREO_DEFAULT_NAMESPACE, since that is the namespace the
# service creates projects in — and a namespaced ProjectType is only resolvable
# from within its own namespace.
openchoreoNamespace: default

# ProjectType referenced by the default Project.
# OpenChoreo 1.2.0+ makes Project.spec.type a required reference to a
# (Cluster)ProjectType, which provides the per-environment resource template
# (here, the cell namespace). A namespaced ProjectType is used rather than a
# cluster-scoped ClusterProjectType so the type is not shared across tenants.
#
# The name is deliberately not configurable: it is a contract with the service,
# which references client.DefaultProjectTypeName. If the two diverged, every
# project created through the API would fail to reconcile with
# ProjectTypeNotFound.
projectType:
  # Display name for the project type
  displayName: "Default Project Type"
  # Description for the project type
  description: "Minimal project type that provisions only the cell namespace per environment."

# External Secrets configuration
externalSecrets:
  # Name of the ClusterSecretStore (uses the default OpenBao ClusterSecretStore)
  clusterSecretStoreName: default

# Authorization configuration for OpenChoreo
authz:
  # AMP API Client authorization binding
  ampApiClient:
    # Client ID used by agent-manager-service (must match Thunder OAuth client_id)
    clientId: amp-api-client
    # Role to assign (admin grants full access to OpenChoreo APIs)
    role: admin
  # AM Observer Client authorization binding
  amObserverClient:
    # Client ID used by agent-manager-observer's outbound calls to the
    # OpenChoreo observer (must match Thunder OAuth client_id seeded by
    # wso2-amp-thunder-extension's amObserverClient)
    clientId: am-observer-client
    # Minimal read-only role for observability data (traces/logs/metrics)
    role: amp-observer-reader

# Gateway TLS certificate configuration
gatewayTls:
  # Enable gateway TLS certificate creation
  enabled: true
  # Certificate name
  certificateName: gateway-tls
  # Secret name where the certificate will be stored
  secretName: gateway-tls
  # Namespace where the certificate and secret will be created
  namespace: openchoreo-data-plane
  # Certificate duration (default: 2160h = 90 days)
  duration: 2160h
  # Certificate renewal time (default: 720h = 30 days before expiry)
  renewBefore: 720h
  # Common name for the certificate
  commonName: "*.agentmanager.localhost"
  # DNS names for the certificate
  dnsNames:
    - "*.agentmanager.localhost"
    - "agentmanager.localhost"
    # Per-environment agent gateway host advertised on Environment CRs by
    # add-environment.sh (ENV_INGRESS_HOST=am-gateway.localhost). Agent routes
    # land on "<env>-<org>.am-gateway.localhost", so HTTPS needs this SAN.
    - "*.am-gateway.localhost"
    - "am-gateway.localhost"
  # Issuer reference for cert-manager
  issuerRef:
    # Name of the issuer (created by openchoreo-data-plane chart)
    name: openchoreo-data-plane-selfsigned-issuer
    # Issuer kind: Issuer or ClusterIssuer
    kind: Issuer
