apiVersion: openchoreo.dev/v1alpha1
kind: Trait
metadata:
  name: instrumentation-trait-env-injection
  namespace: {{ .Values.global.defaultResources.namespace }}
  annotations:
    openchoreo.dev/description: "Trait to inject OpenTelemetry and agent API key environment variables into containers"
spec:
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        agentApiKeySecretRef:
          type: string
          description: "Remote-store reference (ExternalSecret remoteRef key) of the agent API key, set only for agents created before the key moved to the agent's AMP_AGENT_API_KEY env var. When empty, the trait does not deliver the key itself."
        agentApiKeySecretProperty:
          type: string
          description: "Optional property within the remote secret that holds the agent API key (ExternalSecret remoteRef property)."
        envInjectionEnabled:
          type: boolean
          default: true
          description: "Enable or disable env injection instrumentation"
        otelEndpointEnvName:
          type: string
          default: "AMP_OTEL_ENDPOINT"
          description: "Name of the environment variable to inject the OTEL endpoint into. Override per language (e.g. Ballerina uses BAL_CONFIG_VAR_BALLERINAX_AMP_OTELENDPOINT)."
        apiKeyEnvName:
          type: string
          default: "AMP_AGENT_API_KEY"
          description: "Name of the environment variable to inject the agent API key into. Override per language (e.g. Ballerina uses BAL_CONFIG_VAR_BALLERINAX_AMP_APIKEY)."

  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        envInjectionEnabled:
          type: boolean
          description: "Enable or disable env injection instrumentation for this environment"
        agentApiKeySecretRef:
          type: string
          description: "Environment-specific remote-store reference of the agent API key (ExternalSecret remoteRef key). An empty value means this environment's key comes from the agent's AMP_AGENT_API_KEY env var, even when parameters.agentApiKeySecretRef is set."
        agentApiKeySecretProperty:
          type: string
          description: "Environment-specific property within the remote secret that holds the agent API key (ExternalSecret remoteRef property)."

  # The agent API key reaches the pod as the AMP_AGENT_API_KEY env var, which the agent
  # manager sets on the workload as a reference to the key's SecretReference, by name.
  # Agents created before that still carry the key's KV path (agentApiKeySecretRef); for
  # them this ExternalSecret fetches it and the legacy patch below injects it. The raw key
  # is never persisted in the control plane either way.
  creates:
    - includeWhen: '${(has(environmentConfigs.agentApiKeySecretRef) ? environmentConfigs.agentApiKeySecretRef : (has(parameters.agentApiKeySecretRef) ? parameters.agentApiKeySecretRef : "")) != ""}'
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${metadata.name}-agent-api-key
          namespace: ${metadata.namespace}
        spec:
          refreshInterval: 15s
          secretStoreRef:
            name: {{ .Values.externalSecrets.clusterSecretStoreName }}
            kind: ClusterSecretStore
          target:
            name: ${metadata.name}-agent-api-key
            creationPolicy: Owner
          data:
            - secretKey: api-key
              remoteRef:
                key: |-
                  ${has(environmentConfigs.agentApiKeySecretRef) ? environmentConfigs.agentApiKeySecretRef : parameters.agentApiKeySecretRef}
                property: |-
                  ${has(environmentConfigs.agentApiKeySecretProperty) ? environmentConfigs.agentApiKeySecretProperty : (has(parameters.agentApiKeySecretProperty) ? parameters.agentApiKeySecretProperty : oc_omit())}

  # Patches to inject AMP_OTEL_ENDPOINT and, under apiKeyEnvName, the agent API key.
  # This is the sole injector of AMP_OTEL_ENDPOINT across all agent types.
  # Gated by envInjectionEnabled (per-environment overridable) the same way the
  # OTEL instrumentation traits gate on instrumentationEnabled: when false the
  # 'where' clause filters out the target so no env vars are injected. The
  # parameter defaults to true, so agent types that never set it (Python, Docker)
  # are unaffected.
  patches:
    - target:
        kind: SandboxTemplate
        group: extensions.agents.x-k8s.io
        version: v1alpha1
        where: |
          ${has(environmentConfigs.envInjectionEnabled) ? environmentConfigs.envInjectionEnabled : parameters.envInjectionEnabled}
      operations:
        - op: add
          path: /spec/podTemplate/spec/containers/0/env/-
          value:
            name: ${parameters.otelEndpointEnvName}
            # In-cluster gateway runtime Service (per-org-env namespace): the
            # sandboxed agent reaches the runtime directly at
            # "api-platform-<org>-<env>-gw-gateway-gateway-runtime.<org>-<env>:22893/otel".
            # Derived from the apiGatewayName convention ("api-platform-<org>-<env>")
            # + the per-env gateway namespace ("<org>-<env>"), matching the
            # API-management trait's runtime backend. This in-cluster path is what
            # the sandbox NetworkPolicy egress allows (namespace label
            # amp.wso2.com/api-platform-gateway=true, port 22893) and avoids the
            # host-hairpin vhost, which a sandboxed pod cannot reach.
            #
            # otelEndpointOverride replaces the whole URL when set (e.g. a VM
            # install fronts a single public gateway host on :443, where the
            # per-env in-cluster Service does not apply). Leave empty for the
            # default in-cluster runtime endpoint.
            value: {{ if .Values.apiPlatformGatewayVhost.otelEndpointOverride }}{{ .Values.apiPlatformGatewayVhost.otelEndpointOverride | quote }}{{ else }}"http://{{ include "amp.gatewayRuntimeHost" . }}:22893/otel"{{ end }}
    # Legacy agents: inject the key from the ExternalSecret above.
    - target:
        kind: SandboxTemplate
        group: extensions.agents.x-k8s.io
        version: v1alpha1
        where: |
          ${(has(environmentConfigs.envInjectionEnabled) ? environmentConfigs.envInjectionEnabled : parameters.envInjectionEnabled) && (has(environmentConfigs.agentApiKeySecretRef) ? environmentConfigs.agentApiKeySecretRef : (has(parameters.agentApiKeySecretRef) ? parameters.agentApiKeySecretRef : "")) != ""}
      operations:
        - op: add
          path: /spec/podTemplate/spec/containers/0/env/-
          value:
            name: ${parameters.apiKeyEnvName}
            valueFrom:
              secretKeyRef:
                name: ${metadata.name}-agent-api-key
                key: api-key
    # Agents whose key is the AMP_AGENT_API_KEY env var but that read it under another
    # name (Ballerina): copy it there. Kubernetes expands $(AMP_AGENT_API_KEY) from the
    # container's envFrom, where the workload's secret env vars land.
    - target:
        kind: SandboxTemplate
        group: extensions.agents.x-k8s.io
        version: v1alpha1
        where: |
          ${(has(environmentConfigs.envInjectionEnabled) ? environmentConfigs.envInjectionEnabled : parameters.envInjectionEnabled) && (has(environmentConfigs.agentApiKeySecretRef) ? environmentConfigs.agentApiKeySecretRef : (has(parameters.agentApiKeySecretRef) ? parameters.agentApiKeySecretRef : "")) == "" && parameters.apiKeyEnvName != "AMP_AGENT_API_KEY"}
      operations:
        - op: add
          path: /spec/podTemplate/spec/containers/0/env/-
          value:
            name: ${parameters.apiKeyEnvName}
            value: "$(AMP_AGENT_API_KEY)"
