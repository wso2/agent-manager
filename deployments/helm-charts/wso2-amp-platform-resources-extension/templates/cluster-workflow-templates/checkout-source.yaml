apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: checkout-source
spec:
  templates:
    - name: checkout
      outputs:
        parameters:
          - name: git-revision
            valueFrom:
              path: /tmp/git-revision.txt
      volumes:
        - name: git-secret
          secret:
            secretName: '{{ "{{" }}workflow.parameters.git-secret{{ "}}" }}'
            optional: true
      container:
        image: alpine/git
        command:
          - sh
          - -c
        # Workflow parameters are passed as environment variables and never
        # interpolated into the script body below. Argo substitution is purely
        # textual, so a parameter spliced into the script would be parsed by this
        # shell -- quoting the interpolation is not enough, because the value can
        # contain the quote character itself.
        env:
          - name: BRANCH
            value: '{{ "{{" }}workflow.parameters.branch{{ "}}" }}'
          - name: REPO
            value: '{{ "{{" }}workflow.parameters.git-repo{{ "}}" }}'
          - name: COMMIT
            value: '{{ "{{" }}workflow.parameters.commit{{ "}}" }}'
        args:
          - |-
            set -e

            GIT_SECRET_PATH="/etc/secrets/git-secret"

            # A leading dash would be read by git as an option rather than a ref,
            # so reject it before either value reaches a git argv.
            for revision in "$BRANCH" "$COMMIT"; do
                case "$revision" in
                    -*)
                        echo "Invalid git revision '$revision': must not start with '-'"
                        exit 1
                        ;;
                esac
            done

            credential_helper=
            if [ -d "$GIT_SECRET_PATH" ] && [ "$(ls -A "$GIT_SECRET_PATH")" ]; then
                if [ -f "$GIT_SECRET_PATH/password" ]; then
                    case "$REPO" in
                        https://*)
                            echo "Using basic authentication (username/password)"
                            REPO_AUTHORITY=${REPO#https://}
                            REPO_AUTHORITY=${REPO_AUTHORITY%%/*}
                            export GIT_CHECKOUT_HOST="${REPO_AUTHORITY##*@}" GIT_SECRET_PATH

                            helper_dir=$(mktemp -d /tmp/checkout-git.XXXXXX)
                            trap 'rm -rf "$helper_dir"' EXIT
                            credential_helper="$helper_dir/credentials"
                            cat > "$credential_helper" <<'GIT_HELPER'
            #!/bin/sh
            set -e
            [ "$1" = get ] || exit 0

            protocol=
            host=
            username=
            while IFS= read -r field && [ -n "$field" ]; do
                case "$field" in
                    protocol=*) protocol=${field#protocol=} ;;
                    host=*) host=${field#host=} ;;
                    username=*) username=${field#username=} ;;
                esac
            done
            [ "$protocol" = https ] && [ "$host" = "$GIT_CHECKOUT_HOST" ] || exit 0

            if [ -z "$username" ]; then
                username=git
                if [ -f "$GIT_SECRET_PATH/username" ]; then
                    username=$(cat "$GIT_SECRET_PATH/username")
                fi
            fi
            password=$(cat "$GIT_SECRET_PATH/password")

            cr=$(printf '\r')
            newline='
            '
            case "$username$password" in
                *"$cr"*|*"$newline"*) exit 1 ;;
            esac
            printf 'username=%s\npassword=%s\n' "$username" "$password"
            GIT_HELPER
                            chmod 700 "$credential_helper"
                            ;;
                        *)
                            echo "Warning: REPO is not an HTTPS URL, basic auth may not work"
                            ;;
                    esac
                else
                    echo "Warning: Git secret exists but no recognized credentials found"
                fi
            else
                echo "No git secret found, assuming public repository"
            fi

            checkout_git() {
                if [ -n "$credential_helper" ]; then
                    git -c credential.helper= -c "credential.helper=$credential_helper" "$@"
                else
                    git "$@"
                fi
            }

            if [ -n "$COMMIT" ]; then
                echo "Cloning specific commit: $COMMIT"
                checkout_git clone --no-checkout --depth 1 -- "$REPO" /mnt/vol/source
                cd /mnt/vol/source
                git config --global advice.detachedHead false
                checkout_git fetch --depth 1 origin "$COMMIT"
                # FETCH_HEAD is what the fetch above just resolved, so the commit
                # never has to be passed to checkout as a ref argument.
                git checkout FETCH_HEAD
                echo -n "$COMMIT" | cut -c1-8 > /tmp/git-revision.txt
            else
                echo "Cloning branch: $BRANCH with latest commit"
                checkout_git clone --single-branch --branch "$BRANCH" --depth 1 -- "$REPO" /mnt/vol/source
                cd /mnt/vol/source
                COMMIT_SHA=$(git rev-parse HEAD)
                echo -n "$COMMIT_SHA" | cut -c1-8 > /tmp/git-revision.txt
            fi

            # Drop git metadata before the build step mounts the workspace: keeps
            # any credential state out of the build context and out of "COPY . ."
            # images. Nothing downstream needs it (revision is a workflow output).
            rm -rf /mnt/vol/source/.git

            echo "Repository cloned successfully"
        volumeMounts:
          - mountPath: /mnt/vol
            name: workspace
          - mountPath: /etc/secrets/git-secret
            name: git-secret
            readOnly: true
