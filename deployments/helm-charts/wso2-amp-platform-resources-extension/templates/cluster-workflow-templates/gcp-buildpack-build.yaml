apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: gcp-buildpacks-build
spec:
  templates:
    - name: build-image
      metadata:
        labels:
{{- include "amp.buildWorkflowPodLabels" . | nindent 10 }}
      # User-namespaced builds need idmapped-mount kernel support (~6.3+);
      # buildWorkflows.userNamespaces in values.yaml documents the trade-off.
      podSpecPatch: '{{ if .Values.buildWorkflows.userNamespaces }}{"hostUsers": false}{{ else }}{}{{ end }}'
      inputs:
        parameters:
          - name: git-revision
          - name: build-env
      volumes:
        - name: storage
          emptyDir:
            sizeLimit: 10Gi
      container:
        image: ghcr.io/openchoreo/podman-runner:v1.2
        command:
          - sh
          - -c
        # Workflow parameters arrive as environment variables rather than being
        # interpolated into the script body: Argo substitution is textual, so a
        # spliced parameter would be parsed as shell by the interpreter below.
        env:
          - name: IMAGE_NAME
            value: '{{ "{{" }}workflow.parameters.image-name{{ "}}" }}'
          - name: IMAGE_TAG
            value: '{{ "{{" }}workflow.parameters.image-tag{{ "}}" }}'
          - name: GIT_REVISION
            value: '{{ "{{" }}inputs.parameters.git-revision{{ "}}" }}'
          - name: APP_PATH
            value: '{{ "{{" }}workflow.parameters.app-path{{ "}}" }}'
          - name: BUILD_ENV_JSON
            value: '{{ "{{" }}inputs.parameters.build-env{{ "}}" }}'
        args:
          - |-
            set -e

            WORKDIR=/mnt/vol/source

            IMAGE="${IMAGE_NAME}:${IMAGE_TAG}-${GIT_REVISION}"

            echo ">> Image: $IMAGE"
            echo ">> App path: $APP_PATH"

            if [ ! -d "$WORKDIR/$APP_PATH" ]; then
              echo ">> Error: The specified application path '$APP_PATH' does not exist in the repository"
              echo ">> Hint: Verify that the application path points to a valid directory in your repository."
              echo ">> Repository contents:"
              ls -la "$WORKDIR/"
              exit 1
            fi

            mkdir -p /etc/containers /storage/run /storage/graph
            cat > /etc/containers/storage.conf <<EOF
            [storage]
            driver = "overlay"
            runroot = "/storage/run"
            graphroot = "/storage/graph"
            [storage.options.overlay]
            EOF

            cat > /etc/containers/containers.conf <<CEOF
            [containers]
            netns="host"
            userns="host"
            ipcns="host"
            utsns="host"
            cgroupns="host"
            cgroups="disabled"
            log_driver = "k8s-file"
            [engine]
            cgroup_manager = "cgroupfs"
            events_logger="file"
            runtime="crun"
            CEOF

            echo ">> Initializing build environment"
            mkdir -p /run/podman
            podman system service --time=0 unix:///run/podman/podman.sock &
            until podman info --format '{{ "{{" }}.Host.RemoteSocket.Exists{{ "}}" }}' 2>/dev/null | grep -q true; do sleep 1; done
            export DOCKER_HOST=unix:///run/podman/podman.sock


            BUILDER="{{ include "openchoreo-workflow-plane.buildpackImage" (dict "id" "google-builder" "context" .) }}"
            RUN_IMG="{{ include "openchoreo-workflow-plane.buildpackImage" (dict "id" "google-run" "context" .) }}"

            # Build pack command using positional parameters ($1, $2, $3, ...).
            # "set --" assigns args to $@. Each arg stays separate, preserving spaces in values.
            # "$@" then executes the command with each parameter as a distinct argument.
            # This avoids eval and prevents shell injection.
            set -- pack build "$IMAGE" \
              --builder "$BUILDER" \
              --run-image "$RUN_IMG" \
              --docker-host inherit \
              --network host \
              --path "$WORKDIR/$APP_PATH" \
              --pull-policy always

            # Add --env flags from the buildEnv JSON array (e.g. [{"name":"GOOGLE_RUNTIME_VERSION","value":"21"}])
            # Each "set -- "$@" --env "$env_kv"" appends --env and KEY=VALUE as separate args
            if [ -n "$BUILD_ENV_JSON" ] && [ "$BUILD_ENV_JSON" != "[]" ]; then
              echo "$BUILD_ENV_JSON" | podman run --rm -i ghcr.io/jqlang/jq:1.7.1 -r '.[] | "\(.name)=\(.value)"' > /tmp/env_vars.txt
              while IFS= read -r env_kv; do
                set -- "$@" --env "$env_kv"
              done < /tmp/env_vars.txt
              rm -f /tmp/env_vars.txt
            fi

            # Execute the pack command with all arguments
            "$@"

            echo ">> Verifying image security requirements..."
            IMAGE_USER=$(podman inspect "$IMAGE" --format '{{ "{{" }}.Config.User{{ "}}" }}')

            # Extract user part (before colon if present, e.g., "0:0" -> "0", "root:docker" -> "root")
            USER_PART="${IMAGE_USER%%:*}"

            if [ -z "$IMAGE_USER" ] || [ "$USER_PART" = "0" ] || [ "$USER_PART" = "root" ]; then
              echo ""
              echo "============================================================"
              echo "ERROR: Image must run as non-root user"
              echo "============================================================"
              echo ""
              echo "The built image does not specify a non-root USER."
              echo "Agent images are required to run as non-root for security."
              echo ""
              echo "============================================================"
              exit 1
            fi
            echo ">> Image user verified: $IMAGE_USER (non-root)"

            podman save -o /mnt/vol/app-image.tar "$IMAGE"
        securityContext:
          privileged: true
        volumeMounts:
          - mountPath: /mnt/vol
            name: workspace
          - mountPath: /storage
            name: storage
