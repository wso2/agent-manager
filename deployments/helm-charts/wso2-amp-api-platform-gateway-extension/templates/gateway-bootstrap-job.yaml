{{- if .Values.bootstrap.enabled }}
---
# ServiceAccount for the bootstrap job — created in the target gateway namespace
# so the Role/RoleBinding grant access to the Secret in the same namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wso2-amp-gateway-extension.bootstrapName" . }}-sa
  namespace: {{ .Values.apiGateway.namespace }}
  labels:
    {{- include "wso2-amp-gateway-extension.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
---
# Role scoped to the target gateway namespace — only allows access to the specific token secret
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "wso2-amp-gateway-extension.bootstrapName" . }}-role
  namespace: {{ .Values.apiGateway.namespace }}
  labels:
    {{- include "wso2-amp-gateway-extension.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # create cannot be scoped by resourceNames (the object has no name yet at creation time)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # get/update/patch are scoped to only the specific token secret
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
    resourceNames: [{{ include "wso2-amp-gateway-extension.tokenSecretName" . | quote }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "wso2-amp-gateway-extension.bootstrapName" . }}-rolebinding
  namespace: {{ .Values.apiGateway.namespace }}
  labels:
    {{- include "wso2-amp-gateway-extension.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ include "wso2-amp-gateway-extension.bootstrapName" . }}-sa
    namespace: {{ .Values.apiGateway.namespace }}
roleRef:
  kind: Role
  name: {{ include "wso2-amp-gateway-extension.bootstrapName" . }}-role
  apiGroup: rbac.authorization.k8s.io
---
# Bootstrap Job:
#   1. Waits for Agent Manager API to be healthy
#   2. Gets a JWT from Thunder IDP using amp-api-client credentials
#   3. Registers the Gateway in Agent Manager and maps it to its environment (idempotent)
#   4. Generates a registration token (skipped on upgrades if Secret already exists)
#   5. Writes the token to a Secret in apiGateway.namespace so the gateway-operator
#      can reference it via the APIGateway CR spec.controlPlane.tokenSecretRef
#
# Pre-install hook: creates the token Secret BEFORE the APIGateway CR so the
# gateway-controller pod can mount it immediately when the operator deploys it.
# Hook weight 10 runs after other pre-install hooks in this chart (SA, Role, RoleBinding).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "wso2-amp-gateway-extension.bootstrapName" . }}
  namespace: {{ .Values.apiGateway.namespace }}
  labels:
    {{- include "wso2-amp-gateway-extension.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.bootstrap.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.bootstrap.ttlSecondsAfterFinished }}
  template:
    metadata:
      name: {{ include "wso2-amp-gateway-extension.bootstrapName" . }}
      labels:
        {{- include "wso2-amp-gateway-extension.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway-bootstrap
    spec:
      serviceAccountName: {{ include "wso2-amp-gateway-extension.bootstrapName" . }}-sa
      restartPolicy: Never
      {{- with .Values.bootstrap.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway-bootstrap
          image: {{ .Values.kubectl.image }}
          imagePullPolicy: IfNotPresent
          {{- with .Values.bootstrap.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: AMP_API_URL
              value: {{ .Values.agentManager.apiUrl | quote }}
            - name: IDP_TOKEN_URL
              value: {{ .Values.agentManager.idp.tokenUrl | quote }}
            {{- include "wso2-amp-gateway-extension.idpClientIdEnv" . | nindent 12 }}
            {{- include "wso2-amp-gateway-extension.idpClientSecretEnv" . | nindent 12 }}
            - name: ORG_NAME
              value: {{ .Values.agentManager.orgName | quote }}
            - name: GATEWAY_NAME
              value: {{ include "wso2-amp-gateway-extension.apiGatewayName" . | quote }}
            - name: GATEWAY_DISPLAY_NAME
              value: {{ .Values.gateway.displayName | quote }}
            - name: GATEWAY_VHOST
              value: {{ .Values.gateway.vhost | quote }}
            - name: GATEWAY_RUNTIME_URL
              value: {{ include "wso2-amp-gateway-extension.runtimeUrl" . | quote }}
            - name: GATEWAY_TYPE
              value: {{ .Values.gateway.type | quote }}
            - name: ENVIRONMENT_NAME
              value: {{ .Values.gateway.environment | quote }}
            # The same Job runs for install, upgrade and rollback; only an install
            # maps a reused gateway to its environment (ensure_environment_mapping).
            - name: RELEASE_IS_INSTALL
              value: {{ .Release.IsInstall | quote }}
            - name: TOKEN_SECRET_NAME
              value: {{ include "wso2-amp-gateway-extension.tokenSecretName" . | quote }}
            - name: TOKEN_SECRET_KEY
              value: {{ .Values.gateway.tokenSecret.key | quote }}
            # Write the Secret to the gateway namespace so the gateway-operator can find it
            - name: TOKEN_SECRET_NAMESPACE
              value: {{ .Values.apiGateway.namespace | quote }}
          {{- with .Values.bootstrap.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              log_info()  { echo "[INFO]  $*"; }
              log_error() { echo "[ERROR] $*" >&2; }

              # http_get URL [auth-token] — prints body; exits 1 with error log on non-2xx
              http_get() {
                _url="$1"; _auth="${2:-}"
                _tmpfile=$(mktemp)
                if [ -n "$_auth" ]; then
                  _status=$(curl -s --max-time 30 --retry 3 --retry-delay 5 \
                    -H "Authorization: Bearer ${_auth}" \
                    -o "$_tmpfile" -w "%{http_code}" "$_url")
                else
                  _status=$(curl -s --max-time 30 --retry 3 --retry-delay 5 \
                    -o "$_tmpfile" -w "%{http_code}" "$_url")
                fi
                _body=$(cat "$_tmpfile"); rm -f "$_tmpfile"
                case "$_status" in
                  2*) echo "$_body" ;;
                  *)  log_error "GET ${_url} failed with HTTP ${_status}: ${_body}"; return 1 ;;
                esac
              }

              # http_post URL content-type body [authorization] — prints body; exits 1 with error log on non-2xx
              http_post() {
                _url="$1"; _ct="$2"; _body="$3"; _auth="${4:-}"
                _tmpfile=$(mktemp)
                if [ -n "$_auth" ]; then
                  _status=$(curl -s --max-time 30 --retry 3 --retry-delay 5 \
                    -X POST -H "Content-Type: ${_ct}" \
                    -H "Authorization: ${_auth}" \
                    -d "$_body" \
                    -o "$_tmpfile" -w "%{http_code}" "$_url")
                else
                  _status=$(curl -s --max-time 30 --retry 3 --retry-delay 5 \
                    -X POST -H "Content-Type: ${_ct}" \
                    -d "$_body" \
                    -o "$_tmpfile" -w "%{http_code}" "$_url")
                fi
                _body=$(cat "$_tmpfile"); rm -f "$_tmpfile"
                case "$_status" in
                  2*) echo "$_body" ;;
                  *)  log_error "POST ${_url} failed with HTTP ${_status}: ${_body}"; return 1 ;;
                esac
              }

              # http_put URL content-type body authorization — prints body; exits 1 with error log on non-2xx
              http_put() {
                _url="$1"; _ct="$2"; _body="$3"; _auth="${4:-}"
                _tmpfile=$(mktemp)
                _status=$(curl -s --max-time 30 --retry 3 --retry-delay 5 \
                  -X PUT -H "Content-Type: ${_ct}" \
                  -H "Authorization: ${_auth}" \
                  -d "$_body" \
                  -o "$_tmpfile" -w "%{http_code}" "$_url")
                _body=$(cat "$_tmpfile"); rm -f "$_tmpfile"
                case "$_status" in
                  2*) echo "$_body" ;;
                  *)  log_error "PUT ${_url} failed with HTTP ${_status}: ${_body}"; return 1 ;;
                esac
              }

              # seed_identity_provider name issuer jwksUri skipTlsVerify — mirrors a
              # gateway keymanager into the AMS identity-provider table (idempotent
              # upsert). Non-fatal: a failure logs and continues so a transient sync
              # issue does not block gateway bootstrap. type=system is derived by the
              # API from the well-known provider name.
              seed_identity_provider() {
                _ip_name="$1"; _ip_issuer="$2"; _ip_jwks="$3"; _ip_skip="$4"
                log_info "Seeding identity provider '${_ip_name}'..."
                if http_put \
                    "${AMP_API_URL}/orgs/${ORG_NAME}/gateways/${GATEWAY_ID}/identity-providers/${_ip_name}" \
                    "application/json" \
                    '{"issuer":"'"${_ip_issuer}"'","jwksUri":"'"${_ip_jwks}"'","skipTlsVerify":'"${_ip_skip}"'}' \
                    "Bearer ${ACCESS_TOKEN}" >/dev/null; then
                  log_info "Identity provider '${_ip_name}' seeded."
                else
                  log_error "Failed to seed identity provider '${_ip_name}' (continuing)."
                fi
              }

              # sync_runtime_url wanted registered — PUTs the in-cluster runtime address when
              # it differs from what AMS holds. Unlike the role, the address is mutable: it is
              # a fact about placement, so a stale one is simply wrong. Non-fatal like
              # seed_identity_provider — http_put returns 1 on non-2xx and set -eu would
              # otherwise abort this pre-upgrade hook, killing the runtime image bump that
              # was the point of the upgrade.
              sync_runtime_url() {
                # _ru_ prefix: POSIX sh has no portable `local`, so these leak as globals.
                _ru_want="$1"; _ru_have="$2"
                if [ -z "${_ru_want}" ] || [ "${_ru_want}" = "${_ru_have}" ]; then
                  return 0
                fi
                log_info "Updating gateway runtimeUrl from '${_ru_have}' to '${_ru_want}'..."
                if http_put \
                    "${AMP_API_URL}/orgs/${ORG_NAME}/gateways/${GATEWAY_ID}" \
                    "application/json" \
                    '{"runtimeUrl":"'"${_ru_want}"'"}' \
                    "Bearer ${ACCESS_TOKEN}" >/dev/null; then
                  log_info "Gateway runtimeUrl updated."
                else
                  log_error "Failed to update gateway runtimeUrl to '${_ru_want}' (continuing). Sandboxed agents will keep using the registered value."
                fi
                # Explicit: without it an appended statement could make this fatal again.
                return 0
              }

              warn_vhost_drift() {
                # _vh_ prefix: POSIX sh has no portable `local`, so these leak as globals.
                _vh_want="$1"; _vh_have="$2"
                if [ -z "${_vh_want}" ] || [ "${_vh_want}" = "${_vh_have}" ]; then
                  return 0
                fi
                # Unlike runtimeUrl there is no PUT for vhost: it is not part of the
                # gateway update API, so registration is the only chance to set it and a
                # supplied value that differs is silently discarded. Say so, rather than
                # leaving the operator to notice the console still shows the old host.
                log_info "WARNING: gateway.vhost is '${_vh_want}' but this gateway is registered with '${_vh_have}'."
                log_info "WARNING: vhost is written at first registration only and cannot be updated, so the registered value stays in effect."
                log_info "WARNING: Applying it means deleting this gateway registration and re-registering."
                return 0
              }

              # ensure_environment_mapping — maps a reused gateway to ENVIRONMENT_NAME.
              # Conflict model: fills an empty mapping on install, never overrides a console
              # change (upgrades and rollbacks skip it; a rollback to the first revision
              # replays its install-time hook). Non-fatal like sync_runtime_url.
              ensure_environment_mapping() {
                # _em_ prefix: POSIX sh has no portable `local`, so these leak as globals.
                if [ "${RELEASE_IS_INSTALL}" != "true" ]; then
                  return 0
                fi
                log_info "Mapping gateway '${GATEWAY_NAME}' to environment '${ENVIRONMENT_NAME}'..."
                # The API checks the mapping under its locks; both "another environment"
                # and the ingress cap are 409s, told apart by the code. Plain curl because
                # http_post drops the body on a non-2xx.
                _em_tmp=$(mktemp)
                _em_status=$(curl -s --max-time 30 --retry 3 --retry-delay 5 -X POST \
                  -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                  -o "${_em_tmp}" -w "%{http_code}" \
                  "${AMP_API_URL}/orgs/${ORG_NAME}/gateways/${GATEWAY_ID}/environments/${ENVIRONMENT_NAME}") || true
                _em_body=$(cat "${_em_tmp}"); rm -f "${_em_tmp}"
                case "${_em_status}" in
                  2*)
                    log_info "Gateway serves environment '${ENVIRONMENT_NAME}'."
                    ;;
                  409)
                    if echo "${_em_body}" | grep -q '"code":"GATEWAY_ENVIRONMENT_FIXED"'; then
                      log_error "Gateway '${GATEWAY_NAME}' serves another environment, so it was not mapped to '${ENVIRONMENT_NAME}' (continuing). Move it under Gateways in the console."
                    else
                      log_error "Environment '${ENVIRONMENT_NAME}' did not accept gateway '${GATEWAY_NAME}' (continuing): ${_em_body}"
                    fi
                    ;;
                  *)
                    log_error "Failed to map gateway '${GATEWAY_NAME}' to environment '${ENVIRONMENT_NAME}' (HTTP ${_em_status}, continuing): ${_em_body}. Assign it under Gateways in the console."
                    ;;
                esac
                return 0
              }

              # ----------------------------------------------------------------
              # Step 1: Wait for Agent Manager API to be healthy
              # ----------------------------------------------------------------
              log_info "Waiting for Agent Manager API at ${AMP_API_URL}..."
              MAX_WAIT=120
              ELAPSED=0
              until http_get "${AMP_API_URL%/api/v1}/healthz" >/dev/null; do
                if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
                  log_error "Timed out waiting for Agent Manager API after ${MAX_WAIT}s"
                  exit 1
                fi
                sleep 5
                ELAPSED=$((ELAPSED + 5))
              done
              log_info "Agent Manager API is healthy."

              # ----------------------------------------------------------------
              # Step 2: Obtain a JWT from Thunder IDP using client_credentials
              # ----------------------------------------------------------------
              log_info "Obtaining JWT from Thunder IDP..."
              # Use client_secret_basic: credentials in Authorization header (Base64 encoded, no newlines)
              BASIC_AUTH=$(echo -n "${IDP_CLIENT_ID}:${IDP_CLIENT_SECRET}" | base64 | tr -d '\n')

              TOKEN_RESPONSE=$(http_post "${IDP_TOKEN_URL}" \
                "application/x-www-form-urlencoded" \
                "grant_type=client_credentials&scope=amp:gateway:create%20amp:gateway:read%20amp:gateway:update%20amp:gateway:delete%20amp:gateway:token-manage%20amp:data-plane:read%20amp:deployment-pipeline:read%20amp:environment:read%20amp:project:read%20amp:agent:read%20amp:agent:build%20amp:llm-provider:read%20amp:mcp-server:read%20amp:evaluator:read%20amp:monitor:read%20amp:monitor:score-read%20amp:git-secret:read%20amp:catalog:read%20amp:repository:read" \
                "Basic ${BASIC_AUTH}")

              ACCESS_TOKEN=$(echo "${TOKEN_RESPONSE}" | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)
              if [ -z "${ACCESS_TOKEN}" ]; then
                log_error "Failed to obtain access token from IDP. Response: ${TOKEN_RESPONSE}"
                exit 1
              fi
              log_info "JWT obtained successfully."

              # ----------------------------------------------------------------
              # Step 3: Check if gateway already exists (idempotency)
              # ----------------------------------------------------------------
              log_info "Checking if gateway '${GATEWAY_NAME}' already exists in org '${ORG_NAME}'..."
              LIST_RESPONSE=$(http_get \
                "${AMP_API_URL}/orgs/${ORG_NAME}/gateways?limit=100" \
                "${ACCESS_TOKEN}")
              log_info "List response: ${LIST_RESPONSE}"

              # Extract gateway UUID by finding the object containing the matching name
              GATEWAY_ID=$(echo "${LIST_RESPONSE}" | \
                grep -o '"uuid":"[^"]*"[^}]*"name":"'"${GATEWAY_NAME}"'"\|"name":"'"${GATEWAY_NAME}"'"[^}]*"uuid":"[^"]*"' | \
                grep -o '"uuid":"[^"]*"' | cut -d'"' -f4 | head -1)

              if [ -n "${GATEWAY_ID}" ]; then
                log_info "Gateway '${GATEWAY_NAME}' already exists with ID: ${GATEWAY_ID}"
                # Read-only drift check. The role is written only at registration and is
                # immutable afterwards, so this never writes and cannot fail the hook.
                # Under the ingress cap, PUTting the role on every upgrade could fail
                # because a *different* release holds the environment's ingress slot —
                # and as a pre-upgrade hook that would abort the whole release upgrade,
                # including the runtime image bump that was the point of it.
                REGISTERED_TYPE=$(echo "${LIST_RESPONSE}" | \
                  grep -o '"name":"'"${GATEWAY_NAME}"'"[^}]*"gatewayType":"[^"]*"\|"gatewayType":"[^"]*"[^}]*"name":"'"${GATEWAY_NAME}"'"' | \
                  grep -o '"gatewayType":"[^"]*"' | cut -d'"' -f4 | head -1)
                WANTED_TYPE=$(echo "${GATEWAY_TYPE}" | tr '[:lower:]' '[:upper:]')
                case "${WANTED_TYPE}" in
                  REGULAR) WANTED_TYPE="BOTH" ;;
                  AI)      WANTED_TYPE="EGRESS" ;;
                esac
                if [ -n "${REGISTERED_TYPE}" ] && [ "${REGISTERED_TYPE}" != "${WANTED_TYPE}" ]; then
                  log_info "WARNING: gateway '${GATEWAY_NAME}' is registered as '${REGISTERED_TYPE}' but values.yaml requests '${WANTED_TYPE}'."
                  log_info "         The role is immutable; values.yaml will stay wrong until the gateway is re-registered."
                fi
                # Window is safe because JSON object keys are emitted alphabetically: the only
                # }-bearing value, environments, precedes name, and only scalar region can fall
                # between name and runtimeUrl.
                REGISTERED_RUNTIME_URL=$(echo "${LIST_RESPONSE}" | \
                  grep -o '"name":"'"${GATEWAY_NAME}"'"[^}]*"runtimeUrl":"[^"]*"' | \
                  grep -o '"runtimeUrl":"[^"]*"' | cut -d'"' -f4 | head -1)
                sync_runtime_url "${GATEWAY_RUNTIME_URL}" "${REGISTERED_RUNTIME_URL}"

                # Same window reasoning as runtimeUrl above: vhost sorts after name and
                # everything between them is scalar.
                REGISTERED_VHOST=$(echo "${LIST_RESPONSE}" | \
                  grep -o '"name":"'"${GATEWAY_NAME}"'"[^}]*"vhost":"[^"]*"' | \
                  grep -o '"vhost":"[^"]*"' | cut -d'"' -f4 | head -1)
                warn_vhost_drift "${GATEWAY_VHOST}" "${REGISTERED_VHOST}"

                ensure_environment_mapping
              else
                # ----------------------------------------------------------------
                # Step 4: Find the environment by name
                # ----------------------------------------------------------------
                log_info "Fetching environments for org '${ORG_NAME}'..."
                ENV_RESPONSE=$(http_get \
                  "${AMP_API_URL}/orgs/${ORG_NAME}/environments" \
                  "${ACCESS_TOKEN}")
                log_info "Environments response: ${ENV_RESPONSE}"

                ENVIRONMENT_ID=$(echo "${ENV_RESPONSE}" | \
                  grep -o '"id":"[^"]*"[^}]*"name":"'"${ENVIRONMENT_NAME}"'"\|"name":"'"${ENVIRONMENT_NAME}"'"[^}]*"id":"[^"]*"' | \
                  grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

                if [ -z "${ENVIRONMENT_ID}" ]; then
                  log_error "Environment '${ENVIRONMENT_NAME}' not found for org '${ORG_NAME}'. Available environments:"
                  log_error "${ENV_RESPONSE}"
                  exit 1
                fi
                log_info "Using environment '${ENVIRONMENT_NAME}' with ID: ${ENVIRONMENT_ID}"

                # ----------------------------------------------------------------
                # Step 5: Register the gateway with the environment
                # ----------------------------------------------------------------
                log_info "Registering gateway '${GATEWAY_NAME}'..."
                REGISTER_RESPONSE=$(http_post \
                  "${AMP_API_URL}/orgs/${ORG_NAME}/gateways" \
                  "application/json" \
                  '{"name":"'"${GATEWAY_NAME}"'","displayName":"'"${GATEWAY_DISPLAY_NAME}"'","gatewayType":"'"${GATEWAY_TYPE}"'","vhost":"'"${GATEWAY_VHOST}"'","runtimeUrl":"'"${GATEWAY_RUNTIME_URL}"'","environmentIds":["'"${ENVIRONMENT_ID}"'"]}' \
                  "Bearer ${ACCESS_TOKEN}")

                GATEWAY_ID=$(echo "${REGISTER_RESPONSE}" | \
                  grep -o '"uuid":"[^"]*"' | head -1 | cut -d'"' -f4)

                if [ -z "${GATEWAY_ID}" ]; then
                  log_error "Failed to register gateway. Response: ${REGISTER_RESPONSE}"
                  exit 1
                fi
                log_info "Gateway registered with ID: ${GATEWAY_ID}"
              fi

              # ----------------------------------------------------------------
              # Step 6: Seed the identity provider mirror into AMS for the Security
              # UI and agent OAuth issuer options.
              #
              # Source: bootstrap.identityProviders — the authoritative allowlist of
              # IdPs to register. It is decoupled from jwtauth_v1.keymanagers (the
              # gateway runtime's JWT-validation config, which includes the internal
              # agent-manager-service keymanager and ThunderKeyManager), so no
              # name-based filtering is needed here: only what is listed gets mirrored.
              # The list defaults to empty ([]), so no IdP is seeded unless explicitly
              # configured; operators register IdPs on demand instead.
              # ----------------------------------------------------------------
              log_info "Seeding identity providers for gateway '${GATEWAY_ID}'..."
              {{- range .Values.bootstrap.identityProviders }}
              seed_identity_provider {{ .name | quote }} {{ .issuer | quote }} {{ .jwksUri | quote }} {{ .skipTlsVerify | default false }}
              {{- end }}

              # ----------------------------------------------------------------
              # Step 7: Generate a gateway registration token
              # Skip rotation if the Secret already exists to avoid invalidating
              # a running gateway-controller.
              # ----------------------------------------------------------------
              EXISTING_TOKEN=$(kubectl get secret "${TOKEN_SECRET_NAME}" \
                --namespace="${TOKEN_SECRET_NAMESPACE}" \
                -o jsonpath="{.data.${TOKEN_SECRET_KEY}}" 2>/dev/null | base64 -d 2>/dev/null || true)

              # The Secret is created with kubectl below, so Helm does not own it and
              # `helm uninstall` leaves it behind. Reusing it unconditionally would then
              # hand the controller a credential the control plane has no record of —
              # which is what happens on a reinstall after the gateway's tokens are gone,
              # and it authenticates nowhere while looking correctly configured. Only
              # reuse the Secret when this gateway still has at least one token.
              if [ -n "${EXISTING_TOKEN}" ]; then
                TOKEN_LIST=$(http_get \
                  "${AMP_API_URL}/orgs/${ORG_NAME}/gateways/${GATEWAY_ID}/tokens" \
                  "${ACCESS_TOKEN}" || true)
                if ! echo "${TOKEN_LIST}" | grep -q '"id"'; then
                  log_info "Token Secret '${TOKEN_SECRET_NAME}' exists but gateway '${GATEWAY_ID}' has no registered tokens — minting a new one."
                  EXISTING_TOKEN=""
                fi
              fi

              if [ -n "${EXISTING_TOKEN}" ]; then
                log_info "Token Secret '${TOKEN_SECRET_NAME}' already exists — skipping token rotation."
                GATEWAY_TOKEN="${EXISTING_TOKEN}"
              else
                log_info "Generating registration token for gateway '${GATEWAY_ID}'..."
                ROTATE_RESPONSE=$(http_post \
                  "${AMP_API_URL}/orgs/${ORG_NAME}/gateways/${GATEWAY_ID}/tokens" \
                  "application/json" "" "Bearer ${ACCESS_TOKEN}")

                GATEWAY_TOKEN=$(echo "${ROTATE_RESPONSE}" | \
                  grep -o '"token":"[^"]*"' | head -1 | cut -d'"' -f4)

                if [ -z "${GATEWAY_TOKEN}" ]; then
                  log_error "Failed to generate gateway token. Response: ${ROTATE_RESPONSE}"
                  exit 1
                fi
                log_info "Gateway token generated successfully."
              fi

              # ----------------------------------------------------------------
              # Step 8: Store the token in a Secret in the gateway namespace.
              # The APIGateway CR references this via spec.controlPlane.tokenSecretRef.
              # The gateway-operator injects it into the gateway-controller as
              # APIP_GW_GATEWAY_REGISTRATION_TOKEN.
              # ----------------------------------------------------------------
              log_info "Writing token Secret '${TOKEN_SECRET_NAME}' in namespace '${TOKEN_SECRET_NAMESPACE}'..."
              kubectl create secret generic "${TOKEN_SECRET_NAME}" \
                --namespace="${TOKEN_SECRET_NAMESPACE}" \
                --from-literal="${TOKEN_SECRET_KEY}=${GATEWAY_TOKEN}" \
                --dry-run=client -o yaml | \
              kubectl apply -f -

              kubectl annotate secret "${TOKEN_SECRET_NAME}" \
                --namespace="${TOKEN_SECRET_NAMESPACE}" \
                amp.wso2.com/gateway-id="${GATEWAY_ID}" \
                amp.wso2.com/gateway-name="${GATEWAY_NAME}" \
                amp.wso2.com/org-name="${ORG_NAME}" \
                amp.wso2.com/environment="${ENVIRONMENT_NAME}" \
                --overwrite

              # The mapping outcome is logged where it happens, so this line does not repeat it.
              log_info "Bootstrap complete. Gateway '${GATEWAY_NAME}' registered with ID: ${GATEWAY_ID}"
{{- end }}
