---
# ConfigMap containing Helm values for the gateway stack deployed by the gateway-operator.
# Referenced by the APIGateway CR via spec.configRef.name.
# The gateway-operator reads values.yaml from this ConfigMap and uses it when
# running helm install/upgrade for the gateway-controller + router + policy-engine.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wso2-amp-gateway-extension.configMapName" . }}
  namespace: {{ .Values.apiGateway.namespace }}
  labels:
    {{- include "wso2-amp-gateway-extension.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-config
{{- if .Values.apiGateway.config.systemEnv }}
{{ fail "apiGateway.config.systemEnv has been replaced by apiGateway.config.config_toml + apiGateway.config.systemExtraEnv. See values.yaml for the migration example." }}
{{- end }}
data:
  values.yaml: |
    gateway:
      developmentMode: {{ .Values.developmentMode }}
      {{- if .Values.apiGateway.config.config_toml }}
      config_toml: |
        {{- .Values.apiGateway.config.config_toml | nindent 8 }}
      {{- end }}
      config:
        controller:
          server:
            api_port: 9090
            xds_port: 18000
            shutdown_timeout: 15s
            gateway_id: "platform-gateway-id"
          policy_server:
            port: 18001
            tls:
              enabled: false
          storage:
            type: sqlite
            sqlite:
              path: ./data/gateway.db
          controlplane:
            insecure_skip_verify: {{ .Values.apiGateway.controlPlane.tls.insecureSkipVerify }}
            reconnect_initial: 1s
            reconnect_max: 5m
            polling_interval: 15m
            deployment_push_enabled: false
            sync_batch_size: 50
          logging:
            level: info
            format: json
        router:
          gateway_host: "*"
          listener_port: 22893
          https_enabled: true
          https_port: 22894
          access_logs:
            enabled: true
            format: json
          policy_engine:
            mode: uds
            timeout_ms: 60000
            failure_mode_allow: false
            route_cache_action: RETAIN
            allow_mode_override: true
            message_timeout_ms: 60000
            tls:
              enabled: false
          logging:
            level: info
            format: json
        policy_engine:
          server:
            extproc_port: 9001
          admin:
            enabled: true
            port: 9002
          config_mode:
            mode: xds
          xds:
            connect_timeout: 10s
            request_timeout: 5s
            initial_reconnect_delay: 1s
            max_reconnect_delay: 60s
            tls:
              enabled: false
          logging:
            level: info
            format: json
        {{- $policyConfigs := deepCopy (.Values.apiGateway.config.policyConfigurations | default dict) }}
        {{- $mcpauth := $policyConfigs.mcpauth_v1 | default dict }}
        {{- if not $mcpauth.gatewayhost }}
        {{- $_ := set $mcpauth "gatewayhost" (include "wso2-amp-gateway-extension.mcpGatewayHost" .) }}
        {{- end }}
        {{- $_ := set $policyConfigs "mcpauth_v1" $mcpauth }}
        policy_configurations:
          {{- $policyConfigs | toYaml | nindent 10 }}

      controller:
        controlPlane:
          host: {{ .Values.apiGateway.controlPlane.host | quote }}
          {{- if .Values.apiGateway.controlPlane.tls.enabled }}
          port: 9243
          {{- else }}
          port: 9000
          {{- end }}
          token:
            value: ""
            secretName: {{ include "wso2-amp-gateway-extension.tokenSecretName" . | quote }}
            key: {{ .Values.gateway.tokenSecret.key | quote }}
        tls:
          enabled: true
          certificateProvider: cert-manager
          certManager:
            createIssuer: true
        storage:
          type: sqlite
          sqlitePath: ./data/gateway.db
        persistence:
          enabled: true
          size: 100Mi
        logging:
          level: info
        deployment:
          # Recreate, not the Kubernetes default RollingUpdate. The controller is a
          # single replica holding its SQLite store on a ReadWriteOnce PVC, and a
          # rolling update starts the replacement before the old pod is evicted
          # (maxSurge 1 / maxUnavailable 0 at one replica). On a multi-node cluster
          # the scheduler prefers a different node for the new pod, which then cannot
          # attach the volume — "Multi-Attach error for volume" — while the old pod
          # cannot be evicted until the new one is Ready. That deadlock does not time
          # out into a rollback; it holds the APIGateway at Programmed=False until an
          # operator deletes the old pod by hand.
          #
          # Recreate terminates the old pod first, so the volume is free when the new
          # one starts. The cost is a few seconds of controller downtime per upgrade,
          # which this component already has: it cannot run more than one replica
          # while storage.type is sqlite.
          #
          # Single-node clusters never hit the deadlock, because ReadWriteOnce allows
          # multiple pods on the same node — which is why local installs are unaffected.
          strategy:
            type: Recreate
          podSecurityContext:
            fsGroup: 10001
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- if .Values.apiGateway.config.systemExtraEnv }}
          extraEnv:
            {{- .Values.apiGateway.config.systemExtraEnv | toYaml | nindent 12 }}
          {{- end }}

      gatewayRuntime:
        deployment:
          podLabels:
            openchoreo.dev/system-component: gateway-runtime
          {{- if .Values.apiGateway.config.systemExtraEnv }}
          extraEnv:
            {{- .Values.apiGateway.config.systemExtraEnv | toYaml | nindent 12 }}
          {{- end }}
        service:
          type: ClusterIP
          ports:
            http: 22893
            https: 22894
            envoyAdmin: 9901
            policyEngineAdmin: 9002
            policyEngineMetrics: 9003