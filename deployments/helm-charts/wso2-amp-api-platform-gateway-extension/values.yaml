# Default values for wso2-amp-api-platform-gateway-extension
# This chart bootstraps the API Platform Gateway registration in Agent Manager,
# then deploys the gateway via an APIGateway CR consumed by the gateway-operator.
#
# Flow:
#   1. Bootstrap Job (post-install hook):
#      - Gets JWT from Thunder IDP using amp-api-client credentials
#      - Registers the AI gateway in Agent Manager via REST API
#      - Generates a registration token and stores it in a K8s Secret
#   2. APIGateway CR (non-hook, picked up by gateway-operator):
#      - References the token Secret via spec.controlPlane.tokenSecretRef
#      - References a ConfigMap via spec.configRef for full Helm values
#      - Gateway operator deploys controller + router + policy-engine via Helm

# Kubectl image used in bootstrap job
kubectl:
  image: alpine/k8s:1.32.3

# Agent Manager API connection details (used by bootstrap job to register gateway)
agentManager:
  # Public API URL (port 8080 = JWT-authenticated API)
  apiUrl: "http://amp-api.wso2-amp.svc.cluster.local:9000/api/v1"
  # Organization name in Agent Manager (must match Thunder OU handle)
  orgName: "default"
  # Thunder IDP for obtaining a JWT to call Agent Manager API
  idp:
    tokenUrl: "http://amp-thunder-extension-service.amp-thunder.svc.cluster.local:8090/oauth2/token"
    clientId: "amp-api-client"
    clientSecret: "amp-api-client-secret" # Prefer existingSecret; only set this for local/dev use
    # Reference an existing secret for IDP credentials (recommended for production).
    # When set, clientId and clientSecret above are ignored.
    existingSecret: ""
    existingSecretClientIdKey: "client-id"
    existingSecretClientSecretKey: "client-secret"

# Gateway registration configuration
gateway:
  # Name of the AI gateway to register in Agent Manager (lowercase alphanumeric + hyphens).
  # Defaults to the Helm release name if empty.
  name: ""
  # Human-readable display name
  displayName: "Default API Gateway"
  # Virtual host (FQDN or IP) that the gateway is reachable on. All access is
  # hostname-routed through kgateway — never the runtime Service directly.
  vhost: "http://default-default.gateway.localhost:19080"
  # In-cluster base URL sandboxed agents use to reach this gateway runtime. Empty derives
  # "http://<apiGatewayName>-gw-gateway-gateway-runtime.<apiGateway.namespace>:22893".
  # AMS validates it: http/https, explicit port that is not 80 or 443, cluster-local host.
  runtimeUrl: ""
  # Hostname for routing traffic to this gateway through kgateway.
  # All traffic (LLM proxy, OTEL, etc.) matching this hostname on kgateway
  # is forwarded to this gateway's runtime service.
  # Defaults to "<environment>-<orgName>.gateway.localhost" if empty.
  hostname: ""
  # Gateway placement role: INGRESS, EGRESS, or BOTH (must match GatewayType enum in
  # Agent Manager API). BOTH is correct for single topology, where the chart is installed
  # once per environment; split topology sets this explicitly on both releases from
  # add-environment.sh. Immutable after first registration — changing it later only logs
  # a drift warning.
  type: "BOTH"
  # Environment name in Agent Manager to associate this gateway with.
  # The bootstrap job looks up environments by this name.
  environment: "default"

  # The generated registration token is stored in this Kubernetes Secret.
  # It is then referenced by the APIGateway CR spec.controlPlane.tokenSecretRef.
  # Defaults to "<release-name>-token" if empty.
  tokenSecret:
    name: ""
    key: "token"

# APIGateway CR configuration (deployed by gateway-operator)
# Development mode
developmentMode: true

# kgateway ingress the gw-route HTTPRoute attaches to. This is the shared
# data-plane Gateway provisioned by the OpenChoreo data-plane chart — it does
# NOT move when the api-platform gateway gets its own per-org-env namespace.
# The HTTPRoute is created here (same namespace as the Gateway) and reaches the
# gateway runtime Service cross-namespace via a ReferenceGrant.
kgateway:
  name: "gateway-default"
  namespace: "openchoreo-data-plane"

apiGateway:
  # Namespace where the APIGateway CR is created.
  # Must be the same namespace where the gateway-operator is watching.
  # For per-org-env namespace isolation set this to "<org>-<env>"
  # (add-environment.sh passes it via --set apiGateway.namespace=...).
  namespace: "openchoreo-data-plane"


  # Control plane connection: points to Agent Manager's gateway management port (9243)
  controlPlane:
    host: "amp-api-gateway-manager.wso2-amp.svc.cluster.local:9243"
    tls:
      enabled: true
      # Skip verification of the control plane's TLS certificate. True because the
      # control plane serves a self-signed certificate in-cluster; set to false only
      # where the gateway can trust the control plane's certificate chain.
      insecureSkipVerify: true

  # ConfigMap containing full Helm values for the gateway Helm chart.
  # The gateway-operator reads this and passes it when deploying the gateway stack.
  config:
    # Name of the ConfigMap to create with gateway Helm values.
    # Defaults to "<release-name>-config" if empty.
    configMapName: ""

    # =========================================================================
    # Policy system parameter configurations
    # These are injected into the gateway's config.toml and resolved by policies
    # via ${config.*} expressions in their systemParameters definitions.
    # =========================================================================

    # Policy configurations rendered under [policy_configurations.*] in config.toml.
    # Consumed by policies that reference ${config.policy_configurations.<section>.<key>}.
    policyConfigurations:
      # --- Rate Limiting (shared by basic-ratelimit, advanced-ratelimit,
      #     token-based-ratelimit, llm-cost-based-ratelimit) ---
      ratelimit_v1:
        algorithm: "fixed-window" # "fixed-window" or "gcra"
        backend: "memory" # "memory" or "redis"
        memory:
          max_entries: 10000
          cleanup_interval: "5m"
        # redis:                     # Required when backend is "redis"
        #   host: "localhost"
        #   port: 6379
        #   password: ""
        #   username: ""
        #   db: 0
        #   key_prefix: "ratelimit:v1:"
        #   failure_mode: "open"     # "open" (allow) or "closed" (deny) on Redis failure
        #   connection_timeout: "5s"
        #   read_timeout: "3s"
        #   write_timeout: "3s"
        # headers:                   # advanced-ratelimit only
        #   include_x_rate_limit: true
        #   include_ietf: true
        #   include_retry_after: true

      # --- LLM Cost Based Rate Limiting (additional to ratelimit_v1) ---
      llm_cost_ratelimit_v1:
        cost_scale_factor: 1000000000

      # --- JWT Authentication (shared by jwt-auth and mcp-auth) ---
      jwtauth_v1:
        keymanagers:
          - name: agent-manager-service
            issuer: agent-manager-service
            jwks:
              remote:
                uri: http://amp-api.wso2-amp.svc.cluster.local:9000/auth/external/jwks.json
                skipTlsVerify: true
          - name: ThunderKeyManager
            issuer: http://thunder.amp.localhost:8080
            jwks:
              remote:
                uri: http://amp-thunder-extension-service.amp-thunder:8090/oauth2/jwks
                skipTlsVerify: true
        authheaderscheme: ""
        onfailurestatuscode: 401
        errormessageformat: json
        errormessage: "Authentication failed"
        leeway: 30s
        allowedalgorithms:
          - RS256
          - ES256
        jwkscachettl: 5m
        jwksfetchtimeout: 5s
        jwksfetchretrycount: 3
        jwksfetchretryinterval: 2s
        validateissuer: true

      # --- MCP Authentication (additional to jwtauth_v1) ---
      # gatewayhost defaults to the bare hostname of gateway.vhost (else the
      # routed kgateway hostname), so mcp-auth OAuth challenges advertise the
      # public serving host. Set it here only to override that derivation.
      # mcpauth_v1:
      #   gatewayhost: "localhost"

    # Raw TOML injected at the TOP of the downstream gateway chart's generated
    # config.toml, above every [table] section (rendered as gateway.config_toml
    # in the generated values.yaml). Use for policy "system parameters" that
    # policies read as ${config.<key>} at root level (e.g. AWS Bedrock,
    # Azure Content Safety, embedding providers) — TOML requires bare root
    # keys to precede any [table] header, which is why this leads the file.
    # Whole [table] sections work here too (tables are order-independent).
    # Do NOT redefine a table this chart already emits below
    # ([policy_configurations.*], [controller.*], [router], etc.) — TOML
    # rejects a duplicate table and the gateway-runtime crash-loops on it.
    #
    # config.toml renders into a ConfigMap, not a Secret. For any secret value,
    # supply an `{{ env "VAR" }}` interpolation token (resolved by the policy
    # engine at load time) instead of a literal, and inject the backing env
    # var via apiGateway.config.systemExtraEnv below (backed by a Kubernetes
    # Secret, never a plaintext value).
    #
    # Example:
    #   config_toml: |
    #     # AWS Bedrock Guardrail
    #     awsbedrock_guardrail_region = "us-east-1"
    #     awsbedrock_guardrail_id = ""
    #     awsbedrock_guardrail_version = "DRAFT"
    #     awsbedrock_access_key_id = ""
    #     awsbedrock_secret_access_key = '{{ env "APIP_GW_AWSBEDROCK_SECRET_ACCESS_KEY" }}'
    #     awsbedrock_session_token = ""
    #     awsbedrock_role_arn = ""
    #     awsbedrock_role_region = ""
    #     awsbedrock_role_external_id = ""
    #
    #     # Azure Content Safety
    #     azurecontentsafety_endpoint = ""
    #     azurecontentsafety_key = '{{ env "APIP_GW_AZURECONTENTSAFETY_KEY" }}'
    #
    #     # Embedding Provider (semantic-cache, semantic-prompt-guard, semantic-tool-filtering)
    #     embedding_provider = "OPENAI"
    #     embedding_provider_endpoint = ""
    #     embedding_provider_model = "text-embedding-ada-002"
    #     embedding_provider_dimension = "1536"
    #     embedding_provider_api_key = '{{ env "APIP_GW_EMBEDDING_PROVIDER_API_KEY" }}'
    #
    #     # Vector DB (semantic-cache)
    #     vector_db_provider = "REDIS"
    #     vector_db_provider_host = ""
    #     vector_db_provider_port = "6379"
    #     vector_db_provider_username = ""
    #     vector_db_provider_password = '{{ env "APIP_GW_VECTOR_DB_PROVIDER_PASSWORD" }}'
    #     vector_db_provider_database = ""
    #     vector_db_provider_ttl = "3600"
    #
    #     # Granite Guardian Prompt Injection
    #     granite_guardian_endpoint = "http://granite-guardian:8000"
    #     granite_guardian_model = "ibm-granite/granite-guardian-3.3-8b"
    #     granite_guardian_timeout = "10"
    #     granite_guardian_api_key = '{{ env "APIP_GW_GRANITE_GUARDIAN_API_KEY" }}'
    #
    #     # NeMo Guard Content Safety
    #     nemoguard_endpoint = "http://nemoguard:8101"
    #     nemoguard_model = "nemoguard"
    #     nemoguard_timeout = "30"
    #     nemoguard_api_key = '{{ env "APIP_GW_NEMOGUARD_API_KEY" }}'
    config_toml: ""

    # Env vars backing any `{{ env "..." }}` tokens used in config_toml above.
    # config.toml is loaded by both the gateway-controller and gatewayRuntime
    # (policy engine) pods, so each entry is rendered into BOTH
    # controller.deployment.extraEnv and gatewayRuntime.deployment.extraEnv.
    # Secret values should use valueFrom.secretKeyRef rather than a literal value.
    #
    # Example:
    #   systemExtraEnv:
    #     - name: APIP_GW_AZURECONTENTSAFETY_KEY
    #       valueFrom:
    #         secretKeyRef:
    #           name: azure-content-safety
    #           key: subscription-key
    systemExtraEnv: []

# Bootstrap Job configuration
#
# The job runs as a pre-install, pre-upgrade AND pre-rollback hook, so `helm rollback` now
# runs it too and can fail (leaving the release in pending-rollback) when Agent Manager is
# unreachable — rollbacks could not fail before. Recovery: re-run `helm rollback`, or
# `helm rollback --no-hooks` to skip the job entirely.
bootstrap:
  enabled: true
  backoffLimit: 3
  # Identity providers to mirror into Agent Manager (AMS) for this gateway.
  #
  # This list is the authoritative allowlist of IdPs the bootstrap job seeds via
  # the AMS identity-provider API. It is intentionally decoupled from
  # apiGateway.config.policyConfigurations.jwtauth_v1.keymanagers: that list is the
  # gateway runtime's JWT-validation config (and legitimately includes the internal
  # 'agent-manager-service' keymanager and ThunderKeyManager), whereas this list is
  # what AMS exposes in the Security UI and as agent OAuth issuer options. Only list
  # user-visible providers here — omit any internal/reserved keymanagers (e.g.
  # agent-manager-service).
  #
  # Defaults to empty: no IdP is auto-mirrored into AMS. ThunderKeyManager stays a
  # gateway keymanager (so deployed agents still validate Thunder-issued tokens), but
  # is no longer registered as a visible identity provider by default — operators add
  # IdPs on demand via the Manage Identity Provider flow.
  #
  # The bootstrap job seeds exactly the entries listed here, so an empty list seeds
  # nothing. Each entry: { name, issuer, jwksUri, skipTlsVerify }.
  identityProviders: []
  # TTL after completion (seconds). 86400 = 1 day
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    fsGroup: 0
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
