# Dev-only cluster resources for `make setup-lite`; apply with kubectl.
# observer-lite stands in for the OpenChoreo observer and collector; the
# observability extension chart still installs amp-observer next to it.
apiVersion: v1
kind: Namespace
metadata:
  name: openchoreo-observability-plane
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-default
  namespace: openchoreo-observability-plane
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 11080
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observer-lite
  namespace: openchoreo-observability-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observer-lite
  template:
    metadata:
      labels:
        app: observer-lite
    spec:
      serviceAccountName: observer-lite
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observer-lite
          image: amp-observer-lite:dev
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /tmp/observer-lite
      volumes:
        - name: data
          emptyDir: {}
---
# The OpenChoreo observer Service name, so the OpenChoreo URLs resolve to observer-lite.
apiVersion: v1
kind: Service
metadata:
  name: observer
  namespace: openchoreo-observability-plane
spec:
  selector:
    app: observer-lite
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# Stands in for the OpenChoreo collector Service so the gateway's upstream URL
# (opentelemetry-collector:4318) reaches observer-lite.
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-collector
  namespace: openchoreo-observability-plane
spec:
  selector:
    app: observer-lite
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observer-lite
  namespace: openchoreo-observability-plane
spec:
  podSelector:
    matchLabels:
      app: observer-lite
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              openchoreo.dev/system-component: gateway-runtime
      ports:
        - port: 4318
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: amp-observer
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observer-lite
  namespace: openchoreo-observability-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observer-lite
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["openchoreo.dev"]
    resources: ["components", "projects", "environments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observer-lite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observer-lite
subjects:
  - kind: ServiceAccount
    name: observer-lite
    namespace: openchoreo-observability-plane
---
# Lite mode has no Prometheus operator, but the observability extension chart
# ships a ServiceMonitor; this stub CRD lets it install (spec section 3a).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: servicemonitors.monitoring.coreos.com
spec:
  group: monitoring.coreos.com
  scope: Namespaced
  names:
    kind: ServiceMonitor
    plural: servicemonitors
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
