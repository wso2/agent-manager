apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: amp-dev
image: rancher/k3s:v1.32.9-k3s1
servers: 1
agents: 0
# k3d assigns the server node a STATIC container IP
subnet: "172.29.0.0/16"
kubeAPI:
  hostPort: "6550"
# Host ports published from the k3d load balancer; each is a listener on the
# shared AMP Gateway (k8s/amp-gateway.yaml).
ports:
  # Console, API, Thunder, gateway management
  - port: 8080:8080
    nodeFilters:
      - loadbalancer
  # Thunder HTTPS (wso2-amp-thunder-extension thunder.ocIngress.https)
  - port: 8443:8443
    nodeFilters:
      - loadbalancer
  # Agent Manager Observer (traces API / MCP)
  - port: 11080:11080
    nodeFilters:
      - loadbalancer
  # API Platform Gateway vhosts (LLM proxy, /otel ingest)
  - port: 19080:19080
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      # Add host.k3d.internal to API server TLS certificate SANs so pods and
      # containers can reach the API server via host.k3d.internal:6550.
      - arg: "--tls-san=host.k3d.internal"
        nodeFilters:
          - server:*
      # Configure kubelet eviction thresholds to prevent resource exhaustion
      - arg: "--kubelet-arg=eviction-hard=imagefs.available<1%,nodefs.available<1%"
        nodeFilters:
          - server:*
      - arg: "--kubelet-arg=eviction-minimum-reclaim=imagefs.available=1%,nodefs.available=1%"
        nodeFilters:
          - server:*
      # Disable Traefik; kgateway serves ingress
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
