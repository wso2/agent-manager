# Shared ingress for AMP: one kgateway Gateway that the console, the API, Thunder,
# the observer and the API Platform Gateway attach HTTPRoutes to. Each chart
# creates its HTTPRoute in its own namespace, so the listeners accept routes
# from all namespaces. Listener ports keep the historical host-port layout
# (k3d publishes 8080, 11080 and 19080 from its load balancer):
#   8080   console, API, Thunder, gateway management
#   11080  Agent Manager Observer (traces API / MCP)
#   19080  API Platform Gateway vhosts (LLM proxy, /otel ingest)
apiVersion: v1
kind: Namespace
metadata:
  name: amp-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: amp-gateway
  namespace: amp-gateway
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: http-observability
      port: 11080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: http-gateway
      port: 19080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
