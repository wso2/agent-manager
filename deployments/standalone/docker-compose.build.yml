# Builds the Agent Manager images from this checkout instead of pulling them.
# `make up` and `make dev-up` add this file; the release bundle leaves it out.

services:
  # One image for the API and the console: the console is built into the
  # binary from ../../console. amp-init runs the same image, so it is built
  # once, here.
  amp-api:
    build:
      context: ../../agent-manager-service
      additional_contexts:
        console-src: ../../console
  amp-init:
    # Built by amp-api above; never pulled.
    pull_policy: never
  observability-migrate:
    # Built by amp-api above; never pulled.
    pull_policy: never
  observability-secrets:
    pull_policy: never
  observability-secrets-external:
    pull_policy: never
