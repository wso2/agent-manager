server:
  hostname: "0.0.0.0"
  port: @@THUNDER_PORT@@
  http_only: true
  public_url: "@@THUNDER_PUBLIC_URL@@"
  security:
    # The setup job generates the secret into config/secrets/direct_auth_secret on a shared volume;
    # the server reads it from there at load time via this file:// reference.
    direct_auth_secret: "file://config/secrets/direct_auth_secret"

gate_client:
  # hostname/port/scheme default to the server's public URL. Required only when Gate is hosted separately.
  hostname: "@@THUNDER_HOST@@"
  port: @@THUNDER_PORT@@
  scheme: "http"
  path: "/gate"

tls:
  min_version: "1.3"
  cert_file: "config/certs/server.cert"
  key_file: "config/certs/server.key"

crypto:
  encryption:
    key: "file://config/certs/crypto.key"
  password_hashing:
    algorithm: "PBKDF2"
    pbkdf2:
      salt_size: 16
      iterations: 600000
      key_size: 32
    argon2id:
      salt_size: 16
      iterations: 2
      key_size: 32
      memory: 19456
      parallelism: 1
    sha256:
      salt_size: 16
  keys:
    - id: "default-key"
      cert_file: "config/certs/signing.cert"
      key_file: "config/certs/signing.key"
    - id: "ecdsa-key"
      cert_file: "config/certs/ecdsa-signing.cert"
      key_file: "config/certs/ecdsa-signing.key"

attribute_cache:
  encryption:
    enabled: false

database:
  config:
    type: "sqlite"
    sqlite:
      path: "database/configdb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600
      max_retries: 3
      min_retry_backoff_ms: 50
      max_retry_backoff_ms: 2000
  runtime_transient:
    type: "sqlite"
    sqlite:
      path: "database/runtime_transient.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600
      max_retries: 3
      min_retry_backoff_ms: 50
      max_retry_backoff_ms: 2000
  entity:
    type: "sqlite"
    sqlite:
      path: "database/entitydb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600
      max_retries: 3
      min_retry_backoff_ms: 50
      max_retry_backoff_ms: 2000
  runtime_persistent:
    type: "sqlite"
    sqlite:
      path: "database/runtime_persistent.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600
      max_retries: 3
      min_retry_backoff_ms: 50
      max_retry_backoff_ms: 2000

cache:
  disabled: false
  type: "inmemory"
  size: 1000
  ttl: 3600
  eviction_policy: "LRU"
  cleanup_interval: 300

jwt:
  issuer: "@@THUNDER_PUBLIC_URL@@"
  validity_period: 3600
  audience: "application"
  preferred_key_id: "default-key"

oauth:
  refresh_token:
    renew_on_grant: false
    revoke_previous_on_renew: true
    validity_period: 86400
  authorization_code:
    validity_period: 600
  authorization_request:
    validity_period: 3600
  dcr:
    enabled: true
    insecure: false
  send_server_errors_to_client: false
  allowed_auth_methods:
    - "client_secret_basic"
    - "client_secret_post"
    - "private_key_jwt"
    - "none"
  allowed_response_types:
    - "code"
  allowed_grant_types:
    - "client_credentials"
    - "authorization_code"
    - "refresh_token"
    - "urn:ietf:params:oauth:grant-type:token-exchange"
    - "urn:openid:params:grant-type:ciba"
    - "urn:ietf:params:oauth:grant-type:jwt-bearer"

flow:
  max_version_history: 3
  auto_infer_registration: false

passkey:
  allowed_origins:
    - "https://localhost:8090"

openid4vp:
  client_id_scheme: "x509_san_dns"
  signing_key_id: ""
  ephemeral_key_id: "vp-enc"
  response_enc_values:
    - "A128GCM"
    - "A256GCM"
    - "A128CBC-HS256"
    - "A256CBC-HS512"
  request_validity_seconds: 300
  state_ttl_seconds: 300
  leeway_seconds: 30
  key_binding_max_age_seconds: 300
  result_token_validity_seconds: 300
  enforce_key_binding: true
  registration_cert_file: ""
  trusted_anchors:

openid4vci:
  signing_key_id: ""
  nonce_ttl_seconds: 300
  proof_max_age_seconds: 300
  credential_validity_seconds: 2592000
  batch_size: 5
  enforce_scope: false

log:
  level: "info"
  output:
    console:
      enabled: true

declarative_resources:
  enabled: false
