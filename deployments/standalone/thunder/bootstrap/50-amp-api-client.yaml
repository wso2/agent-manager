# ouId (not ouHandle) on every application document in this file: the declarative
# importer resolves ouHandle correctly for roles/groups/users, but not for
# applications, so an application bootstrapped with ouHandle: default ends up with
# no OU at all, and its client_credentials tokens carry no ouId/ouHandle claim —
# agent-manager-service's RequireOrgMatch then rejects them as "missing ou identity
# in token". "01900000-0000-7000-8000-000000000001" is ThunderID's own built-in
# "default" OU, fixed on every install rather than generated per instance, mirroring
# what the pre-declarative bootstrap scripts did: resolve "default" once and send
# the real id. This on-prem deployment only ever runs a single org/OU ("default",
# AMP's internal default org) — multi-org support is a future
# concern, not something to solve here.
#
# ouId alone is NOT enough: Thunder only embeds ouId/ouHandle as token claims when
# a client's own token.accessToken.clientConfig.attributes opts in. Every
# client_credentials-only application in this file needs this attributes list, or
# its tokens keep getting rejected as "missing ou identity in token" even though
# ouId above is set correctly.
resource_type: application
id: amp-api-client
type: m2m # client_credentials only, no interactive login
name: "AMP API Client"
description: "Client application for AMP API access"
ouId: "01900000-0000-7000-8000-000000000001"
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: "amp-api-client"
      clientSecret: "@@AMP_API_CLIENT_SECRET@@"
      grantTypes: ["client_credentials"]
      tokenEndpointAuthMethod: "client_secret_basic"
      pkceRequired: false
      publicClient: false
      scopes: ["openid","profile","email","amp:org:view","amp:org:modify-settings","amp:org:invite-member","amp:org:remove-member","amp:org:assign-role","amp:org:manage-idp","amp:org:manage-service-account","amp:project:create","amp:project:read","amp:project:update","amp:project:delete","amp:environment:create","amp:environment:read","amp:environment:update","amp:environment:delete","amp:gateway:create","amp:gateway:read","amp:gateway:update","amp:gateway:delete","amp:gateway:token-manage","amp:data-plane:read","amp:deployment-pipeline:create","amp:deployment-pipeline:read","amp:deployment-pipeline:update","amp:deployment-pipeline:delete","amp:git-secret:create","amp:git-secret:read","amp:git-secret:delete","amp:llm-provider-template:create","amp:llm-provider-template:read","amp:llm-provider-template:update","amp:llm-provider-template:delete","amp:llm-provider:create","amp:llm-provider:read","amp:llm-provider:update","amp:llm-provider:delete","amp:llm-provider:configure-guardrail","amp:llm-provider:connect","amp:llm-provider:deploy","amp:llm-provider:api-key-manage","amp:mcp-server:create","amp:mcp-server:read","amp:mcp-server:update","amp:mcp-server:delete","amp:mcp-server:configure-guardrail","amp:mcp-server:connect","amp:mcp-server:api-key-manage","amp:llm-proxy:create","amp:llm-proxy:read","amp:llm-proxy:update","amp:llm-proxy:delete","amp:llm-proxy:deploy","amp:llm-proxy:api-key-manage","amp:evaluator:create","amp:evaluator:read","amp:evaluator:update","amp:evaluator:delete","amp:agent:create","amp:agent:read","amp:agent:update","amp:agent:delete","amp:agent:build","amp:agent:env-non-production","amp:agent:env-production","amp:agent:rollback","amp:agent:suspend","amp:agent:token-manage","amp:agent:api-key-manage","amp:agent-kind:read","amp:agent-kind:create","amp:agent-kind:update","amp:agent-kind:delete","amp:monitor:create","amp:monitor:read","amp:monitor:update","amp:monitor:delete","amp:monitor:execute","amp:monitor:score-read","amp:monitor:score-publish","amp:events:read","amp:events:manage","amp:observability:trace-read","amp:observability:log-read","amp:observability:build-log-read","amp:observability:metric-read","amp:role:create","amp:role:read","amp:role:update","amp:role:delete","amp:group:create","amp:group:read","amp:group:update","amp:group:delete","amp:catalog:read","amp:repository:read","amp:profile:read","amp:profile:update-attributes","amp:scope:create","amp:scope:read","amp:scope:update","amp:scope:delete","amp:agent-identity:read","amp:agent-identity:create","amp:agent-identity:update","amp:agent-identity:delete"]
      token:
        accessToken:
          clientConfig:
            validityPeriod: 3600
            attributes: ["ouId", "ouHandle"]
