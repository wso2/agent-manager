      - "amp:llm-provider-template:read"
      - "amp:llm-provider:read"
      - "amp:llm-provider:configure-guardrail"
      - "amp:llm-provider:connect"
      - "amp:mcp-server:read"
      - "amp:mcp-server:configure-guardrail"
      - "amp:mcp-server:connect"
      - "amp:mcp-server:api-key-manage"
      - "amp:scope:read"
      - "amp:llm-proxy:create"
      - "amp:llm-proxy:read"
      - "amp:llm-proxy:update"
      - "amp:llm-proxy:delete"
