# AMP Lite without Kubernetes: `docker compose up` from this directory.
# Agent Manager's settings are in amp.yaml; .env is optional and only changes
# images, host ports and ThunderID's network name. Secrets are generated on
# first start and kept in the amp-secrets volume; the two other containers
# read (the admin and PostgreSQL passwords) are copied to amp-shared-secrets,
# the only secrets volume those containers mount. Each service publishes its
# own port; there is no ingress controller or reverse proxy. Browsers use the
# public names (*.localhost resolves to 127.0.0.1); containers dial the
# service names, and ThunderID's public URL stays the token issuer everywhere.
# Clients such as curl pin *.localhost to loopback, so service-to-service URLs
# never use it.
#
# Startup order: amp-init generates the secrets and writes the ThunderID and
# gateway configuration, thunder-setup applies ThunderID's bootstrap, amp-api
# registers the default gateway, and the gateway connects and receives its
# APIs from amp-api.

name: amp-lite

x-thunder: &thunder
  image: ${THUNDER_IMAGE:-ghcr.io/thunder-id/thunderid:1.0.2}
  environment: &thunder-env
    THUNDER_PORT: ${THUNDER_PORT:-8080}
  entrypoint: ["/bin/sh", "/amp/thunder/entrypoint.sh"]
  networks: [amp]

x-otel-collector: &otel-collector
  image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.163.2}
  command: ["--config=/etc/otelcol-contrib/amp.yaml"]
  volumes:
    - ./observability/otel-collector.yaml:/etc/otelcol-contrib/amp.yaml:ro
    # The write password only.
    - observability-collector-secrets:/run/secrets/observability:ro
  depends_on:
    amp-init:
      condition: service_completed_successfully
    observability-migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  # --- Generated configuration --------------------------------------------------
  # Generates the secrets nothing sets (the observability store's too, with a
  # store URL), and writes ThunderID's configuration
  # and bootstrap resources and the AI Gateway's config.toml, keys and
  # registration token, from amp.yaml. Reruns regenerate the configuration and
  # keep generated secrets, keys and tokens.
  # The same image and binary as amp-api, run as `amp init`.
  amp-init:
    image: ${AMP_API_IMAGE:-amp-api:lite}
    # Writes into fresh named volumes and hands each file to the uid that reads it.
    user: "0:0"
    entrypoint: ["/go/bin/amp"]
    command: ["init", "thunder", "/out/thunder", "ai-gateway", "/out/gateway", "fileauth", "/out/fileauth"]
    environment:
      - AMP_CONFIG=/etc/amp/amp.yaml
      - AMP_DATA_DIR=/var/lib/agent-manager
      # The admin and PostgreSQL passwords, for the containers that read them.
      - AMP_SHARED_SECRETS_DIR=/out/shared-secrets
      # What only Compose knows: ports and service names.
      - THUNDER_PORT=${THUNDER_PORT:-8080}
      # The console amp-api serves (server.public_url) may always sign in; the
      # dev console (`make console`, Vite on CONSOLE_PORT) may too.
      - CONSOLE_REDIRECT_URIS=http://localhost:${CONSOLE_PORT:-3000}/login
      - THUNDER_CORS_ORIGINS=http://localhost:${CONSOLE_PORT:-3000}
      - MODULE_AI_GATEWAY_CONTROLPLANE_HOST=amp-api:9243
      - MODULE_AI_GATEWAY_AMP_JWKS_URL=http://amp-api:8080/auth/external/jwks.json
      - MODULE_AI_GATEWAY_THUNDER_ISSUER=http://${THUNDER_HOST:-thunder.amp.localhost}:${THUNDER_PORT:-8080}
      - MODULE_AI_GATEWAY_THUNDER_JWKS_URL=http://thunder:${THUNDER_PORT:-8080}/oauth2/jwks
      - MODULE_AI_GATEWAY_HOST=${GATEWAY_HOST:-default-default.gateway.localhost}
      - MODULE_AI_GATEWAY_FILE_OWNER=10001:10001
      - THUNDER_FILE_OWNER=10001:10001
      - AMP_FILE_OWNER=1000:1000
      # With a store URL (.env or amp.yaml), the observability store's
      # passwords: all four for ClickHouse, and each other reader's own.
      - MODULE_OBSERVABILITY_CLICKHOUSE_URL${AMP_OBSERVABILITY_STORE_URL:+=${AMP_OBSERVABILITY_STORE_URL:-}}
      - AMP_CLICKHOUSE_SECRETS_DIR=/out/clickhouse
      - AMP_CLICKHOUSE_API_SECRETS_DIR=/out/clickhouse-api
      - AMP_CLICKHOUSE_MIGRATE_SECRETS_DIR=/out/clickhouse-migrate
      - AMP_CLICKHOUSE_COLLECTOR_SECRETS_DIR=/out/clickhouse-collector
    volumes:
      - ./amp.yaml:/etc/amp/amp.yaml:ro
      - amp-secrets:/var/lib/agent-manager/secrets
      - amp-shared-secrets:/out/shared-secrets
      - thunder-config:/out/thunder
      - gateway-config:/out/gateway
      - fileauth-config:/out/fileauth
      - observability-secrets:/out/clickhouse
      - amp-observability-secrets:/out/clickhouse-api
      - observability-migrate-secrets:/out/clickhouse-migrate
      - observability-collector-secrets:/out/clickhouse-collector
    networks: [amp]

  # --- Identity ---------------------------------------------------------------
  thunder-setup:
    <<: *thunder
    command: ["--setup"]
    environment:
      <<: *thunder-env
      ADMIN_USERNAME: admin
      # Agent Manager's admin password, not one of ThunderID's own: the same
      # account signs in whichever mode is configured.
      ADMIN_PASSWORD_FILE: /amp/secrets/admin-password
    volumes:
      - ./thunder:/amp/thunder:ro
      - thunder-config:/amp/thunder-config:ro
      - amp-shared-secrets:/amp/secrets:ro
      - thunder-db:/opt/thunderid/database
      - thunder-certs:/opt/thunderid/config/certs
      - thunder-secrets:/opt/thunderid/config/secrets
    depends_on:
      amp-init:
        condition: service_completed_successfully

  thunder:
    <<: *thunder
    ports:
      - "${THUNDER_PORT:-8080}:${THUNDER_PORT:-8080}"
    volumes:
      - ./thunder:/amp/thunder:ro
      - thunder-config:/amp/thunder-config:ro
      - thunder-db:/opt/thunderid/database
      - thunder-certs:/opt/thunderid/config/certs:ro
      - thunder-secrets:/opt/thunderid/config/secrets:ro
    depends_on:
      thunder-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${THUNDER_PORT:-8080}"]
      interval: 3s
      retries: 40
    networks:
      amp:
        aliases: ["${THUNDER_HOST:-thunder.amp.localhost}"]
    restart: unless-stopped

  # --- Database (optional) ------------------------------------------------------
  # SQLite is the default. With COMPOSE_PROFILES=postgres in .env and the db:
  # block in amp.yaml set to postgres, amp-api uses this PostgreSQL instead;
  # its password is generated with the other secrets.
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: amp
      POSTGRES_PASSWORD_FILE: /amp/secrets/db-password
      POSTGRES_DB: agent_manager
    volumes:
      - amp-shared-secrets:/amp/secrets:ro
      - postgres-data:/var/lib/postgresql
    depends_on:
      amp-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amp -d agent_manager"]
      interval: 3s
      retries: 40
    networks: [amp]
    restart: unless-stopped

  # --- Agent Manager ------------------------------------------------------------
  # The API, and the console on the same port. Its settings are in amp.yaml;
  # what remains here is what only Compose knows.
  amp-api:
    image: ${AMP_API_IMAGE:-amp-api:lite}
    command: ["serve", "--migrate"]
    ports:
      - "${AMP_API_PORT:-9000}:8080"
      - "${AMP_INTERNAL_PORT:-9243}:9243"
    environment:
      - AMP_CONFIG=/etc/amp/amp.yaml
      - AMP_DATA_DIR=/var/lib/agent-manager
      - DB_SSL_MODE=disable
      # The console is same-origin; this lets the dev console (Vite) call in.
      - CORS_ALLOWED_ORIGIN=http://localhost:${CONSOLE_PORT:-3000}
      # ThunderID is dialled by its service name; its public URL (amp.yaml)
      # stays the token issuer.
      - THUNDER_RESOLVE_TO_HOST=thunder:${THUNDER_PORT:-8080}
      - FILE_AUTH_USERS_PATH=/amp/fileauth/users.yaml
      # Lite answers 501 for internal agents, the only writers of agent
      # credentials, so no secret manager provider is wired here.
      - SECRET_MANAGER_PROVIDER=unsupported
      - MODULE_AI_GATEWAY_A2A_CARD_FETCH_DIAL_ADDR=gateway-runtime:19080
      # The bundled gateway, registered at startup with the token amp-init wrote.
      - MODULE_AI_GATEWAY_DEFAULT_GATEWAY_NAME=default
      - MODULE_AI_GATEWAY_DEFAULT_GATEWAY_VHOST=http://${GATEWAY_HOST:-default-default.gateway.localhost}:${GATEWAY_PORT:-19080}
      - MODULE_AI_GATEWAY_DEFAULT_GATEWAY_TOKEN_FILE=/amp/gw/registration-token
      # The console's settings (CONSOLE_<NAME> fills $NAME in its config.js).
      # The API base URL, ThunderID URL, sign-in redirects, AUTH_MODE and the
      # sign-in scopes default from amp.yaml.
      - CONSOLE_GATEWAY_CONTROL_PLANE_URL=https://localhost:${AMP_INTERNAL_PORT:-9243}
      - CONSOLE_GATEWAY_VERSION=v2026.09.24
      - CONSOLE_FEATURE_FLAG_ENABLE_PROFILE_MANAGEMENT=true
      - CONSOLE_FEATURE_FLAG_ENABLE_USER_MANAGEMENT=true
      - CONSOLE_FEATURE_FLAG_ENABLE_SELF_HOSTED_GATEWAYS=true
      # The observability module's trace store, set with an observability
      # profile; unset, the module keeps traces in memory. Its read and delete
      # passwords are amp-init's copies. See docs/amp-lite/observability.md.
      # Left out when .env has no store URL, so amp.yaml's clickhouse.url applies.
      - MODULE_OBSERVABILITY_CLICKHOUSE_URL${AMP_OBSERVABILITY_STORE_URL:+=${AMP_OBSERVABILITY_STORE_URL:-}}
      - MODULE_OBSERVABILITY_CLICKHOUSE_USER=amp_reader
      - MODULE_OBSERVABILITY_CLICKHOUSE_PASSWORD_FILE=/amp/observability/read-password
      - MODULE_OBSERVABILITY_CLICKHOUSE_CLEANER_USER=amp_cleaner
      - MODULE_OBSERVABILITY_CLICKHOUSE_CLEANER_PASSWORD_FILE=/amp/observability/delete-password
    volumes:
      - ./amp.yaml:/etc/amp/amp.yaml:ro
      - amp-data:/var/lib/agent-manager
      - amp-secrets:/var/lib/agent-manager/secrets
      - gateway-config:/amp/gw:ro
      - fileauth-config:/amp/fileauth:ro
      # The read and delete passwords only.
      - amp-observability-secrets:/amp/observability:ro
    depends_on:
      thunder:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null"]
      interval: 3s
      retries: 60
    # observability reaches ClickHouse and the collector; it has no other
    # members without the profile.
    networks: [amp, observability]
    restart: unless-stopped

  # --- Observability (optional) ---------------------------------------------------
  # Traces need a store and the OpenTelemetry collector. One of two profiles:
  #   observability           runs ClickHouse here, with no published ports.
  #   observability-external  uses your ClickHouse at AMP_OBSERVABILITY_STORE_URL.
  # Both run the collector on the internal observability network and a step
  # that applies the trace schema with `amp migrate` once amp-api is up, before
  # the collector starts. ClickHouse creates no tables itself. amp-init writes
  # the four passwords, one file per job (read, write, delete, setup), set in
  # amp.yaml or generated, into a folder per reader; each container mounts only
  # its own. A failure here stops only these containers, never amp-api.
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8.33.6}
    profiles: [observability]
    # users.xml reads the passwords from the environment, so this exports each
    # file into its variable; a missing or empty one stops ClickHouse.
    entrypoint:
      - /bin/sh
      - -c
      - |
        for p in read:READER write:INGEST delete:CLEANER setup:MIGRATOR; do
          f=/run/secrets/observability/$${p%%:*}-password
          v=$$(cat "$$f" 2>/dev/null)
          [ -n "$$v" ] || { echo "$$f is missing or empty: amp-init writes it when AMP_OBSERVABILITY_STORE_URL is set in .env. See docs/amp-lite/observability.md." >&2; exit 1; }
          export "AMP_CLICKHOUSE_$${p#*:}_PASSWORD=$$v"
        done
        exec /entrypoint.sh
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - observability-secrets:/run/secrets/observability:ro
      - clickhouse-data:/var/lib/clickhouse
      # The module's four logins (agent-manager-service/modules/observability/store/clickhouse/users.xml).
      - ./observability/clickhouse-users.xml:/etc/clickhouse-server/users.d/amp.xml:ro
    depends_on:
      amp-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping >/dev/null"]
      interval: 3s
      retries: 60
    networks: [observability]
    restart: unless-stopped

  # Applies the trace schema with the setup login, which amp-api never holds.
  # It waits for amp-api, whose first start creates the encryption key on an
  # empty database. Rerun it (`docker compose run --rm observability-migrate`) after an upgrade.
  observability-migrate:
    image: ${AMP_API_IMAGE:-amp-api:lite}
    profiles: [observability, observability-external]
    # Names a missing store URL or a refused setup login in plain words; a
    # refused login most often means your ClickHouse has no logins yet.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -s /run/secrets/observability/setup-password ]; then
          echo "The setup password is missing: amp-init writes it when AMP_OBSERVABILITY_STORE_URL is set in .env. See docs/amp-lite/observability.md." >&2
          exit 1
        fi
        out=$$(/go/bin/amp migrate 2>&1)
        rc=$$?
        # amp migrate skips a store with no URL (from .env or amp.yaml) and still succeeds.
        if printf '%s' "$$out" | grep -q 'observability: skipped its external schema'; then
          echo "No ClickHouse URL is set: set AMP_OBSERVABILITY_STORE_URL in .env or clickhouse.url in amp.yaml. See docs/amp-lite/observability.md." >&2
          exit 1
        fi
        if [ "$$rc" -ne 0 ] && printf '%s' "$$out" | grep -q 'Code: 516'; then
          echo "ClickHouse refused the amp_migrator login. With your own ClickHouse, create the observability logins first: see docs/amp-lite/observability.md." >&2
          exit 1
        fi
        printf '%s\n' "$$out"
        exit "$$rc"
    # amp-api's settings and database, plus the setup login.
    environment:
      - AMP_CONFIG=/etc/amp/amp.yaml
      - AMP_DATA_DIR=/var/lib/agent-manager
      - DB_SSL_MODE=disable
      - MODULE_OBSERVABILITY_CLICKHOUSE_URL${AMP_OBSERVABILITY_STORE_URL:+=${AMP_OBSERVABILITY_STORE_URL:-}}
      - MODULE_OBSERVABILITY_CLICKHOUSE_MIGRATOR_USER=amp_migrator
      - MODULE_OBSERVABILITY_CLICKHOUSE_MIGRATOR_PASSWORD_FILE=/run/secrets/observability/setup-password
      # Left out when .env has no TTL, so amp.yaml's clickhouse.ttl-days applies.
      - MODULE_OBSERVABILITY_CLICKHOUSE_TTL_DAYS${AMP_OBSERVABILITY_TTL_DAYS:+=${AMP_OBSERVABILITY_TTL_DAYS:-}}
    volumes:
      - ./amp.yaml:/etc/amp/amp.yaml:ro
      - amp-data:/var/lib/agent-manager
      - amp-secrets:/var/lib/agent-manager/secrets
      # The setup password only.
      - observability-migrate-secrets:/run/secrets/observability:ro
    depends_on:
      amp-init:
        condition: service_completed_successfully
      amp-api:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
        required: false
    # amp for PostgreSQL and your ClickHouse, observability for the bundled one.
    networks: [amp, observability]

  # Receives OTLP/HTTP only from the observability network, replaces the
  # spans' agent-manager/* resource attributes with the identity headers the
  # observability module sets, and writes to ClickHouse with the write login.
  otel-collector:
    <<: *otel-collector
    profiles: [observability]
    networks: [observability]

  # The same, writing to your ClickHouse: its own network out reaches it, and
  # nothing else joins that network.
  otel-collector-external:
    <<: *otel-collector
    profiles: [observability-external]
    environment:
      AMP_CLICKHOUSE_ENDPOINT: ${AMP_OBSERVABILITY_STORE_URL:-}
    networks:
      observability:
        aliases: [otel-collector]
      observability-egress:

  # --- AI Gateway -----------------------------------------------------------------
  # Uses config.toml from amp-init and connects to amp-api with the registration
  # token amp-api registered at startup; amp-api pushes its APIs over that
  # connection.
  gateway-controller:
    image: ${GATEWAY_CONTROLLER_IMAGE:-ghcr.io/wso2/api-platform/gateway-controller:2026.09.24}
    command: ["-config", "/amp/gw/config.toml"]
    environment:
      GATEWAY_CONTROLLER_HOST: gateway-controller
    volumes:
      - gateway-config:/amp/gw:ro
      - gateway-data:/app/data
    depends_on:
      amp-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9092/api/admin/v1/health >/dev/null"]
      interval: 3s
      retries: 40
    networks: [amp]
    restart: unless-stopped

  gateway-runtime:
    image: ${GATEWAY_RUNTIME_IMAGE:-ghcr.io/wso2/api-platform/gateway-runtime:2026.09.24}
    command: ["--pol.config", "/amp/gw/config.toml"]
    ports:
      - "${GATEWAY_PORT:-19080}:19080"
    environment:
      GATEWAY_CONTROLLER_HOST: gateway-controller
      ROUTER_ADMIN_ENABLED: "false"
    volumes:
      - gateway-config:/amp/gw:ro
      - ./gateway/model_prices.json:/etc/policy-engine/llm-pricing/model_prices.json:ro
    depends_on:
      gateway-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 19080"]
      interval: 3s
      retries: 40
    networks:
      amp:
        aliases: ["${GATEWAY_HOST:-default-default.gateway.localhost}"]
    restart: unless-stopped

volumes:
  thunder-config:
  thunder-db:
  thunder-certs:
  thunder-secrets:
  postgres-data:
  amp-data:
  amp-secrets:
  amp-shared-secrets:
  gateway-config:
  gateway-data:
  fileauth-config:
  clickhouse-data:
  observability-secrets:
  amp-observability-secrets:
  observability-migrate-secrets:
  observability-collector-secrets:

networks:
  amp:
  # amp-api, ClickHouse and the collector only. Internal: no route out.
  observability:
    internal: true
  observability-egress:
