apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: amp-local
image: rancher/k3s:v1.32.9-k3s1
servers: 1
agents: 0
# k3d assigns the server node a STATIC container IP
subnet: "172.28.0.0/16"
kubeAPI:
  hostPort: "6550"
# Host ports published from the k3d load balancer; each (except 8443) is a
# listener on the shared AMP Gateway (k8s/amp-gateway.yaml). AMP services have
# no host ports of their own.
ports:
  # Console, API, Thunder, gateway management
  - port: 8080:8080
    nodeFilters:
      - loadbalancer
  # Thunder HTTPS
  - port: 8443:8443
    nodeFilters:
      - loadbalancer
  # Agent Manager Observer (traces API / MCP)
  - port: 11080:11080
    nodeFilters:
      - loadbalancer
  # API Platform Gateway vhosts (LLM proxy, OTLP /otel)
  - port: 19080:19080
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      # Add host.k3d.internal to API server TLS certificate SANs so pods can
      # reach the API server via host.k3d.internal:6550.
      - arg: "--tls-san=host.k3d.internal"
        nodeFilters:
          - server:*
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
      # Configure kubelet eviction thresholds to prevent resource exhaustion
      - arg: "--kubelet-arg=eviction-hard=imagefs.available<10%,nodefs.available<10%"
        nodeFilters:
          - server:*
      - arg: "--kubelet-arg=eviction-minimum-reclaim=imagefs.available=5%,nodefs.available=5%"
        nodeFilters:
          - server:*
      # Pin Flannel to eth0 inside the k3s container. eth0 has a stable IP
      # within the Docker/Colima network, so the cluster keeps working after
      # the host IP changes.
      - arg: "--flannel-iface=eth0"
        nodeFilters:
          - server:*
# Node registries.yaml. Empty by default; a private-registry install appends
# its credentials (amp_registries_yaml_fragment) to this block.
registries:
  config: |
    mirrors: {}
