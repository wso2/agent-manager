<text x="32" y="80" class="subtitle">One schema for all three tiers (AI Gateway, Agent Manager, Agent Runtime), created on first start. Tables a tier does not use stay empty; environments stay hidden below Agent Runtime.</text>

<text x="48" y="1720" class="aname" fill="#be185d">EVALUATION AND ALERTS (AGENT MANAGER TIER; EMPTY ON AI GATEWAY)</text>
<rect x="30" y="2018" width="2820" height="298" rx="14" fill="#f7fee7" stroke="#4d7c0f" stroke-opacity="0.45" stroke-width="1.5"/>
<text x="48" y="2048" class="aname" fill="#4d7c0f">AGENT RUNTIME (AGENT RUNTIME TIER; EMPTY BELOW IT)</text>
<rect x="30" y="2338" width="2820" height="184" rx="14" fill="#ffffff" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="48" y="2368" class="aname" fill="#64748b">KEPT OUTSIDE THIS DATABASE</text>
<text x="320" y="468" class="anote">Every table carries org_id, and children point at parents through (org_id, parent id),</text>
<text x="320" y="486" class="anote">so no row can reach another org's data.</text>
<text x="320" y="512" class="anote">First start seeds the default org, its default environment and deployment pipeline,</text>
<text x="320" y="530" class="anote">a default project, and the bundled gateway with its token.</text>
<text x="2402" y="1050" class="anote">No foreign keys: rows outlive what they describe.</text>
<text x="2380" y="214" class="anote2">Referenced by secret_id from LLM providers,</text>
<text x="2380" y="233" class="anote2">LLM proxies, MCP endpoints, A2A proxies and</text>
<text x="2380" y="252" class="anote2">event destinations. The service deletes a</text>
<text x="2380" y="271" class="anote2">secret after its owner.</text>
<text x="2380" y="290" class="anote2"></text>
<text x="2380" y="309" class="anote2">Production can keep values in an external</text>
<text x="2380" y="328" class="anote2">vault instead (provider + external_ref).</text>
<text x="347" y="614" class="alabel">each agent owns these; they are deleted with it</text>
