<text x="30" y="52" class="title">AMP Lite data model</text>
<text x="32" y="80" class="subtitle">WSO2 Agent Manager without OpenChoreo. One database holds everything the control plane manages; environments exist but stay hidden.</text>
<rect x="1560" y="14" width="1290" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>

<text x="1628" y="92" class="legtext">is a: typed row shares its artifact's id</text>

<text x="2028" y="92" class="legtext">a worker turns one into the other</text>

<text x="2444" y="37" class="chip" fill="#334155" text-anchor="middle">per environment</text>
<text x="2508" y="37" class="legtext">one row per environment; in Lite always the hidden default</text>
<rect x="2390" y="46" width="95" height="18" rx="9" fill="#fee2e2"/>
<text x="2438" y="59" class="chip" fill="#991b1b" text-anchor="middle">uses a secret</text>
<text x="2508" y="59" class="legtext">credential lives in Secrets, not in this row</text>
<rect x="2390" y="68" width="89" height="18" rx="9" fill="#e0e7ff"/>
<text x="2435" y="81" class="chip" fill="#3730a3" text-anchor="middle">worker queue</text>

<text x="1628" y="120" class="legtext">dashed card: hidden, deferred, or outside this database</text>

<text x="963" y="162" class="aname" fill="#7c3aed">GATEWAY MODULE: GATEWAYS, ARTIFACTS, LLM AND MCP</text>

<text x="2040" y="162" class="aname" fill="#dc2626">SECRETS</text>

<text x="2040" y="494" class="aname" fill="#0891b2">EVENTS AND WEBHOOKS</text>

<text x="2040" y="1114" class="aname" fill="#b45309">AUDIT LOG AND CONSOLE USAGE</text>
<rect x="2022" y="1394" width="828" height="270" rx="14" fill="#f8fafc" stroke="#475569" stroke-opacity="0.45" stroke-width="1.5"/>
<text x="2040" y="1424" class="aname" fill="#475569">INTERNALS (WORKERS)</text>

<text x="2040" y="1716" class="aname" fill="#0f766e">MODULE HOST</text>
<rect x="30" y="2292" width="2820" height="200" rx="14" fill="#ffffff" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="48" y="2322" class="aname" fill="#64748b">NOT IN AMP LITE YET, OR KEPT OUTSIDE THIS DATABASE</text>
<text x="320" y="546" class="anote">With file sign-in, core creates the trial org's default environment at startup;</text>
<text x="320" y="564" class="anote">the gateway module seeds the bundled gateway and its token.</text>
<text x="975" y="510" class="anote">amp installs the gateway module by default; amp-core lacks it.</text>
<text x="975" y="528" class="anote">Its tables are named mod_ai_gateway_&lt;table&gt;.</text>
<text x="2202" y="1716" class="anote">Core tables; module-owned tables are mod_&lt;module&gt;_&lt;table&gt;.</text>
<text x="2402" y="1114" class="anote">No foreign keys: rows outlive what they describe.</text>
<text x="2380" y="214" class="anote2">Referenced by secret_id from event</text>
<text x="2380" y="233" class="anote2">destinations. Modules keep theirs by path</text>
<text x="2380" y="252" class="anote2">(the AI Gateway's LLM providers, LLM proxies,</text>
<text x="2380" y="271" class="anote2">MCP endpoints and A2A proxies, owner kind</text>
<text x="2380" y="290" class="anote2">mod:ai-gateway), deleted with the owning row</text>
<text x="2380" y="309" class="anote2">or when the module is purged.</text>
<text x="2380" y="328" class="anote2"></text>
<text x="2380" y="347" class="anote2">Production can keep values in an external</text>
<text x="2380" y="366" class="anote2">vault instead (provider + external_ref).</text>
<text x="347" y="614" class="alabel">labels and identity go with the agent; dashed gateway rows go when the gateway tears the agent down</text>

<text x="625.0" y="232.0" text-anchor="middle" class="alabel">has one</text>

<text x="364" y="236" class="cpurpose" fill="#334155">Not stored: the caller's token</text>

<text x="843" y="213" class="badge" text-anchor="middle">HIDDEN</text>
<text x="674" y="228" class="ctable">environments</text>
<text x="674" y="250" class="cpurpose" fill="#334155">Exactly one per org, named</text>
<text x="674" y="266" class="cpurpose" fill="#334155">default; it is what makes the</text>
<text x="674" y="282" class="cpurpose" fill="#334155">org exist here. Created at</text>
<text x="674" y="298" class="cpurpose" fill="#334155">startup for the file sign-in</text>
<text x="674" y="314" class="cpurpose" fill="#334155">trial org, else on the org's</text>
<text x="674" y="330" class="cpurpose" fill="#334155">first request. Never shown in or</text>
<text x="674" y="346" class="cpurpose" fill="#334155">accepted by the API or console.</text>
<text x="674" y="364" class="crel" fill="#2563eb">Kept so more environments can come</text>
<text x="674" y="378" class="crel" fill="#2563eb">later with no table changes.</text>

<text x="2064" y="1180" class="ctable">audit_events</text>
<text x="2064" y="1202" class="cpurpose" fill="#0f172a">One row per console or API action. Insert only; old</text>
<text x="2064" y="1218" class="cpurpose" fill="#0f172a">rows aged out.</text>
<line x1="2064" y1="1227" x2="2398" y2="1227" stroke="#e2e8f0"/>
<text x="2064" y="1244"><tspan class="fkey">org_id</tspan><tspan class="fnote" dx="7">no FK, empty if none</tspan></text>
<text x="2064" y="1260"><tspan class="fkey">occurred_at</tspan></text>
<text x="2064" y="1276"><tspan class="fkey">action</tspan><tspan class="fnote" dx="7">e.g. agent.delete</tspan></text>
<text x="2064" y="1292"><tspan class="fkey">actor_id</tspan><tspan class="fnote" dx="7">username</tspan></text>
<text x="2064" y="1308"><tspan class="fkey">resource_type, resource_id</tspan></text>
<text x="2064" y="1324"><tspan class="fkey">outcome</tspan><tspan class="fnote" dx="7">success | failure | deny</tspan></text>
</g>
<g class="card" id="card-usage">
<rect x="2440" y="1142" width="380" height="184" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.6" filter="url(#shadow)"/>
<rect x="2440" y="1142" width="6" height="184" rx="3" fill="#b45309"/>
<text x="2454" y="1166" class="ctitle" fill="#0f172a">Usage event</text>
<text x="2454" y="1180" class="ctable">usage_events</text>
<text x="2454" y="1202" class="cpurpose" fill="#0f172a">Console and API feature usage. Store and export only.</text>
<line x1="2454" y1="1211" x2="2808" y2="1211" stroke="#e2e8f0"/>
<text x="2454" y="1228"><tspan class="fkey">org_id</tspan><tspan class="fnote" dx="7">no FK, empty if none</tspan></text>
<text x="2454" y="1244"><tspan class="fkey">occurred_at</tspan></text>
<text x="2454" y="1260"><tspan class="fkey">source</tspan><tspan class="fnote" dx="7">api | console</tspan></text>
<text x="2454" y="1276"><tspan class="fkey">feature_code</tspan></text>
<text x="2454" y="1292"><tspan class="fkey">username</tspan></text>
<text x="2454" y="1308"><tspan class="fkey">dimensions</tspan><tspan class="fnote" dx="7">JSON</tspan></text>
</g>
<g class="card" id="card-locks">
<rect x="2050" y="1452" width="360" height="182" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.6" filter="url(#shadow)"/>
<rect x="2050" y="1452" width="6" height="182" rx="3" fill="#475569"/>
<text x="2064" y="1476" class="ctitle" fill="#0f172a">Lock</text>
<text x="2064" y="1490" class="ctable">locks</text>
<text x="2064" y="1512" class="cpurpose" fill="#0f172a">A lease that lets only one instance run a singleton</text>
<text x="2064" y="1528" class="cpurpose" fill="#0f172a">worker.</text>
<text x="2064" y="1546" class="crel" fill="#475569">The gateway's drift-scan lease is in its own</text>
<text x="2064" y="1560" class="crel" fill="#475569">mod_ai_gateway_locks.</text>
<line x1="2064" y1="1567" x2="2398" y2="1567" stroke="#e2e8f0"/>
<text x="2064" y="1584"><tspan class="fkey">name</tspan><tspan class="fnote" dx="7">e.g. agent_identity.reconciler</tspan></text>
<text x="2064" y="1600"><tspan class="fkey">owner</tspan><tspan class="fnote" dx="7">empty = free</tspan></text>
<text x="2064" y="1616"><tspan class="fkey">expires_at</tspan></text>
</g>
<g class="card" id="card-queues">
<rect x="2440" y="1452" width="380" height="140" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.6" filter="url(#shadow)"/>
<rect x="2440" y="1452" width="6" height="140" rx="3" fill="#475569"/>
<text x="2454" y="1476" class="ctitle" fill="#0f172a">Queue columns</text>
<text x="2454" y="1490" class="ctable">claimed_by, claimed_until</text>
<text x="2454" y="1512" class="cpurpose" fill="#0f172a">Rows a worker claims carry a lease instead of a lock:</text>
<text x="2454" y="1528" class="cpurpose" fill="#0f172a">agent identities, agent cards, deployment status, event</text>
<text x="2454" y="1544" class="cpurpose" fill="#0f172a">outbox, event deliveries, module event deliveries.</text>
<rect x="2454" y="1558" width="89" height="18" rx="9" fill="#e0e7ff"/>
<text x="2499" y="1571" class="chip" fill="#3730a3" text-anchor="middle">worker queue</text>
</g>
<g class="card" id="card-modules">
<rect x="2050" y="1744" width="240" height="216" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6" filter="url(#shadow)"/>
<rect x="2050" y="1744" width="6" height="216" rx="3" fill="#0f766e"/>
<text x="2064" y="1768" class="ctitle" fill="#0f172a">Module</text>
<text x="2064" y="1782" class="ctable">modules, module_generation</text>
<text x="2064" y="1804" class="cpurpose" fill="#0f172a">Install and enable state of each</text>
<text x="2064" y="1820" class="cpurpose" fill="#0f172a">compiled-in module; no row =</text>
<text x="2064" y="1836" class="cpurpose" fill="#0f172a">available (purge deletes it).</text>
<text x="2064" y="1852" class="cpurpose" fill="#0f172a">Every change bumps the generation;</text>
<text x="2064" y="1868" class="cpurpose" fill="#0f172a">replicas poll it.</text>
<line x1="2064" y1="1877" x2="2278" y2="1877" stroke="#e2e8f0"/>
<text x="2064" y="1894"><tspan class="fkey">name</tspan></text>
<text x="2064" y="1910"><tspan class="fkey">version</tspan></text>
<text x="2064" y="1926"><tspan class="fkey">state</tspan></text>
<text x="2080" y="1942" class="fnote">active | disabled | uninstalled</text>
</g>
<g class="card" id="card-modmig">
<rect x="2315" y="1744" width="240" height="152" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6" filter="url(#shadow)"/>
<rect x="2315" y="1744" width="6" height="152" rx="3" fill="#0f766e"/>
<text x="2329" y="1768" class="ctitle" fill="#0f172a">Module migration</text>
<text x="2329" y="1782" class="ctable">module_migrations</text>
<text x="2329" y="1804" class="cpurpose" fill="#0f172a">Each module's applied migrations.</text>
<text x="2329" y="1820" class="cpurpose" fill="#0f172a">Module tables are named</text>
<text x="2329" y="1836" class="cpurpose" fill="#0f172a">mod_&lt;module&gt;_&lt;table&gt;.</text>
<line x1="2329" y1="1845" x2="2543" y2="1845" stroke="#e2e8f0"/>
<text x="2329" y="1862"><tspan class="fkey">module, version</tspan></text>
<text x="2329" y="1878"><tspan class="fkey">checksum</tspan><tspan class="fnote" dx="7">sha256</tspan></text>
</g>
<g class="card" id="card-modev">
<rect x="2580" y="1744" width="240" height="226" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6" filter="url(#shadow)"/>
<rect x="2580" y="1744" width="6" height="226" rx="3" fill="#0f766e"/>
<text x="2594" y="1768" class="ctitle" fill="#0f172a">Module event</text>
<text x="2594" y="1782" class="ctable">module_events,</text>
<text x="2594" y="1796" class="ctable">module_event_deliveries</text>
<text x="2594" y="1818" class="cpurpose" fill="#0f172a">Events for modules, one delivery</text>
<text x="2594" y="1834" class="cpurpose" fill="#0f172a">per subscribing module, retried</text>
<text x="2594" y="1850" class="cpurpose" fill="#0f172a">with backoff.</text>
<line x1="2594" y1="1859" x2="2808" y2="1859" stroke="#e2e8f0"/>
<text x="2594" y="1876"><tspan class="fkey">org_id</tspan><tspan class="fnote" dx="7">org's id, no FK</tspan></text>
<text x="2594" y="1892"><tspan class="fkey">type</tspan><tspan class="fnote" dx="7">e.g. agent.created</tspan></text>
<text x="2594" y="1908"><tspan class="fkey">source</tspan><tspan class="fnote" dx="7">core or a module</tspan></text>
<text x="2594" y="1924"><tspan class="fkey">attempts</tspan></text>
<rect x="2594" y="1934" width="89" height="18" rx="9" fill="#e0e7ff"/>
<text x="2639" y="1947" class="chip" fill="#3730a3" text-anchor="middle">worker queue</text>
</g>
<g class="card" id="card-wlcred">
<rect x="2050" y="1994" width="240" height="246" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6" filter="url(#shadow)"/>
<rect x="2050" y="1994" width="6" height="246" rx="3" fill="#0f766e"/>
<text x="2064" y="2018" class="ctitle" fill="#0f172a">Workload credential</text>
<text x="2064" y="2032" class="ctable">workload_credentials,</text>
<text x="2064" y="2046" class="ctable">workload_instances</text>
<text x="2064" y="2068" class="cpurpose" fill="#0f172a">A module workload's credential,</text>
<text x="2064" y="2084" class="cpurpose" fill="#0f172a">presented in heartbeats for</text>
<text x="2064" y="2100" class="cpurpose" fill="#0f172a">short-lived tokens, and the</text>
<text x="2064" y="2116" class="cpurpose" fill="#0f172a">instances that heartbeat. Only a</text>
<text x="2064" y="2132" class="cpurpose" fill="#0f172a">hash is kept.</text>
<line x1="2064" y1="2141" x2="2278" y2="2141" stroke="#e2e8f0"/>
<text x="2064" y="2158"><tspan class="fkey">org_id</tspan><tspan class="fnote" dx="7">org's id, optional</tspan></text>
<text x="2064" y="2174"><tspan class="fkey">module, workload</tspan></text>
<text x="2064" y="2190"><tspan class="fkey">subject</tspan></text>
<text x="2064" y="2206"><tspan class="fkey">revoked_at</tspan></text>
<text x="2064" y="2222"><tspan class="fkey">last_seen</tspan><tspan class="fnote" dx="7">per instance</tspan></text>
</g>
<g class="card" id="card-d_eval">
<rect x="60" y="2350" width="360" height="112" rx="9" fill="#fafafa" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#shadow)"/>
<text x="74" y="2374" class="ctitle" fill="#64748b">Evaluation</text>
<text x="74" y="2388" class="ctable">monitors, runs, scores, evaluators, alerts,</text>
<text x="74" y="2402" class="ctable">eval credentials</text>
<text x="74" y="2424" class="cpurpose" fill="#64748b">Not in Lite; returns as a module. Its credentials</text>
<text x="74" y="2440" class="cpurpose" fill="#64748b">would live in secrets.</text>
</g>
<g class="card" id="card-d_host">
<rect x="444" y="2350" width="360" height="112" rx="9" fill="#fafafa" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#shadow)"/>
<text x="458" y="2374" class="ctitle" fill="#64748b">Hosted-agent runtime</text>
<text x="458" y="2388" class="ctable">builds, deployments, env vars, resources,</text>
<text x="458" y="2402" class="ctable">git credentials, agent kinds</text>
<text x="458" y="2424" class="cpurpose" fill="#64748b">Lite only connects external agents. Added if hosted</text>
<text x="458" y="2440" class="cpurpose" fill="#64748b">agents come to Lite.</text>
</g>
<g class="card" id="card-d_pmcp">
<rect x="828" y="2350" width="360" height="112" rx="9" fill="#fafafa" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#shadow)"/>
<text x="842" y="2374" class="ctitle" fill="#64748b">Project MCP proxies</text>
<text x="842" y="2396" class="cpurpose" fill="#64748b">Exposing a hosted agent's own MCP endpoint. Deferred.</text>
</g>
<g class="card" id="card-d_envs">
<rect x="1212" y="2350" width="360" height="112" rx="9" fill="#fafafa" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#shadow)"/>
<text x="1226" y="2374" class="ctitle" fill="#64748b">More environments</text>
<text x="1226" y="2388" class="ctable">environment rows, deployment pipeline,</text>
<text x="1226" y="2402" class="ctable">per-env Thunder</text>
<text x="1226" y="2424" class="cpurpose" fill="#64748b">Full product only. Per-environment tables already</text>
<text x="1226" y="2440" class="cpurpose" fill="#64748b">carry environment_id.</text>
</g>
<g class="card" id="card-o_thunder">
<rect x="1626" y="2350" width="360" height="112" rx="9" fill="#fafafa" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#shadow)"/>
<text x="1640" y="2374" class="ctitle" fill="#64748b">Thunder</text>
<text x="1640" y="2388" class="ctable">own database</text>
<text x="1640" y="2410" class="cpurpose" fill="#64748b">Issues agent identities. Ours stores only the IDs it</text>
<text x="1640" y="2426" class="cpurpose" fill="#64748b">returns. One Thunder per install, set in config.</text>
</g>
<g class="card" id="card-o_obs">
<rect x="2010" y="2350" width="360" height="112" rx="9" fill="#fafafa" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#shadow)"/>
<text x="2024" y="2374" class="ctitle" fill="#64748b">Traces, logs, metrics</text>
<text x="2024" y="2388" class="ctable">observability module (later)</text>
<text x="2024" y="2410" class="cpurpose" fill="#64748b">Not stored in Lite. When observability returns as a</text>
<text x="2024" y="2426" class="cpurpose" fill="#64748b">module, they live in its own store, not this</text>
<text x="2024" y="2442" class="cpurpose" fill="#64748b">database.</text>
</g>
<g class="card" id="card-o_users">
<rect x="2394" y="2350" width="360" height="112" rx="9" fill="#fafafa" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#shadow)"/>
<text x="2408" y="2374" class="ctitle" fill="#64748b">Users and roles</text>
<text x="2408" y="2388" class="ctable">config file</text>
<text x="2408" y="2410" class="cpurpose" fill="#64748b">Console sign-in and role mapping come from a file.</text>
<text x="2408" y="2426" class="cpurpose" fill="#64748b">Tables refer to users by username.</text>
</g>
</svg>
