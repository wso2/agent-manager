# =============================================================================
# WSO2 Agent Manager — Feature Taxonomy
# =============================================================================
# Schema   : https://wso2.com/schemas/feature-taxonomy/v1
# Product  : WSO2 Agent Manager (AMP)
# Maintainer: Agent Manager Engineering Team
#
# This file describes what the product actually emits. Server-side events come
# from growthanalytics.Track wrappers in agent-manager-service/api/*_routes.go;
# console events are the closed allowlist in console.go. Event codes and
# dimension values listed here are the exact strings the code sends, and they
# are already in production data: change the file to match the code, never the
# other way round.
#
# Features that exist in the product but have no Track call yet carry a
# "Not emitted yet" comment in their tracking block.
#
# Every event also carries this metadata (track.go / console.go buildMetadata),
# which is not repeated per feature:
#   platform          string  always "Agent Manager"
#   source            enum    "api" | "console"
#   growth_action     string  the feature code
#   product_version   string
#   deployment_model  string
#   environment       string  optional
#
# Changes: treat a removed or renamed code or enum value as breaking. Codes are
# permanent; retire one with status: deprecated and availability.deprecated_in.
# =============================================================================

schema:
  version: "1.0.0"
  id: "https://wso2.com/schemas/feature-taxonomy/v1"

# -----------------------------------------------------------------------------
# PRODUCT
# -----------------------------------------------------------------------------

product:
  id: "amp"
  name: "WSO2 Agent Manager"
  version: "1.0.0"
  description: "Enterprise control plane to deploy, manage, govern, and observe AI agents at scale, built on OpenChoreo."
  team_owner: "agent-manager-engineering"
  category: "developer-platform"
  is_active: true

# -----------------------------------------------------------------------------
# FEATURE CATEGORIES
# Flat on purpose: the skeleton requires a feature's category to be its most
# specific category id AND the second segment of its code. The emitted codes
# are amp.connections.* and amp.console.*, so those categories cannot be split
# into sub-categories without renaming live events.
# -----------------------------------------------------------------------------

categories:
  - id: "agent-development"
    name: "Agent Development"
    description: "Creating, configuring, and building agents, including binding them to the LLM models and MCP tools they use."

  - id: "deployment-ops"
    name: "Deployment & Operations"
    description: "Projects, environments, gateways, deployment pipelines, A2A exposure, and the agent deployment/promotion lifecycle."

  - id: "connections"
    name: "Connections"
    description: "Managed connections to LLM providers, LLM proxies, and MCP servers that agents call through the gateway: registering, deploying, scoping, and issuing credentials for them."

  - id: "security-access"
    name: "Security & Access"
    description: "Runtime identity, tokens, and API keys that let agents (and the configs bound to them) authenticate."

  - id: "org-management"
    name: "Organization Management"
    description: "Human user, group, role, and permission management at the organization level."

  - id: "source-control"
    name: "Source Control Integration"
    description: "Git credential management and repository browsing used to build agents from source."

  - id: "discovery"
    name: "Discovery & Templates"
    description: "Discovery and reuse of agent kinds/templates, the org catalog, and available build options. Not a cross-org marketplace like Choreo's — this is in-org template/catalog reuse."

  - id: "observability"
    name: "Observability"
    description: "Monitors, alerting, custom evaluators, and quality scores for deployed agents."

  - id: "events"
    name: "Events & Webhooks"
    description: "Outbound event destinations and the org, project, and agent subscriptions that route platform events to them."

  - id: "console"
    name: "Console Experience"
    description: "UI-only behaviour reported by the console, none of which reaches an API route. The third code segment groups it: navigation, intent, onboarding, playground, observability, utility, friction (errors, empty states, permission denials, expired sessions), and session."

# -----------------------------------------------------------------------------
# FEATURES
# code convention: amp.<category-id>.<action>
#   Console features use amp.console.<group>.<action>.
# -----------------------------------------------------------------------------

features:

  # ============================================================
  # AGENT DEVELOPMENT
  # ============================================================

  - code: "amp.agent-development.create-agent"
    name: "Agent Creation"
    description: "Register a new agent within a project, either from scratch or from an agent kind template."
    category: "agent-development"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.agent-development.create-agent"
      event_category: "adoption"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["created-agent"]
          required: true
        - name: "creation_method"
          type: "enum"
          values: ["external", "from-kind", "platform-hosted"]
          required: false
          description: "Provisioning method, set after the create request is validated."
      aggregations:
        - type: "count"
          label: "Agents Created"

  - code: "amp.agent-development.update-agent"
    name: "Agent Configuration Update"
    description: "Update an agent's basic info, build parameters, resource configs, deploy settings, or runtime configurations."
    category: "agent-development"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.agent-development.update-agent"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "update_target"
          type: "enum"
          values: ["basic-info", "build-parameters", "resource-configs", "configurations", "deploy-settings"]
          required: true
      aggregations:
        - type: "count"
          label: "Agent Updates"
        - type: "count_distinct"
          dimension: "update_target"
          label: "Update Targets Touched"

  - code: "amp.agent-development.bind-model-config"
    name: "Agent Model Binding"
    description: "Bind a specific agent to an LLM model configuration it should use at runtime — the link between an agent and a Connections-managed LLM provider/proxy."
    category: "agent-development"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.agent-development.bind-model-config"
      event_category: "adoption"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["created-model-config-binding", "updated-model-config-binding", "deleted-model-config-binding"]
          required: true
      aggregations:
        - type: "count"
          label: "Model Config Bindings"

  - code: "amp.agent-development.bind-mcp-config"
    name: "Agent MCP Binding"
    description: "Bind a specific agent to an MCP server configuration it should use at runtime — the link between an agent and a Connections-managed MCP proxy."
    category: "agent-development"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.agent-development.bind-mcp-config"
      event_category: "adoption"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["created-mcp-config-binding", "updated-mcp-config-binding", "deleted-mcp-config-binding"]
          required: true
      aggregations:
        - type: "count"
          label: "MCP Config Bindings"

  - code: "amp.agent-development.build-agent"
    name: "Agent Build"
    description: "Trigger a build of an agent from its source repository into a deployable artifact."
    category: "agent-development"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.agent-development.build-agent"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["built-agent"]
          required: true
        - name: "outcome"
          type: "enum"
          values: ["success", "failure"]
          required: true
          description: "Derived from the HTTP status of the build request, not the build result."
      aggregations:
        - type: "count"
          label: "Agent Builds Triggered"

  - code: "amp.agent-development.publish-kind"
    name: "Publish Agent as Kind"
    description: "Publish an existing agent as a reusable agent kind/template, making it discoverable in the org catalog."
    category: "agent-development"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.agent-development.publish-kind"
      event_category: "adoption"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["published-agent-as-kind"]
          required: true
      aggregations:
        - type: "count"
          label: "Agents Published as Kinds"

  - code: "amp.agent-development.delete-agent"
    name: "Agent Deletion"
    description: "Permanently remove an agent and its associated deployments."
    category: "agent-development"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.agent-development.delete-agent"
      event_category: "abandonment"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["deleted-agent"]
          required: true
      aggregations:
        - type: "count"
          label: "Agents Deleted"

  # ============================================================
  # DEPLOYMENT & OPERATIONS
  # ============================================================

  - code: "amp.deployment-ops.deploy-agent"
    name: "Agent Deployment"
    description: "Deploy a built agent to an environment, making it live behind the gateway."
    category: "deployment-ops"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.deployment-ops.deploy-agent"
      event_category: "adoption"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["deployed-agent"]
          required: true
        - name: "environment_type"
          type: "string"
          required: false
          description: "Target environment name returned by a successful deployment; values are deployment-specific."
      aggregations:
        - type: "count"
          label: "Agent Deployments"
    sub_features:
      - code: "amp.deployment-ops.deploy-agent.promote"
        name: "Agent Promotion"
        description: "Promote an agent's deployment along the deployment pipeline (e.g. staging to production)."
        category: "deployment-ops"
        tier: "core"
        status: "stable"
        availability:
          introduced_in: "1.0.0"
        tracking:
          event_name: "amp.deployment-ops.deploy-agent.promote"
          event_category: "adoption"
          platforms: ["web", "api"]
          dimensions:
            - name: "action"
              type: "enum"
              values: ["promoted-agent-deployment"]
              required: true
          aggregations:
            - type: "count"
              label: "Agent Promotions"
      - code: "amp.deployment-ops.deploy-agent.suspend"
        name: "Agent Deployment Suspend/Resume"
        description: "Change a deployment's running state (suspend or resume) without redeploying."
        category: "deployment-ops"
        tier: "core"
        status: "stable"
        availability:
          introduced_in: "1.0.0"
        tracking:
          # Not emitted yet (no Track call); the dimensions below are planned.
          event_name: "amp.deployment-ops.deploy-agent.suspend"
          event_category: "engagement"
          platforms: ["web", "api"]
          dimensions:
            - name: "action"
              type: "enum"
              values: ["suspended-agent-deployment", "resumed-agent-deployment"]
              required: true
          aggregations:
            - type: "count"
              label: "Deployment State Changes"

  - code: "amp.deployment-ops.create-project"
    name: "Project Management"
    description: "Create, update, or delete a project that groups related agents and LLM proxies."
    category: "deployment-ops"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.deployment-ops.create-project"
      event_category: "adoption"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["created-project", "updated-project", "deleted-project"]
          required: true
      aggregations:
        - type: "count"
          label: "Project Changes"

  - code: "amp.deployment-ops.create-environment"
    name: "Environment Management"
    description: "Create, update, or delete a deployment environment (e.g. dev, staging, production) within an organization."
    category: "deployment-ops"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.deployment-ops.create-environment"
      event_category: "adoption"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["created-environment", "updated-environment", "deleted-environment"]
          required: true
      aggregations:
        - type: "count"
          label: "Environment Changes"
    sub_features:
      - code: "amp.deployment-ops.create-environment.thunder-system-client"
        name: "Thunder Identity Configuration"
        description: "Configure or remove the Thunder (identity provider) URL and system client bound to an environment."
        category: "deployment-ops"
        tier: "core"
        status: "stable"
        availability:
          introduced_in: "1.0.0"
        tracking:
          # Not emitted yet (no Track call); the dimensions below are planned.
          event_name: "amp.deployment-ops.create-environment.thunder-system-client"
          event_category: "engagement"
          platforms: ["web", "api"]
          dimensions:
            - name: "action"
              type: "enum"
              values: ["configured-thunder-system-client", "removed-thunder-system-client", "configured-thunder-url", "removed-thunder-url"]
              required: true
          aggregations:
            - type: "count"
              label: "Thunder Configuration Changes"

  - code: "amp.deployment-ops.register-gateway"
    name: "Gateway Registration"
    description: "Register, update, or delete a data-plane gateway, including self-hosted gateways."
    category: "deployment-ops"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.deployment-ops.register-gateway"
      event_category: "adoption"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["registered-gateway", "updated-gateway", "deleted-gateway"]
          required: true
      aggregations:
        - type: "count"
          label: "Gateway Changes"
    sub_features:
      - code: "amp.deployment-ops.register-gateway.assign-environment"
        name: "Gateway-to-Environment Assignment"
        description: "Assign or remove a gateway from an environment."
        category: "deployment-ops"
        tier: "core"
        status: "stable"
        availability:
          introduced_in: "1.0.0"
        tracking:
          event_name: "amp.deployment-ops.register-gateway.assign-environment"
          event_category: "engagement"
          platforms: ["web", "api"]
          dimensions:
            - name: "action"
              type: "enum"
              values: ["assigned-gateway-to-environment", "removed-gateway-from-environment"]
              required: true
          aggregations:
            - type: "count"
              label: "Gateway-Environment Assignment Changes"
      - code: "amp.deployment-ops.register-gateway.identity-provider"
        name: "Gateway Identity Provider Configuration"
        description: "Configure or remove an OIDC identity provider on a gateway. OIDC discovery is a read and is not tracked."
        category: "deployment-ops"
        tier: "core"
        status: "stable"
        availability:
          introduced_in: "1.0.0"
        tracking:
          event_name: "amp.deployment-ops.register-gateway.identity-provider"
          event_category: "engagement"
          platforms: ["web", "api"]
          dimensions:
            - name: "action"
              type: "enum"
              values: ["configured-gateway-identity-provider", "removed-gateway-identity-provider"]
              required: true
          aggregations:
            - type: "count"
              label: "Gateway Identity Provider Changes"
      - code: "amp.deployment-ops.register-gateway.token"
        name: "Gateway Token Management"
        description: "Rotate or revoke a gateway's registration token (managed and self-hosted gateways)."
        category: "deployment-ops"
        tier: "core"
        status: "stable"
        availability:
          introduced_in: "1.0.0"
        tracking:
          event_name: "amp.deployment-ops.register-gateway.token"
          event_category: "engagement"
          platforms: ["web", "api"]
          dimensions:
            - name: "action"
              type: "enum"
              values: ["rotated-gateway-token", "revoked-gateway-token"]
              required: true
          aggregations:
            - type: "count"
              label: "Gateway Token Operations"

  - code: "amp.deployment-ops.deployment-pipeline"
    name: "Deployment Pipeline Configuration"
    description: "Create, update, or delete an organization or project deployment pipeline defining environment promotion order."
    category: "deployment-ops"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.deployment-ops.deployment-pipeline"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["created-deployment-pipeline", "updated-deployment-pipeline", "deleted-deployment-pipeline"]
          required: true
      aggregations:
        - type: "count"
          label: "Deployment Pipeline Changes"

  - code: "amp.deployment-ops.a2a-proxy"
    name: "A2A Proxy"
    description: "Expose, refresh, or remove an agent's per-environment A2A (agent-to-agent) proxy."
    category: "deployment-ops"
    tier: "core"
    status: "beta"
    availability:
      introduced_in: "2026.12.0"
    tracking:
      # Not emitted yet (no Track call); the dimensions below are planned.
      event_name: "amp.deployment-ops.a2a-proxy"
      event_category: "adoption"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["configured-a2a-proxy", "refreshed-a2a-proxy", "removed-a2a-proxy"]
          required: true
      aggregations:
        - type: "count"
          label: "A2A Proxy Changes"

  - code: "amp.deployment-ops.agent-card"
    name: "A2A Agent Card"
    description: "Set, refresh, or remove the source of an agent's per-environment A2A agent card."
    category: "deployment-ops"
    tier: "core"
    status: "beta"
    availability:
      introduced_in: "2026.12.0"
    tracking:
      # Not emitted yet (no Track call); the dimensions below are planned.
      event_name: "amp.deployment-ops.agent-card"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["set-agent-card-source", "refreshed-agent-card", "removed-agent-card-source"]
          required: true
      aggregations:
        - type: "count"
          label: "Agent Card Changes"

  # ============================================================
  # CONNECTIONS
  # ============================================================

  - code: "amp.connections.create-llm-provider"
    name: "LLM Provider Management"
    description: "Register, update, or delete an LLM provider configuration, or change whether it is listed in the org catalog."
    category: "connections"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.connections.create-llm-provider"
      event_category: "adoption"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["created-llm-provider", "updated-llm-provider", "deleted-llm-provider", "updated-llm-provider-catalog-status"]
          required: true
        - name: "from_template"
          type: "boolean"
          required: false
          description: "True when creating from a provider template, false when configuring from scratch; absent on other actions."
        - name: "provider_type"
          type: "string"
          required: false
          description: "Provider template handle (for example openai, azure-openai, or awsbedrock); present only when creating from a template."
      aggregations:
        - type: "count"
          label: "LLM Provider Changes"
    sub_features:
      - code: "amp.connections.create-llm-provider.template"
        name: "LLM Provider Template Management"
        description: "Create, update, or delete a reusable LLM provider template."
        category: "connections"
        tier: "core"
        status: "stable"
        availability:
          introduced_in: "1.0.0"
        tracking:
          event_name: "amp.connections.create-llm-provider.template"
          event_category: "engagement"
          platforms: ["web", "api"]
          dimensions:
            - name: "action"
              type: "enum"
              values: ["created-provider-template", "updated-provider-template", "deleted-provider-template"]
              required: true
          aggregations:
            - type: "count"
              label: "LLM Provider Template Changes"

  - code: "amp.connections.deploy-llm-provider"
    name: "LLM Provider Deployment"
    description: "Deploy, undeploy, restore, or delete an LLM provider's gateway-facing deployment. Deleting a deployment is reported as an undeploy."
    category: "connections"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.connections.deploy-llm-provider"
      event_category: "adoption"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["deployed-llm-provider", "undeployed-llm-provider", "restored-llm-provider-deployment"]
          required: true
      aggregations:
        - type: "count"
          label: "LLM Provider Deployment Actions"

  - code: "amp.connections.llm-provider-api-key"
    name: "LLM Provider Consumer API Key"
    description: "Issue, rotate, or revoke an API key that lets consumers call a deployed LLM provider directly."
    category: "connections"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.connections.llm-provider-api-key"
      event_category: "adoption"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["issued-provider-api-key", "rotated-provider-api-key", "revoked-provider-api-key"]
          required: true
      aggregations:
        - type: "count"
          label: "LLM Provider API Key Operations"

  - code: "amp.connections.create-llm-proxy"
    name: "LLM Proxy Management"
    description: "Create, update, or delete a project-scoped LLM proxy that fronts one or more LLM providers with policy enforcement."
    category: "connections"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      # Not emitted yet (no Track call); the dimensions below are planned.
      event_name: "amp.connections.create-llm-proxy"
      event_category: "adoption"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["created-llm-proxy", "updated-llm-proxy", "deleted-llm-proxy"]
          required: true
      aggregations:
        - type: "count"
          label: "LLM Proxy Changes"

  - code: "amp.connections.deploy-llm-proxy"
    name: "LLM Proxy Deployment"
    description: "Deploy, undeploy, restore, or delete an LLM proxy's gateway-facing deployment."
    category: "connections"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      # Not emitted yet (no Track call); the dimensions below are planned.
      event_name: "amp.connections.deploy-llm-proxy"
      event_category: "adoption"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["deployed-llm-proxy", "undeployed-llm-proxy", "restored-llm-proxy-deployment"]
          required: true
      aggregations:
        - type: "count"
          label: "LLM Proxy Deployment Actions"

  - code: "amp.connections.llm-proxy-api-key"
    name: "LLM Proxy Consumer API Key"
    description: "Issue, rotate, or revoke an API key that lets consumers call an LLM proxy."
    category: "connections"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      # Not emitted yet (no Track call); the dimensions below are planned.
      event_name: "amp.connections.llm-proxy-api-key"
      event_category: "adoption"
      platforms: ["web", "api"]
      dimensions:
        - name: "action"
          type: "enum"
          values: ["issued-proxy-api-key", "rotated-proxy-api-key", "revoked-proxy-api-key"]
          required: true
      aggregations:
        - type: "count"
          label: "LLM Proxy API Key Operations"

  - code: "amp.connections.create-mcp-proxy"
    name: "MCP Proxy Management"
    description: "Register, update, or delete an MCP (Model Context Protocol) server as a governed proxy resource, or probe a server via fetch-server-info first."
    category: "connections"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "1.0.0"
    tracking:
      event_name: "amp.connections.create-mcp-proxy"
      event_category: "adoption"
