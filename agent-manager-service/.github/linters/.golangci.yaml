version: "2"
run:
  concurrency: 4
  go: 1.23.2
  modules-download-mode: readonly
  allow-parallel-runners: false
linters:
  enable:
    - errorlint
    - exhaustruct
    - forbidigo
    - goheader
    - grouper
    - nilerr
    - nilnil
    - nolintlint
    - reassign
    - sloglint
    - wastedassign
  disable:
    - revive
    - unused
  settings:
    # Only the context logger carries the correlation ID, so a package-level
    # slog call on a request path emits a line that cannot be tied back to the
    # request that produced it. Startup, shutdown and migrations have no
    # request and are excluded below.
    forbidigo:
      forbid:
        - pattern: ^slog\.(Info|Warn|Error|Debug)(Context)?$
          msg: use logger.GetLogger(ctx) so the record carries the correlation ID (see docs/logging.md)
      # Matched on the source expression: `slog.Info` is a package-level
      # function, not a method on a type forbidigo could resolve.
      analyze-types: false
    sloglint:
      # Catches the alternating key/value form being broken — a bare value in a
      # key position serialises as "!BADKEY" and the record loses the field.
      no-mixed-args: true
      key-naming-case: snake
    exhaustruct:
      include:
        - .*\.Test
        - example\.com/package\.ExampleStruct[\d]{1,2}
        - github.com/wso2-enterprise/agent-manager-service/models\..*
        - github.com/wso2-enterprise/agent-manager-service/spec\..*
        - github.com/wso2-enterprise/agent-manager-service/wiring\..*
      exclude:
        - github.com/wso2-enterprise/agent-manager-service/spec\.DBServerMetricsDataItemData
        - github.com/wso2-enterprise/agent-manager-service/spec\.DbServerMetrics
        - github.com/wso2-enterprise/agent-manager-service/spec\.DbServerLogs
        - github.com/wso2-enterprise/agent-manager-service/spec\.DbServerBackups
        - github.com/wso2-enterprise/agent-manager-service/spec\.DBServerMetricsRow
        - github.com/wso2-enterprise/agent-manager-service/spec\.KafkaACLs
        - github.com/wso2-enterprise/agent-manager-service/spec\.MySqlQueryStats
        - github.com/wso2-enterprise/agent-manager-service/spec\.DBServerMetricsRow
        - github.com/wso2-enterprise/agent-manager-service/spec\.DBServerStateConnectionParams
        - github.com/wso2-enterprise/agent-manager-service/spec\.PostgresQueryStats
    goheader:
      template-path: .github/copyright_header.tmpl
      values:
        regexp:
          YEAR: "\\d{4}"
  exclusions:
    generated: lax
    rules:
      - path: env_reader.go
        text: non-wrapping format verb for fmt.Errorf
      - linters:
          - exhaustruct
        path: repositories.*go
      - linters:
          - exhaustruct
        path: \_test.go
      # No request context exists during startup, shutdown or migrations.
      - linters:
          - forbidigo
        path: (app|config|db|server|db_migrations)/
      # These repository methods predate the context convention and take no
      # context.Context, so their logs cannot reach the request logger. Give
      # them the exemption rather than deleting logs that already exist;
      # threading a context through the repository interface (and its generated
      # mock) is a change worth making on its own terms.
      - linters:
          - forbidigo
        path: repositories/llm_provider_repository\.go
      - linters:
          - forbidigo
        path: main\.go
      - linters:
          - forbidigo
          - sloglint
        path: \_test.go
    paths:
      - agent-manager-service/spec
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - agent-manager-service/spec
      - third_party$
      - builtin$
      - examples$
