        projectName:
          type: string
          description: Optional project to associate the pipeline with
        promotionPaths:
          type: array
          description: Ordered list of promotion paths
          minItems: 1
          items:
            $ref: "#/components/schemas/PromotionPath"

    UpdateDeploymentPipelineRequest:
      type: object
      required:
        - promotionPaths
      properties:
        displayName:
          type: string
          description: Updated display name
        description:
          type: string
          description: Updated description
        promotionPaths:
          type: array
          description: Updated list of promotion paths
          minItems: 1
          items:
            $ref: "#/components/schemas/PromotionPath"

    DeploymentPipelineListResponse:
      type: object
      properties:
        deploymentPipelines:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentPipelineResponse"
        total:
          type: integer
