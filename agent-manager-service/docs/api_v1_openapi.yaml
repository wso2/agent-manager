      tags:
        - Events
      summary: Get an event destination
      operationId: getEventDestination
      responses:
        "200":
          description: Event destination, with the subscriptions that use it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDestinationResponse"
        "404":
          description: Event destination not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Events
      summary: Update an event destination
      description: |
        The kind cannot change. Narrowing availability so that subscriptions
