          type: string
    get:
      tags:
        - Events
      summary: List the organization's event destinations
      description: |
        Every destination with how many subscriptions use it and how its recent
        deliveries went. Callers who cannot manage destinations see their
        settings masked.
      operationId: listEventDestinations
      responses:
        "200":
          description: Event destinations
