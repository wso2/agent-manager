      properties:
        id:
          type: string
          description: Group ID
          example: "group-123"
        name:
          type: string
          description: Group name
          example: "developers"
        description:
          type: string
          description: Group description
          example: "Development team members"
        ouId:
          type: string
          description: Organization unit ID
          example: "ou-456"

    CreateGroupRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Group name
          minLength: 1
          example: "developers"
        description:
          type: string
          description: Group description
          example: "Development team members"

    UpdateGroupRequest:
      type: object
      properties:
        name:
          type: string
          description: Group name
          minLength: 1
        description:
          type: string
          description: Group description

    GroupListResponse:
      type: object
      required:
        - groups
        - total
        - offset
        - limit
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupResponse"
        total:
          type: integer
          description: Total number of groups
          example: 50
        offset:
          type: integer
          description: Number of results skipped
          example: 0
        limit:
          type: integer
          description: Maximum results returned
          example: 20

    RoleResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Role ID
          example: "role-123"
        name:
          type: string
          description: Role name
          example: "admin"
        description:
          type: string
          description: Role description
          example: "Administrator role with full access"
        isReadOnly:
          type: boolean
          description: Whether this is a predefined read-only role
          example: false
        ouId:
          type: string
          description: Organization unit ID
          example: "ou-456"
        permissions:
          type: array
          description: Role permissions
          items:
            type: object
            properties:
              resourceServerId:
                type: string
              permissions:
                type: array
                items:
                  type: string

    CreateRoleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Role name
          minLength: 1
          example: "developer"
        description:
          type: string
          description: Role description
          example: "Developer role with project management access"

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
          description: Role name
          minLength: 1
        description:
          type: string
          description: Role description

    RoleListResponse:
      type: object
      required:
        - roles
        - total
        - offset
        - limit
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleResponse"
        total:
          type: integer
          description: Total number of roles
          example: 10
        offset:
          type: integer
          description: Number of results skipped
          example: 0
        limit:
          type: integer
          description: Maximum results returned
          example: 20

    AgentProvisioningType:
      type: string
      description: Whether the agent runs on the platform (`internal`) or outside it (`external`)
      example: internal

    AgentThunderStatus:
      type: string
      description: |
        Provisioning status of one AgentID binding. Goes from `pending` to
        `in_progress` to `completed`, or to `failed` if it runs out of
        retries (5 attempts over about 15 minutes).
      enum:
        - pending
        - in_progress
        - completed
        - failed
      example: completed

    AgentIdentityEnvironmentView:
      type: object
      description: |
        One environment's AgentID binding. This is a safe view that never
        includes a secret. For an externally hosted agent, use
        `POST .../identities` (regenerate) to obtain one.
      required:
        - environmentName
        - provisioningType
        - status
      properties:
        environmentName:
          type: string
          description: Environment this binding belongs to
          example: production
        provisioningType:
          $ref: "#/components/schemas/AgentProvisioningType"
        status:
          $ref: "#/components/schemas/AgentThunderStatus"
        agentId:
          type: string
          description: |
            Thunder's own ID for this identity. This is different from
            `clientId`, which is the OAuth2 client ID. Empty until
            provisioning reaches Thunder.
          example: 3fa2c8e1-6b4d-4e2a-9c1a-2f8e7d5b1a90
        clientId:
          type: string
          description: OAuth2 client ID for this AgentID
          example: 9c1b7a44-3e2f-4d8a-b1c5-6a9f0e2d7c81
        lastError:
          type: string
          description: Short, user-safe reason the last provisioning attempt failed (never raw upstream/database error text)
        requestedBy:
          type: string
          description: Who requested this binding, kept for audit purposes only

    AgentIdentityActionRequest:
      type: object
      description: Request body for regenerating an AgentID secret
      required:
        - environment
      properties:
        environment:
          type: string
          description: Environment name to regenerate the AgentID secret in
          example: production

    AgentRegenerateSecretResponse:
      type: object
      description: Response for rotating an AgentID secret
      required:
        - environmentName
        - provisioningType
        - clientId
        - clientSecret
        - status
      properties:
        environmentName:
          type: string
          example: production
        provisioningType:
          $ref: "#/components/schemas/AgentProvisioningType"
        clientId:
          type: string
          example: 9c1b7a44-3e2f-4d8a-b1c5-6a9f0e2d7c81
        clientSecret:
          type: string
          description: The newly generated OAuth2 client secret, sent back to both platform-hosted and external agents
          example: f6e5d4c3b2a1f6e5d4c3b2a1f6e5d4c3
        status:
          type: string
          example: regenerated
        workloadRefreshWarning:
          type: string
          description: |
            Present only when the secret was rotated successfully but pushing it into the
            already-running workload failed. The workload keeps using the previous secret
            until its next deploy, promote, or rotation.
          example: The secret was rotated, but the running workload could not be refreshed automatically; it will keep using the previous secret until its next deploy, promote, or rotation.

    AgentRevokeSecretResponse:
      type: object
      description: |
        Response for revoking an AgentID secret. Never includes a
        `clientSecret`, since revoke turns access off rather than rotating it.
      required:
        - environmentName
        - clientId
        - status
      properties:
        environmentName:
          type: string
          example: production
        clientId:
          type: string
          example: 9c1b7a44-3e2f-4d8a-b1c5-6a9f0e2d7c81
        status:
          type: string
          example: revoked
        workloadRefreshWarning:
          type: string
          description: |
            Present when the secret was revoked successfully but the best-effort cleanup of
            the already-running workload's credential could not be completed or verified.
            The workload may keep referencing the revoked credential until this is confirmed
            or the workload is redeployed.
          example: Could not confirm whether this is the deployment pipeline's lowest environment, so its shared workload-level credentials were left untouched as a precaution.
    EventType:
      type: object
      required: [type, scope, category, description]
      properties:
        type:
          type: string
          description: The catalog name, e.g. agent.updated.
        scope:
          type: string
          enum: [org, project, agent]
          description: The level the event happens at.
        category:
          type: string
        description:
          type: string

    EventTypeListResponse:
      type: object
      required: [eventTypes]
      properties:
        eventTypes:
          type: array
          items:
            $ref: "#/components/schemas/EventType"

    EventDestinationKindService:
      type: object
      required: [id, label, category, urlFormat, docsPath]
      properties:
        id:
          type: string
          description: The service, and the scheme of its URL, e.g. slack.
        label:
          type: string
        category:
          type: string
        urlFormat:
          type: string
          description: The shape of the service URL.
        docsPath:
          type: string
          description: The docs site path that explains the values the URL needs, such as /guides/notification-service-urls/#slack. Append it to the docs site URL for the deployed version.

    EventDestinationKind:
      type: object
      required: [kind, generatedSecret, suppliedCredential, services]
      properties:
        kind:
          type: string
          description: webhook or notify.
        generatedSecret:
          type: boolean
          description: Destinations of this kind get a generated secret that can be rotated.
        suppliedCredential:
          type: boolean
          description: The kind's settings include a credential that is never returned.
        services:
          type: array
          description: The services the kind delivers to, if it has several.
          items:
            $ref: "#/components/schemas/EventDestinationKindService"

    EventDestinationKindListResponse:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/EventDestinationKind"

    EventDestinationRequest:
      type: object
      required: [name, kind, config, availability]
      properties:
        name:
          type: string
          maxLength: 100
          description: Unique in the organization, ignoring case.
        description:
          type: string
          maxLength: 500
        kind:
          type: string
          description: webhook or notify. Cannot change on update.
        config:
          type: object
          additionalProperties: true
          description: |
            The kind's settings. webhook: {"url"}. notify: {"service", "url"},
            where url is the Shoutrrr service URL; it is stored encrypted and
            never returned. Leave url out on update to keep it.
        availability:
          type: string
          enum: [all, org, projects]
          description: |
            Which subscriptions below the organization may use the destination:
            those of every project, none, or those of the listed projects.
            Organization subscriptions may use any destination.
        projects:
          type: array
          items:
            type: string
          description: The projects whose subscriptions may use it, for availability projects.

    EventDestinationResponse:
      type: object
      required: [id, name, description, kind, config, availability, projects, usedBy, health, consecutiveFailures, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        kind:
          type: string
        service:
          type: string
          description: The notification service, for notify destinations.
        config:
          type: object
          additionalProperties: true
          description: The kind's settings, masked for callers who cannot manage destinations.
        availability:
          type: string
          enum: [all, org, projects]
        projects:
          type: array
          items:
            type: string
        usedBy:
          type: integer
          description: The number of subscriptions that send to it.
        lastDeliveryAt:
          type: string
          format: date-time
        health:
          type: string
          enum: [healthy, failing, idle]
          description: |
            healthy: the latest delivery succeeded. failing: deliveries failed,
            or are being retried, since the latest success. idle: nothing was
            delivered yet.
        consecutiveFailures:
          type: integer
          description: Deliveries that failed or are being retried since the latest success.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        secret:
          type: string
          description: The generated secret. Only in the response that creates it.
        subscriptions:
          type: array
          description: The subscriptions that send to it. Only when getting one destination.
          items:
            $ref: "#/components/schemas/EventSubscriptionRef"

    EventDestinationListResponse:
      type: object
      required: [destinations]
      properties:
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/EventDestinationResponse"

    EventDestinationSummary:
      type: object
      description: A destination as subscriptions below the organization see it, without its settings.
      required: [id, name, kind, health]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
        service:
          type: string
        health:
          type: string
          enum: [healthy, failing, idle]

    EventDestinationSummaryListResponse:
      type: object
      required: [destinations]
      properties:
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/EventDestinationSummary"

    EventDestinationSecretResponse:
      type: object
      required: [secret]
      properties:
        secret:
          type: string

    EventDestinationTestResponse:
      type: object
      required: [delivered]
      properties:
        delivered:
          type: boolean
        statusCode:
          type: integer
          format: int32
        error:
          type: string

    EventSubscriptionRef:
      type: object
      required: [id, name, scope]
      properties:
        id:
          type: string
        name:
          type: string
        scope:
          type: string
          enum: [org, project, agent]
        projectName:
          type: string
        agentName:
          type: string

    EventSubscriptionRequest:
      type: object
      required: [name, destinationId, eventTypes]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        destinationId:
          type: string
          description: A destination available to the subscription's project.
        eventTypes:
          type: array
          minItems: 1
          items:
            type: string
          description: |
            Event types the subscription's scope can receive, or just "*" for
            every one, including types added later.
        environments:
          type: array
          items:
            type: string
          description: |
            Only events in these environments; empty or absent for every
            environment. Events tied to no environment, such as a build, are
            sent whatever it holds.
        enabled:
          type: boolean
          description: Defaults to true.

    EventDeliveryCounts:
      type: object
      required: [delivered, failed, pending, skipped]
      properties:
        delivered:
          type: integer
        failed:
          type: integer
        pending:
          type: integer
        skipped:
          type: integer

    EventSubscriptionResponse:
      type: object
      required: [id, scope, projectName, agentName, name, description, destination, eventTypes, environments, enabled, createdBy, createdAt, updatedAt, last24h]
      properties:
        id:
          type: string
        scope:
          type: string
          enum: [org, project, agent]
        projectName:
          type: string
        agentName:
          type: string
        name:
          type: string
        description:
          type: string
        destination:
          $ref: "#/components/schemas/EventDestinationSummary"
        eventTypes:
          type: array
          items:
            type: string
        environments:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        createdBy:
          type: string
          description: The ID of the user who created it.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        last24h:
          $ref: "#/components/schemas/EventDeliveryCounts"

    EventSubscriptionListResponse:
      type: object
      required: [subscriptions, inherited]
      properties:
        subscriptions:
          type: array
          description: The subscriptions this level owns.
          items:
            $ref: "#/components/schemas/EventSubscriptionResponse"
        inherited:
          type: array
          description: |
            Wider levels' subscriptions that also send this level's events,
            read-only here. Their event types are narrowed to those that can
            happen at this level, and their counts to this level's events.
          items:
            $ref: "#/components/schemas/EventSubscriptionResponse"

    EventDeliveryResponse:
      type: object
      required: [id, eventId, eventType, eventScope, status, attempts, subscriptions, createdAt, updatedAt]
      properties:
        id:
          type: string
        eventId:
          type: string
        eventType:
          type: string
        eventScope:
          type: string
        projectName:
          type: string
        agentName:
          type: string
        environment:
          type: string
        destination:
          $ref: "#/components/schemas/EventDestinationSummary"
        subscriptions:
          type: array
          description: The subscriptions that sent the event to the destination.
          items:
            $ref: "#/components/schemas/EventSubscriptionRef"
        status:
          type: string
          enum: [pending, delivered, failed, skipped]
        attempts:
          type: integer
          format: int32
        responseCode:
          type: integer
          format: int32
        lastError:
          type: string
        deliveredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EventDeliveryListResponse:
      type: object
      required: [deliveries, total]
      properties:
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/EventDeliveryResponse"
        total:
          type: integer
          description: Deliveries matching the query, ignoring limit and offset.
