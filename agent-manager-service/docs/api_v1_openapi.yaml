              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Events
      summary: Add an event destination
      description: |
        Registers where events can be sent. Subscriptions at org, project and
        agent level pick a destination; availability decides which projects'
        subscriptions may. A generated secret, if the kind uses one, is
        returned only in this response.
