      summary: List the agent's event deliveries
      description: |
        Deliveries of the agent's events.
      operationId: listAgentEventDeliveries
      parameters:
        - name: destinationId
          in: query
          required: false
          description: Only deliveries to this destination.
          schema:
            type: string
        - name: subscriptionId
          in: query
          required: false
          description: Only deliveries this subscription queued.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Only deliveries with this status.
          schema:
            type: string
            enum: [pending, delivered, failed, skipped]
        - name: limit
          in: query
          required: false
          description: Maximum number of deliveries (default 50, at most 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          description: Number of deliveries to skip.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Event deliveries, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDeliveryListResponse"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UIManifestResponse:
      type: object
      required:
        - modules
        - pages
      properties:
        modules:
          type: array
          description: The core (name "core") and each active module with console UI, in activation order.
          items:
            $ref: "#/components/schemas/UIManifestModule"
        pages:
          type: array
          description: Every page of the console's built-in UI modules the caller may open, as "<console module>/<page>".
          items:
            type: string
    UIManifestModule:
      type: object
      required:
        - name
        - pages
        - nav
        - slots
      properties:
        name:
          type: string
        version:
          type: string
        pages:
          type: array
          description: Pages of the console's built-in UI modules, as "<console module>/<page>".
          items:
            type: string
        nav:
          type: array
          items:
            $ref: "#/components/schemas/UIManifestNavItem"
        slots:
          type: array
          items:
            $ref: "#/components/schemas/UIManifestSlot"
    UIManifestNavItem:
      type: object
      required:
        - label
        - page
      properties:
        label:
          type: string
        page:
          type: string
    UIManifestSlot:
      type: object
      required:
        - slot
        - component
      properties:
        slot:
          type: string
        component:
          type: string
    ConfigResponse:
      type: object
      properties:
        consoleAnalyticsEnabled:
          type: boolean
          description: |
            Whether this deployment accepts console usage analytics. The
            console buffers and sends nothing when false, so CONSOLE_ANALYTICS_ENABLED
            on the service is the single switch for the whole path rather than
            one half of it. Absent is treated as false.
        eventsEnabled:
          type: boolean
          description: |
            Whether this deployment delivers platform events to event
            destinations, that is, whether it runs an event bus (EVENTS_MODE is
            not off). The console hides Events when false. Absent is treated as
            false.

    CreateOrganizationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the organization

    CreateProjectRequest:
      type: object
      required:
        - name
        - displayName
      properties:
        name:
          type: string
          description: Name of the project
        displayName:
          type: string
          description: Display name of the project
        description:
          type: string
          description: Description of the project
        deploymentPipeline:
          type: string

    Provisioning:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [internal, external]
          description: Type of provisioning
        repository:
          $ref: "#/components/schemas/RepositoryConfig"
        agentKind:
          type: object
          description: Reference to a published Agent Kind version (mutually exclusive with repository)
          required:
            - name
            - version
          properties:
            name:
              type: string
              description: Name of the Agent Kind to instantiate
              example: "weather-assistant"
            version:
              type: string
              description: Version of the Agent Kind to use
              example: "v1.0.0"

    AgentType:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: Type of the agent
        subType:
          type: string
          description: Sub-type of the agent

    BuildpackConfig:
      type: object
      required:
        - language
      properties:
        language:
          type: string
          description: Programming language for the buildpack
        languageVersion:
          type: string
          description: Version of the language runtime (optional, not needed for languages like Ballerina)
        runCommand:
          type: string
          description: Command to run the application (optional, not needed for languages like Ballerina)

    DockerConfig:
      type: object
      required:
        - dockerfilePath
      properties:
        dockerfilePath:
          type: string
          description: Path to the Dockerfile relative to the app path (e.g. "Dockerfile" or "docker/Dockerfile")
          pattern: "^/[A-Za-z0-9._\\-/]*$"
          maxLength: 1024
          example: "/Dockerfile"

    BuildpackBuild:
      type: object
      required:
        - type
        - buildpack
      properties:
        type:
          type: string
          enum: [buildpack]
          description: Build method for the component
        buildpack:
          $ref: "#/components/schemas/BuildpackConfig"

    DockerBuild:
      type: object
      required:
        - type
        - docker
      properties:
        type:
          type: string
          enum: [docker]
          description: Build method for the component
        docker:
          $ref: "#/components/schemas/DockerConfig"

    Build:
      oneOf:
        - $ref: "#/components/schemas/BuildpackBuild"
        - $ref: "#/components/schemas/DockerBuild"
      discriminator:
        propertyName: type
        mapping:
          buildpack: "#/components/schemas/BuildpackBuild"
          docker: "#/components/schemas/DockerBuild"

    Extensions:
      type: object
      description: >-
        Settings for the modules that extend this resource, keyed by module
        name. Each module sees only its own block. A block for a module that
        is not active, or that does not extend this resource, is rejected with
        400.
      additionalProperties:
        type: object
        additionalProperties: true
      example:
        example-module:
          enabled: true

    Labels:
      type: object
      description: >-
        User-defined key/value labels. Keys are 1-63 characters of
        [a-zA-Z0-9._-] starting and ending alphanumeric (not enforceable here
        as an OpenAPI 3.0 property-name pattern — validated server-side);
        values follow the same rules but may be empty. At most 10 labels per
        resource.
      maxProperties: 10
      additionalProperties:
        type: string
        maxLength: 63
        pattern: "^([a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9])?)?$"

    CreateAgentRequest:
      type: object
      required:
        - name
        - displayName
        - provisioning
      description: Create an agent. For internal provisioning, supply either repository (source build) or agentKind (from a published Kind version).
      properties:
        name:
          type: string
          description: Unique name of the agent
        displayName:
          type: string
          description: Display name of the agent
        provisioning:
          $ref: "#/components/schemas/Provisioning"
        githubApp:
          $ref: "#/components/schemas/GitHubAppSource"
        description:
          type: string
          description: Description of the agent
        agentType:
          $ref: "#/components/schemas/AgentType"
        build:
          $ref: "#/components/schemas/Build"
        inputInterface:
          $ref: "#/components/schemas/InputInterface"
        healthChecks:
          $ref: "#/components/schemas/HealthChecks"
        labels:
          $ref: "#/components/schemas/Labels"
        extensions:
          $ref: "#/components/schemas/Extensions"

    GitHubAppSource:
      type: object
      description: >-
        Optional GitHub App source binding for cloud deployments. The control
        plane consumes this metadata, persists it through the deployment-provided
        repository source provider, and never forwards it. When
        omitted, public-repository and PAT-backed behavior is unchanged.
      required:
        - installationId
        - owner
        - repo
      properties:
        installationId:
          type: integer
          format: int64
          minimum: 1
          description: GitHub App installation that grants access to the repository
        owner:
          type: string
          minLength: 1
          description: GitHub repository owner or organization
        repo:
          type: string
          minLength: 1
          description: GitHub repository name without the owner prefix
        branch:
          type: string
          description: Branch to build; defaults to provisioning.repository.branch
        appPath:
          type: string
          description: Source directory; defaults to provisioning.repository.appPath
        repositoryUrl:
          type: string
          format: uri
          description: Repository clone URL; defaults to provisioning.repository.url

    UpdateAgentBasicInfoRequest:
      type: object
      required:
        - displayName
        - description
      properties:
        displayName:
          type: string
          description: Display name of the agent
        description:
          type: string
          description: Description of the agent
        labels:
          $ref: "#/components/schemas/Labels"
        extensions:
          $ref: "#/components/schemas/Extensions"

    UpdateAgentBuildParametersRequest:
      type: object
      required:
        - provisioning
        - agentType
        - build
        - inputInterface
      properties:
        provisioning:
          $ref: "#/components/schemas/Provisioning"
        agentType:
          $ref: "#/components/schemas/AgentType"
        build:
          $ref: "#/components/schemas/Build"
        inputInterface:
          $ref: "#/components/schemas/InputInterface"
        healthChecks:
          $ref: "#/components/schemas/HealthChecks"
        configurations:
          $ref: "#/components/schemas/Configurations"

    UpdateAgentResourceConfigsRequest:
      type: object
      required:
        - replicas
        - resources
        - autoScaling
      properties:
        replicas:
          type: integer
          format: int32
          description: Number of replicas to run (only used when autoscaling is disabled)
          minimum: 0
          maximum: 10
        resources:
          $ref: "#/components/schemas/ResourceConfig"
        autoScaling:
          $ref: "#/components/schemas/AutoScalingConfig"

    ResourceConfig:
      type: object
      properties:
        requests:
          $ref: "#/components/schemas/ResourceRequests"
        limits:
          $ref: "#/components/schemas/ResourceLimits"

    ResourceRequests:
      type: object
      properties:
        cpu:
          type: string
          description: CPU request (e.g., "100m", "0.5", "1.5")
          pattern: '^[0-9]+(\.[0-9]+)?m?$'
        memory:
          type: string
          description: Memory request (e.g., "256Mi", "1Gi", "512Ki", "2Ti")
          pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei)$'

    ResourceLimits:
      type: object
      properties:
        cpu:
          type: string
          description: CPU limit (e.g., "500m", "2", "1.5")
          pattern: '^[0-9]+(\.[0-9]+)?m?$'
        memory:
          type: string
          description: Memory limit (e.g., "512Mi", "2Gi", "1Ti", "256Ki")
          pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei)$'

    AutoScalingConfig:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether autoscaling is enabled
        minReplicas:
          type: integer
          format: int32
          description: Minimum number of replicas
          minimum: 1
        maxReplicas:
          type: integer
          format: int32
          description: Maximum number of replicas
          minimum: 1

    CORSConfig:
      type: object
      properties:
        enabled:
          type: boolean
          description: Enable or disable CORS for this agent endpoint
          default: true
        allowOrigin:
          type: array
          items:
            type: string
          description: Allowed origins. Use ["*"] to allow all (incompatible with allowCredentials)
        allowMethods:
          type: array
          items:
            type: string
          description: Allowed HTTP methods for CORS
        allowHeaders:
          type: array
          items:
            type: string
          description: Allowed request headers for CORS
        allowCredentials:
          type: boolean
          description: Whether credentials are allowed. Cannot be true when allowOrigin contains "*"
          default: false

    AgentCardCORSConfig:
      type: object
      description: >-
        CORS for the public Agent Card route (/.well-known/agent-card.json) of an
        A2A agent. The card route sits outside the agent-wide policy chain, so it
        has its own CORS. Methods are always GET and OPTIONS. Applies only to A2A
        agents.
      properties:
        inherit:
          type: boolean
          default: false
          description: >-
            When true the card follows the agent's CORS: enabled when agent CORS
            is, with the agent's origins and credentials setting and Content-Type
            as the only header. On a request, true clears any stored override and
            the other fields are ignored. On a response, the other fields hold the
            effective values.
        enabled:
          type: boolean
          description: Enable CORS on the public Agent Card route. Required on a request when inherit is false.
        allowOrigin:
          type: array
          items:
            type: string
          description: Allowed origins. Use ["*"] to allow all (incompatible with allowCredentials).
        allowHeaders:
          type: array
          items:
            type: string
          description: Allowed request headers.
        allowCredentials:
          type: boolean
          default: false
          description: Whether credentials are allowed. Cannot be true when allowOrigin contains "*".

    OAuthConfig:
      type: object
      description: >-
        OAuth security configuration for the agent endpoint. Callers
        authenticate with a standard Authorization Bearer token validated by the
        gateway.
      properties:
        issuers:
          type: array
          items:
            type: string
          description: >-
            Issuer names for token validation, referencing identity provider entries
            configured gateway-side. Must be non-empty when OAuth security is enabled,
            and every name must be one of the environment's configured identity providers.
        audiences:
          type: array
          items:
            type: string
          description: >-
            Accepted token audiences (aud claim). Validation succeeds only when at
            least one configured audience is present in the token. Empty disables
            audience validation.
        headerName:
          type: string
          description: Request header carrying the token.
          default: Authorization
        authHeaderPrefix:
          type: string
          description: Prefix before the token in the header value.
          default: Bearer
        forwardToken:
          type: boolean
          description: >-
            When true, the original token header is forwarded to the upstream
            service after successful validation. When false, it is stripped
            before the request is proxied.
          default: true

    AgentResourceConfigsResponse:
      type: object
      properties:
        replicas:
          type: integer
          format: int32
          description: Current number of replicas
        resources:
          $ref: "#/components/schemas/ResourceConfig"
          description: Current resource configurations
        autoScaling:
          $ref: "#/components/schemas/AutoScalingConfig"
          description: Current autoscaling configuration

    UpdateProjectRequest:
      type: object
      properties:
        displayName:
          type: string
          description: Display name of the project
        description:
          type: string
          description: Description of the project
        deploymentPipeline:
          type: string
      required:
        - displayName
        - description
    AgentResponse:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        projectName:
          type: string
        status:
          type: string
          description: Current status of the agent
        provisioning:
          $ref: "#/components/schemas/Provisioning"
        agentType:
          $ref: "#/components/schemas/AgentType"
        inputInterface:
          $ref: "#/components/schemas/InputInterface"
        healthChecks:
          $ref: "#/components/schemas/HealthChecks"
        build:
          $ref: "#/components/schemas/Build"
        kindName:
          type: string
          description: Name of the Agent Kind this agent was instantiated from (absent for source-built agents)
        kindVersion:
          type: string
          description: Version tag of the Agent Kind this agent was instantiated from (absent for source-built agents, and for kind-sourced agents created before the version was recorded)
        labels:
          $ref: "#/components/schemas/Labels"
        createdBy:
          $ref: "#/components/schemas/AgentCreatedBy"
      required:
        - uuid
        - name
        - displayName
        - createdAt
        - projectName
        - description
        - provisioning
        - agentType
    AgentCreatedBy:
      type: object
      description: |
        The user who created this agent. Resolved from an audit-only
        requester id captured at creation time, so it is best-effort and
        omitted entirely when unknown (e.g. agents created before this was
        tracked, or where the creating user could not be resolved).
      required:
        - id
      properties:
        id:
          type: string
          description: User ID of the creator
          example: "user-123"
        display:
          type: string
          description: |
            Display name/username of the creator, when resolvable. Omitted
            if the user has since been deleted.
          example: "john.doe"
    ConsoleActionBatchRequest:
      type: object
      description: A flush of console actions buffered by the browser.
      properties:
        actions:
          type: array
          description: |
            The buffered actions, oldest first. Capped so a single flush cannot
            be used to push an unbounded payload through to the collector.
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/ConsoleAction"
      required:
        - actions
    ConsoleAction:
      type: object
      description: One thing a user did in the console UI.
      properties:
        action:
          type: string
          description: |
            Action name from the console taxonomy, e.g.
            "amp.console.navigation.page-view". Validated against a
            server-side allowlist; an unrecognized name is dropped.
          maxLength: 128
        occurredAt:
          type: string
          format: date-time
          description: |
            When the user did this, per the browser clock. The server uses it
            as-is so the ordering within a buffered flush survives, and falls
            back to receipt time when it is absent. A value present but not
            RFC 3339 fails decoding and makes the whole batch malformed (400)
            — the client controls this field, so a bad value is a client bug
            worth surfacing rather than silently rewriting.
        page:
          type: string
          description: |
            The console route the action happened on, e.g.
            "/orgs/acme/projects/p1/agents/a1/deploy". Path only — the client
            must not send query strings, which can carry identifiers.
          maxLength: 512
        sessionId:
          type: string
          description: |
            Opaque per-tab identifier generated by the console, used to group
            an individual browsing session. Not a credential and not derived
            from one.
          maxLength: 64
        dimensions:
          type: object
          description: |
            Taxonomy dimensions for this action, e.g. {"entity": "agent"}.
            Keys are validated per action against the server-side allowlist;
            unknown keys are dropped. Values must be scalars — never request
            bodies, secrets, or free-form user input.
          additionalProperties: true
      required:
        - action
    ConsoleActionBatchResponse:
      type: object
      description: How much of the submitted batch survived validation.
      properties:
        accepted:
          type: integer
          description: Number of actions forwarded to the collector.
        dropped:
          type: integer
          description: |
            Number of actions discarded for failing the allowlist. Reported so
            a console release that starts emitting an unregistered action is
            visible without reading service logs.
      required:
        - accepted
        - dropped
    ResourceNameRequest:
      type: object
      properties:
        displayName:
          type: string
          description: Display name of the agent
        resourceType:
          type: string
          description: Type of resource (e.g., agent, project)
        projectName:
          type: string
          description: Name of the project (required if resourceType is agent)
      required:
        - displayName
        - resourceType
    ResourceNameResponse:
      type: object
      properties:
        name:
          type: string
          description: The resource name
        displayName:
          type: string
          description: The display name of the resource
        resourceType:
          type: string
          description: Type of resource (e.g., agent, project)
      required:
        - name
        - displayName
        - resourceType
    AgentListResponse:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentResponse"
        total:
          type: integer
          description: Total number of agents matching the query
        limit:
          type: integer
        offset:
          type: integer
      required:
        - agents
        - total
        - limit
        - offset
    AgentSummary:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        projectName:
          type: string
        projectDisplayName:
          type: string
      required:
        - name
        - displayName
        - projectName
        - projectDisplayName
    AgentSummaryListResponse:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentSummary"
      required:
        - agents
    BuildsListResponse:
      type: object
      properties:
        builds:
          type: array
          items:
            $ref: "#/components/schemas/BuildResponse"
        total:
          type: integer
          description: Total number of builds matching the query
        limit:
          type: integer
        offset:
          type: integer
      required:
        - builds
        - total
        - limit
        - offset
    # Repository Configuration
    # The patterns below document the contract; they are not what enforces it.
    # This service has no OpenAPI request-validation middleware, so every rule
    # here is also implemented in Go (agent-manager-service/utils/utils.go). These
    # values become arguments to git and to the container build inside the build
    # pod, so keep the two in step when changing either.
    RepositoryConfig:
      type: object
      description: Git repository configuration
      required:
        - url
        - branch
        - appPath
        - secretRef
      properties:
        url:
          type: string
          description: URL of the git repository
          pattern: "^https://github\\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(?:\\.git)?/?$"
          maxLength: 2048
          example: "https://github.com/wso2/agent-manager"
        branch:
          type: string
          description: Branch to use
          pattern: "^[A-Za-z0-9._@+/-]+$"
          maxLength: 255
          example: "main"
        appPath:
          type: string
          description: Path within the repository where the source code resides
          pattern: "^/[A-Za-z0-9._\\-/]*$"
          maxLength: 1024
          example: "/my-agent"
        secretRef:
          type: string
          nullable: true
          description: Name of the git secret to use for authentication. Set to null for public repositories.
          pattern: "^[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*$"
          minLength: 1
          maxLength: 63
          example: "my-github-pat"
    BuildParameters:
      type: object
      description: Parameters used for the build
      properties:
        repoUrl:
          type: string
          description: Repository URL
        appPath:
          type: string
          description: Path within the repository
        branch:
          type: string
          description: Branch name
        commitId:
          type: string
          description: Commit ID
        language:
          type: string
          description: Programming language
        languageVersion:
          type: string
          description: Language version (buildpack builds only)
        runCommand:
          type: string
          description: Command to run the application (buildpack builds only)
        dockerfilePath:
          type: string
          description: Path to the Dockerfile relative to the app path (docker builds only)
      required:
        - commitId
        - branch
        - repoUrl
        - appPath
        - language
        - languageVersion
        - runCommand
    BuildResponse:
      type: object
      properties:
        buildId:
          type: string
        buildName:
          type: string
        projectName:
          type: string
        agentName:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        imageId:
          type: string
        status:
          type: string
          description: >-
            Overall build status, derived from the underlying workflow phase.
            Succeeded means the image was built and pushed; Completed additionally
            means the workload CR was updated. Per-step progress is in `steps`.
          enum: [Pending, Running, Succeeded, Completed, Failed]
        buildParameters:
          $ref: "#/components/schemas/BuildParameters"
        # The health checks this build recorded when it started; an environment running this
        # build, including after a redeploy or rollback, runs them. Absent when the build
        # recorded none, so the defaults apply.
        healthChecks:
          $ref: "#/components/schemas/HealthChecks"
      required:
        - buildName
        - projectName
        - agentName
        - startedAt
        - buildParameters
    BuildStep:
      type: object
      properties:
        type:
          type: string
          description: Type of build step
          enum:
            [
              BuildInitiated,
              BuildTriggered,
              BuildRunning,
              BuildCompleted,
              WorkloadUpdated,
            ]
        status:
          type: string
          description: Status of the build step
          enum: [Succeeded, Failed, Running, Pending]
        message:
          type: string
          description: Human-readable message about the step
        startedAt:
          type: string
          format: date-time
          description: Timestamp when the step occurred
        finishedAt:
          type: string
          format: date-time
          description: Timestamp when the step finished
      required:
        - type
        - status
        - message

    BuildDetailsResponse:
      allOf:
        - $ref: "#/components/schemas/BuildResponse"
        - type: object
          properties:
            percent:
              type: number
              format: float
              description: Build completion percentage (0-100)
              minimum: 0
              maximum: 100
            steps:
              type: array
              description: Array of build steps with their status
              items:
                $ref: "#/components/schemas/BuildStep"
            durationSeconds:
              type: integer
              description: Build duration in seconds
              minimum: 0
            inputInterface:
              $ref: "#/components/schemas/InputInterface"

    # Deployment Schemas
    DeployAgentRequest:
      type: object
      properties:
        imageId:
          type: string
          description: Container image ID to deploy
        env:
          type: array
          description: Environment variables
          items:
            $ref: "#/components/schemas/EnvironmentVariable"
        files:
          type: array
          description: File mounts
          items:
            $ref: "#/components/schemas/FileMount"
        enableAutoInstrumentation:
          type: boolean
          description: Enable auto instrumentation for observability
          default: true
        enableApiKeySecurity:
          type: boolean
          description: Enable API key security for the agent endpoint
          default: true
        corsConfig:
          $ref: "#/components/schemas/CORSConfig"
          nullable: true
          description: CORS configuration for the agent endpoint. Omit to keep existing settings.
        agentCardCorsConfig:
          description: Public Agent Card CORS for this environment (A2A agents only). Omit to keep the current value.
          $ref: "#/components/schemas/AgentCardCORSConfig"
        enableOAuthSecurity:
          type: boolean
          description: Enable OAuth security for the agent endpoint. Mutually exclusive with enableApiKeySecurity.
          default: false
        oauthConfig:
          $ref: "#/components/schemas/OAuthConfig"
          nullable: true
          description: OAuth configuration for the agent endpoint. Omit to keep existing settings.
      required:
        - imageId

    UpdateDeploymentStateRequest:
      type: object
      description: Request to update the deployment state of an agent
      properties:
        environment:
          type: string
          description: Target environment name
        state:
          type: string
          description: Desired deployment state
          enum:
            - Active
            - Undeploy
      required:
        - environment
        - state

    UpdateDeploymentStateResponse:
      type: object
      description: |
        Response indicating the deployment state transition request was accepted.
      properties:
        message:
          type: string
          description: Confirmation message indicating the state transition request was accepted
        environment:
          type: string
          description: Environment where the state transition was requested
        state:
          type: string
          description: Desired deployment state that was requested (not necessarily the current state)
          enum:
            - Active
            - Undeploy
      required:
        - message
        - environment
        - state

    Configurations:
      type: object
      properties:
        env:
          type: array
          description: Environment variables
          items:
            $ref: "#/components/schemas/EnvironmentVariable"
        files:
          type: array
          description: File mounts
          items:
            $ref: "#/components/schemas/FileMount"
        enableAutoInstrumentation:
          type: boolean
          description: Enable automatic OTEL instrumentation for the agent
          default: true
        instrumentationVersion:
          type: string
          nullable: true
          description: |
            AMP instrumentation version to use for the agent. Selects the
            pre-built init-container image
            (`amp-python-instrumentation-provider:<version>-python<X.Y>`) and the
            `traceloop-sdk` it pins. Omit (or send null) to use the platform
            default. Must be one of the versions supported by the deployment;
            unknown values are rejected.
        enableApiKeySecurity:
          type: boolean
          description: Enable API key security for the agent endpoint
          default: true
        corsConfig:
          $ref: "#/components/schemas/CORSConfig"
          nullable: true
          description: Current CORS configuration for the agent endpoint
        enableOAuthSecurity:
          type: boolean
          description: Enable OAuth security for the agent endpoint. Mutually exclusive with enableApiKeySecurity.
          default: false
        oauthConfig:
          $ref: "#/components/schemas/OAuthConfig"
          nullable: true
          description: Current OAuth configuration for the agent endpoint
        resilienceTimeoutSeconds:
          type: integer
          description: Max duration (seconds) the gateway keeps a response open between the agent and the client before cutting it off, for this agent's endpoint in this environment. Defaults to 30 seconds when unset.
          minimum: 1
          maximum: 3600
    EnvironmentVariable:
      type: object
      required:
        - key
      properties:
        key:
          type: string
          description: Environment variable name
        value:
          type: string
          description: Value (plain text or secret value for input; omitted for secrets in responses)
        isSensitive:
          type: boolean
          default: false
          description: If true, value is stored in KV and synced via ExternalSecret
        secretRef:
          type: string
          description: Reference to existing secret.
    FileMount:
      type: object
      required:
        - key
        - mountPath
      properties:
        key:
          type: string
          minLength: 1
          description: File name/key identifier
        mountPath:
          type: string
          description: Mount path in container (absolute path, no '..' segments)
          pattern: "^/(?!.*\\.\\.)[A-Za-z0-9._\\-/]*$"
        value:
          type: string
          description: File content (plain text or secret value for input; omitted for secrets in responses)
        isSensitive:
          type: boolean
          default: false
          description: If true, value is stored in KV and synced via ExternalSecret
        secretRef:
          type: string
          description: Reference to existing secret.
    InputInterface:
      type: object
      description: Endpoint configurations
      required:
        - type
      properties:
        type:
          type: string
          description: Type of the endpoint (e.g., HTTP)
        port:
          type: integer
          description: Port number
          minimum: 1
          maximum: 65535
        schema:
          $ref: "#/components/schemas/InputInterfaceSchema"
        basePath:
          type: string
          description: Base path for the endpoint
    HealthChecks:
      type: object
      description: >-
        Startup, readiness and liveness checks for the agent's container. A
        check that is not set uses the default: startup and readiness are TCP
        checks on the agent's port, and there is no liveness check.
      properties:
        startup:
          $ref: "#/components/schemas/HealthCheck"
        readiness:
          $ref: "#/components/schemas/HealthCheck"
        liveness:
          $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      description: >-
        One health check. A field that is not set uses its default value.
      properties:
        enabled:
          type: boolean
          description: Whether the check runs. Defaults to true.
        type:
          type: string
          enum:
            - TCP
            - HTTP
          description: >-
            TCP opens a connection to the port; HTTP sends a GET request to the
            path. Defaults to TCP.
        path:
          type: string
          pattern: "^/"
          description: Path for an HTTP check. Required when type is HTTP.
          example: "/health"
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Port to check. Defaults to the agent's port.
        initialDelaySeconds:
          type: integer
          minimum: 0
          description: Seconds to wait after the container starts before the first check.
        periodSeconds:
          type: integer
          minimum: 1
          description: Seconds between checks.
        timeoutSeconds:
          type: integer
          minimum: 1
          description: Seconds before a check times out.
        failureThreshold:
          type: integer
          minimum: 1
          description: Failed checks in a row before the check is treated as failed.
    InputInterfaceSchema:
      type: object
      properties:
        path:
          type: string
          description: Path to OpenAPI schema file
          pattern: "^/.*"
          example: "/openapi.yaml"
        content:
          type: string
          description: Inline schema content (e.g., OpenAPI definition); response-only
    EndpointSchema:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          description: Schema content
    DeploymentResponse:
      type: object
      properties:
        agentName:
          type: string
        projectName:
          type: string
        imageId:
          type: string
        environment:
          type: string
      required:
        - agentName
        - projectName
        - imageId
        - environment

    EnvironmentObject:
      type: object
      properties:
        name:
          type: string
          description: Environment name
        displayName:
          type: string
          description: Human-readable display name of the environment
      required:
        - name
        - displayName

    EndpointConfiguration:
      type: object
      properties:
        url:
          type: string
          description: URL of the endpoint
        endpointName:
          type: string
          description: Name of the endpoint
        schema:
          $ref: "#/components/schemas/EndpointSchema"
        visibility:
          type: string
          description: Visibility level of the endpoint
      required:
        - url
        - endpointName
        - schema
        - visibility

    EndpointsResponse:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/EndpointConfiguration"
      description: Map of endpoint names to endpoint configurations

    Environment:
      type: object
      properties:
        uuid:
          type: string
          description: Unique identifier of the environment
        name:
          type: string
          description: Name of the environment
        dataplaneRef:
          type: string
          description: Reference to the data plane for the environment
        displayName:
          type: string
          description: Human-readable display name
        isProduction:
          type: boolean
          description: Whether this is a production environment
        dnsPrefix:
          type: string
          description: DNS prefix for the environment
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the environment was created
      required:
        - uuid
        - name
        - dataplaneRef
        - isProduction
        - createdAt

    EnvironmentListResponse:
      type: array
      items:
        $ref: "#/components/schemas/Environment"
      description: List of environments

    DataPlane:
      type: object
      properties:
        name:
          type: string
          description: Name of the data plane
        displayName:
          type: string
          description: Human-readable display name
        description:
          type: string
          description: Description of the data plane
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the data plane was created
      required:
        - name
        - displayName
        - description
        - createdAt

    DataPlaneListResponse:
      type: array
      items:
        $ref: "#/components/schemas/DataPlane"
      description: List of data planes

    DeploymentPipelineResponse:
      type: object
      properties:
        name:
          type: string
          description: Name of the deployment pipeline
        displayName:
          type: string
          description: Human-readable display name
        description:
          type: string
          description: Description of the deployment pipeline
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the pipeline was created
        promotionPaths:
          type: array
          description: List of promotion paths in the pipeline
          items:
            $ref: "#/components/schemas/PromotionPath"
      required:
        - name
        - displayName
