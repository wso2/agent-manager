                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event destination not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The name is taken, subscriptions would lose access, or the destination changed concurrently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Events
      summary: Delete an event destination
      description: |
        Refused while subscriptions send to it: delete them, or move them to another destination, first.
