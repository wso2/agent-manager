openapi: 3.0.3
info:
  version: 1.0.0
  title: Agent Manager Service API
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /config:
    get:
      security: []
      summary: Get service configuration
      description: Returns the deployment feature switches the console and CLI read before signing in.
      operationId: getConfig
      tags:
        - Config
      responses:
        "200":
          description: Service configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
  /ui-manifest:
    get:
      summary: Get the console UI manifest
      description: |
        Lists the console UI of the core and of every active module: the pages
        of the console's built-in UI modules to turn on, and the nav items and
        slot contributions of module bundles. Entries that need a permission
        the caller does not hold are left out. The console shows a built-in UI
        module only when this lists one of its pages.
      operationId: getUIManifest
      tags:
        - Config
      responses:
        "200":
          description: The console UI the caller may use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UIManifestResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs:
    get:
      summary: List all organizations
      operationId: listOrganizations
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
        - name: offset
          in: query
          description: Number of results to skip
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationListResponse"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a new organization
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "202":
          description: Organization creation initiated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}:
    get:
      summary: Get organization details
      operationId: getOrganization
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/projects:
    post:
      summary: Create a new project
      operationId: createProject
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "202":
          description: Project creation initiated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Project already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: List all projects in an organization
      operationId: listProjects
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results to return
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
        - name: offset
          in: query
          description: Number of results to skip
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/projects/{projName}:
    get:
      summary: Get project details
      operationId: getProject
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: projName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update project
      operationId: updateProject
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: projName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete a project
      operationId: deleteProject
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: projName
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Project deleted successfully
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/projects/{projName}/agents:
    post:
      summary: Create a new agent
      operationId: createAgent
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: projName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "202":
          description: Agent creation initiated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The agent already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Referenced LLM provider not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: List all agents in a project of an organization
      operationId: listAgents
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: projName
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results to return
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
        - name: offset
          in: query
          description: Number of results to skip
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: label
          in: query
          description: >-
            Filter by label as key:value. Repeat the parameter to require
            multiple labels (AND semantics).
          required: false
          style: form
          explode: true
          schema:
            type: array
            # A resource carries at most 10 labels (MaxLabelsPerResource), so more
            # selectors than that can never match.
            maxItems: 10
            items:
              type: string
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/agents:
    get:
      summary: List all agents in an organization
      description: >-
        Returns a lightweight, unpaginated list of every agent in the
        organization across all projects, containing each agent's name,
        display name, and the name and display name of the project it
        belongs to.
      operationId: listOrgAgents
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of agents in the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSummaryListResponse"
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/projects/{projName}/agents/{agentName}:
    get:
      summary: Get agent details
      operationId: getAgent
      parameters:
        - name: agentName
          in: path
          required: true
          schema:
            type: string
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: projName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update agent basic information
      operationId: updateAgent
      parameters:
        - name: agentName
          in: path
          required: true
          schema:
            type: string
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: projName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentBasicInfoRequest"
      responses:
        "200":
          description: Agent updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete agent
      operationId: deleteAgent
      parameters:
        - name: agentName
          in: path
          required: true
          schema:
            type: string
        - name: orgName
          in: path
          required: true
          schema:
            type: string
        - name: projName
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Agent deleted successfully
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/utils/generate-name:
    post:
      summary: Get name by display name
      description: Retrieve name using display name for a specific resource
      operationId: getNameByDisplayName
      parameters:
        - name: orgName
          in: path
          description: Organization name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceNameRequest"
      responses:
        "200":
          description: Agent name retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceNameResponse"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /telemetry/console-actions:
    post:
      tags:
        - Telemetry
      summary: Report a batch of console user actions
      description: |
        Accept a batch of UI interaction records from the console and forward
        them to the analytics collector as Moesif Actions. Deliberately not
        org-scoped in the path: the organization is taken from the caller's
        token, and some console actions (sign-in landing, organization
        switching) happen before an org is in scope.

        Reporting is best-effort and never blocks the caller. The endpoint
        answers 202 whenever the batch is well-formed, including when every
        action in it was dropped for failing the server-side allowlist —
        a client must never retry, and must never surface a failure here to
        the user. Unknown action names and unknown dimension keys are
        discarded rather than rejected, so a console that is newer than the
        service degrades quietly instead of erroring.
      operationId: reportConsoleActions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsoleActionBatchRequest"
      responses:
        "202":
          description: Batch accepted for forwarding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleActionBatchResponse"
        "400":
          description: Malformed batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: |
            Batch exceeds the accepted size — either the body is over the byte
            cap or it carries more than maxItems actions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: |
            Per-user reporting rate limit exceeded. Clients must NOT retry:
            telemetry is best-effort, and a retry into the limit is what the
            limit exists to prevent. Drop the batch and carry on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/environments:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 1
          maxLength: 64

    get:
      tags:
        - Environments
      summary: List all environments
      description: Retrieve a paginated list of all environments for the organization
      operationId: listEnvironments
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        "200":
          description: Successfully retrieved environment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentListResponse"
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/environments/{envID}:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 1
          maxLength: 64
      - name: envID
        in: path
        required: true
        description: Environment UUID or name
        schema:
          type: string

    get:
      tags:
        - Environments
      summary: Get environment details
      description: Retrieve detailed information about a specific environment
      operationId: getEnvironment
      responses:
        "200":
          description: Successfully retrieved environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayEnvironmentResponse"
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================
  # AI GATEWAY ENDPOINTS
  # ============================================

  /orgs/{orgName}/projects/{projName}/agents/{agentName}/token:
    post:
      summary: Generate authentication token for an agent
      description: |
        Generates a signed JWT token for an external agent to authenticate API requests.
        The token includes claims for component, environment, organization, and project identifiers.
      operationId: generateAgentToken
      parameters:
        - name: orgName
          in: path
          required: true
          schema:
            type: string
          description: Organization name
        - name: projName
          in: path
          required: true
          schema:
            type: string
          description: Project name
        - name: agentName
          in: path
          required: true
          schema:
            type: string
          description: Agent name
        - name: environment
          in: query
          required: false
          schema:
            type: string
          description: Environment name (defaults to configured default if not provided)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Token generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request (e.g., invalid expiry duration)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent, project, or organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/projects/{projName}/agents/{agentName}/identities:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name
        schema:
          type: string
      - name: projName
        in: path
        required: true
        description: Project name
        schema:
          type: string
      - name: agentName
        in: path
        required: true
        description: Agent name
        schema:
          type: string

    get:
      tags:
        - Agent Identity
      summary: List an agent's AgentID bindings
      description: |
        Returns the agent's AgentID for every environment in the project's
        deployment pipeline. This is a safe read only: it never returns or
        removes a secret. For an externally hosted agent, use
        `POST .../identities` (regenerate) to obtain a secret.

        Pass `environment` to narrow the result to one environment.
      operationId: getAgentIdentity
      parameters:
        - name: environment
          in: query
          required: false
          description: Environment name to filter the result to a single binding
          schema:
            type: string
      responses:
        "200":
          description: The agent's AgentID bindings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentIdentityEnvironmentView"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags:
        - Agent Identity
      summary: Provision an AgentID for a missing environment
      description: |
        Creates an AgentID for an internal or externally hosted agent in an
        environment that was added after the agent already existed. Internal
        agents normally get an AgentID automatically during deployment or
        promotion; this operation provides an idempotent repair path when the
        binding is missing.

        Safe to call more than once: if a binding already exists it is left
        as is and returned with `200`. A genuinely missing binding is
        created and provisioned in the background, returning `202`.
      operationId: provisionAgentIdentity
      parameters:
        - name: environment
          in: query
          required: true
          description: Environment name to provision the AgentID in
          schema:
            type: string
      responses:
        "200":
          description: A binding already existed for this environment; returned unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentIdentityEnvironmentView"
        "202":
          description: No binding existed; provisioning has been kicked off in the background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentIdentityEnvironmentView"
        "400":
          description: Missing `environment` query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent or environment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Agent Identity
      summary: Regenerate an agent's AgentID secret
      description: |
        Rotates the AgentID secret for one environment and returns the new
        value straight away, for both platform-hosted and externally hosted
        agents. For an externally hosted agent this is the only way to ever
        get a secret — it is minted on request and never stored, so this is
        also how you obtain the very first one, not just later rotations.
        Note that this endpoint takes `environment` in the request body, not
        as a query parameter, since the other identity endpoints have no
        body to carry it in.

        A token minted from the old secret keeps working until it expires
        naturally.
      operationId: regenerateAgentIdentitySecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentIdentityActionRequest"
      responses:
        "200":
          description: Secret regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegenerateSecretResponse"
        "400":
          description: Missing or invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent identity not yet provisioned for this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Agent Identity
      summary: Revoke an agent's AgentID secret
      description: |
        Turns off the AgentID secret for one environment without issuing a
        new one. Call regenerate afterward to restore access.

        This only stops new tokens from being minted. A token issued before
        the revoke stays valid until it expires naturally.
      operationId: revokeAgentIdentitySecret
      parameters:
        - name: environment
          in: query
          required: true
          description: Environment name to revoke the AgentID secret in
          schema:
            type: string
      responses:
        "200":
          description: Secret revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRevokeSecretResponse"
        "400":
          description: Missing `environment` query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent identity not yet provisioned for this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/projects/{projName}/agents/{agentName}/identities/retry:
    post:
      tags:
        - Agent Identity
      summary: Retry a failed AgentID provisioning attempt
      description: |
        Resets a binding stuck in `failed` status back to `pending` — clearing
        its attempt budget and last error — and re-attempts provisioning in
        the background, for both platform-hosted and externally hosted
        agents.

        Only a binding whose current status is `failed` can be retried this
        way: `completed`, `pending`, and `in_progress` bindings already have
        their own path forward (nothing to reset, or already retrying) and
        are rejected with `409`.
      operationId: retryAgentIdentityProvisioning
      parameters:
        - name: orgName
          in: path
          required: true
          description: Organization name
          schema:
            type: string
        - name: projName
          in: path
          required: true
          description: Project name
          schema:
            type: string
        - name: agentName
          in: path
          required: true
          description: Agent name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentIdentityActionRequest"
      responses:
        "202":
          description: The binding was reset and provisioning was scheduled again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentIdentityEnvironmentView"
        "400":
          description: Missing or invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent identity not yet provisioned for this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The binding exists but is not currently in `failed` status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

