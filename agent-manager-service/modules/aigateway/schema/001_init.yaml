module: ai-gateway
# The AI Gateway's tables. They reference core rows (organizations, projects,
# agents, environments, secrets) by id without foreign keys: the module's
# finalize hooks remove or protect them when the core row goes.
tables:

  - name: mod_ai_gateway_agent_gateway_settings
    columns:
      - {name: agent_id, type: id}
      - {name: org_id, type: id}
      - {name: environment_id, type: id}
      - {name: api_key_security, type: bool}
      - {name: oauth_enabled, type: bool}
      - {name: oauth_issuers, type: json}
      - {name: oauth_audiences, type: json}
      - {name: oauth_header_name, type: text, size: 255}
      - {name: oauth_header_prefix, type: text, size: 64}
      - {name: oauth_forward_token, type: bool}
      - {name: cors_enabled, type: bool}
      - {name: cors_allow_origins, type: json}
      - {name: cors_allow_methods, type: json}
      - {name: cors_allow_headers, type: json}
      - {name: cors_allow_credentials, type: bool}
      - {name: timeout_seconds, type: int, nullable: true}
      - {name: card_cors_enabled, type: bool, nullable: true}
      - {name: card_cors_allow_origins, type: json, nullable: true}
      - {name: card_cors_allow_headers, type: json, nullable: true}
      - {name: card_cors_allow_credentials, type: bool, nullable: true}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
    primary_key: [agent_id, environment_id]

  # The LLM providers and MCP proxies an agent asked for in its
  # extensions.ai-gateway block. The agent's hooks write them; a handler
  # provisions each one as an agent configuration (config_id) in the background.
  - name: mod_ai_gateway_agent_bindings
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: agent_id, type: id}
      - {name: kind, type: text, size: 8}
      - {name: position, type: int}
      - {name: target, type: text, size: 255}
      - {name: request, type: json}
      - {name: state, type: text, size: 16}
      - {name: last_error, type: text, size: 2000, nullable: true}
      - {name: config_id, type: id, nullable: true}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
    primary_key: [id]
    indexes: [[org_id, agent_id]]
    checks:
      - "kind IN ('llm', 'mcp')"
      - "state IN ('pending', 'ready', 'failed', 'removing')"

  # Deleted agents whose gateway state is still being revoked. The rows keep
  # the agent's names so the revocation finds them after the agent is gone;
  # an agent of the same name cannot be created until the row goes.
  - name: mod_ai_gateway_agent_teardowns
    columns:
      - {name: agent_id, type: id}
      - {name: org_id, type: id}
      - {name: project_name, type: text, size: 255}
      - {name: agent_name, type: text, size: 255}
      - {name: last_error, type: text, size: 2000, nullable: true}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
    primary_key: [agent_id]
    unique: [[org_id, project_name, agent_name]]

  # --- Gateways -----------------------------------------------------------------------------

  - name: mod_ai_gateway_gateways
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: name, type: text, size: 255}
      - {name: display_name, type: text, size: 255}
      - {name: description, type: text, size: 1000, nullable: true}
      - {name: functionality_type, type: text, size: 16}
      - {name: hosting, type: text, size: 16}
      - {name: vhost, type: text, size: 255}
      - {name: runtime_url, type: text, size: 2048, nullable: true}
      - {name: is_critical, type: bool}
      - {name: is_active, type: bool}
      - {name: properties, type: json}
      - {name: manifest, type: json, nullable: true}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
    primary_key: [id]
    unique: [[org_id, name], [org_id, id]]
    checks:
      - "functionality_type IN ('ingress', 'egress', 'both')"
      - "hosting IN ('managed', 'self_hosted')"
      - "hosting <> 'self_hosted' OR functionality_type = 'egress'"

  - name: mod_ai_gateway_gateway_environments
    columns:
      - {name: gateway_id, type: id}
      - {name: environment_id, type: id}
      - {name: org_id, type: id}
      - {name: created_at, type: time}
    primary_key: [gateway_id, environment_id]
    foreign_keys:
      - {columns: [org_id, gateway_id], references: mod_ai_gateway_gateways, ref_columns: [org_id, id], on_delete: cascade}
    indexes: [[environment_id]]

  - name: mod_ai_gateway_environment_default_gateways
    columns:
      - {name: environment_id, type: id}
      - {name: role, type: text, size: 16}
      - {name: org_id, type: id}
      - {name: gateway_id, type: id}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
    primary_key: [environment_id, role]
    foreign_keys:
      - {columns: [gateway_id, environment_id], references: mod_ai_gateway_gateway_environments, ref_columns: [gateway_id, environment_id]}
    checks:
      - "role IN ('ingress', 'egress')"
    indexes: [[gateway_id]]

  - name: mod_ai_gateway_gateway_tokens
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: gateway_id, type: id}
      - {name: token_hash, type: text, size: 255}
      - {name: salt, type: text, size: 255}
      - {name: token_prefix, type: text, size: 36}
      - {name: status, type: text, size: 10}
      - {name: created_at, type: time}
      - {name: revoked_at, type: time, nullable: true}
    primary_key: [id]
    unique: [[token_prefix]]
    foreign_keys:
      - {columns: [org_id, gateway_id], references: mod_ai_gateway_gateways, ref_columns: [org_id, id], on_delete: cascade}
    checks:
      - "status IN ('active', 'revoked')"
      - "revoked_at IS NULL OR status = 'revoked'"
    indexes: [[gateway_id, status]]

  - name: mod_ai_gateway_gateway_identity_providers
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: gateway_id, type: id}
      - {name: name, type: text, size: 255}
      - {name: issuer, type: text, size: 2048, nullable: true}
      - {name: jwks_uri, type: text, size: 2048, nullable: true}
      - {name: description, type: text, size: 1000, nullable: true}
      - {name: type, type: text, size: 32}
      - {name: jwks_skip_tls_verify, type: bool}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
    primary_key: [id]
    unique: [[gateway_id, name]]
    foreign_keys:
      - {columns: [org_id, gateway_id], references: mod_ai_gateway_gateways, ref_columns: [org_id, id], on_delete: cascade}

  - name: mod_ai_gateway_gateway_event_states
    columns:
      - {name: gateway_id, type: id}
      - {name: org_id, type: id}
      - {name: version_id, type: text, size: 64, nullable: true}
      - {name: seq, type: bigint}
      - {name: updated_at, type: time}
    primary_key: [gateway_id]
    foreign_keys:
      - {columns: [org_id, gateway_id], references: mod_ai_gateway_gateways, ref_columns: [org_id, id], on_delete: cascade}

  - name: mod_ai_gateway_gateway_events
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: gateway_id, type: id}
      - {name: seq, type: bigint}
      - {name: entity_type, type: text, size: 64}
      - {name: action, type: text, size: 32}
      - {name: entity_id, type: text, size: 255}
      - {name: event_data, type: json}
      - {name: originated_at, type: time}
      - {name: processed_at, type: time}
    primary_key: [id]
    foreign_keys:
      - {columns: [org_id, gateway_id], references: mod_ai_gateway_gateways, ref_columns: [org_id, id], on_delete: cascade}
    indexes: [[gateway_id, seq], [gateway_id, processed_at]]

  # --- Artifacts and gateway deployments ------------------------------------------------------

  - name: mod_ai_gateway_artifacts
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: kind, type: text, size: 20}
      - {name: handle, type: text, size: 255}
      - {name: name, type: text, size: 255}
      - {name: version, type: text, size: 30}
      - {name: in_catalog, type: bool}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
    primary_key: [id]
    unique: [[org_id, handle], [org_id, name, version], [org_id, id]]
    checks:
      - "kind IN ('RestApi', 'WebSubAPI', 'LlmProvider', 'LlmProxy', 'Agent', 'McpProxy', 'McpProxyMapping')"

  - name: mod_ai_gateway_artifact_deployments
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: artifact_id, type: id}
      - {name: gateway_id, type: id}
      - {name: base_deployment_id, type: id, nullable: true}
      - {name: name, type: text, size: 255}
      - {name: content, type: binary}
      - {name: metadata, type: json, nullable: true}
      - {name: created_at, type: time}
    primary_key: [id]
    foreign_keys:
      - {columns: [org_id, artifact_id], references: mod_ai_gateway_artifacts, ref_columns: [org_id, id], on_delete: cascade}
      - {columns: [org_id, gateway_id], references: mod_ai_gateway_gateways, ref_columns: [org_id, id]}
      - {columns: [base_deployment_id], references: mod_ai_gateway_artifact_deployments, ref_columns: [id]}
    indexes: [[artifact_id, gateway_id, created_at], [gateway_id], [base_deployment_id]]

  - name: mod_ai_gateway_artifact_gateway_status
    columns:
      - {name: artifact_id, type: id}
      - {name: gateway_id, type: id}
      - {name: org_id, type: id}
      - {name: deployment_id, type: id, nullable: true}
      - {name: status, type: text, size: 20}
      - {name: status_desired, type: text, size: 20}
      - {name: status_reason, type: longtext, nullable: true}
      - {name: render_reason, type: longtext, nullable: true}
      - {name: performed_at, type: time}
      - {name: next_attempt_at, type: time, nullable: true}
      - {name: attempt_count, type: int}
      - {name: claimed_by, type: text, size: 255, nullable: true}
      - {name: claimed_until, type: time, nullable: true}
      - {name: updated_at, type: time}
    primary_key: [artifact_id, gateway_id]
    foreign_keys:
      - {columns: [org_id, artifact_id], references: mod_ai_gateway_artifacts, ref_columns: [org_id, id], on_delete: cascade}
      - {columns: [org_id, gateway_id], references: mod_ai_gateway_gateways, ref_columns: [org_id, id]}
      - {columns: [deployment_id], references: mod_ai_gateway_artifact_deployments, ref_columns: [id]}
    checks:
      - "status IN ('PENDING', 'DEPLOYING', 'DEPLOYED', 'UNDEPLOYING', 'UNDEPLOYED', 'FAILED')"
      - "deployment_id IS NOT NULL OR status IN ('PENDING', 'UNDEPLOYED')"
      - "(status_desired = 'DEPLOYED' AND status IN ('PENDING', 'DEPLOYING', 'DEPLOYED', 'FAILED')) OR (status_desired = 'UNDEPLOYED' AND status IN ('UNDEPLOYING', 'UNDEPLOYED', 'FAILED'))"
    indexes: [[gateway_id], [deployment_id], [next_attempt_at], [status]]

  # --- LLM ----------------------------------------------------------------------------------

  - name: mod_ai_gateway_llm_provider_templates
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: handle, type: text, size: 255}
      - {name: name, type: text, size: 253}
      - {name: description, type: longtext, nullable: true}
      - {name: configuration, type: json}
      - {name: created_by, type: text, size: 255, nullable: true}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
    primary_key: [id]
    unique: [[org_id, handle]]

  - name: mod_ai_gateway_llm_providers
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: description, type: longtext, nullable: true}
      - {name: template_handle, type: text, size: 255}
      - {name: openapi_spec, type: longtext, nullable: true}
      - {name: model_list, type: longtext, nullable: true}
      - {name: status, type: text, size: 20}
      - {name: configuration, type: json}
      - {name: upstream_secret_id, type: id, nullable: true}
      - {name: created_by, type: text, size: 255, nullable: true}
    primary_key: [id]
    unique: [[org_id, id]]
    foreign_keys:
      - {columns: [org_id, id], references: mod_ai_gateway_artifacts, ref_columns: [org_id, id], on_delete: cascade}
    indexes: [[template_handle], [upstream_secret_id]]

  - name: mod_ai_gateway_llm_proxies
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: project_id, type: id}
      - {name: provider_id, type: id}
      - {name: description, type: longtext, nullable: true}
      - {name: openapi_spec, type: longtext, nullable: true}
      - {name: status, type: text, size: 20}
      - {name: configuration, type: json}
      - {name: upstream_secret_id, type: id, nullable: true}
      - {name: created_by, type: text, size: 255, nullable: true}
    primary_key: [id]
    unique: [[org_id, id]]
    foreign_keys:
      - {columns: [org_id, id], references: mod_ai_gateway_artifacts, ref_columns: [org_id, id], on_delete: cascade}
      - {columns: [org_id, provider_id], references: mod_ai_gateway_llm_providers, ref_columns: [org_id, id]}
    indexes: [[org_id, project_id], [provider_id], [upstream_secret_id]]

  # --- MCP proxies --------------------------------------------------------------------------

  - name: mod_ai_gateway_mcp_proxies
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: project_id, type: id, nullable: true}
      - {name: description, type: longtext, nullable: true}
      - {name: status, type: text, size: 20}
      - {name: configuration, type: json}
      - {name: created_by, type: text, size: 255, nullable: true}
    primary_key: [id]
    unique: [[org_id, id]]
    foreign_keys:
      - {columns: [org_id, id], references: mod_ai_gateway_artifacts, ref_columns: [org_id, id], on_delete: cascade}
    indexes: [[org_id, project_id]]

  - name: mod_ai_gateway_mcp_proxy_mappings
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: source_mcp_proxy_id, type: id}
      - {name: description, type: longtext, nullable: true}
      - {name: status, type: text, size: 20}
      - {name: configuration, type: json}
    primary_key: [id]
    unique: [[org_id, id]]
    foreign_keys:
      - {columns: [org_id, id], references: mod_ai_gateway_artifacts, ref_columns: [org_id, id], on_delete: cascade}
      - {columns: [org_id, source_mcp_proxy_id], references: mod_ai_gateway_mcp_proxies, ref_columns: [org_id, id]}
    indexes: [[source_mcp_proxy_id]]

  - name: mod_ai_gateway_mcp_proxy_scopes
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: mcp_proxy_id, type: id}
      - {name: action, type: text, size: 255}
      - {name: description, type: text, size: 1000, nullable: true}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
    primary_key: [id]
    unique: [[mcp_proxy_id, action], [org_id, id]]
    foreign_keys:
      - {columns: [org_id, mcp_proxy_id], references: mod_ai_gateway_mcp_proxies, ref_columns: [org_id, id], on_delete: cascade}

  - name: mod_ai_gateway_mcp_proxy_scope_tools
    columns:
      - {name: scope_id, type: id}
      - {name: tool_name, type: text, size: 255}
      - {name: org_id, type: id}
    primary_key: [scope_id, tool_name]
    foreign_keys:
      - {columns: [org_id, scope_id], references: mod_ai_gateway_mcp_proxy_scopes, ref_columns: [org_id, id], on_delete: cascade}
    indexes: [[org_id, tool_name]]

  - name: mod_ai_gateway_mcp_proxy_endpoints
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: mcp_proxy_id, type: id}
      - {name: handle, type: text, size: 255}
      - {name: name, type: text, size: 255, nullable: true}
      - {name: status, type: text, size: 20}
      - {name: configuration, type: json}
      - {name: upstream_secret_id, type: id, nullable: true}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
    primary_key: [id]
    unique: [[mcp_proxy_id, handle], [mcp_proxy_id, id]]
    foreign_keys:
      - {columns: [org_id, mcp_proxy_id], references: mod_ai_gateway_mcp_proxies, ref_columns: [org_id, id], on_delete: cascade}
    indexes: [[upstream_secret_id]]

  - name: mod_ai_gateway_mcp_proxy_endpoint_environments
    columns:
      - {name: endpoint_id, type: id}
      - {name: environment_id, type: id}
      - {name: org_id, type: id}
      - {name: mcp_proxy_id, type: id}
      - {name: artifact_id, type: id}
      - {name: status, type: text, size: 20}
      - {name: created_at, type: time}
    primary_key: [endpoint_id, environment_id]
    unique: [[mcp_proxy_id, environment_id], [artifact_id]]
    foreign_keys:
      - {columns: [mcp_proxy_id, endpoint_id], references: mod_ai_gateway_mcp_proxy_endpoints, ref_columns: [mcp_proxy_id, id], on_delete: cascade}
      - {columns: [org_id, artifact_id], references: mod_ai_gateway_artifacts, ref_columns: [org_id, id]}

  # --- Agent model and MCP configurations -----------------------------------------------------

  - name: mod_ai_gateway_agent_model_configs
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: agent_id, type: id}
      - {name: name, type: text, size: 255}
      - {name: description, type: longtext, nullable: true}
      - {name: type, type: text, size: 16}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
    primary_key: [id]
    unique: [[agent_id, name], [org_id, id]]
    checks:
      - "type IN ('llm', 'mcp', 'agent')"

  - name: mod_ai_gateway_agent_model_config_llm
    columns:
      - {name: config_id, type: id}
      - {name: environment_id, type: id}
      - {name: org_id, type: id}
      - {name: llm_proxy_id, type: id}
      - {name: policy_configuration, type: json}
      - {name: created_at, type: time}
    primary_key: [config_id, environment_id]
    foreign_keys:
      - {columns: [org_id, config_id], references: mod_ai_gateway_agent_model_configs, ref_columns: [org_id, id], on_delete: cascade}
      - {columns: [org_id, llm_proxy_id], references: mod_ai_gateway_llm_proxies, ref_columns: [org_id, id]}
    indexes: [[llm_proxy_id]]

  - name: mod_ai_gateway_agent_model_config_mcp
    columns:
      - {name: config_id, type: id}
      - {name: org_id, type: id}
      - {name: mcp_proxy_id, type: id}
      - {name: scope_recorded_at, type: time, nullable: true}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
    primary_key: [config_id]
    foreign_keys:
      - {columns: [org_id, config_id], references: mod_ai_gateway_agent_model_configs, ref_columns: [org_id, id], on_delete: cascade}
      - {columns: [org_id, mcp_proxy_id], references: mod_ai_gateway_mcp_proxies, ref_columns: [org_id, id]}
    indexes: [[mcp_proxy_id]]

  - name: mod_ai_gateway_agent_model_config_mcp_envs
    columns:
      - {name: config_id, type: id}
      - {name: environment_id, type: id}
      - {name: org_id, type: id}
      - {name: mapping_artifact_id, type: id, nullable: true}
      - {name: mcp_proxy_id, type: id, nullable: true}
      - {name: excluded, type: bool}
      - {name: created_at, type: time}
    primary_key: [config_id, environment_id]
    foreign_keys:
      - {columns: [org_id, config_id], references: mod_ai_gateway_agent_model_configs, ref_columns: [org_id, id], on_delete: cascade}
      - {columns: [org_id, mapping_artifact_id], references: mod_ai_gateway_mcp_proxy_mappings, ref_columns: [org_id, id]}
      - {columns: [org_id, mcp_proxy_id], references: mod_ai_gateway_mcp_proxies, ref_columns: [org_id, id]}
    indexes: [[mapping_artifact_id], [mcp_proxy_id]]

  - name: mod_ai_gateway_agent_model_config_vars
    columns:
      - {name: config_id, type: id}
      - {name: environment_id, type: id}
      - {name: variable_key, type: text, size: 255}
      - {name: org_id, type: id}
      - {name: variable_name, type: text, size: 255}
      - {name: created_at, type: time}
    primary_key: [config_id, environment_id, variable_key]
    foreign_keys:
      - {columns: [org_id, config_id], references: mod_ai_gateway_agent_model_configs, ref_columns: [org_id, id], on_delete: cascade}

  - name: mod_ai_gateway_ai_applications
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: agent_id, type: id}
      - {name: environment_id, type: id}
      - {name: handle, type: text, size: 255}
      - {name: name, type: text, size: 255}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
    primary_key: [id]
    unique: [[agent_id, environment_id]]

  - name: mod_ai_gateway_api_keys
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: artifact_id, type: id}
      - {name: name, type: text, size: 255}
      - {name: display_name, type: text, size: 255}
      - {name: key_hash, type: text, size: 255}
      - {name: masked_key, type: text, size: 255}
      - {name: status, type: text, size: 16}
      - {name: purpose, type: int}
      - {name: expires_at, type: time, nullable: true}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
    primary_key: [id]
    unique: [[artifact_id, name]]
    foreign_keys:
      - {columns: [org_id, artifact_id], references: mod_ai_gateway_artifacts, ref_columns: [org_id, id], on_delete: cascade}
    indexes: [[key_hash]]

  # --- A2A ----------------------------------------------------------------------------------

  - name: mod_ai_gateway_agent_exposures
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
