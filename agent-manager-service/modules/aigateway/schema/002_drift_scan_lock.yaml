module: ai-gateway
# Worker leases: the drift scan runs on one replica at a time.
tables:

  - name: mod_ai_gateway_locks
    columns:
      - {name: name, type: text, size: 128}
      - {name: owner, type: text, size: 255, nullable: true}
      - {name: expires_at, type: time, nullable: true}
    primary_key: [name]
    seed:
      - {name: drift_scan}
