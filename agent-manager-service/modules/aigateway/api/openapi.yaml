  # ============================================
  # MCP PROXY ENDPOINTS
  # ============================================

  /mcp-proxies/fetch-server-info:
    post:
      tags:
        - MCP Proxies
      summary: Fetch MCP server information
      description: Connects to an MCP server and returns discovered server metadata and capabilities.
      operationId: fetchMCPProxyServerInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPServerInfoFetchRequest"
      responses:
        "200":
          description: MCP server information fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServerInfoFetchResponse"
        "400":
          description: Invalid request or unreachable MCP server URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized or MCP server authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many MCP server probes are in progress for this user or on the service. Retry shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mcp-proxies/policies:
    get:
      tags:
        - MCP Proxies
      summary: List available MCP policies
      description: Returns MCP policy names and versions reported by active gateways.
      operationId: listAvailableMCPPolicies
      responses:
        "200":
          description: Available MCP policies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPPolicyAvailabilityResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mcp-proxies:
    post:
      tags:
        - MCP Proxies
      summary: Create an MCP proxy
      description: Creates an MCP proxy and optionally deploys its endpoints to the environments they declare.
      operationId: createMCPProxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpProxyDocument"
      responses:
        "201":
          description: MCP proxy created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpProxyDocument"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "MCP proxy already exists, or CONTEXT_IN_USE: its context equals, contains or sits under another artifact's context on the same vhost of a gateway it deploys to; nothing is stored"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - MCP Proxies
      summary: List MCP proxies
      description: >-
        Retrieve a paginated list of MCP proxies in an organization.


        Each item is an McpProxy document, populated for list use: every required field
        is present, but heavy optional blocks - spec.endpoints above all - are omitted.
        A list item is a valid document, not necessarily a complete one; read the item
        itself for the full spec.
      operationId: listMCPProxies
      parameters:
        - name: project
          in: query
          description: >-
            Also include this project's proxies, read only. Without it only org-level proxies are
            returned. Unknown project returns 404 PROJECT_NOT_FOUND. The agent Tools picker passes the
            agent's project.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        "200":
          description: Successfully retrieved MCP proxy list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPProxyListResponse"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found (PROJECT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mcp-proxies/{proxyId}:
    parameters:
      - name: proxyId
        in: path
        required: true
        description: MCP proxy UUID or handle
        schema:
          type: string

    get:
      tags:
        - MCP Proxies
      summary: Get MCP proxy details
      description: >-
        Retrieve detailed information about an MCP proxy. Also returns a project's proxy (read only),
        with spec.projectName set and no endpoints; its per-environment data (security, deployment
        status) is on the project's own route.
      operationId: getMCPProxy
      responses:
        "200":
          description: Successfully retrieved MCP proxy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpProxyDocument"
        "400":
          description: Invalid MCP proxy ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: MCP proxy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags:
        - MCP Proxies
      summary: Update MCP proxy
      description: >-
        Updates an MCP proxy and redeploys dependent MCP mapping artifacts. metadata.name must
        name the proxy in the path. The spec replaces the stored one, so it must carry every
        field to keep, including at least one endpoint; an endpoint's upstream credentials are
        the exception and survive being omitted.
      operationId: updateMCPProxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpProxyDocument"
      responses:
        "200":
          description: MCP proxy updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpProxyDocument"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: MCP proxy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "PROJECT_OWNED. The proxy belongs to a project and is managed only through the project routes; or CONTEXT_IN_USE: its context equals, contains or sits under another artifact's context on the same vhost of a gateway it deploys to, and nothing is stored"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - MCP Proxies
      summary: Delete MCP proxy
      description: >-
        Deletes an MCP proxy if no agent mappings still reference it. A project proxy is refused with
        409 PROJECT_OWNED while its project exists; once the project is gone (looked up by
        the project name stored on the proxy), this route deletes it with the same teardown.
      operationId: deleteMCPProxy
      responses:
        "204":
          description: MCP proxy deleted successfully
        "400":
          description: Invalid MCP proxy ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: MCP proxy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: PROJECT_OWNED (the proxy belongs to a project that still exists) or MCP proxy has agent mappings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mcp-proxies/{proxyId}/scopes:
    parameters:
      - name: proxyId
        in: path
        required: true
        description: MCP proxy UUID or handle
        schema:
          type: string

    get:
      tags:
        - MCPProxyScopes
      summary: List MCP proxy scopes
      description: >-
        Lists the proxy's scopes. Each scope is an action on the resource server this proxy is;
        metadata.name is the action and spec.scope the token scope string "<proxy-handle>:<action>".
      operationId: listMCPProxyScopes
      responses:
        "200":
          description: Scope list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPProxyScopeListResponse"
        "404":
          description: MCP proxy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - MCPProxyScopes
      summary: Create MCP proxy scope
      description: metadata.name is the scope's action.
      operationId: createMCPProxyScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpProxyScopeDocument"
      responses:
        "201":
          description: Scope created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpProxyScopeDocument"
        "400":
          description: Invalid action, tools, or unknown tool name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: MCP proxy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A scope with this action already exists on the proxy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mcp-proxies/{proxyId}/scopes/{scopeAction}:
    parameters:
      - name: proxyId
        in: path
        required: true
        description: MCP proxy UUID or handle
        schema:
          type: string
      - name: scopeAction
        in: path
        required: true
        description: The scope's action
        schema:
          type: string

    put:
      tags:
        - MCPProxyScopes
      summary: Update MCP proxy scope
      description: >-
        Updates description and/or tools. The action itself is immutable (rename = delete +
        create), so metadata.name must match the action in the path. An absent spec.tools
        leaves the tool list unchanged; an empty one unbinds the scope from every tool.
      operationId: updateMCPProxyScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpProxyScopeDocument"
      responses:
        "200":
          description: Scope updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpProxyScopeDocument"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: MCP proxy or scope not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - MCPProxyScopes
      summary: Delete MCP proxy scope
      description: Deletes the scope. Best-effort removal of the corresponding Thunder action and role permissions, then gateway re-emission; tools the scope covered become authenticated-only unless another scope covers them.
      operationId: deleteMCPProxyScope
      responses:
        "204":
          description: Scope deleted
        "404":
          description: MCP proxy or scope not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================
  # LLM DEPLOYMENT ENDPOINTS
  # ============================================

  /orgs/{orgName}/llm-providers/{providerId}/deployments:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
      - name: providerId
        in: path
        required: true
        description: Provider UUID
        schema:
          type: string

    post:
      tags:
        - LLM Deployments
      summary: Deploy an LLM provider
      description: >-
        Deploy the LLM provider's current configuration to a gateway. The deployment starts DEPLOYING and becomes
        DEPLOYED when the gateway acknowledges it; the request does not wait for the gateway. To redeploy an earlier
        deployment, restore it.
      operationId: deployLLMProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMDeployRequest"
      responses:
        "201":
          description: Deployment started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMDeploymentResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Provider or gateway not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "CONTEXT_IN_USE. The context equals, contains or sits under another artifact's context on the same vhost of the gateway"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - LLM Deployments
      summary: Get LLM provider deployments
      description: Retrieve all deployments for an LLM provider
      operationId: getLLMProviderDeployments
      parameters:
        - name: gatewayId
          in: query
          description: Filter by gateway ID
          schema:
            type: string
        - name: status
          in: query
          description: >-
            Filter by the gateway's stored deployment status. A deployment whose redeploy is owed is shown DEPLOYING
            but filtered by the status the gateway holds.
          schema:
            type: string
            enum:
              - DEPLOYING
              - DEPLOYED
              - UNDEPLOYING
              - UNDEPLOYED
              - FAILED
              - ARCHIVED
      responses:
        "200":
          description: Successfully retrieved deployments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LLMDeploymentResponse"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/llm-providers/{providerId}/deployments/undeploy:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
      - name: providerId
        in: path
        required: true
        description: Provider UUID
        schema:
          type: string

    post:
      tags:
        - LLM Deployments
      summary: Undeploy an LLM provider deployment
      description: >-
        Undeploy the provider's current deployment on a gateway, whether it is DEPLOYING, DEPLOYED or failed to
        deploy. The deployment goes UNDEPLOYING until the gateway acknowledges it. A failed undeploy can be
        retried by undeploying again.
      operationId: undeployLLMProviderDeployment
      parameters:
        - name: deploymentId
          in: query
          required: true
          description: Deployment UUID to undeploy
          schema:
            type: string
        - name: gatewayId
          in: query
          required: true
          description: Gateway UUID
          schema:
            type: string
      responses:
        "200":
          description: Provider undeployed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: LLM provider undeployed successfully
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Provider, deployment, or gateway not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            The deployment isn't the gateway's current deployment, or it is already undeployed or being
            undeployed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

