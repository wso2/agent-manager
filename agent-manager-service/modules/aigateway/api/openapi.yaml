openapi: 3.0.3
info:
  version: 1.0.0
  title: AI Gateway API
  description: |
    The AI Gateway module's API: gateways, LLM providers and proxies, MCP
    proxies, A2A, agent API keys and agent identities. Paths are relative to
    /m/ai-gateway. The controller-facing API below /api/internal/v1 is not
    described here.
  x-amp-module: ai-gateway
  x-go-package: gwspec
servers:
  - url: /m/ai-gateway
security:
  - bearerAuth: []
paths:
  /agents/{agentName}/deployments:
    get:
      summary: List agent deployments with detailed information
      description: Retrieves detailed deployment information for a specific agent across all environments
      operationId: listAgentDeployments
      parameters:
        - name: agentName
          in: path
          description: Unique name of the agent
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: true
          description: Handle of the project the agent belongs to.
          schema:
            type: string
      responses:
        "200":
          description: Map of environment names to deployment details, ordered by deployment pipeline sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentListResponse"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agents/{agentName}/configurations:
    get:
      summary: Get agent configurations
      description: The agent's gateway settings in the default environment, and the provisioning state of the LLM providers and MCP proxies it asked for in its extensions.ai-gateway block (see AgentGatewayExtension)
      operationId: getAgentConfigurations
      parameters:
        - name: agentName
          in: path
          description: Unique name of the agent
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: true
          description: Handle of the project the agent belongs to.
          schema:
            type: string
      responses:
        "200":
          description: Agent configuration details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfigurationResponse"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agents/{agentName}/deploy-settings:
    put:
      summary: Update agent deploy settings
      description: |
        Updates per-environment deploy settings (CORS, API key security, auto
        instrumentation) on the agent's release binding without redeploying or
        promoting. Triggers a pod rollout in the target environment so the new
        policies take effect immediately. Any setting field omitted from the
        request retains its current value.
      operationId: updateAgentDeploySettings
      parameters:
        - name: agentName
          in: path
          description: Unique name of the agent
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: true
          description: Handle of the project the agent belongs to.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentDeploySettingsRequest"
      responses:
        "204":
          description: Deploy settings updated successfully
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent or environment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/environments/{envID}/gateways:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 1
          maxLength: 64
      - name: envID
        in: path
        required: true
        description: Environment UUID or name
        schema:
          type: string

    get:
      tags:
        - Environments
      summary: Get environment gateways
      description: |
        List all gateways mapped to a specific environment.

        This endpoint returns all gateways that are available in this environment,
        useful for understanding which gateways can be used by agents in this environment.
      operationId: getEnvironmentGateways
      responses:
        "200":
          description: Successfully retrieved gateway list
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateways:
                    type: array
                    items:
                      $ref: "#/components/schemas/GatewayResponse"
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/gateways:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 1
          maxLength: 64

    get:
      tags:
        - Gateways
      summary: List all gateways
      description: |
        Retrieve a paginated list of all gateways for the organization.

        Supports filtering by gateway type, status, and environment.
      operationId: listGateways
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: type
          in: query
          description: |
            Filter by gateway type. `REGULAR` and `AI` are deprecated aliases
            (REGULAR -> BOTH, AI -> EGRESS) kept for backward compatibility.
          schema:
            $ref: "#/components/schemas/GatewayTypeInput"
        - name: status
          in: query
          description: Filter by gateway status
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
              - PROVISIONING
              - ERROR
        - name: environment
          in: query
          description: Filter by environment name
          schema:
            type: string
      responses:
        "200":
          description: Successfully retrieved gateway list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayListResponse"
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Gateways
      summary: Register a new gateway
      description: |
        Register a new AI gateway with the platform.

        **Gateway Types:**
        - REGULAR: Handles incoming API traffic
        - AI: Handles outgoing LLM/MCP traffic (used for AI agents)

        **Security Note:**
        - Gateway credentials are encrypted before storage
        - Credentials are never returned in API responses
        - Use a strong encryption key configured in GATEWAY_ENCRYPTION_KEY

        A gateway serves exactly one environment: `environmentIds` takes at most one environment.
      operationId: registerGateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGatewayRequest"
      responses:
        "201":
          description: Gateway registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Forbidden - insufficient permissions, or `orgId` names an organization other than the
            caller's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            Conflict - the gateway already exists, or `environmentIds` names more than one environment
            (code `GATEWAY_ENVIRONMENT_FIXED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/gateways/{gatewayID}:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 1
          maxLength: 64
      - name: gatewayID
        in: path
        required: true
        description: Gateway UUID or name
        schema:
          type: string

    get:
      tags:
        - Gateways
      summary: Get gateway details
      description: |
        Retrieve detailed information about a specific gateway, including mapped environments.

        **Security Note:** Credentials are never returned in the response.
      operationId: getGateway
      responses:
        "200":
          description: Successfully retrieved gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags:
        - Gateways
      summary: Update gateway
      description: |
        Update an existing gateway's properties.

        **Updatable Fields:**
        - Display name
        - Critical flag
        - Status
        - Adapter configuration
        - Credentials (re-encrypted on update)

        **Immutable Fields:**
        - Gateway name
        - Gateway type
        - VHost
        - Organization
      operationId: updateGateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGatewayRequest"
      responses:
        "200":
          description: Gateway updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Gateways
      summary: Deregister gateway
      description: |
        Soft delete a gateway. This will:
        - Mark the gateway as deleted
        - Remove all gateway-environment mappings
        - Preserve gateway data for audit/recovery

        The gateway can be restored if needed by contacting support.

        **Warning:** This operation will affect all environments using this gateway.
      operationId: deleteGateway
      responses:
        "204":
          description: Gateway deregistered successfully
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/gateways/{gatewayID}/environments:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 1
          maxLength: 64
      - name: gatewayID
        in: path
        required: true
        description: Gateway UUID or name
        schema:
          type: string

    get:
      tags:
        - Gateway-Environment Mappings
      summary: Get gateway environments
      description: |
        List all environments mapped to a specific gateway.

        This shows which environments can use this gateway for routing traffic.
      operationId: getGatewayEnvironments
      responses:
        "200":
          description: Successfully retrieved environment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  environments:
                    type: array
                    items:
                      $ref: "#/components/schemas/GatewayEnvironmentResponse"
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/gateways/{gatewayID}/environments/{envID}:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 1
          maxLength: 64
      - name: gatewayID
        in: path
        required: true
        description: Gateway UUID or name
        schema:
          type: string
      - name: envID
        in: path
        required: true
        description: Environment UUID or name
        schema:
          type: string

    post:
      tags:
        - Gateway-Environment Mappings
      summary: Assign gateway to environment
      description: |
        Create a mapping between a gateway and an environment.

        This makes the gateway available for use in the specified environment.
        A gateway serves exactly one environment: once mapped, it can be assigned again only to
        that same environment, which succeeds without change.
      operationId: assignGatewayToEnvironment
      responses:
        "201":
          description: Mapping created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            Conflict - the gateway is already mapped to another environment (code
            `GATEWAY_ENVIRONMENT_FIXED`), or the environment already has an ingress gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Gateway-Environment Mappings
      summary: Remove gateway from environment
      description: |
        Remove the mapping between a gateway and an environment.

        This makes the gateway unavailable in the specified environment.

        The mapping is not removed while any of the environment's agents, MCP proxies or
        agent and monitor LLM proxies is deployed, or being deployed, on the gateway.
        Undeploy them from this gateway first.
      operationId: removeGatewayFromEnvironment
      responses:
        "204":
          description: Mapping removed successfully
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Gateway, environment, or mapping not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The gateway still serves this environment's agents or proxies; undeploy them from this gateway, or remove the LLM configuration from the agents and monitors in this environment, first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/gateways/{gatewayID}/health:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 1
          maxLength: 64
      - name: gatewayID
        in: path
        required: true
        description: Gateway UUID or name
        schema:
          type: string

    get:
      tags:
        - Health
      summary: Check gateway health
      description: |
        Perform a health check on the gateway by communicating with it via the configured adapter.

        This endpoint will:
        - Verify connectivity to the gateway
        - Check gateway operational status
        - Measure response time
        - Return detailed health information
      operationId: checkGatewayHealth
      responses:
        "200":
          description: Health check completed (status in response body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatusResponse"
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/gateways/{gatewayID}/tokens:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 1
          maxLength: 64
      - name: gatewayID
        in: path
        required: true
        description: Gateway UUID or name
        schema:
          type: string

    get:
      tags:
        - Gateway Tokens
      summary: List gateway tokens
      description: Retrieve all active authentication tokens for a specific gateway.
      operationId: listGatewayTokens
      responses:
        "200":
          description: List of gateway tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayTokenListResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Gateway not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Gateway Tokens
      summary: Rotate gateway token
      description: |
        Generate a new authentication token for the gateway and invalidate the old one.

        **Security Note:**
        - The new token is only returned once in this response
        - Store the token securely - it cannot be retrieved later
        - The old token will be immediately invalidated
        - Update your gateway configuration with the new token

        **Use Cases:**
        - Regular token rotation for security compliance
        - Token compromise recovery
        - Periodic security maintenance
      operationId: rotateGatewayToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateGatewayTokenRequest"
      responses:
        "200":
          description: Token rotated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayTokenResponse"
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Forbidden - insufficient permissions, or `orgId` names an organization other than the
            caller's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Gateway not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/gateways/{gatewayID}/tokens/{tokenID}:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 1
          maxLength: 64
      - name: gatewayID
        in: path
        required: true
        description: Gateway UUID or name
        schema:
          type: string
      - name: tokenID
        in: path
        required: true
        description: Token identifier to revoke
        schema:
          type: string

    delete:
      tags:
        - Gateway Tokens
      summary: Revoke gateway token
      description: |
        Revoke a specific gateway authentication token.

        **Security Note:**
        - The token will be immediately invalidated
        - Any gateway using this token will lose authentication
        - This action cannot be undone

        **Use Cases:**
        - Emergency token revocation after compromise
        - Decommissioning gateway instances
        - Security incident response
      operationId: revokeGatewayToken
      responses:
        "204":
          description: Token revoked successfully
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Gateway or token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/self-hosted-gateways:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 1
          maxLength: 64

    get:
      tags:
        - Self-Hosted Gateways
      summary: List self-hosted gateways
      description: Retrieve a paginated list of the organization's self-hosted gateways. Managed gateways are not listed.
      operationId: listSelfHostedGateways
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        "200":
          description: Successfully retrieved self-hosted gateway list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayListResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Self-Hosted Gateways
      summary: Register a self-hosted gateway
      description: |
        Registers a gateway the customer runs, in the named environment, and binds it there.
        No cloud infrastructure is created and no token is returned: the gateway becomes active
        when its own controller connects with a registration token
        (`POST /orgs/{orgName}/self-hosted-gateways/{gatewayID}/tokens`).

        The gateway's name is the `handle` given, unique in the organization.
      operationId: registerSelfHostedGateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfHostedGatewayRequest"
