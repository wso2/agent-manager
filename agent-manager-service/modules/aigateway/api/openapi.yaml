        description: Organization name/handle
        schema:
          type: string
      - name: projName
        in: path
        required: true
        description: Project name
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: Proxy handle
        schema:
          type: string

    post:
      tags:
        - LLM Deployments
      summary: Deploy an LLM proxy
      description: >-
        Deploy the LLM proxy's current configuration to a gateway. The deployment starts DEPLOYING and becomes
        DEPLOYED when the gateway acknowledges it; the request does not wait for the gateway. To redeploy an earlier
        deployment, restore it.
      operationId: deployLLMProxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMDeployRequest"
      responses:
        "201":
          description: Deployment started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMDeploymentResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Proxy or gateway not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "CONTEXT_IN_USE. The context equals, contains or sits under another artifact's context on the same vhost of the gateway"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - LLM Deployments
      summary: Get LLM proxy deployments
      description: Retrieve all deployments for an LLM proxy
      operationId: getLLMProxyDeployments
      parameters:
        - name: gatewayId
          in: query
          description: Filter by gateway ID
          schema:
            type: string
        - name: status
          in: query
          description: >-
            Filter by the gateway's stored deployment status. A deployment whose redeploy is owed is shown DEPLOYING
            but filtered by the status the gateway holds.
          schema:
            type: string
            enum:
              - DEPLOYING
              - DEPLOYED
              - UNDEPLOYING
              - UNDEPLOYED
              - FAILED
              - ARCHIVED
      responses:
        "200":
          description: Successfully retrieved deployments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LLMDeploymentResponse"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Proxy not found
          content:
            application/json:
