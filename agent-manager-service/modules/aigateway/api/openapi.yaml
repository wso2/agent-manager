  /orgs/{orgName}/identity-providers/discover:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 1
          maxLength: 64

    get:
      tags:
        - Gateway Identity Providers
      summary: Discover OIDC issuer metadata from a URL
      description: |
        Fetch the OpenID Connect discovery document for the given URL and return the
        issuer and JWKS URI. Accepts either an issuer base URL or a full
        `.well-known/openid-configuration` URL. Used to auto-populate the issuer and
        JWKS URI fields in the Add Identity Provider dialog; manual entry remains
        available. The backend fetches the document server-side over an SSRF-protected
        client, so it works regardless of browser CORS.
      operationId: discoverOidcConfiguration
      parameters:
        - name: url
          in: query
          required: true
          description: Issuer base URL or full .well-known/openid-configuration URL.
          schema:
            type: string
      responses:
        "200":
          description: Discovered OIDC metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcDiscoveryResponse"
        "400":
          description: Invalid or unreachable URL, or malformed discovery document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/gateways/{gatewayID}/identity-providers:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 1
          maxLength: 64
      - name: gatewayID
        in: path
        required: true
        description: Gateway UUID or name
        schema:
          type: string

    get:
      tags:
        - Gateway Identity Providers
      summary: List gateway identity providers
      description: |
        Retrieve the JWT identity providers (token issuers) configured for a gateway.

        Identity providers are owned by the gateway's runtime configuration; this list
        mirrors that configuration and is used to populate the issuer options when
        applying OAuth security to an agent endpoint. The reserved internal identity
        provider used for platform trace ingestion is never included.
      operationId: listGatewayIdentityProviders
      responses:
        "200":
          description: List of gateway identity providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProviderListResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Gateway not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orgs/{orgName}/gateways/{gatewayID}/identity-providers/{name}:
    parameters:
      - name: orgName
        in: path
        required: true
        description: Organization name/handle
        schema:
          type: string
          pattern: "^[a-z0-9-]+$"
          minLength: 1
          maxLength: 64
      - name: gatewayID
        in: path
        required: true
        description: Gateway UUID or name
        schema:
          type: string
      - name: name
        in: path
        required: true
        description: Unique identity provider name within the gateway
        schema:
          type: string

    put:
      tags:
        - Gateway Identity Providers
      summary: Upsert a gateway identity provider
      description: |
        Create or update an identity provider in the gateway's AMS mirror.

        This endpoint only updates the mirror used by the console and agent OAuth
        configuration. The gateway runtime configuration (ConfigMap) is the source
        of truth and must be patched separately via the manage-identity-provider
        script. The console renders that command rather than calling this endpoint
        directly.

        Sharp edge: writing to the mirror without also patching the gateway runtime
        makes the two diverge. Agent OAuth deploy-time validation only checks the
        mirror, so an agent referencing a mirror-only issuer will deploy successfully
        while the gateway rejects every token at runtime. Use the
        manage-identity-provider script to keep them in sync.
      operationId: upsertGatewayIdentityProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertIdentityProviderRequest"
      responses:
        "200":
          description: Identity provider upserted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvider"
        "400":
          description: Bad request - invalid parameters or reserved name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Gateway not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Gateway Identity Providers
      summary: Delete a gateway identity provider
      description: |
        Remove an identity provider from the gateway's AMS mirror. As with upsert, the
        gateway runtime configuration must be patched separately. System identity
        providers (e.g. ThunderKeyManager) cannot be deleted.

        Sharp edge: deleting only the mirror row leaves the issuer trusted by the
        gateway at runtime, and re-adding it elsewhere can mask the divergence. Use
        the manage-identity-provider script (ACTION=delete) so the mirror and the
        gateway runtime stay in sync.
      operationId: deleteGatewayIdentityProvider
      responses:
        "204":
          description: Identity provider deleted successfully
        "400":
          description: Bad request - reserved or system provider cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Gateway or identity provider not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

