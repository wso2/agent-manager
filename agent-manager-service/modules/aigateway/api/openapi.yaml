  /agents/{agentName}/agent-card:
    parameters: &agentCardPathParams
      - name: agentName
        in: path
        required: true
        description: Agent name
        schema:
          type: string
      - name: project
        in: query
        required: true
        description: Handle of the project the agent belongs to.
        schema:
          type: string
    get:
      tags:
        - Agent Card
      summary: Get an A2A agent's stored agent card for an environment
      description: Returns the last good public agent card the platform fetched, and the state of the current fetch. Returns 404 when no fetch was ever queued for the environment; refreshing queues one.
      operationId: getAgentCard
      responses:
        "200":
          description: Stored agent card and fetch state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCardResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent, environment or card not found, or the agent is not an A2A agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agents/{agentName}/agent-card/refresh:
    parameters: *agentCardPathParams
    post:
      tags:
        - Agent Card
      summary: Re-fetch an A2A agent's card
      description: Queues a fetch of the agent card. The stored card is kept until the new fetch succeeds.
      operationId: refreshAgentCard
      responses:
        "202":
          description: Fetch queued
        "400":
          description: The agent is not an A2A agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing the environment tier permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent or environment not found, the agent is not deployed in this environment, or an external agent has no card source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agents/{agentName}/agent-card/source:
    parameters: *agentCardPathParams
    put:
      tags:
        - Agent Card
      summary: Register an external agent's card URL for an environment
      description: Sets the URL the platform fetches the card from and queues a fetch. External agents only.
      operationId: setAgentCardSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAgentCardSourceRequest"
      responses:
        "202":
          description: Source saved and fetch queued
        "400":
          description: >-
            Invalid URL, the agent is not an external agent, or the environment routes the agent
            through its gateway and the gateway cannot fetch the card from this URL (it must end in
            /.well-known/agent-card.json with no query)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing the environment tier permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent or environment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            The environment is routed through the gateway with a stored upstream credential, and the
            new URL is on another origin (scheme, host or port). Clear the upstream auth first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Agent Card
      summary: Remove an external agent's card source for an environment
      description: Deletes the stored card and its source. Idempotent. External agents only.
      operationId: deleteAgentCardSource
      responses:
        "204":
          description: Source removed
        "400":
          description: The agent is not an external agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing the environment tier permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent or environment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The audit trail is unavailable; nothing was changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agents/{agentName}/a2a-proxy:
    parameters: *agentCardPathParams
    get:
      tags:
        - A2A Proxy
      summary: Get how an external agent is routed through the environment's gateway
      description: >-
        Reports the gateway publication of a proxied environment. The upstream secret is never
        returned; a non-empty upstreamAuthHeader means one is stored.
      operationId: getA2AProxy
      responses:
        "200":
          description: Proxy state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2AProxyResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The environment is not proxied, or the agent or environment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - A2A Proxy
      summary: Route an external agent through the environment's gateway, or change its upstream auth
      description: >-
        Publishes the agent through the environment's ingress gateway, with routes derived from its
        registered card URL. Omitting upstreamAuth clears the stored credential; upstreamAuth without
        a value keeps the stored secret; a value replaces it. External agents only.
      operationId: setA2AProxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetA2AProxyRequest"
      responses:
        "202":
          description: Saved; the gateway publication is queued
        "400":
          description: >-
            Invalid upstream auth, the agent is not an external agent, or the gateway cannot fetch
            the card from the registered URL (it must end in /.well-known/agent-card.json with no query)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing the environment tier permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent or environment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No card URL is registered for the environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The audit trail is unavailable; nothing was changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - A2A Proxy
      summary: Stop routing an external agent through the environment's gateway
      description: >-
        Removes the agent from the gateway, discards the stored upstream secret and fetches the
        agent's own card again. The environment's API keys are kept.
      operationId: deleteA2AProxy
      responses:
        "204":
          description: The environment is direct again
        "400":
          description: The agent is not an external agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing the environment tier permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The environment is not proxied, or the agent or environment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The audit trail is unavailable; nothing was changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agents/{agentName}/a2a-proxy/refresh:
    parameters: *agentCardPathParams
    post:
      tags:
        - A2A Proxy
      summary: Re-derive a proxied agent's routes from its card and republish it
      operationId: refreshA2AProxy
      responses:
        "202":
          description: Republish queued; the card is fetched again once it lands
