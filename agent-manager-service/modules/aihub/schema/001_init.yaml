module: ai-hub
# The AI Hub's tables: subscription plans, the subscriptions copied in from developer portals, and the secrets
# those portals sign their webhook deliveries with. They reference the organization by id (org_id) without
# foreign keys into the core. Secret values (subscription keys, webhook secrets) are kept in the module's secret
# store under paths named after their rows, not in these tables.
tables:
  # Subscription plans, one row per plan of an organization. The handle is the plan's id in the API,
  # unique in its organization. org_id is the core organization's id; modules hold no foreign keys into
  # the core, so a plan outlives nothing it points at.
  - name: mod_ai_hub_subscription_plans
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: handle, type: text, size: 40}
      - {name: display_name, type: text, size: 255}
      # The name case-folded (Unicode), which the list's search matches: SQLite's LOWER folds ASCII only.
      # Folding can lengthen a name (one character becomes up to three), so it holds three times the name.
      - {name: display_name_folded, type: text, size: 765}
      - {name: description, type: text, size: 1023, nullable: true}
      - {name: status, type: text, size: 16}
      - {name: expiry_time, type: time, nullable: true}
      - {name: created_by, type: text, size: 255, nullable: true}
      - {name: updated_by, type: text, size: 255, nullable: true}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
      # When the plan last changed at the developer portal it was copied from, by the portal's clock: a webhook
      # delivery that happened earlier is out of date and changes nothing. Null for a plan made here.
      - {name: source_changed_at, type: time, nullable: true}
      # Where the plan was made: ai-control-plane for a plan made here, or the name of the developer portal that
      # copied it in by webhook.
      - {name: origin, type: text, size: 255}
      # When the plan was deprecated. A deprecated plan is kept for the subscriptions on it, and gateways still
      # get it, but it can't be changed, offered or subscribed to again. Null while the plan is current.
      - {name: deprecated_at, type: time, nullable: true}
    primary_key: [id]
    unique: [[org_id, handle], [org_id, id]]

  # The conditions of a plan, in order. A built-in condition (request-count, tool-call-count, token-count) has a
  # fixed id; a custom condition has its own.
  - name: mod_ai_hub_subscription_plan_conditions
    columns:
      - {name: org_id, type: id}
      - {name: plan_id, type: id}
      - {name: condition_id, type: text, size: 63}
      - {name: condition_type, type: text, size: 32}
      - {name: params, type: json}
      - {name: sort_order, type: int}
    primary_key: [plan_id, condition_id]
    foreign_keys:
      - {columns: [org_id, plan_id], references: mod_ai_hub_subscription_plans, ref_columns: [org_id, id], on_delete: cascade}

  # Subscriptions to an artifact (an MCP proxy) on a plan, copied in from the developer portal where the
  # subscriber subscribed. One per subscriber and artifact. The subscription key itself is kept in the
  # core's secret store (subscriptions/<id>/token), encrypted with the core's key; gateways get it to hash.
  - name: mod_ai_hub_subscriptions
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      # The subscription's id at the developer portal, for its later events.
      - {name: source_id, type: text, size: 64}
      - {name: artifact_kind, type: text, size: 32}
      - {name: artifact_handle, type: text, size: 255}
      - {name: plan_id, type: id}
      - {name: subscriber_id, type: text, size: 255}
      - {name: status, type: text, size: 16}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
      # When the subscription last changed at the portal, by the portal's clock: an older event changes nothing.
      - {name: source_changed_at, type: time}
    primary_key: [id]
    unique: [[org_id, source_id], [org_id, artifact_kind, artifact_handle, subscriber_id], [org_id, id]]

  # The secrets developer portals sign their webhook deliveries with, one row per portal (or per portal
  # organization) that sends to an organization here. A delivery names its secret by secret_hash; the row says
  # which organization the delivery is for, so a portal organization's reference (org.ref_id) needn't be this
  # organization's id: several portals, several portal organizations, and a portal organization that also sends
  # to other control planes (with its reference set to their handle) can each send to one organization here.
  - name: mod_ai_hub_webhook_secrets
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      # The secret's name in the API, unique in its organization.
      - {name: handle, type: text, size: 40}
      - {name: display_name, type: text, size: 255}
      # The org.ref_id the portal sends, when it isn't this organization's id (which is always accepted): the
      # portal organization's control-plane reference, such as the organization handle another control plane
      # needs. Null when the portal sends this organization's id.
      - {name: org_ref, type: text, size: 255, nullable: true}
      # The highest version issued, so a version number is never reused.
      - {name: last_version, type: int}
      - {name: created_by, type: text, size: 255, nullable: true}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
    primary_key: [id]
    unique: [[org_id, handle], [org_id, id]]

  # The versions of a secret a sender may still sign with: a rotation adds one, and the old one stays until it is
  # deleted, so the portal can switch without a failed delivery. The value is kept in the core's secret store
  # (webhook-secrets/<id>/v<version>), encrypted with the core's key; only its hash and a masked form are here.
  - name: mod_ai_hub_webhook_secret_versions
    columns:
      - {name: org_id, type: id}
      - {name: secret_id, type: id}
      - {name: version, type: int}
      # The hex SHA3-256 of "api-portal-webhook-secret-hash-v1:<secret>", as deliveries name it.
      - {name: secret_hash, type: text, size: 64}
      - {name: masked_secret, type: text, size: 32}
      - {name: created_by, type: text, size: 255, nullable: true}
      - {name: created_at, type: time}
    primary_key: [secret_id, version]
    unique: [[secret_hash]]
    foreign_keys:
      - {columns: [org_id, secret_id], references: mod_ai_hub_webhook_secrets, ref_columns: [org_id, id], on_delete: cascade}
