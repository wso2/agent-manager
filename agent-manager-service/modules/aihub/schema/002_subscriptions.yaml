module: ai-hub
tables:
  # Subscriptions to an artifact (an MCP proxy) on a plan, copied in from the developer portal where the
  # subscriber subscribed. One per subscriber and artifact. The subscription key itself is kept in the
  # core's secret store (subscriptions/<id>/token), encrypted with the core's key; gateways get it to hash.
  - name: mod_ai_hub_subscriptions
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      # The subscription's id at the developer portal, for its later events.
      - {name: source_id, type: text, size: 64}
      - {name: artifact_kind, type: text, size: 32}
      - {name: artifact_handle, type: text, size: 255}
      - {name: plan_id, type: id}
      - {name: subscriber_id, type: text, size: 255}
      - {name: status, type: text, size: 16}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
      # When the subscription last changed at the portal, by the portal's clock: an older event changes nothing.
      - {name: source_changed_at, type: time}
    primary_key: [id]
    unique: [[org_id, source_id], [org_id, artifact_kind, artifact_handle, subscriber_id], [org_id, id]]
