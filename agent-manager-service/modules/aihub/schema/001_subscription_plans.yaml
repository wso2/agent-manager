module: ai-hub
tables:
  # Subscription plans, one row per plan of an organization. The handle is the plan's id in the API,
  # unique in its organization. org_id is the core organization's id; modules hold no foreign keys into
  # the core, so a plan outlives nothing it points at.
  - name: mod_ai_hub_subscription_plans
    columns:
      - {name: id, type: id}
      - {name: org_id, type: id}
      - {name: handle, type: text, size: 40}
      - {name: display_name, type: text, size: 255}
      # The name case-folded (Unicode), which the list's search matches: SQLite's LOWER folds ASCII only.
      # Folding can lengthen a name (one character becomes up to three), so it holds three times the name.
      - {name: display_name_folded, type: text, size: 765}
      - {name: description, type: text, size: 1023, nullable: true}
      - {name: status, type: text, size: 16}
      - {name: expiry_time, type: time, nullable: true}
      - {name: created_by, type: text, size: 255, nullable: true}
      - {name: updated_by, type: text, size: 255, nullable: true}
      - {name: created_at, type: time}
      - {name: updated_at, type: time}
      # When the plan last changed at the developer portal it was copied from, by the portal's clock: a webhook
      # delivery that happened earlier is out of date and changes nothing. Null for a plan made here.
      - {name: source_changed_at, type: time, nullable: true}
      # Where the plan was made: ai-control-plane for a plan made here, or the name of the developer portal that
      # copied it in by webhook.
      - {name: origin, type: text, size: 255}
      # When the plan was deprecated. A deprecated plan is kept for the subscriptions on it, and gateways still
      # get it, but it can't be changed, offered or subscribed to again. Null while the plan is current.
      - {name: deprecated_at, type: time, nullable: true}
    primary_key: [id]
    unique: [[org_id, handle], [org_id, id]]

  # The conditions of a plan, in order. A built-in condition (request-count, tool-call-count, token-count) has a
  # fixed id; a custom condition has its own.
  - name: mod_ai_hub_subscription_plan_conditions
    columns:
      - {name: org_id, type: id}
      - {name: plan_id, type: id}
      - {name: condition_id, type: text, size: 63}
      - {name: condition_type, type: text, size: 32}
      - {name: params, type: json}
      - {name: sort_order, type: int}
    primary_key: [plan_id, condition_id]
    foreign_keys:
      - {columns: [org_id, plan_id], references: mod_ai_hub_subscription_plans, ref_columns: [org_id, id], on_delete: cascade}

  # Plans deleted (deprecated) at the developer portal they were copied from, kept for a while after the deletion,
  # so a create delivered after it (a retry of an older event) doesn't bring back a plan this side never had.
  # deleted_at is the portal's clock; recorded_at is ours, for pruning.
  - name: mod_ai_hub_deleted_plans
    columns:
      - {name: org_id, type: id}
      - {name: handle, type: text, size: 40}
      - {name: deleted_at, type: time}
      - {name: recorded_at, type: time}
    primary_key: [org_id, handle]
