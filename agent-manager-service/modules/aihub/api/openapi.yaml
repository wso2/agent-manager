openapi: 3.0.3
info:
  title: AI Hub API
  version: 0.1.0
  description: >-
    Subscription plans of the AI Hub module. A plan is a set of conditions (request, tool call, token and custom
    limits) that MCP servers offer and agents subscribe to. The caller's organization comes from the token.

    A plan is never removed: deleting it deprecates it (a soft delete). A deprecated plan stays, read only, for the
    subscriptions on it, and gateways still get it; it can't be changed, offered on an MCP server or subscribed to
    again.

    A plan is a document, as Kubernetes resources are: `apiVersion` (the document schema's version, separate from
    the URL's), `kind`, `metadata` (`name` is the plan's handle; the rest is set by the server), `spec` (what the
    caller declares) and `status` (what the server observes, ignored on input). Bodies are JSON, or YAML with
    `Content-Type: application/yaml`; a response is YAML when the request accepts `application/yaml`.

    Webhook secrets (`/webhook-secrets`) are the secrets developer portals sign their deliveries to this
    organization with, one per portal (or per portal organization). A secret's value is returned once, when it is
    created or rotated; reads return a masked value and the hash a delivery names it by.
  x-amp-module: ai-hub
servers:
  - url: /m/ai-hub
security:
  - BearerAuth: []
paths:
  /subscription-plans:
    get:
      operationId: listSubscriptionPlans
      summary: List the organization's subscription plans, current ones first, then deprecated ones, each newest first
      parameters:
        - name: query
          in: query
          description: Case-insensitive match on the plan's name or id.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SubscriptionPlanStatus"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanListResponse"
            application/yaml:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSubscriptionPlan
      summary: Create a subscription plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPlanDocument"
          application/yaml:
            schema:
              $ref: "#/components/schemas/SubscriptionPlanDocument"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanDocument"
            application/yaml:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanDocument"
        default:
          $ref: "#/components/responses/Error"
  /subscription-plans/{subscriptionPlanId}:
    parameters:
      - name: subscriptionPlanId
        in: path
        required: true
        description: The plan's id (its handle).
        schema:
          type: string
    get:
      operationId: getSubscriptionPlan
      summary: Get a subscription plan, with what offers or uses it
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanDocument"
            application/yaml:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanDocument"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateSubscriptionPlan
      summary: Update a subscription plan
      description: >-
        `metadata.name` must be the plan's handle, which can't change. Spec fields left out are kept, so a document
        read with GET can be sent back as it is; `spec.expiryTime: null` clears the expiry. A plan in use (one with
        subscriptions) keeps its name, conditions and expiry (409 SUBSCRIPTION_PLAN_IN_USE); its description and status
        can change. A deprecated plan can't change (409 SUBSCRIPTION_PLAN_DEPRECATED).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPlanDocument"
          application/yaml:
            schema:
              $ref: "#/components/schemas/SubscriptionPlanDocument"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanDocument"
            application/yaml:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanDocument"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deprecateSubscriptionPlan
      summary: Deprecate a subscription plan
      description: >-
        Deprecates the plan (a soft delete), in use or not: it stays, read only, for the subscriptions on it, and
        gateways still get it, but it can't be changed, offered or subscribed to again. Returns the deprecated plan.
        Deprecating a deprecated plan changes nothing.
      responses:
        "200":
          description: The deprecated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanDocument"
            application/yaml:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanDocument"
        default:
          $ref: "#/components/responses/Error"
  /webhook-secrets:
    get:
      operationId: listWebhookSecrets
      summary: List the organization's webhook secrets, by id, with their versions (values masked)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createWebhookSecret
      summary: Create a webhook secret for a developer portal
      description: >-
        Creates a secret with its first version and returns its value, once (`secret`). Give it to the portal's
        webhook subscriber for this organization. A delivery signed with it is for this organization only: its
        `org.ref_id` must be this organization's id, or `orgRef` when given (the portal organization's control-plane
        reference, such as the organization handle another control plane needs). 409 WEBHOOK_SECRET_EXISTS when the
        id is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSecretCreateRequest"
      responses:
        "201":
          description: Created; the only response that carries the value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecret"
        default:
          $ref: "#/components/responses/Error"
  /webhook-secrets/{webhookSecretId}:
    parameters:
      - name: webhookSecretId
        in: path
        required: true
        description: The secret's id (its handle).
        schema:
          type: string
    get:
      operationId: getWebhookSecret
      summary: Get a webhook secret with its versions (values masked)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecret"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteWebhookSecret
      summary: Delete a webhook secret and all its versions
      description: Deliveries signed with any of its versions are refused from then on.
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /webhook-secrets/{webhookSecretId}/rotate:
    parameters:
      - name: webhookSecretId
        in: path
        required: true
        description: The secret's id (its handle).
        schema:
          type: string
    post:
      operationId: rotateWebhookSecret
      summary: Add a version to a webhook secret
      description: >-
        Adds a version and returns its value, once (`secret`). The older versions keep verifying deliveries until
        they are deleted, so the portal can switch to the new value without a refused delivery. A secret keeps at
        most `webhook_secret_max_versions` versions (3 by default): 409 WEBHOOK_SECRET_VERSION_LIMIT until an old
        version is deleted.
      responses:
        "200":
          description: Rotated; the only response that carries the new value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecret"
        default:
          $ref: "#/components/responses/Error"
  /webhook-secrets/{webhookSecretId}/versions/{version}:
    parameters:
      - name: webhookSecretId
        in: path
        required: true
        description: The secret's id (its handle).
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    delete:
      operationId: deleteWebhookSecretVersion
      summary: Delete one version of a webhook secret
      description: >-
        Deliveries signed with that version are refused from then on. The last version can't be deleted on its own
        (409 WEBHOOK_SECRET_LAST_VERSION): delete the secret instead.
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SubscriptionPlanStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    SubscriptionPlanCondition:
      type: object
      description: >-
        One condition of a plan. A built-in type (request-count, tool-call-count, token-count) has a fixed id and
        `params` of limit windows and `onExceed`; a custom condition has its own id and the params its policy reads.
      required: [type]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [request-count, tool-call-count, token-count, custom]
        params:
          type: object
          additionalProperties: true
    SubscriptionPlanLimit:
      type: object
      description: The older single-limit form, read as a request-count condition.
      required: [timeUnit, limitCount]
      properties:
        limitType:
          type: string
        timeUnit:
          type: string
        timeAmount:
          type: integer
        limitCount:
          type: integer
        limitCountUnit:
          type: string
        stopOnQuotaReach:
          type: boolean
    DocumentMetadata:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 40
          description: >-
            The plan's handle: lowercase letters, digits and hyphens, starting and ending with a letter or digit.
            It can't change.
        uid:
          type: string
          format: uuid
          readOnly: true
          description: Server-assigned ID; gateways know the plan by it.
        creationTimestamp:
          type: string
          format: date-time
          readOnly: true
        updateTimestamp:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
          readOnly: true
          description: Subject that created the plan; empty for a plan copied in from the developer portal.
        origin:
          type: string
          readOnly: true
          description: >-
            Where the plan was made: `ai-control-plane` for a plan made here, or the name of the developer portal
            that copied it in.
    SubscriptionPlanSpec:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1023
        status:
          $ref: "#/components/schemas/SubscriptionPlanStatus"
        expiryTime:
          type: string
          format: date-time
          nullable: true
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionPlanCondition"
        limits:
          type: array
          writeOnly: true
          description: The older single-limit form, read as a request-count condition. Send conditions or limits, not both.
          items:
            $ref: "#/components/schemas/SubscriptionPlanLimit"
    SubscriptionPlanUsage:
      type: object
      description: >-
        What offers or uses the plan. A plan in use (one with subscriptions) keeps its name, conditions and expiry.
        Offering a plan on an MCP proxy doesn't put it in use.
      required: [inUse, mcpProxies, subscriptions]
      properties:
        inUse:
          type: boolean
          description: Whether the plan has subscriptions, so its name, conditions and expiry can't change.
        mcpProxies:
          type: integer
          description: The MCP proxies offering the plan.
        subscriptions:
          type: integer
          description: The subscriptions on the plan.
    SubscriptionPlanObservedStatus:
      type: object
      readOnly: true
      description: Observed state, set by the server and ignored on input. `usage` is only in GET of one plan.
      required: [deprecated]
      properties:
        deprecated:
          type: boolean
          description: Whether the plan is deprecated (read only, kept for the subscriptions on it).
        deprecationTimestamp:
          type: string
          format: date-time
          description: When the plan was deprecated; absent while it is current.
        usage:
          $ref: "#/components/schemas/SubscriptionPlanUsage"
    SubscriptionPlanDocument:
      type: object
      description: A subscription plan as a document; metadata.name is its handle, spec.displayName its label.
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion:
          type: string
          enum: [ai-control-plane.choreolabs.com/v1]
        kind:
          type: string
          enum: [SubscriptionPlan]
          description: Must match the route; never ignored.
        metadata:
          $ref: "#/components/schemas/DocumentMetadata"
        spec:
          $ref: "#/components/schemas/SubscriptionPlanSpec"
        status:
          $ref: "#/components/schemas/SubscriptionPlanObservedStatus"
    SubscriptionPlanListResponse:
      type: object
      required: [list, count, pagination]
      properties:
        list:
          type: array
          description: Each item is a whole document; its status has no usage.
          items:
            $ref: "#/components/schemas/SubscriptionPlanDocument"
        count:
          type: integer
          description: Number of items in this page.
        pagination:
          type: object
          required: [total, offset, limit]
          properties:
            total:
              type: integer
            offset:
              type: integer
            limit:
              type: integer
    WebhookSecretCreateRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: The secret's handle, unique in the organization.
          maxLength: 40
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
        name:
          type: string
          description: Display name; the id when left out.
          maxLength: 255
        orgRef:
          type: string
          description: >-
            The `org.ref_id` the portal sends, when it isn't this organization's id: the portal organization's
            control-plane reference. This organization's id is always accepted too.
          maxLength: 255
    WebhookSecretVersion:
      type: object
      required: [version, maskedSecret, hash, createdAt]
      properties:
        version:
          type: integer
        maskedSecret:
          type: string
          description: The prefix and the last four characters.
        hash:
          type: string
          description: >-
            The lowercase hex SHA3-256 of `api-portal-webhook-secret-hash-v1:` followed by the secret: the
            `secret_hash` a delivery signed with this version carries.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    WebhookSecret:
      type: object
      required: [id, name, createdAt, updatedAt, versions]
      properties:
        id:
          type: string
        name:
          type: string
        orgRef:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        versions:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/WebhookSecretVersion"
        secret:
          type: string
          description: The value of the version just made, only in the response to a create or a rotation.
    WebhookSecretListResponse:
      type: object
      required: [list, count, pagination]
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/WebhookSecret"
        count:
          type: integer
        pagination:
          type: object
          required: [total, offset, limit]
          properties:
            total:
              type: integer
            offset:
              type: integer
            limit:
              type: integer
    ErrorResponse:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: string
        code:
          type: string
        message:
          type: string
        trackingId:
          type: string
