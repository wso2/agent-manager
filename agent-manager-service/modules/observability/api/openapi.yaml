openapi: 3.0.3
info:
  title: Observability module API
  description: |
    The observability module's trace routes, under `/m/observability`. A trace or span
    has the Agent Manager Observer's shape; a list holds its items and a `pagination`
    object with the page's paging state. The observer's trace filters and `cursor` are
    refused with 400 (see each operation).

    The organization is always the caller's. An `organization` query parameter, which the
    console sends, is ignored. `project` and `agent` are names in that organization; an
    unknown one is a 404. `environment` is accepted and ignored, as on the observer.

    The routes exist only while the module is active: they answer 404 before it is
    installed and after it is disabled.
  version: 1.0.0
  x-amp-module: observability
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: /m/observability

security:
  - bearerAuth: []

paths:
  /traces:
    get:
      tags: [traces]
      summary: List traces
      description: |
        Lists the agent's traces whose root span starts in the window, by start time.
        The observer's filter parameters (`status`, `minDurationMs`, `minTokens`,
        `minSpanCount`, `model`, `conversationId`, `tool`, `toolError`, `mcpServer`,
        `missing`) and `cursor` are refused with 400. `include` is ignored.
      operationId: listTraces
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/agent"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/startTime"
        - $ref: "#/components/parameters/endTime"
        - $ref: "#/components/parameters/limit"
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Trace overview list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /traces/export:
    get:
      tags: [traces]
      summary: Export traces
      description: |
        Exports the agent's traces whose root span starts in the window, each with its
        spans and their attributes (at most 1000 spans a trace). The filters and `cursor`
        are refused with 400 as on the list. A trace whose spans can't be read is left
        out and named in `failedTraceIds`.
      operationId: exportTraces
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/agent"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/startTime"
        - $ref: "#/components/parameters/endTime"
        - name: limit
          in: query
          description: Traces to export (default 100, at most 1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: The exported traces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceExportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /traces/{traceId}/spans:
    get:
      tags: [traces]
      summary: List spans for a trace
      description: |
        Lists a trace's span summaries, without attributes. A trace outside the caller's
        organization, project or agent has no spans. `startTime` and `endTime` are the
        trace list's window: spans are read from a minute before it to a day after it,
        as the list counts them.
      operationId: listTraceSpans
      parameters:
        - $ref: "#/components/parameters/traceId"
        - $ref: "#/components/parameters/projectOptional"
        - $ref: "#/components/parameters/agentOptional"
        - $ref: "#/components/parameters/environment"
        - $ref: "#/components/parameters/startTime"
        - $ref: "#/components/parameters/endTime"
        - $ref: "#/components/parameters/limit"
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Span summary list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpanSummaryListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /traces/{traceId}/spans/{spanId}:
    get:
      tags: [traces]
      summary: Get a span
      description: Returns one span of the caller's organization with its attributes.
      operationId: getSpanDetail
      parameters:
        - $ref: "#/components/parameters/traceId"
        - name: spanId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The span
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichedSpan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /otel/v1/traces:
    post:
      tags: [ingest]
      summary: Send traces
      description: |
        OTLP/HTTP trace export for agents: an agent's OTLP endpoint is
        `<amp>/m/observability/otel`. It authenticates with its agent key, not a sign-in.
        Every span is stored under the key's organization, project, agent and environment,
        whatever headers or `agent-manager/*` attributes the agent sent. The body is
        forwarded to the collector unchanged, gzip included, and the collector's answer is
        passed back. Answers 404 while the module is not active.
      operationId: ingestTraces
      security:
        - agentKey: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: The collector's OTLP export response
        "401":
          description: No agent key, an invalid or expired one, or its agent no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The module is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The body is over the size limit (`MODULE_OBSERVABILITY_INGEST_MAX_BODY_BYTES`, 10 MiB by default)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Not `application/x-protobuf` or `application/json`, or an encoding other than gzip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No collector is configured, or it is unreachable; the agent retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The Agent Manager sign-in token, with the scope `amp:observability:traces-read`.
    agentKey:
      type: apiKey
      in: header
      name: X-Amp-Api-Key
      description: The agent's key, from the console's "Set up agent" drawer.

  parameters:
    traceId:
      name: traceId
      in: path
      required: true
      schema:
        type: string
    project:
      name: project
      in: query
      required: true
      description: Project name
      schema:
        type: string
    agent:
      name: agent
      in: query
      required: true
      description: Agent name
      schema:
        type: string
    projectOptional:
      name: project
      in: query
      description: Project name filter
      schema:
        type: string
    agentOptional:
      name: agent
      in: query
      description: Agent name filter; needs `project`
      schema:
        type: string
    environment:
      name: environment
      in: query
      description: Ignored.
      schema:
        type: string
    startTime:
      name: startTime
      in: query
      required: true
      schema:
        type: string
        format: date-time
    endTime:
      name: endTime
      in: query
      required: true
      schema:
        type: string
        format: date-time
    limit:
      name: limit
      in: query
      description: Page size (default 10, at most 1000)
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 10

  responses:
    BadRequest:
      description: A missing, invalid or unsupported query parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Not signed in, or the sign-in names no organization
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The caller lacks `observability:traces-read`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: |
        The module is not active, the project or agent is not in the caller's
        organization, or the span is not
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: The trace store failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string

    Pagination:
      type: object
      required: [limit, total]
      properties:
        limit:
          type: integer
          description: Maximum items requested for this page
        total:
          type: integer
          description: Spans across all pages

    TracePagination:
      type: object
      required: [limit]
      description: Where a trace search stopped. Pages follow `nextCursor`, not an offset.
      properties:
        limit:
          type: integer
          description: Maximum traces requested for this page
        total:
          type: integer
          description: Matching traces in the window; absent when the server doesn't know it exactly
        nextCursor:
          type: string
          description: |
            Opaque cursor for the next page, sent back as `cursor`. Absent when the window ran
            out. Not set yet: `cursor` is refused until the trace stores support it. Never set
            on an export, which takes no cursor.
        lookedBackTo:
          type: string
          format: date-time
          description: How far the search got. Sent only with `truncated`.
        truncated:
          type: boolean
          description: |
            Sent only as true, when the search stopped before the page filled and before the
            window ran out. Absent means not truncated.

    TraceListResponse:
      type: object
      required: [traces, pagination]
      properties:
        traces:
          type: array
          items:
            $ref: "#/components/schemas/TraceOverview"
        pagination:
          $ref: "#/components/schemas/TracePagination"

    TraceOverview:
      type: object
      required: [traceId, rootSpanId, rootSpanName, rootSpanKind, startTime, endTime, durationInNanos, spanCount]
      properties:
        traceId:
          type: string
        rootSpanId:
          type: string
        rootSpanName:
          type: string
        rootSpanKind:
          type: string
          description: Semantic span type, from the root span's name
          enum: [llm, tool, embedding, retriever, rerank, agent, chain, unknown]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        durationInNanos:
          type: integer
          format: int64
        spanCount:
          type: integer

    TraceExportResponse:
      type: object
      required: [traces, pagination, spansTruncated]
      properties:
        traces:
          type: array
          items:
            $ref: "#/components/schemas/FullTrace"
        pagination:
          $ref: "#/components/schemas/TracePagination"
        spansTruncated:
          type: boolean
          description: True when an exported trace has more than 1000 spans and its spans were cut
        failedTraceIds:
          type: array
          description: Traces left out because their spans couldn't be read
          items:
            type: string

    FullTrace:
      allOf:
        - $ref: "#/components/schemas/TraceOverview"
        - type: object
          required: [spans]
          properties:
            spans:
              type: array
              items:
                $ref: "#/components/schemas/EnrichedSpan"

    SpanSummaryListResponse:
      type: object
      required: [spans, pagination]
      properties:
        spans:
          type: array
          items:
            $ref: "#/components/schemas/SpanSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"

    SpanSummary:
      type: object
      required: [spanId, spanName, startTime, endTime, durationNs]
      properties:
        spanId:
          type: string
        spanName:
          type: string
        spanKind:
          type: string
          description: Semantic span type, from the span name
          enum: [llm, tool, embedding, retriever, rerank, agent, chain, unknown]
        parentSpanId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        durationNs:
          type: integer
          format: int64
        error:
          type: boolean
          description: True when the span's OTel status code is error
        statusMessage:
          type: string

    Span:
      type: object
      required: [traceId, spanId, name, service, startTime, endTime, durationInNanos]
      properties:
        traceId:
          type: string
        spanId:
          type: string
        parentSpanId:
          type: string
        name:
          type: string
        service:
          type: string
          description: The `agent-manager/agent` resource attribute
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        durationInNanos:
          type: integer
          format: int64
        kind:
          type: string
        status:
          type: string
          description: OTel status code ("ok", "error" or "unset")
        statusMessage:
          type: string
        attributes:
          type: object
          additionalProperties: true
        resource:
          type: object
          additionalProperties: true

    EnrichedSpan:
      allOf:
        - $ref: "#/components/schemas/Span"
        - type: object
          properties:
            ampAttributes:
              $ref: "#/components/schemas/AmpAttributes"

    AmpAttributes:
      type: object
      required: [kind]
      description: Only `kind` and `status` are filled
      properties:
        kind:
          type: string
          enum: [llm, tool, embedding, retriever, rerank, agent, chain, unknown]
        status:
          $ref: "#/components/schemas/SpanStatus"

    SpanStatus:
      type: object
      properties:
        error:
          type: boolean
        message:
          type: string
