    actions:
      - { name: Create, handle: create, description: "Create an environment" }
      - { name: Read, handle: read, description: "View environment details" }
      - { name: Update, handle: update, description: "Update an environment" }
      - { name: Delete, handle: delete, description: "Delete an environment" }
  - name: Gateway
    handle: gateway
    parent: amp
    description: Gateway management
    actions:
      - { name: Create, handle: create, description: "Register a gateway" }
      - { name: Read, handle: read, description: "View gateway details and status" }
      - { name: Update, handle: update, description: "Update gateway configuration" }
      - { name: Delete, handle: delete, description: "Delete a gateway" }
      - { name: Manage Token, handle: token-manage, description: "Create, list, and delete gateway tokens" }
  - name: Data Plane
    handle: data-plane
