# oapi-codegen configuration for the AI Gateway module client generation
package: gen
output: cli/pkg/clients/aigateway/gen/client.gen.go
generate:
  models: false
  client: true
  embedded-spec: false
output-options:
  overlay:
    path: cli/pkg/clients/aigateway/gen/json-only-overlay.yaml
  response-type-suffix: Resp
