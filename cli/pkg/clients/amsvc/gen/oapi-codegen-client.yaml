# oapi-codegen configuration for Agent Manager Service client generation
package: gen
output: cli/pkg/clients/amsvc/gen/client.gen.go
generate:
  models: false
  client: true
  embedded-spec: false
output-options:
  response-type-suffix: Resp
  # The YAML form of the server's own spec would make the client parse YAML
  # (a gopkg.in/yaml.v2 dependency) for no command's benefit; the JSON form
  # is generated.
  exclude-operation-ids:
    - getOpenAPISpecYAML
