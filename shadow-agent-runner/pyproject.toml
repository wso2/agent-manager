[project]
authors = [
  {name = "WSO2"},
]
description = "Shadow agent runner for WSO2 Agent Manager: finds AI agents in source code repositories, on a machine the customer runs"
keywords = ["ai", "agents", "shadow-agents", "inventory"]
license = "Apache-2.0"
maintainers = [
  {name = "WSO2"},
]
name = "amp-shadow-runner"
readme = "README.md"
requires-python = ">=3.12"
# Package metadata version only. The version the runner reports is
# amp_shadow_runner._version.__version__, which the image build stamps
# with its VERSION build argument (release tags need not be PEP 440).
version = "0.0.0.dev0"

# Runtime closure must stay MIT or Apache-2.0 (scripts/check_deps.py enforces it).
# Keep these pins identical to requirements.in (scripts/check_lock.py enforces it).
# Never add tree-sitter-language-pack: it bundles GPL and unlicensed grammars.
dependencies = [
  "tree-sitter==0.26.0",
  "tree-sitter-python==0.25.0",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-c-sharp==0.23.5",
]

[project.optional-dependencies]
# Development tools only; never installed into the image.
dev = [
  "mypy>=1.13",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # Pinned: ruff 0.16 widened its default rule set, so an unpinned
  # install changes what CI enforces without any code change.
  "ruff==0.15.22",
]

[project.scripts]
amp-shadow-runner = "amp_shadow_runner.cli:main"

[project.urls]
Repository = "https://github.com/wso2/agent-manager"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/amp_shadow_runner"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.mypy]
files = ["src", "tests", "scripts"]
# Tests import the scripts as top-level modules (see pytest pythonpath below).
mypy_path = "scripts"
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-v --cov=amp_shadow_runner --cov-report=term-missing"
python_classes = "Test*"
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["scripts"]
testpaths = ["tests"]
