worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Basic optimizations
    sendfile on;
    keepalive_timeout 65;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 3000;
        root /usr/share/nginx/html;
        index index.html;

        # Behind a gateway the external host:port differs from the listen port,
        # so redirects (e.g. /console -> /console/) must be relative.
        absolute_redirect off;

        # Base path support. When the image is built with BASE_PATH=/console the
        # Dockerfile replaces this marker with
        #   rewrite ^/console$ /console/ permanent;
        #   rewrite ^/console/(.*)$ /$1 last;
        # so /console/assets/x.js and /console/config.js resolve to the files below
        # and every other /console/... path falls through to index.html.
        # __BASE_PATH_REWRITE__

        # Disable caching for runtime config file
        location = /config.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # React Router support - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets (excluding config.js handled above)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

    }
}
